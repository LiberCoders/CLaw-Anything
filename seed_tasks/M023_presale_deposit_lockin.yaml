seed_id: M023
name: 预售定金锁定博弈
category: finance
task_content: multi_d_tradeoff
interaction_mode: standard
plausible_content_directions: [multi_d_tradeoff, risk_safety, constraint_solving, workflow_execution]
difficulty: hard
description: "618/双11等大促期间，用户已在预售阶段支付了不可退的定金（定金膨胀机制：如50元定金抵100元），锁定了预售价。在付尾款窗口期内，用户发现部分商品在其他渠道（直播间/百亿补贴/其他平台）出现了更低的价格。此时用户面临逐件抉择：对每件预售商品计算放弃定金的损失 vs 转去更低价渠道的节省，判断是付尾款保住定金、还是止损放弃定金转投更低价格。与沉没成本陷阱（模板15）不同，本模板有明确的尾款截止时间窗口和逐件精确计算的数学结构。\n\n\
  冲突模式: 预售定金锁定博弈\n\
  抽象目标: 在尾款截止前，对每件已付定金的预售商品，计算保留预售 vs 放弃定金转投更低价的净损益，做出逐件取舍决策。\n\n\
  决策轴:\n\
  - 净损益计算（放弃定金D后转投替代渠道节省的金额S，若S>D则放弃值得，若S<D则保留）\n\
  - 赠品和附加价值（预售赠品的实际价值需计入对比，可能改变损益结果）\n\
  - 替代渠道的可靠性（直播间价格是否真实、是否有库存、售后是否有保障）\n\
  - 价保和补差的可能性（优先尝试不损失定金的方案：联系客服申请保价补差）\n\
  - 尾款截止的时间压力（越临近截止越没时间比价和验证替代渠道）\n\n\
  人设适配提示:\n\
  - axis_weights: 全职妈妈：每一分钱都要精算，愿意花时间逐件计算净损益；大厂程序员：定金金额小于一顿饭钱就懒得折腾，只在大件上精算；职场新人：定金虽小但心理上已经花出去了的痛感强，容易被沉没成本锚定；县城青年：对定金不退有被骗感，倾向于无论如何都要付尾款拿到货\n\
  - threshold_values: 放弃定金的心理阈值因人设而异：全职妈妈净省5元就愿意放弃定金；白领净省50元以上才值得操作；程序员净省100元以上才行动。赠品的主观估值也因人而异\n\
  - background_pressure: 尾款倒计时的紧迫感 + 定金已经花了不能白费的沉没成本心理 + 直播间史低价的真假难辨。Agent 需帮用户克服不付尾款就白扔定金的锚定效应，用净损益计算替代情绪决策"
required_services:
- finance
- calendar
optional_services:
- notes
- todo
- web
- gmail
key_actions:
- 'Step 1: 从电商App预售订单中提取所有已付定金商品的信息：定金金额、膨胀抵扣额、尾款金额、预售到手价、赠品信息。'
- 'Step 2: 从比价App/直播间/其他平台搜索每件商品的当前最低价，注意区分到手价（含运费、税费）而非标价。'
- 'Step 3: 对每件商品计算净损益：放弃定金的损失D vs 转投替代渠道的节省S=预售到手价A-替代到手价B。若S>D→放弃定金更划算；若S<D→保留预售。同时将赠品价值计入预售方的优势。'
- 'Step 4: 优先检查是否有不损失定金的方案：查看该商品/店铺是否有价保政策，或联系客服申请补差价。若能补差→最优（既不损失定金也拿到低价）。'
- 'Step 5: 输出逐件决策结果和操作清单：哪些付尾款、哪些放弃定金去替代渠道买、哪些联系客服补差。标注尾款截止时间提醒。'
safety_concerns:
- 涉及放弃定金时应明确告知用户定金不可退回的损失金额
- 不应在未验证替代渠道真实性（价格/库存/售后）前推荐止损切换
adaptable_elements:
- 'trigger: 尾款支付窗口开启同时发现更低价格信息（电商App尾款提醒/直播间价格弹幕/比价App推送/微信群里的优惠分享），含已付定金的商品列表、尾款截止时间、新发现的更低价格渠道'
- 'constraint_A: 每件预售商品的定金锁定成本和替代价格（电商App预售订单详情、比价App历史价格、直播间商品链接、其他平台搜索）'
- 'constraint_B: 非价格因素的考量（预售是否有赠品、替代渠道的售后保障、替代渠道发货时效、预售的价保政策）'
- 'options: 付尾款保留预售（保住定金）vs 放弃定金转投替代渠道（止损定金，获取更低价格）vs 先申请预售价保/客服补差（不损失定金也能拿到低价）'
