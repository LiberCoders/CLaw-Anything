seed_id: S024
name: "Goal-driven task planning"
category: personal_productivity
task_content: workflow_execution
interaction_mode: standard
difficulty: medium
description: "Based on long-term goals recorded in notes, combined with current to-dos and calendar gaps, proactively plan and create specific executable tasks for this week"
