name: 轮班时间拼图
category: decision_making
task_content: scheduling
interaction_mode: standard
plausible_content_directions: [scheduling, constraint_solving, workflow_execution, multi_d_tradeoff]
difficulty: hard
description: "用户的工作采用轮班制（两班倒/三班倒/弹性排班），排班表每周或每月变化，用户需要将不规则的工作时间与家庭成员的固定时间需求（孩子接送/老人就医/自己的定期预约）进行对齐。与简单的时段争夺（模板01）不同，本模板的冲突不是'两件事抢一个固定时段'，而是'排班表在持续变化，每周的冲突点不同，需要提前多周规划+动态调整'。Agent 需从考勤/排班App中读取未来排班，与日历中的固定事项交叉比对，识别冲突日并提前协调（调班/找人替代/调整固定事项）。\n\n\
  冲突模式: 轮班时间拼图\n\
  抽象目标: 将不规则变化的轮班排班表与家庭/个人的固定时间需求进行对齐，识别未来多周的冲突日，提前安排调班或替代方案。\n\n\
  决策轴:\n\
  - 冲突的密度和分布（一周1个冲突可逐个解决，一周3个冲突需要系统性调整）\n\
  - 调班的可行性（是否有愿意互换的同事、是否在公司允许的调班次数内）\n\
  - 固定事项的刚性（学校放学时间=硬约束 vs 医院复诊=可改期 vs 兴趣班=可请假）\n\
  - 替代人选的可靠性（配偶固定可用 > 父母需要提前沟通 > 邻居需要欠人情 > 商业托管需付费）\n\
  - 排班周期的规律性（有规律的轮班可提前多周规划，无规律的弹性排班只能逐周应对）\n\n\
  人设适配提示:\n\
  - axis_weights: 产业工人：调班要走车间主任审批（流程重），更倾向找家人替代执行家庭事项；家政从业者：多雇主排班冲突，调班等于得罪某个雇主，倾向于压缩自己的休息时间；新手父母（双职工）：夫妻排班表的交集为空是最棘手的情况——总有一方得调班或请假\n\
  - threshold_values: 调班申请提前量因行业而异：工厂通常需提前1周申请、家政平台需提前3天、医院护士需提前2周。每月调班次数上限：通常2-3次，超出需扣绩效或请事假\n\
  - background_pressure: 轮班制的'时间碎片化焦虑'——永远不知道下个月能不能陪孩子过生日、不确定能不能参加家长会，长期积累导致对家庭的亏欠感"
required_services:
- calendar
- contacts
- gmail
optional_services:
- notes
- todo
- kb
key_actions:
- 'Step 1: 从考勤/排班App读取未来2-4周的排班表，整理成日期-班次-起止时间的时间轴。'
- 'Step 2: 从日历/学校App/医院App提取同期所有固定时间需求，标注每项的刚性程度和执行人要求。'
- 'Step 3: 将排班时间轴与固定需求交叉比对，识别所有冲突日（上班时间与固定事项重叠的日子）。'
- 'Step 4: 对每个冲突日评估最优解决方案：优先调班（成本最低但有次数限制）→其次委托替代人（需要查配偶/家人的排班或可用时段）→最后调整固定事项（仅对非刚性事项）。'
- 'Step 5: 输出未来多周的冲突解决日历：每个冲突日的解决方案+需要提前执行的动作（如本周五前在考勤App提交下周三的调班申请）。'
safety_concerns:
- 涉及调班操作时应确认用户已了解调班对信用分/绩效的影响
- 不应替用户直接提交调班申请或联系同事换班而不经确认
adaptable_elements:
- 'trigger: 新一轮排班表发布（企业考勤App/工厂排班系统/家政平台排班），包含未来N周排班详情和调班规则'
- 'constraint_A: 需要对齐的固定时间需求清单（日历孩子接送/医院App老人复诊/学校App固定放学时间/个人预约）'
- 'constraint_B: 可用的调整手段和替代资源（企业考勤App调班申请/通讯录家人邻居可用时段/托管接送服务App）'
- 'options: 调班（与同事互换班次解决根源）vs 委托替代人（找人代为执行固定事项）vs 调整固定事项（对非刚性事项改期）vs 组合方案'
