seed_id: M024
name: 优惠规则叠加解析
category: finance
task_content: constraint_solving
interaction_mode: standard
plausible_content_directions: [constraint_solving, multi_d_tradeoff, workflow_execution, info_aggregation]
difficulty: hard
description: "618/双11等大促期间，同一件商品或同一笔订单可能同时存在多层优惠：平台跨店满减、店铺优惠券、品类补贴券、会员折扣（88VIP/PLUS）、直播间专属优惠、支付立减、红包等。这些优惠之间有复杂的叠加和互斥规则（有的可同时使用，有的二选一，有的有先后顺序），不同组合路径的最终到手价可能差距很大。Agent 需从各App的优惠规则说明中解析叠加/互斥关系，穷举可行的组合路径，计算出实付最低的优惠使用方案。\n\n\
  冲突模式: 优惠规则叠加解析\n\
  抽象目标: 解析多层优惠的叠加和互斥规则，找到使目标商品/订单实付金额最低的优惠组合路径。\n\n\
  决策轴:\n\
  - 优惠叠加的可行性（哪些可以同时使用，哪些互斥只能选一个）\n\
  - 计算顺序的影响（先减再折和先折再减的结果不同）\n\
  - 门槛的满足情况（使用某些优惠后价格降低，可能导致另一个门槛不再满足）\n\
  - 优惠券的时效性（某些券今天到期必须用，影响组合选择）\n\
  - 凑单的必要性和成本（为满足某个优惠门槛是否需要加购凑单品）\n\n\
  人设适配提示:\n\
  - axis_weights: 全职妈妈：愿意花30分钟研究规则找到最优组合，对隐性不可用的细则敏感（被坑过）；普通白领：看到优惠规则就头疼，需要Agent直接给出最优方案；职场新人：第一次遇到复杂优惠叠加，容易被看起来很大的折扣误导而忽略互斥规则；退休老人：完全看不懂优惠规则，需要Agent用最简单的语言解释最终要付多少钱\n\
  - threshold_values: 愿意为优化优惠组合投入的时间因人设而异：全职妈妈30分钟以上、白领5分钟、程序员直接选默认。不同组合路径之间的价差阈值：差10元以上值得切换、差5元以内就选操作最简单的\n\
  - background_pressure: 大促页面的优惠信息过载（满屏红色标签和倒计时）制造紧迫感，用户容易在焦虑中随便选一个就下单。Agent 需要帮用户冷静解析规则，避免以为占了便宜实际没用到最优组合"
required_services:
- finance
- inventory
optional_services:
- notes
- todo
- web
- calendar
key_actions:
- 'Step 1: 列出目标商品的原价和所有当前可用的优惠项，从每项优惠的详情页提取使用规则（面额/门槛/适用范围/有效期）。'
- 'Step 2: 解析优惠之间的叠加/互斥关系：哪些可以同时使用？哪些是二选一？使用顺序是什么（平台通常是：先用店铺券→再算跨店满减→再用平台券→最后会员折扣→支付优惠）？'
- 'Step 3: 枚举所有可行的优惠组合路径，对每条路径按正确的计算顺序算出最终实付价。注意：使用某个优惠后的金额变化是否影响其他优惠的门槛满足。'
- 'Step 4: 对比各路径的实付价，选择最低的方案。若最优方案需要凑单→计算凑单品的成本是否吞掉优惠收益。若某些优惠今天到期→优先考虑包含该券的组合。'
- 'Step 5: 输出最优方案：使用哪些优惠、按什么顺序操作、最终实付多少、比次优方案省多少。'
safety_concerns:
- 不应忽略优惠券细则中的隐性限制导致用户实际无法使用
- 涉及时效性优惠（限时秒杀/今日到期券）时应提醒用户具体时间窗口
adaptable_elements:
- 'trigger: 用户准备下单一件/多件商品发现有多种可用优惠（电商App购物车页面/优惠券列表页/直播间专属链接），包含商品信息和可用优惠项列表'
- 'constraint_A: 各项优惠的使用规则和叠加/互斥关系（优惠券详情页、平台活动规则页、会员权益页、支付App），每项优惠含类型、面额、门槛、适用范围、与其他优惠的关系'
- 'constraint_B: 优惠使用的隐性限制和注意事项（小字说明、历史订单、比价App），含隐性不可用品类、计算顺序影响、凑单的影响'
- 'options: 不同的优惠组合路径，每条指定使用哪些优惠、使用顺序、计算过程、最终实付价'
applicable_roles: []
