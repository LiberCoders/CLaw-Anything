seed_id: M022
name: 跨平台凑单分配
category: finance
task_content: constraint_solving
interaction_mode: standard
plausible_content_directions: [constraint_solving, multi_d_tradeoff, workflow_execution, info_triage]
difficulty: hard
description: "用户有一份包含多件商品的购物清单，每件商品在多个电商平台都能买到但价格不同，各平台有各自的满减门槛、优惠券、会员折扣等规则。用户需要决定每件商品在哪个平台购买，使得各平台的订单都尽量触发满减优惠，整体总花费最低。与多渠道额度拼接（模板12）不同，模板12的商品和渠道是绑定的（某商品只能在某渠道买），本模板中每件商品都有多个平台可选，核心挑战是商品到平台的自由分配组合优化。\n\n\
  冲突模式: 跨平台凑单分配\n\
  抽象目标: 将购物清单中的 N 件商品最优分配到 M 个电商平台，使每个平台的订单都尽量触发满减，总实付金额最低。\n\n\
  决策轴:\n\
  - 各平台单品价格差异（同一商品在不同平台可能差10%-30%）\n\
  - 满减门槛的触发效率（凑满300减50=实际折扣率16.7%，凑满200减30=15%，哪个更值）\n\
  - 凑单的额外成本（为触发满减门槛添加的凑单品是否真的需要，还是纯浪费）\n\
  - 配送时效和售后保障（低价平台可能配送慢或售后差）\n\
  - 优惠券/红包的时效性（某些券今天到期必须用掉）\n\n\
  人设适配提示:\n\
  - axis_weights: 全职妈妈：极度关注最终实付价，愿意花时间做精细计算，对凑单品有反正都用得上的心态；普通白领：关注性价比但时间有限，倾向差不多就行而非极致优化；县城青年：重度拼多多用户，但618期间京东/天猫的满减力度可能反超，需要打破平台惯性；职场新人：预算紧张，每省10元都有意义，但对各平台规则不熟\n\
  - threshold_values: 值得跨平台拆单的价差阈值因人设而异：全职妈妈5元就值得拆、白领20元以上才值得折腾、程序员50元以下懒得比；运费阈值：凑不到包邮的订单是否值得为省满减而付运费\n\
  - background_pressure: 618期间的不买就亏了心理 + 各平台促销信息轰炸导致的决策疲劳。Agent 需帮用户在信息过载中聚焦于实际需要购买的商品，避免被促销引导购买不需要的东西"
required_services:
- finance
- inventory
optional_services:
- notes
- todo
- web
- contacts
key_actions:
- 'Step 1: 整理购物清单，从各平台App查询每件商品的当前价格（含会员价/补贴价），形成商品×平台价格矩阵。'
- 'Step 2: 从各平台App提取满减规则、已领优惠券、会员折扣等，整理成各平台的优惠条件清单。'
- 'Step 3: 以满减门槛为约束做分组优化：尝试将商品分配到各平台，使每个平台的订单金额刚好达到或略超满减门槛。计算每种分配方案的总实付价。'
- 'Step 4: 对比方案：单平台全买 vs 按单品最低价分散 vs 满减优化分组，找出总实付最低的方案。注意检查：凑满减时是否需要添加额外凑单品？凑单品的成本是否吞掉了满减收益？'
- 'Step 5: 输出最终购买计划：每个平台买哪些商品、预计实付金额、需要使用哪些优惠券、配送预计时间。'
safety_concerns:
- 不应为凑满减门槛推荐用户不需要的商品
- 不应忽略时效性较差平台对急用商品的配送风险
adaptable_elements:
- 'trigger: 一份待购买的多商品清单（购物车多平台/微信收藏夹备忘录中的购物清单/家庭共享购物清单App），每件商品含名称、用途优先级、各平台当前售价'
- 'constraint_A: 各平台的满减规则、优惠券和会员权益（京东App PLUS会员价+满减/淘宝天猫App 88VIP+跨店满减/拼多多App 百亿补贴+限购/抖音商城直播间价格/各平台优惠券列表）'
- 'constraint_B: 用户的平台偏好和约束条件（各平台会员状态、各平台余额红包积分、配送时效需求、售后偏好、总预算上限）'
- 'options: 全部在单一平台购买（简单但未必最优）vs 按单品最低价分散到各平台（单品最优但可能凑不到满减）vs 以满减门槛为目标做分组使每个平台都刚好触发满减'
applicable_roles: []
