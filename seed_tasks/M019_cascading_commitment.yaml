seed_id: M019
name: 承诺冲突链
category: decision_making
task_content: conflict_detection
interaction_mode: standard
plausible_content_directions: [conflict_detection, scheduling, multi_d_tradeoff, workflow_execution, constraint_solving]
difficulty: hard
description: "用户在不同时间点对多方做出了承诺（每个承诺在做出时都合理且不冲突），但由于某个环节的意外变化（需求变更/时间挤压/资源不足），导致多个承诺无法同时兑现。违约任何一方都会引发连锁反应：直接后果（违约金/信任损失）+ 间接后果（影响该方相关的下游安排）。Agent 需评估各条承诺链的违约成本（包括连锁反应），找到整体损失最小的违约组合，并主动执行补救措施（提前沟通/部分交付/引入替代资源）。\n\n\
  冲突模式: 承诺冲突链\n\
  抽象目标: 在多个承诺无法同时兑现时，评估每条承诺链的违约连锁成本，选择整体损失最小的方案，并通过提前沟通和补救措施降低违约影响。\n\n\
  决策轴:\n\
  - 承诺的刚性程度（合同约束 > 明确口头承诺 > 模糊暗示）\n\
  - 违约的连锁深度（影响对方3个下游安排 > 影响1个 > 无下游影响）\n\
  - 关系的长期价值（长期合作方 > 一次性交易方 > 可替代的供应商）\n\
  - 补救措施的可行性和成本（能否通过部分交付/延期/外包来降低违约感知）\n\
  - 提前沟通的时间窗口（越早告知对方，对方调整余地越大，违约感知越低）\n\n\
  人设适配提示:\n\
  - axis_weights: 自由职业者：客户关系是生命线，长期客户权重远高于新客户；全职妈妈：对孩子的承诺违约成本最高（情感伤害难以量化）；大厂员工：项目承诺有正式追踪系统，违约会影响绩效评分；小店主：供应商关系和顾客信任同样重要，需要平衡上下游\n\
  - threshold_values: 经济违约金的敏感度因收入而异：500元违约金对骑手是大事、对程序员是小事；提前沟通的有效时限：提前3天告知对方大概率谅解，当天告知对方大概率生气，事后告知信任严重受损\n\
  - background_pressure: 多承诺冲突引发的'道德焦虑'——每个承诺都是自己答应的，违约任何一个都有负罪感。Agent 需帮用户从道德焦虑转向损失最小化的理性框架"
required_services:
- gmail
- contacts
- calendar
optional_services:
- notes
- todo
- kb
key_actions:
- 'Step 1: 识别意外事件，列出所有受影响的承诺，标注每条承诺的对象、内容、截止时间和刚性程度。'
- 'Step 2: 绘制承诺链的连锁关系图：承诺X违约→对方的下游安排Y受影响→Y的相关方Z受波及。量化连锁深度。'
- 'Step 3: 评估每条承诺链的违约总成本（直接+连锁）和可用的补救手段。'
- 'Step 4: 枚举可行的取舍方案（通常2-3种），计算每个方案的总损失。选择总损失最小的方案，优先保全刚性最强+连锁最深+关系价值最高的承诺。'
- 'Step 5: 对需要违约/调整的承诺，立即执行补救：尽早主动沟通、提供替代方案（部分交付/推荐其他人/延期折扣）、明确补偿承诺（下次优先/免费加项）。'
safety_concerns:
- 涉及合同级承诺违约时应提醒用户注意法律风险
- 不应替用户直接向对方发送违约通知而不经确认
adaptable_elements:
- 'trigger: 导致承诺冲突暴露的意外变化（工作IM需求变更/微信临时请求/日历时间冲突/健康状况变化）'
- 'constraint_A: 所有受影响承诺的详细信息和连锁关系（日历截止时间/聊天记录承诺内容/合同条款/项目依赖）'
- 'constraint_B: 各条承诺链的违约成本评估和可用补救手段（关系评估/替代资源/通讯录人脉/违约条款）'
- 'options: 不同承诺取舍组合方案，每个方案指定优先保全哪些、违约调整哪些、对违约方的补救措施、总损失评估'
