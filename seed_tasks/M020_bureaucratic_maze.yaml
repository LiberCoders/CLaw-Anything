seed_id: M020
name: 制度迷宫导航
category: decision_making
task_content: constraint_solving
interaction_mode: standard
plausible_content_directions: [constraint_solving, workflow_execution, info_aggregation, conflict_detection, risk_safety]
difficulty: hard
description: "用户需要完成一个涉及多个部门/系统的行政或制度性流程（入学报名/社保转移/资质办理/报销审批），各环节之间存在前置依赖关系（A 要求先有 B 的证明，B 说需要先完成 A）、隐性截止时间、以及容易遗漏的前置条件。与任务依赖链（模板16）不同，本模板的依赖关系是外部制度设定的，用户无法改变流程顺序，只能在复杂的规则迷宫中找到最短可行路径。Agent 需从政务App/企业系统/政策文件中提取流程规则，识别循环依赖和隐性前置条件，规划最优办理顺序。\n\n\
  冲突模式: 制度迷宫导航\n\
  抽象目标: 在多部门/多系统的行政流程中，识别各环节的前置依赖、隐性截止时间和可能的循环阻塞，规划最短可行路径并在截止前完成全部流程。\n\n\
  决策轴:\n\
  - 各环节的办理时长累计是否超过总截止时间（关键路径识别）\n\
  - 循环依赖是否存在破解入口（如某个环节可以用替代材料打破循环）\n\
  - 可并行办理的环节（不互相依赖的材料可以同时准备）\n\
  - 容缺受理/线上预审等政策通道是否可用（可以先提交再补材料）\n\
  - 各材料的有效期是否会在流程中过期（如证明只有效30天但流程需要45天）\n\n\
  人设适配提示:\n\
  - axis_weights: 进城务工人员：对制度流程不熟悉，依赖Agent主动发现隐性规则和替代路径；职场新人：首次接触社保/公积金/个税等制度，对术语和流程都陌生；新手父母：育儿相关的行政流程（出生证/户口/疫苗接种证/入园入学）时效性强且环环相扣；公务员：熟悉制度但也被制度约束，跨部门协调时遇到对方的制度壁垒\n\
  - threshold_values: 流程容忍度因人设而异：务工人员请假办事等于直接扣工资，所以需要最少跑腿次数的路径；新手父母：孩子相关的截止时间不可协商；职场新人：对找谁问缺乏经验，Agent需要明确指出该查哪个App/打哪个热线\n\
  - background_pressure: 制度流程的'不透明性焦虑'——不知道自己是不是漏了什么、不知道还要等多久、不知道被拒了能不能申诉。Agent 需要把不透明的流程变成可视化的进度条"
required_services:
- gmail
- contacts
- calendar
- kb
optional_services:
- notes
- todo
- documents
key_actions:
- 'Step 1: 从trigger明确最终目标和总截止时间，从政务App/学校公众号提取完整的材料清单和办理指南。'
- 'Step 2: 绘制各环节的依赖关系图：哪些材料需要先办哪些证明？各环节办理时长多少？是否存在循环依赖？'
- 'Step 3: 盘点用户已有材料，识别缺失项。对每个缺失项评估获取难度和时间。'
- 'Step 4: 计算关键路径：所有串行环节的办理时长之和是否超过截止时间？若超过则寻找可并行环节、容缺受理政策、替代材料等加速方案。若存在循环依赖则找到打破循环的入口。'
- 'Step 5: 输出分日办理计划：每天做什么、在哪个App/平台操作、预计等待时间、需要关注的节点。'
safety_concerns:
- 涉及政策解读时应提醒用户以官方渠道确认为准，Agent的理解可能有误
- 涉及证件材料时不应替用户提交虚假信息或走不合规的捷径
adaptable_elements:
- 'trigger: 用户需要完成的最终目标（学校App通知/政务App提醒/企业系统审批/社保公积金App）及总截止时间'
- 'constraint_A: 各环节的办理规则和前置依赖关系（政务服务App办事指南/学校官网/企业HR系统/社区服务平台）'
- 'constraint_B: 用户当前已有的材料/条件和缺失项（个人证件App/电子社保卡/银行App流水/企业App劳动合同）'
- 'options: 标准流程（可能遇到循环阻塞）vs 并行办理（节省等待时间）vs 容缺受理（先提交再补材料）vs 替代材料绕过阻塞'
applicable_roles: []
inapplicable_roles: []
