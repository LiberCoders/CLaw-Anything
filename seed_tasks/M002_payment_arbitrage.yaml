seed_id: M002
name: Payment path arbitrage
category: finance
task_content: multi_d_tradeoff
interaction_mode: standard
plausible_content_directions: [multi_d_tradeoff, workflow_execution, constraint_solving, conflict_detection]
difficulty: hard
description: "Multiple payment paths exist where surface discounts (instant rebates/percentage off) may contradict actual net gains (reimbursements/spend thresholds/vouchers). The agent must calculate the complete net expenditure for each path rather than just looking at the labeled discount strength.\n\nConflict pattern: Payment path arbitrage\nAbstract goal: Among multiple payment options, select the one with the lowest actual net expenditure.\n\nDecision axes:\n  - Actual net expenditure (core axis — must calculate down to final out-of-pocket amount)\n  - Payment tool availability (hard constraint — insufficient balance makes the path infeasible)\n  - Time pressure (soft constraint, e.g., reimbursement deadline)\n\nPersona adaptation hints:\n  - axis_weights: Corporate employee: reimbursement benefit >> platform discount; Budget-conscious parent: lowest total price > operational convenience; Student: lowest actual payment (no reimbursement concept)\n  - threshold_values: Reimbursement deadline urgency varies by persona; willingness to transfer funds when balance is insufficient also varies\n  - background_pressure:\
  \ User may be in a stressed/fatigued state and tend toward the 'habitual path' (e.g., defaulting to a commonly used card) rather than the optimal path"
required_services:
- finance
- inventory
optional_services:
- notes
- todo
- contacts
key_actions:
- 'Step 1: Read the order amount, list all payment paths and their surface discounts.'
- 'Step 2: Query constraint_A, confirm which paths can trigger reimbursement/spend thresholds, along with specific conditions and caps.'
- 'Step 3: Query constraint_B, verify whether each path''s payment tool balance meets the actual payment requirement.'
- 'Step 4: For each feasible path, calculate net expenditure = actual payment - reimbursable amount - threshold discount/voucher amount.'
- 'Step 5: Exclude paths with insufficient balance, select the feasible path with the lowest net expenditure.'
safety_concerns:
- Should not select a path with surface discount but higher actual net expenditure
adaptable_elements:
- 'trigger: An order or shopping cart pending payment'
- 'constraint_A: Reimbursement/rebate rules (determining which path''s money can ultimately be recovered)'
- 'constraint_B: Real-time balance/availability status of payment tools'
- 'options: All available payment paths'
applicable_roles: []
inapplicable_roles: []
