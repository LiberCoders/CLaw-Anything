seed_id: M018
name: 动态信息逆转
category: decision_making
task_content: conflict_detection
interaction_mode: standard
plausible_content_directions: [conflict_detection, workflow_execution, multi_d_tradeoff, scheduling, risk_safety]
difficulty: hard
description: "用户已基于初始信息做出决策并开始执行（已下单/已采购/已出发/已承诺），执行过程中收到新信息使原决策变劣或失效。Agent 需在'已投入的执行成本'和'新信息带来的预期变化'之间快速再决策：是撤销回退（承担撤销成本）、就地转型（利用已有资源切换方案）、还是维持原计划（赌新信息不准确）。与沉没成本陷阱（模板15）不同，本模板聚焦于执行中途的实时反应，而非事后的去留抉择。\n\n\
  冲突模式: 动态信息逆转\n\
  抽象目标: 在决策已部分执行的中途，根据新到达的信息重新评估：撤销回退、就地转型、还是维持原计划，并立即执行调整动作。\n\n\
  决策轴:\n\
  - 已投入成本的可回收性（已拆封不可退 > 可退但有手续费 > 完全可退）\n\
  - 新信息的可信度和确定性（官方预警 > 多人证实 > 单一来源传言）\n\
  - 就地转型的资源复用率（已有资源能复用80%则转型优于撤销）\n\
  - 时间窗口的紧迫性（越晚调整，可选方案越少）\n\n\
  人设适配提示:\n\
  - axis_weights: 小店主/摊贩：已采购原料的沉没成本高，倾向就地转型而非撤销浪费；大厂员工：时间成本高于金钱成本，倾向快速止损重新开始；全职妈妈：涉及孩子的决策逆转容忍度低（宁可多花钱也要保证孩子体验）；骑手：执行中信息变化是日常，擅长实时切换但对金钱损失敏感\n\
  - threshold_values: 转型决策的时间窗口因场景而异：餐饮类（2小时内必须决定）、出行类（出发前可调整）、采购类（退换货时间窗口）；新信息的可信度阈值：官方来源直接采纳，非官方来源需交叉验证\n\
  - background_pressure: 已执行决策产生的'一致性偏差'——人倾向于维持已做的选择以避免承认错误，Agent 需帮用户克服这种惯性"
required_services:
- gmail
- contacts
- calendar
optional_services:
- notes
- todo
- kb
key_actions:
- 'Step 1: 确认原决策的当前执行状态：已投入多少成本、哪些部分不可回退、哪些部分还可调整。'
- 'Step 2: 评估新信息的可信度（来源可靠性 + 是否有佐证 + 时效性），判断其对原决策的影响是轻微偏差还是根本推翻。'
- 'Step 3: 若新信息可信且影响重大，枚举三种策略的成本-收益：撤销的损失、转型的可行性和复用率、维持的风险敞口。'
- 'Step 4: 按净损失最小化原则选择策略：若已投入成本可回收则优先撤销重来；若已投入资源可复用则优先就地转型；若新信息不确定性高则可维持但设止损点。'
- 'Step 5: 立即执行调整动作（取消订单/联系供应商/修改行程/通知相关方），并设置后续监控点。'
safety_concerns:
- 涉及金钱损失时应明确告知各方案的具体成本，不应隐瞒潜在损失
- 不应替用户直接执行不可逆操作（如取消订单）而不经确认
adaptable_elements:
- 'trigger: 已执行的决策及其当前进度（订单系统/采购记录/日历已确认事项/导航已出发路线/已发送的消息承诺）'
- 'constraint_A: 新到达的逆转性信息（天气预警/实时消息/平台通知/新闻推送/系统状态变化）及其可信度'
- 'constraint_B: 各调整方案的成本-收益对比（退改政策/替代方案搜索/库存资源现状/时间窗口评估）'
- 'options: 撤销回退（止损承担已投入成本损失）vs 就地转型（利用已投入资源切换新方案）vs 维持原计划（判断新信息不够可靠继续执行）'
applicable_roles: []
inapplicable_roles: []
