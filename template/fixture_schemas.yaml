# Fixture record schemas — extracted from E01 gold environment.
# Used by fixture_generator.py as templates for LLM-based fixture generation.

gmail:
  id_field: message_id
  id_prefix: "MSG-"
  id_start: 5001
  fields:
    message_id: {type: string, example: "MSG-5001"}
    from: {type: string, example: "zhang.wei@acmecorp.com"}
    to: {type: string, example: "support@ourcompany.com"}
    subject: {type: string, example: "Order shipment delay - Urgent"}
    date: {type: string, example: "2026-03-25T09:30:00+08:00"}
    body: {type: string, example: "Hello, our company (ACME Corp, customer ID CUS-101) placed an order on March 20..."}
    labels: {type: "list[string]", example: ["urgent", "customer"]}
    is_read: {type: boolean, example: false}
  example_record: |
    {
      "message_id": "MSG-5001",
      "from": "zhang.wei@acmecorp.com",
      "to": "support@ourcompany.com",
      "subject": "Order shipment delay - Urgent",
      "date": "2026-03-25T09:30:00+08:00",
      "body": "Hello, our company (ACME Corp, customer ID CUS-101) placed an order on March 20 (ticket TK-801) and has not received a shipment notification. The contractual delivery date was March 24, and it is now one day overdue. Our production line is waiting for this batch of parts to start, and each day of delay causes approximately $7,000 in downtime losses. Please process this promptly and let us know the estimated shipping date.\n\nZhang Wei\nACME Corp Procurement Manager\nPhone: +86 13912345678",
      "labels": ["urgent", "customer"],
      "is_read": false
    }

