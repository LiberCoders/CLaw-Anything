# =============================================================================
# Fixed section: Full tool set — CLI tools (evaluatable) + GUI tools
# =============================================================================
tools:
  # ---- Todo (port 9102) ----
  - { name: todo_list_tasks, description: "List TODO tasks. Returns full task details. Default returns all tasks. Use status filter to narrow results.", input_schema: { type: object, properties: { status: { type: string, description: "Filter by status: 'pending', 'in_progress', 'completed', or 'all' (default 'all')" } } } }
  - { name: todo_create_task, description: "Create a new TODO task", input_schema: { type: object, properties: { title: { type: string }, description: { type: string, description: "Task description (optional)" }, priority: { type: string, description: "Priority level, default 'medium'" }, due_date: { type: string, description: "Due date in ISO format (optional)" } }, required: [title] } }
  - { name: todo_update_task, description: "Update an existing TODO task. Only provided fields will be changed.", input_schema: { type: object, properties: { task_id: { type: string }, title: { type: string, description: "New title (optional)" }, priority: { type: string, description: "New priority (optional)" }, status: { type: string, description: "New status: 'pending', 'in_progress', 'completed' (optional)" }, tags: { type: array, items: { type: string }, description: "New tags list (optional)" } }, required: [task_id] } }
  - { name: todo_delete_task, description: "Delete a TODO task by task_id", input_schema: { type: object, properties: { task_id: { type: string } }, required: [task_id] } }

  # ---- Finance (port 9104) ----
  - { name: finance_list_transactions, description: "List financial transactions. Returns all transactions by default. Use start_date and end_date to filter by date range.", input_schema: { type: object, properties: { start_date: { type: string, description: "Filter from this date (YYYY-MM-DD, inclusive, optional)" }, end_date: { type: string, description: "Filter until this date (YYYY-MM-DD, inclusive, optional)" } } } }
  - { name: finance_get_transaction, description: "Get full transaction details by transaction_id", input_schema: { type: object, properties: { transaction_id: { type: string } }, required: [transaction_id] } }
  - { name: finance_report_submit, description: "Submit a finance report with transaction references", input_schema: { type: object, properties: { title: { type: string }, transactions: { type: array, items: { type: string } }, total_amount: { type: number } }, required: [title, transactions, total_amount] } }

  # ---- KB (port 9106) ----
  - { name: kb_search, description: "Search KB articles by keyword. Returns title/snippet (first 150 chars) only. Default max 5 results. Response includes 'total' (all matching) and 'returned' (this page) counts. Use offset for pagination. Use kb_get_article for full content.", input_schema: { type: object, properties: { query: { type: string }, category: { type: string, description: "Filter by category (optional)" }, max_results: { type: integer, description: "Max results to return, default 5" }, offset: { type: integer, description: "Skip first N results for pagination, default 0" } }, required: [query] } }
  - { name: kb_get_article, description: "Get full KB article content by article_id", input_schema: { type: object, properties: { article_id: { type: string } }, required: [article_id] } }
  - { name: kb_update_article, description: "Update a KB article's content", input_schema: { type: object, properties: { article_id: { type: string }, content: { type: string, description: "New article content" } }, required: [article_id, content] } }

  # ---- Helpdesk (port 9107) ----
  - { name: helpdesk_list_tickets, description: "List helpdesk tickets. Default shows only 'open' tickets. Use status='all' to see all tickets.", input_schema: { type: object, properties: { status: { type: string, description: "Filter by status: 'open', 'closed', 'all', etc. Default 'open'" } } } }
  - { name: helpdesk_get_ticket, description: "Get full ticket details by ticket_id", input_schema: { type: object, properties: { ticket_id: { type: string } }, required: [ticket_id] } }
  - { name: helpdesk_update_ticket, description: "Update a helpdesk ticket. Only provided fields will be changed.", input_schema: { type: object, properties: { ticket_id: { type: string }, priority: { type: string, description: "New priority (optional)" }, tags: { type: array, items: { type: string }, description: "New tags (optional)" }, category: { type: string, description: "New category (optional)" } }, required: [ticket_id] } }
  - { name: helpdesk_close_ticket, description: "Close a helpdesk ticket with a resolution note", input_schema: { type: object, properties: { ticket_id: { type: string }, resolution: { type: string, description: "Resolution description" } }, required: [ticket_id, resolution] } }

  # ---- Inventory (port 9108) ----
  - { name: inventory_list_products, description: "List inventory products. Returns full product details. Optionally filter by category.", input_schema: { type: object, properties: { category: { type: string, description: "Filter by product category (optional)" } } } }
  - { name: inventory_get_product, description: "Get full product details by product_id", input_schema: { type: object, properties: { product_id: { type: string } }, required: [product_id] } }
  - { name: inventory_create_order, description: "Create a purchase order for a product", input_schema: { type: object, properties: { product_id: { type: string }, quantity: { type: integer }, supplier: { type: string, description: "Supplier name (optional)" } }, required: [product_id, quantity] } }

  # ---- RSS (port 9109) ----
  - { name: rss_list_feeds, description: "List available RSS feed sources and their categories. Optionally filter by category.", input_schema: { type: object, properties: { category: { type: string, description: "Filter by category (optional)" } } } }
  - { name: rss_list_articles, description: "List RSS articles (summary only, no full content). Default max 20 results. Filter by source or category.", input_schema: { type: object, properties: { source: { type: string, description: "Filter by source/feed name (optional)" }, category: { type: string, description: "Filter by category (optional)" }, max_results: { type: integer, description: "Max articles to return, default 20" } } } }
  - { name: rss_get_article, description: "Get full RSS article content by article_id", input_schema: { type: object, properties: { article_id: { type: string } }, required: [article_id] } }
  - { name: rss_publish, description: "Publish a newsletter", input_schema: { type: object, properties: { title: { type: string }, content: { type: string }, recipients: { type: array, items: { type: string }, description: "List of recipients (optional)" } }, required: [title, content] } }

  # ---- CRM (port 9110) ----
  - { name: crm_list_customers, description: "List CRM customers (summary only, no detailed notes/contracts). Filter by status, tier, or industry.", input_schema: { type: object, properties: { status: { type: string, description: "Filter by customer status (optional)" }, tier: { type: string, description: "Filter by customer tier (optional)" }, industry: { type: string, description: "Filter by industry (optional)" } } } }
  - { name: crm_get_customer, description: "Get full customer details including notes and contracts by customer_id", input_schema: { type: object, properties: { customer_id: { type: string } }, required: [customer_id] } }

  # ---- Config (port 9111) ----
  - { name: config_list_integrations, description: "List integrations (summary only, no secrets/credentials). Optionally filter by status.", input_schema: { type: object, properties: { status: { type: string, description: "Filter by status, e.g. 'active', 'inactive' (optional)" } } } }
  - { name: config_get_integration, description: "Get full integration details by integration_id", input_schema: { type: object, properties: { integration_id: { type: string } }, required: [integration_id] } }

  # ---- Scheduler (port 9112) ----
  - { name: scheduler_list_jobs, description: "List scheduled jobs (summary, no action/history). Filter by status, enabled state, or tag.", input_schema: { type: object, properties: { status: { type: string, description: "Filter by last run status (optional)" }, enabled: { type: boolean, description: "Filter by enabled state (optional)" }, tag: { type: string, description: "Filter by tag (optional)" } } } }
  - { name: scheduler_get_job, description: "Get full job details including action and execution history by job_id", input_schema: { type: object, properties: { job_id: { type: string } }, required: [job_id] } }
  - { name: scheduler_create_job, description: "Create a new scheduled job", input_schema: { type: object, properties: { name: { type: string }, cron_expression: { type: string }, action: { type: string }, enabled: { type: boolean, description: "Whether the job is enabled, default true" }, tags: { type: array, items: { type: string }, description: "Job tags (optional)" }, created_by: { type: string, description: "Creator name (optional)" } }, required: [name, cron_expression, action] } }
