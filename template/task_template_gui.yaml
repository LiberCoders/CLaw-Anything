# =============================================================================
# Claw-Anything Combined CLI + GUI Task Template
# =============================================================================
# This template extends the standard CLI template with Android GUI tools.
# Use this template for tasks that cross CLI mock-services and GUI phone apps.
#
# GUI apps (suffix _gui) are served by the GUI harness at port 9120.
# Their tool_endpoints route through http://localhost:9120/gui/<app>/<action>.
# GUI apps are NOT evaluated via mock services — they appear as tool calls in
# the trace and can be counted with tool_called scoring components.
#
# CLI services (no _gui suffix) work identically to task_template.yaml and
# ARE evaluated against fixture data.
#
# Instructions:
#   1. Copy this file to gen_tasks/GXXX_task_name/task.yaml
#   2. Global-replace GXXX_task_name with your task directory name
#   3. Edit all sections marked <<<CUSTOMIZE>>>
#   4. The services / tools / tool_endpoints sections are fixed — do not modify
# =============================================================================

# <<<CUSTOMIZE: task metadata>>>
task_id: GXXX_task_name
task_name: <<<CUSTOMIZE: task name>>>
version: "1.0"
category: <<<CUSTOMIZE: android_gui | productivity | cross_device | communication>>>
difficulty: <<<CUSTOMIZE: simple | medium | hard>>>

# =============================================================================
# Android environment metadata (documentation only — not processed by runner)
# =============================================================================
android_environment:
  execution_mode: avd_snapshot
  device_profile: pixel_6
  gui_harness_base_url: http://localhost:9120
  installed_apps:
    - { app: gmail_clone_gui,       package: "com.gmailclone" }
    - { app: fossify_calendar_gui,  package: "org.fossify.calendar" }
    - { app: fossify_messages_gui,  package: "org.fossify.messages" }
    - { app: fossify_notes_gui,     package: "org.fossify.notes" }
    - { app: mastodon_gui,          package: "org.joinmastodon.android.mastodon" }
    - { app: mattermost_gui,        package: "com.mattermost.rnbeta" }
    - { app: testmall_gui,          package: "com.testmall.app" }
    - { app: odf_reader_gui,        package: "at.tomtasche.reader" }
    - { app: photo_gallery_gui,     package: "gallery.photomanager.picturegalleryapp.imagegallery" }
    - { app: opentracks_gui,        package: "de.dennisguse.opentracks.playstore" }
    - { app: loop_habit_gui,        package: "org.isoron.uhabits" }
    - { app: my_expenses_gui,       package: "org.totschnig.myexpenses" }
    - { app: markor_gui,            package: "net.gsantner.markor" }
    - { app: contacts_gui,          package: "com.google.android.contacts" }
    - { app: dialer_gui,            package: "com.google.android.dialer" }
    - { app: clock_gui,             package: "com.google.android.deskclock" }
    - { app: maps_gui,              package: "com.google.android.apps.maps" }
    - { app: camera_gui,            package: "com.android.camera2" }
    - { app: settings_gui,          package: "com.android.settings" }

# =============================================================================
