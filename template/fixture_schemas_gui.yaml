# ---- fossify_messages_gui (org.fossify.messages — SMS/MMS threads seeded via telephony content provider) ----
fossify_messages_gui:
  id_field: thread_id
  id_prefix: "FSMS-"
  id_start: 301
  fields:
    thread_id: {type: string, example: "FSMS-301"}
    participants: {type: "list[string]", example: ["+86 13912345678"]}
    contact_name: {type: "string|null", example: "Wang Fang"}
    last_message: {type: string, example: "See you at 3 PM then!"}
    last_message_time: {type: string, example: "2026-04-25T14:55:00+08:00"}
    unread_count: {type: integer, example: 2}
    pinned: {type: boolean, example: false}
    archived: {type: boolean, example: false}
    messages: {type: "list[object]", example: [{"id": "MSG-001", "from": "+86 13912345678", "text": "Are you free at 3 PM?", "time": "2026-04-25T14:50:00+08:00", "is_outgoing": false}, {"id": "MSG-002", "from": "me", "text": "Yes, see you then!", "time": "2026-04-25T14:52:00+08:00", "is_outgoing": true}]}
  example_record: |
    {
      "thread_id": "FSMS-301",
      "participants": ["+86 13912345678"],
      "contact_name": "Wang Fang",
      "last_message": "Yes, see you then!",
      "last_message_time": "2026-04-25T14:52:00+08:00",
      "unread_count": 0,
      "pinned": false,
      "archived": false,
      "messages": [
        {"id": "MSG-001", "from": "+86 13912345678", "text": "Are you free at 3 PM?", "time": "2026-04-25T14:50:00+08:00", "is_outgoing": false},
        {"id": "MSG-002", "from": "me", "text": "Yes, see you then!", "time": "2026-04-25T14:52:00+08:00", "is_outgoing": true}
      ]
    }

