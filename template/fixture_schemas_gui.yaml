# Fixture record schemas for GUI apps — based on docs/android/app.txt.
# Used by fixture_generator.py as templates for LLM-based fixture generation.
# Each top-level key is named <app>_gui to distinguish from CLI fixture schemas.

# ---- gmail_clone_gui (com.gmailclone — email inbox injected via state.json) ----
gmail_clone_gui:
  id_field: message_id
  id_prefix: "GMSG-"
  id_start: 1001
  fields:
    message_id: {type: string, example: "GMSG-1001"}
    thread_id: {type: string, example: "GTHR-1001"}
    from: {type: string, example: "alice@example.com"}
    to: {type: string, example: "me@example.com"}
    subject: {type: string, example: "Meeting rescheduled to Friday"}
    date: {type: string, example: "2026-04-25T10:30:00+08:00"}
    body: {type: string, example: "Hi, just a heads-up that our weekly sync has moved to Friday 3 PM. Please update your calendar accordingly."}
    labels: {type: "list[string]", example: ["inbox", "work"]}
    is_read: {type: boolean, example: false}
    has_attachment: {type: boolean, example: false}
  example_record: |
    {
      "message_id": "GMSG-1001",
      "thread_id": "GTHR-1001",
      "from": "alice@example.com",
      "to": "me@example.com",
      "subject": "Meeting rescheduled to Friday",
      "date": "2026-04-25T10:30:00+08:00",
      "body": "Hi, just a heads-up that our weekly sync has moved to Friday 3 PM. Please update your calendar accordingly.\n\n— Alice",
      "labels": ["inbox", "work"],
      "is_read": false,
      "has_attachment": false
    }

