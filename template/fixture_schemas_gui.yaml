# ---- my_expenses_gui (org.totschnig.myexpenses — accounts and transactions injected via SQLite data DB) ----
my_expenses_gui:
  id_field: label
  id_prefix: "MYACC-"
  id_start: 101
  fixture_format: compound
  fields:
    accounts:
      type: "list[object]"
      item_fields:
        label: {type: string, example: "Cash Wallet"}
        currency: {type: string, example: "USD"}
        type: {type: string, example: "CASH", description: "CASH | BANK | CCARD | ASSET | LIABILITY"}
        opening_balance: {type: integer, example: 50000, description: "Minor currency units (cents)"}
        description: {type: string, example: "Daily cash spending"}
        color: {type: integer, example: -3355444}
    categories:
      type: "list[object]"
      item_fields:
        label: {type: string, example: "Food & Dining"}
        type: {type: string, example: "expense", description: "expense | income"}
    payees:
      type: "list[string]"
      example: ["Starbucks", "Uber", "Amazon"]
    transactions:
      type: "list[object]"
      item_fields:
        account: {type: string, example: "Cash Wallet", description: "Must match an account label"}
        amount: {type: integer, example: -1250, description: "Cents; negative=expense, positive=income"}
        date: {type: string, example: "2026-04-22"}
        category: {type: string, example: "Food & Dining"}
        payee: {type: string, example: "Starbucks"}
        comment: {type: string, example: "Morning coffee"}
