    {
      "accounts": [
        {"label": "Cash Wallet", "currency": "USD", "type": "CASH", "opening_balance": 50000, "description": "Daily spending", "color": -3355444},
        {"label": "Checking Account", "currency": "USD", "type": "BANK", "opening_balance": 250000, "description": "Primary bank account", "color": -13388315}
      ],
      "categories": [
        {"label": "Food & Dining", "type": "expense"},
        {"label": "Transport", "type": "expense"},
        {"label": "Salary", "type": "income"}
      ],
