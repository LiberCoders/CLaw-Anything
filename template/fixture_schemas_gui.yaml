      "transactions": [
        {"account": "Cash Wallet", "amount": -1250, "date": "2026-04-22", "category": "Food & Dining", "payee": "Starbucks", "comment": "Morning coffee"},
        {"account": "Checking Account", "amount": 500000, "date": "2026-04-25", "category": "Salary", "payee": "Employer Inc", "comment": "Monthly salary"}
      ]
    }

# ---- markor_gui (net.gsantner.markor — notes injected as .md/.txt files under /sdcard/Documents/markor/) ----
markor_gui:
  id_field: filename
  id_prefix: ""
  id_start: 0
  fields:
    filename: {type: string, example: "Project_Alpha_Deadline.md"}
    folder: {type: "string|null", example: "Work"}
    content: {type: string, example: "# Project Alpha\n\nCurrent deadline: **2026-06-01**\n\n## Status\n- Backend API: 90% complete\n- Frontend: 75% complete\n- Testing: In progress"}
