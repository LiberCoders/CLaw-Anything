    {
      "filename": "Project_Alpha_Deadline.md",
      "folder": "Work",
      "content": "# Project Alpha\n\nCurrent deadline: **2026-06-01**\n\n## Status\n- Backend API: 90% complete\n- Frontend: 75% complete\n- Testing: In progress\n\n## Team\n- Lead: Zhang Wei\n- Backend: Li Fang\n- Frontend: Wang Tao"
    }

# ---- settings_gui (com.android.settings — device settings read/written via ADB or Settings API) ----
settings_gui:
  id_field: setting_key
  id_prefix: ""
  id_start: 0
  fields:
    setting_key: {type: string, example: "wifi_enabled"}
    display_name: {type: string, example: "Wi-Fi"}
    category: {type: string, example: "Network & internet"}
    value_type: {type: string, example: "boolean"}
    current_value: {type: "boolean|string|integer", example: true}
