  - { name: stumail_save_draft, description: "Save a campus email as a draft (not sent). Use reply_to_message_id to mark as reply.", input_schema: { type: object, properties: { to: { type: string }, subject: { type: string }, body: { type: string }, reply_to_message_id: { type: string, description: "Original message ID if replying (optional)" } }, required: [to, subject, body] } }

