# =============================================================================
# Claw-Anything Full-Environment Task Template
# =============================================================================
# Instructions:
#   1. Copy this file to gen_tasks/GXXX_task_name/task.yaml
#   2. Global-replace GXXX_task_name with your task directory name
#   3. Edit all sections marked <<<CUSTOMIZE>>>
#   4. The services / tools / tool_endpoints sections are fixed — do not modify
# =============================================================================

# <<<CUSTOMIZE: task metadata>>>
task_id: GXXX_task_name
task_name: <<<CUSTOMIZE: task name>>>
version: "1.0"
category: <<<CUSTOMIZE: customer_service | finance | ops | security | ...>>>
difficulty: <<<CUSTOMIZE: simple | medium | hard>>>

