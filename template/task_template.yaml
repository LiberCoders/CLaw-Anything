  - { name: claw_feishu_list_docs, description: "List Feishu docs. Optionally filter by group_id. Returns doc summaries (doc_id, title, author, last_updated).", input_schema: { type: object, properties: { group_id: { type: string, description: "Filter to one group (optional)" }, max_results: { type: integer, description: "Max docs to return (default 20)" }, offset: { type: integer, description: "Pagination offset (default 0)" } } } }
  - { name: claw_feishu_create_doc, description: "Create a new Feishu doc inside a group. Returns the allocated doc_id.", input_schema: { type: object, properties: { group_id: { type: string }, title: { type: string }, content: { type: string, description: "Initial content (optional, default empty)" }, author: { type: string } }, required: [group_id, title, author] } }
  - { name: claw_feishu_update_doc, description: "Update the content of an existing Feishu doc by doc_id. Overwrites the content field.", input_schema: { type: object, properties: { doc_id: { type: string }, content: { type: string } }, required: [doc_id, content] } }

