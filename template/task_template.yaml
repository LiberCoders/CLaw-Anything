  - { name: workmail_get_message, description: "Get full company-internal message details including body by message_id", input_schema: { type: object, properties: { message_id: { type: string } }, required: [message_id] } }
  - { name: workmail_send_message, description: "Send a company-internal email to the specified recipient (use only for colleague-facing communication)", input_schema: { type: object, properties: { to: { type: string }, subject: { type: string }, body: { type: string } }, required: [to, subject, body] } }
  - { name: workmail_save_draft, description: "Save a company-internal email as draft (not sent). Use reply_to_message_id to mark it as a reply.", input_schema: { type: object, properties: { to: { type: string }, subject: { type: string }, body: { type: string }, reply_to_message_id: { type: string, description: "Original message ID if this is a reply (optional)" } }, required: [to, subject, body] } }

  # ---- Claw-Notion (port 9114) — page + block + database knowledge tree ----
  - { name: claw_notion_list_pages, description: "List claw_notion pages (summary only, no blocks). Optionally filter by parent_page_id or database_id. By default archived pages are excluded.", input_schema: { type: object, properties: { parent_page_id: { type: string, description: "Filter by parent page id (optional)" }, database_id: { type: string, description: "Filter by database id (optional)" }, include_archived: { type: boolean, description: "Whether to include archived pages, default false" }, max_results: { type: integer, description: "Max pages to return, default 20" }, offset: { type: integer, description: "Skip first N results for pagination, default 0" } } } }
  - { name: claw_notion_get_page, description: "Get full page details (title + properties + blocks) by page_id", input_schema: { type: object, properties: { page_id: { type: string } }, required: [page_id] } }
  - { name: claw_notion_create_page, description: "Create a new claw_notion page. Optionally nest under a parent page, attach to a database, set initial properties and blocks.", input_schema: { type: object, properties: { title: { type: string }, parent_page_id: { type: string, description: "Parent page id (optional)" }, database_id: { type: string, description: "Database id if this page belongs to a database (optional)" }, properties: { type: object, description: "Structured key-value properties (optional)" }, blocks: { type: array, items: { type: object }, description: "Initial blocks, each {type, text} (optional)" } }, required: [title] } }
  - { name: claw_notion_update_page_properties, description: "Update a page's structured properties (merge into existing). Does not touch blocks.", input_schema: { type: object, properties: { page_id: { type: string }, properties: { type: object, description: "Property keys to set/override" } }, required: [page_id, properties] } }
  - { name: claw_notion_append_blocks, description: "Append blocks to the end of a page's block list. Each block is {type, text}.", input_schema: { type: object, properties: { page_id: { type: string }, blocks: { type: array, items: { type: object }, description: "Blocks to append" } }, required: [page_id, blocks] } }
  - { name: claw_notion_archive_page, description: "Archive a page (soft delete; page remains retrievable by id but excluded from default list/search).", input_schema: { type: object, properties: { page_id: { type: string } }, required: [page_id] } }
  - { name: claw_notion_search, description: "Full-text search pages by query (matches if ALL words appear in title/properties/blocks). Archived pages are excluded.", input_schema: { type: object, properties: { query: { type: string }, max_results: { type: integer, description: "Max pages to return, default 10" }, offset: { type: integer, description: "Skip first N results for pagination, default 0" } }, required: [query] } }
  - { name: claw_notion_query_database, description: "Query pages in a database by equality filter on properties. Archived pages are excluded.", input_schema: { type: object, properties: { database_id: { type: string }, property_filter: { type: object, description: "Key-value pairs; page matches if all pairs equal page.properties[key]" }, max_results: { type: integer, description: "Max pages to return, default 20" }, offset: { type: integer, description: "Skip first N results for pagination, default 0" } }, required: [database_id] } }

  # ---- Claw-Obsidian (port 9115) — markdown vault with bidirectional links + tags ----
  - { name: claw_obsidian_list_notes, description: "List claw_obsidian notes (summary only, no content). Optionally filter by folder or tag.", input_schema: { type: object, properties: { folder: { type: string, description: "Filter by folder path (optional)" }, tag: { type: string, description: "Filter by a single tag (optional)" }, max_results: { type: integer, description: "Max notes to return, default 20" }, offset: { type: integer, description: "Skip first N results for pagination, default 0" } } } }
  - { name: claw_obsidian_get_note, description: "Get full note (title + content + tags + outlinks + inlinks) by note_id", input_schema: { type: object, properties: { note_id: { type: string } }, required: [note_id] } }
  - { name: claw_obsidian_create_note, description: "Create a new claw_obsidian markdown note. Returns the new note_id.", input_schema: { type: object, properties: { title: { type: string }, folder: { type: string, description: "Folder path (optional)" }, tags: { type: array, items: { type: string }, description: "Tag list (optional)" }, content: { type: string, description: "Initial markdown content (optional)" } }, required: [title] } }
  - { name: claw_obsidian_update_note, description: "Replace a note's content wholesale (destructive; prefer append_to_note for incremental edits).", input_schema: { type: object, properties: { note_id: { type: string }, content: { type: string, description: "New full markdown content" } }, required: [note_id, content] } }
  - { name: claw_obsidian_append_to_note, description: "Append markdown text to the end of a note's content. Adds a newline separator if needed.", input_schema: { type: object, properties: { note_id: { type: string }, text: { type: string, description: "Markdown text to append" } }, required: [note_id, text] } }
  - { name: claw_obsidian_delete_note, description: "Delete a note permanently. Also scrubs this note's id from the inlinks/outlinks of every connected neighbour (cascading cleanup).", input_schema: { type: object, properties: { note_id: { type: string } }, required: [note_id] } }
  - { name: claw_obsidian_search, description: "Search notes by text query (matches if ALL query words appear in title/tags/content) and/or by required tags (note must contain ALL listed tags).", input_schema: { type: object, properties: { query: { type: string, description: "Text query (optional; empty = no text filter)" }, tags: { type: array, items: { type: string }, description: "Required tags (optional; all must be present on the note)" }, max_results: { type: integer, description: "Max notes to return, default 10" }, offset: { type: integer, description: "Skip first N results for pagination, default 0" } } } }
  - { name: claw_obsidian_add_link, description: "Create a directed link from_note_id → to_note_id. Automatically records the reverse inlink on to_note_id so backlinks stay in sync.", input_schema: { type: object, properties: { from_note_id: { type: string }, to_note_id: { type: string } }, required: [from_note_id, to_note_id] } }
  - { name: claw_obsidian_remove_link, description: "Remove a directed link from_note_id → to_note_id. Also removes the reverse inlink on to_note_id.", input_schema: { type: object, properties: { from_note_id: { type: string }, to_note_id: { type: string } }, required: [from_note_id, to_note_id] } }
  - { name: claw_obsidian_get_backlinks, description: "Get the list of note_ids that link TO this note (reads the inlinks field directly).", input_schema: { type: object, properties: { note_id: { type: string } }, required: [note_id] } }

  # ---- Meeting (port 9116) — Zoom-like lifecycle: scheduled -> started -> ended (or cancelled); ending a started meeting auto-generates a recording ----
  - { name: meeting_list, description: "List meetings. Filter by status (scheduled/started/ended/cancelled/all), host, or date range. Returns summary (no participants/recordings).", input_schema: { type: object, properties: { status: { type: string, description: "scheduled | started | ended | cancelled | all (default all)" }, host: { type: string, description: "Filter by host email substring (optional)" }, start_date: { type: string, description: "YYYY-MM-DD inclusive (optional)" }, end_date: { type: string, description: "YYYY-MM-DD inclusive (optional)" } } } }
  - { name: meeting_get, description: "Get full meeting details (participants + recordings) by meeting_id", input_schema: { type: object, properties: { meeting_id: { type: string } }, required: [meeting_id] } }
  - { name: meeting_create, description: "Schedule a new meeting. status starts as 'scheduled'. passcode/join_url are auto-generated if omitted.", input_schema: { type: object, properties: { topic: { type: string }, host: { type: string, description: "Host email" }, start_time: { type: string, description: "ISO 8601" }, duration_minutes: { type: integer, description: "Default 60" }, participants: { type: array, items: { type: object }, description: "Initial participant list, each {email, role, status} (optional)" }, join_url: { type: string, description: "Optional; auto-generated if omitted" }, passcode: { type: string, description: "Optional; auto-generated if omitted" } }, required: [topic, host, start_time] } }
  - { name: meeting_update, description: "Update topic/start_time/duration of a scheduled or started meeting. Only provided fields change. Terminal states (ended/cancelled) reject updates.", input_schema: { type: object, properties: { meeting_id: { type: string }, topic: { type: string }, start_time: { type: string }, duration_minutes: { type: integer } }, required: [meeting_id] } }
  - { name: meeting_cancel, description: "Cancel a scheduled/started meeting (status=cancelled, irreversible). Rejects meetings already in a terminal state.", input_schema: { type: object, properties: { meeting_id: { type: string } }, required: [meeting_id] } }
  - { name: meeting_start, description: "Start a scheduled meeting (status scheduled -> started). Only valid from 'scheduled'.", input_schema: { type: object, properties: { meeting_id: { type: string } }, required: [meeting_id] } }
  - { name: meeting_end, description: "End a meeting. If it was started, status -> ended and a recording is auto-appended. If it was still scheduled (never started), this is treated as a soft-cancel (status -> cancelled, NO recording).", input_schema: { type: object, properties: { meeting_id: { type: string } }, required: [meeting_id] } }
  - { name: meeting_add_participant, description: "Register a participant on a meeting with an initial RSVP status of 'invited'. role defaults to 'attendee' (other values: 'host', 'panelist').", input_schema: { type: object, properties: { meeting_id: { type: string }, email: { type: string }, role: { type: string, description: "host | panelist | attendee (default attendee)" } }, required: [meeting_id, email] } }
  - { name: meeting_remove_participant, description: "Remove a participant from a meeting by email.", input_schema: { type: object, properties: { meeting_id: { type: string }, email: { type: string } }, required: [meeting_id, email] } }
  - { name: meeting_list_recordings, description: "List recordings across meetings. Filter by meeting_id, host, or recording date range. Each entry also carries topic/host of its parent meeting.", input_schema: { type: object, properties: { meeting_id: { type: string, description: "Filter to one meeting (optional)" }, host: { type: string, description: "Filter by host email substring (optional)" }, start_date: { type: string, description: "YYYY-MM-DD inclusive on recording date (optional)" }, end_date: { type: string, description: "YYYY-MM-DD inclusive on recording date (optional)" } } } }

  # ---- Claw-Zotero (port 9117) — literature manager: items + collections + per-item notes ----
  - { name: claw_zotero_list_items, description: "List literature items. Filter by collection_id, tag, item_type (article/book/book_chapter/thesis/webpage/report), or year_min/year_max range. Returns summary (no abstract/notes). Supports pagination via offset/max_results.", input_schema: { type: object, properties: { collection_id: { type: string, description: "Filter to one collection (optional)" }, tag: { type: string, description: "Filter by tag (optional)" }, item_type: { type: string, description: "Filter by item_type (optional)" }, year_min: { type: integer, description: "Inclusive lower bound on publication year (optional)" }, year_max: { type: integer, description: "Inclusive upper bound on publication year (optional)" }, max_results: { type: integer, description: "Max items to return, default 20" }, offset: { type: integer, description: "Skip first N results for pagination, default 0" } } } }
  - { name: claw_zotero_get_item, description: "Get full metadata of one literature item by item_id, including abstract, tags, collection_ids, and all attached notes.", input_schema: { type: object, properties: { item_id: { type: string } }, required: [item_id] } }
  - { name: claw_zotero_search, description: "Search literature items by keyword (matches title, authors, DOI, venue, abstract, tags, citation_key). Query words are AND-matched. Optionally require all of a set of tags.", input_schema: { type: object, properties: { query: { type: string, description: "Space-separated keywords (AND)" }, tags: { type: array, items: { type: string }, description: "All-of tag filter (optional)" }, max_results: { type: integer, description: "Max items to return, default 10" }, offset: { type: integer, description: "Skip first N results for pagination, default 0" } } } }
  - { name: claw_zotero_list_collections, description: "List all collections with item_count. Collections are flat labels used to group items.", input_schema: { type: object, properties: {} } }
  - { name: claw_zotero_add_item, description: "Add a new literature item. item_type defaults to 'article' (allowed: article/book/book_chapter/thesis/webpage/report). DOI and citation_key must be unique library-wide; duplicates return status=conflict without inserting.", input_schema: { type: object, properties: { title: { type: string }, item_type: { type: string, description: "article | book | book_chapter | thesis | webpage | report (default article)" }, authors: { type: array, items: { type: string } }, year: { type: integer }, venue: { type: string }, doi: { type: string }, url: { type: string }, abstract: { type: string }, tags: { type: array, items: { type: string } }, citation_key: { type: string } }, required: [title] } }
  - { name: claw_zotero_update_item, description: "Update metadata of an existing item. Only whitelisted fields can be updated: title, authors, year, venue, doi, url, abstract, tags, citation_key, item_type. Notes and collection membership have dedicated endpoints (add_note / add_to_collection / remove_from_collection). DOI and citation_key uniqueness is re-checked.", input_schema: { type: object, properties: { item_id: { type: string }, fields: { type: object, description: "Map of field -> new value" } }, required: [item_id, fields] } }
  - { name: claw_zotero_add_note, description: "Append a text note to an item (Zotero-style item note). Returns the allocated note_id.", input_schema: { type: object, properties: { item_id: { type: string }, text: { type: string } }, required: [item_id, text] } }
  - { name: claw_zotero_add_to_collection, description: "Add an item to a collection. Idempotent: adding an item that already belongs returns status=already_in_collection without duplicating.", input_schema: { type: object, properties: { item_id: { type: string }, collection_id: { type: string } }, required: [item_id, collection_id] } }
  - { name: claw_zotero_delete_item, description: "Permanently delete a literature item from the library. Irreversible.", input_schema: { type: object, properties: { item_id: { type: string } }, required: [item_id] } }
  - { name: claw_zotero_remove_from_collection, description: "Remove an item from a collection. The item itself is preserved; only the collection link is dropped.", input_schema: { type: object, properties: { item_id: { type: string }, collection_id: { type: string } }, required: [item_id, collection_id] } }

  # ---- Stumail (port 9125) — student/campus email: inbox + send + draft ----
