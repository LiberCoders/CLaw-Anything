  - { name: claw_facebook_like, description: "Like a Facebook post (idempotent).", input_schema: { type: object, properties: { post_id: { type: string } }, required: [post_id] } }
  - { name: claw_facebook_save, description: "Save a Facebook post to bookmarks (idempotent).", input_schema: { type: object, properties: { post_id: { type: string } }, required: [post_id] } }
  - { name: claw_facebook_repost, description: "Repost (share) a Facebook post with optional comment.", input_schema: { type: object, properties: { post_id: { type: string }, repost_comment: { type: string } }, required: [post_id] } }

  # ---- Claw-Zhihu (port 9129) — Q&A platform: search + answer + upvote + collect + follow ----
  - { name: claw_zhihu_search_questions, description: "Search Zhihu questions by query keyword and/or topic. Sort by 'recent' or 'hot'.", input_schema: { type: object, properties: { query: { type: string }, topic: { type: string }, sort_by: { type: string, description: "'recent' (default) or 'hot'" }, max_results: { type: integer }, offset: { type: integer } } } }
  - { name: claw_zhihu_get_question, description: "Get a Zhihu question with all its answers by question_id.", input_schema: { type: object, properties: { question_id: { type: string } }, required: [question_id] } }
  - { name: claw_zhihu_upvote_answer, description: "Upvote a Zhihu answer by answer_id.", input_schema: { type: object, properties: { answer_id: { type: string } }, required: [answer_id] } }
  - { name: claw_zhihu_collect_answer, description: "Collect (bookmark) a Zhihu answer by answer_id.", input_schema: { type: object, properties: { answer_id: { type: string } }, required: [answer_id] } }
  - { name: claw_zhihu_follow_question, description: "Follow a Zhihu question to get updates.", input_schema: { type: object, properties: { question_id: { type: string } }, required: [question_id] } }
  - { name: claw_zhihu_post_answer, description: "Post an answer to a Zhihu question.", input_schema: { type: object, properties: { question_id: { type: string }, author: { type: string }, content: { type: string } }, required: [question_id, author, content] } }

  # ---- Claw-WeChat (port 9130) — chats + moments ----
  - { name: claw_wechat_list_chats, description: "List WeChat chats. type: 'all' | 'dm' | 'group'.", input_schema: { type: object, properties: { type: { type: string, description: "'all' (default) | 'dm' | 'group'" }, max_results: { type: integer }, offset: { type: integer } } } }
  - { name: claw_wechat_get_chat, description: "Get a WeChat chat with recent messages by chat_id.", input_schema: { type: object, properties: { chat_id: { type: string }, max_messages: { type: integer, description: "Default 50" } }, required: [chat_id] } }
  - { name: claw_wechat_search_messages, description: "Search WeChat messages by query, optionally limited to one chat.", input_schema: { type: object, properties: { query: { type: string }, chat_id: { type: string }, max_results: { type: integer } }, required: [query] } }
  - { name: claw_wechat_send_message, description: "Send a WeChat message in a chat (recorded in audit).", input_schema: { type: object, properties: { chat_id: { type: string }, content: { type: string } }, required: [chat_id, content] } }
  - { name: claw_wechat_recall_message, description: "Recall (撤回) a previously sent WeChat message. Irreversible.", input_schema: { type: object, properties: { chat_id: { type: string }, message_id: { type: string } }, required: [chat_id, message_id] } }
  - { name: claw_wechat_mute_chat, description: "Mute or unmute a WeChat chat. mute=true means do-not-disturb.", input_schema: { type: object, properties: { chat_id: { type: string }, mute: { type: boolean, description: "Default true" } }, required: [chat_id] } }
  - { name: claw_wechat_browse_moments, description: "Browse WeChat Moments (朋友圈). Optional author filter.", input_schema: { type: object, properties: { author: { type: string }, max_results: { type: integer }, offset: { type: integer } } } }
  - { name: claw_wechat_search_moments, description: "Search WeChat Moments by keyword.", input_schema: { type: object, properties: { query: { type: string }, max_results: { type: integer } }, required: [query] } }
  - { name: claw_wechat_like_moment, description: "Like or unlike a Moments post.", input_schema: { type: object, properties: { post_id: { type: string }, like: { type: boolean, description: "true to like (default), false to unlike" } }, required: [post_id] } }
  - { name: claw_wechat_comment_moment, description: "Comment on a Moments post.", input_schema: { type: object, properties: { post_id: { type: string }, content: { type: string } }, required: [post_id, content] } }
  - { name: claw_wechat_post_moment, description: "Post a new Moments entry. visibility: 'friends' (default) or other allowed values.", input_schema: { type: object, properties: { content: { type: string }, images: { type: array, items: { type: string } }, visibility: { type: string } }, required: [content] } }

  # ---- Claw-QQ (port 9131) — chats + QZone ----
  - { name: claw_qq_list_chats, description: "List QQ chats. type: 'all' | 'private' | 'group'.", input_schema: { type: object, properties: { type: { type: string, description: "'all' (default) | 'private' | 'group'" }, max_results: { type: integer }, offset: { type: integer } } } }
  - { name: claw_qq_get_chat, description: "Get a QQ chat with recent messages by chat_id.", input_schema: { type: object, properties: { chat_id: { type: string }, max_messages: { type: integer, description: "Default 50" } }, required: [chat_id] } }
  - { name: claw_qq_search_messages, description: "Search QQ messages by query, optionally limited to one chat.", input_schema: { type: object, properties: { query: { type: string }, chat_id: { type: string }, max_results: { type: integer } }, required: [query] } }
  - { name: claw_qq_send_message, description: "Send a QQ message in a chat (recorded in audit).", input_schema: { type: object, properties: { chat_id: { type: string }, content: { type: string } }, required: [chat_id, content] } }
  - { name: claw_qq_recall_message, description: "Recall (撤回) a previously sent QQ message. Irreversible.", input_schema: { type: object, properties: { chat_id: { type: string }, message_id: { type: string } }, required: [chat_id, message_id] } }
  - { name: claw_qq_mute_chat, description: "Mute or unmute a QQ chat. mute=true means do-not-disturb.", input_schema: { type: object, properties: { chat_id: { type: string }, mute: { type: boolean, description: "Default true" } }, required: [chat_id] } }
  - { name: claw_qq_browse_zone, description: "Browse QZone (QQ空间) posts. Optional author filter.", input_schema: { type: object, properties: { author: { type: string }, max_results: { type: integer }, offset: { type: integer } } } }
  - { name: claw_qq_search_zone, description: "Search QZone posts by keyword.", input_schema: { type: object, properties: { query: { type: string }, max_results: { type: integer } }, required: [query] } }
  - { name: claw_qq_like_zone_post, description: "Like or unlike a QZone post.", input_schema: { type: object, properties: { post_id: { type: string }, like: { type: boolean, description: "true to like (default), false to unlike" } }, required: [post_id] } }
  - { name: claw_qq_comment_zone_post, description: "Comment on a QZone post.", input_schema: { type: object, properties: { post_id: { type: string }, content: { type: string } }, required: [post_id, content] } }
  - { name: claw_qq_post_zone, description: "Post a new QZone entry. mood: happy/excited/sad/none. visibility: public/friends/private.", input_schema: { type: object, properties: { content: { type: string }, images: { type: array, items: { type: string } }, mood: { type: string }, visibility: { type: string } }, required: [content] } }

  # ---- Claw-LinkedIn (port 9132) — job board ----
  - { name: claw_linkedin_browse, description: "Browse LinkedIn jobs. Filter by company, skills (any-of), location, experience_level, job_type, saved/applied state.", input_schema: { type: object, properties: { company: { type: string }, skills: { type: array, items: { type: string } }, location: { type: string }, experience_level: { type: string }, job_type: { type: string }, saved: { type: boolean }, applied: { type: boolean }, sort_by: { type: string, description: "'recent' (default) or 'hot'" }, max_results: { type: integer }, offset: { type: integer } } } }
  - { name: claw_linkedin_get_job, description: "Get full details of a LinkedIn job posting by job_id.", input_schema: { type: object, properties: { job_id: { type: string } }, required: [job_id] } }
  - { name: claw_linkedin_search, description: "Keyword search across LinkedIn jobs.", input_schema: { type: object, properties: { query: { type: string }, max_results: { type: integer }, offset: { type: integer } }, required: [query] } }
  - { name: claw_linkedin_save, description: "Save (bookmark) a LinkedIn job.", input_schema: { type: object, properties: { job_id: { type: string } }, required: [job_id] } }
  - { name: claw_linkedin_apply, description: "Submit an application to a LinkedIn job, with optional cover letter. Recorded in audit.", input_schema: { type: object, properties: { job_id: { type: string }, cover_letter: { type: string } }, required: [job_id] } }
  - { name: claw_linkedin_follow_company, description: "Follow a company on LinkedIn (idempotent).", input_schema: { type: object, properties: { company: { type: string } }, required: [company] } }

  # ---- Sheet (port 9133) — spreadsheet workbooks ----
  - { name: sheet_list_workbooks, description: "List all workbooks, optionally filtered by owner.", input_schema: { type: object, properties: { owner: { type: string } } } }
  - { name: sheet_open, description: "Open a workbook by workbook_id and return its sheet metadata.", input_schema: { type: object, properties: { workbook_id: { type: string } }, required: [workbook_id] } }
  - { name: sheet_get_range, description: "Read a cell range (e.g. 'A1:C10') from a sheet.", input_schema: { type: object, properties: { workbook_id: { type: string }, sheet: { type: string }, range: { type: string, description: "A1-style range, e.g. 'A1:C10'" } }, required: [workbook_id, sheet, range] } }
  - { name: sheet_set_cell, description: "Set the value of a single cell.", input_schema: { type: object, properties: { workbook_id: { type: string }, sheet: { type: string }, cell: { type: string, description: "A1-style address, e.g. 'B3'" }, value: {} }, required: [workbook_id, sheet, cell, value] } }
  - { name: sheet_set_range, description: "Set a 2D range of values starting at start_cell.", input_schema: { type: object, properties: { workbook_id: { type: string }, sheet: { type: string }, start_cell: { type: string }, values: { type: array, items: { type: array } } }, required: [workbook_id, sheet, start_cell, values] } }
  - { name: sheet_insert_row, description: "Insert a new row after the given row index, with optional cell values.", input_schema: { type: object, properties: { workbook_id: { type: string }, sheet: { type: string }, after_row: { type: integer }, values: { type: array } }, required: [workbook_id, sheet, after_row] } }
  - { name: sheet_create_workbook, description: "Create a new empty workbook with optional initial sheets.", input_schema: { type: object, properties: { name: { type: string }, owner: { type: string }, initial_sheets: { type: array, items: { type: object } } }, required: [name, owner] } }
  - { name: sheet_add_sheet, description: "Add a new sheet to an existing workbook.", input_schema: { type: object, properties: { workbook_id: { type: string }, name: { type: string } }, required: [workbook_id, name] } }
  - { name: sheet_rename_sheet, description: "Rename a sheet inside a workbook.", input_schema: { type: object, properties: { workbook_id: { type: string }, old_name: { type: string }, new_name: { type: string } }, required: [workbook_id, old_name, new_name] } }
  - { name: sheet_compute, description: "Run an aggregate over a range. op: SUM | AVG | COUNT | MAX | MIN.", input_schema: { type: object, properties: { workbook_id: { type: string }, sheet: { type: string }, range: { type: string }, op: { type: string, description: "SUM | AVG | COUNT | MAX | MIN" } }, required: [workbook_id, sheet, range, op] } }
  - { name: sheet_delete_workbook, description: "Permanently delete a workbook by workbook_id. Irreversible.", input_schema: { type: object, properties: { workbook_id: { type: string } }, required: [workbook_id] } }
  - { name: sheet_delete_sheet, description: "Delete a single sheet from a workbook (the workbook itself is preserved).", input_schema: { type: object, properties: { workbook_id: { type: string }, sheet: { type: string } }, required: [workbook_id, sheet] } }

  # ---- Slide (port 9134) — slide decks (presentations) ----
  - { name: slide_list_decks, description: "List all slide decks, optionally filtered by owner.", input_schema: { type: object, properties: { owner: { type: string } } } }
  - { name: slide_open, description: "Open a deck by deck_id and return its slide list metadata.", input_schema: { type: object, properties: { deck_id: { type: string } }, required: [deck_id] } }
  - { name: slide_get_slide, description: "Get one slide by index inside a deck.", input_schema: { type: object, properties: { deck_id: { type: string }, slide_index: { type: integer } }, required: [deck_id, slide_index] } }
  - { name: slide_set_slide_content, description: "Update title / notes / layout of a slide.", input_schema: { type: object, properties: { deck_id: { type: string }, slide_index: { type: integer }, title: { type: string }, notes: { type: string }, layout: { type: string } }, required: [deck_id, slide_index] } }
  - { name: slide_add_element, description: "Add a content element (text/image/etc.) to a slide.", input_schema: { type: object, properties: { deck_id: { type: string }, slide_index: { type: integer }, type: { type: string }, content: {} }, required: [deck_id, slide_index, type, content] } }
  - { name: slide_update_element, description: "Update the content of an existing element by element_id.", input_schema: { type: object, properties: { deck_id: { type: string }, slide_index: { type: integer }, element_id: { type: string }, content: {} }, required: [deck_id, slide_index, element_id, content] } }
  - { name: slide_add_slide, description: "Add a new slide after the given index. layout defaults to 'blank'.", input_schema: { type: object, properties: { deck_id: { type: string }, after_index: { type: integer }, title: { type: string }, layout: { type: string }, notes: { type: string } }, required: [deck_id, after_index] } }
  - { name: slide_duplicate_slide, description: "Duplicate a slide (the copy is inserted right after the source).", input_schema: { type: object, properties: { deck_id: { type: string }, slide_index: { type: integer } }, required: [deck_id, slide_index] } }
  - { name: slide_reorder_slide, description: "Move a slide from from_index to to_index.", input_schema: { type: object, properties: { deck_id: { type: string }, from_index: { type: integer }, to_index: { type: integer } }, required: [deck_id, from_index, to_index] } }
  - { name: slide_create_deck, description: "Create a new empty deck with optional initial slides.", input_schema: { type: object, properties: { name: { type: string }, owner: { type: string }, initial_slides: { type: array, items: { type: object } } }, required: [name, owner] } }
  - { name: slide_delete_deck, description: "Permanently delete a deck by deck_id. Irreversible.", input_schema: { type: object, properties: { deck_id: { type: string } }, required: [deck_id] } }
  - { name: slide_delete_slide, description: "Delete a single slide from a deck (the deck itself is preserved).", input_schema: { type: object, properties: { deck_id: { type: string }, slide_index: { type: integer } }, required: [deck_id, slide_index] } }

  # ---- Claw-News (port 9135) — social news platform: browse/get/search articles, like/save/repost ----
  - { name: claw_news_browse, description: "Browse news posts. Filter by category (Politics/Business/Tech/Sports/Health/World/Entertainment), source, tag, is_breaking, credibility (verified/unverified/disputed), or liked/saved/reposted status. Sort by 'recent' (default) or 'hot'. Returns post summary; use claw_news_get_post for full content + top_comments.", input_schema: { type: object, properties: { category: { type: string }, source: { type: string }, tag: { type: string }, is_breaking: { type: boolean }, credibility: { type: string, description: "verified | unverified | disputed" }, liked: { type: boolean }, saved: { type: boolean }, reposted: { type: boolean }, sort_by: { type: string, description: "'recent' (default) or 'hot'" }, max_results: { type: integer, description: "default 20" }, offset: { type: integer, description: "default 0" } } } }
  - { name: claw_news_get_post, description: "Get a news post's full content (title, body, source, top_comments) by post_id.", input_schema: { type: object, properties: { post_id: { type: string } }, required: [post_id] } }
  - { name: claw_news_search, description: "Search news posts by keyword across title/content/source/author/tags. Optionally constrain to one category.", input_schema: { type: object, properties: { query: { type: string }, category: { type: string }, max_results: { type: integer, description: "default 20" }, offset: { type: integer, description: "default 0" } }, required: [query] } }
  - { name: claw_news_like, description: "Like a news post. Idempotent: liking an already-liked post returns status=already_liked. Increments likes_count by 1 on first like.", input_schema: { type: object, properties: { post_id: { type: string } }, required: [post_id] } }
  - { name: claw_news_save, description: "Save/bookmark a news post for later reading. Idempotent: saving an already-saved post returns status=already_saved.", input_schema: { type: object, properties: { post_id: { type: string } }, required: [post_id] } }
  - { name: claw_news_repost, description: "Repost (share) a news post with an optional repost_comment. Idempotent: reposting an already-reposted post returns status=already_reposted. Public action — should not be invoked without explicit user instruction.", input_schema: { type: object, properties: { post_id: { type: string }, repost_comment: { type: string, description: "Optional comment to add when reposting" } }, required: [post_id] } }

