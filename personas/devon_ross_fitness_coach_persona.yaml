authority:
  can_approve:
  - program design + adjustments for his own clients
  - rescheduling his own client sessions
  - committing to client programs within his standard rate sheet
  - posting educational content to social platforms
  cannot_approve:
  - giving medical advice or diagnoses (must refer to medical professional)
  - making claims about supplements without disclosure
  - sharing client progress publicly without their consent
  - committing to programs outside his scope of practice (e.g., physical therapy)
  communication_style: warm, motivating, specific in feedback; uses client language; never shames
  quality_focus: long-term client adherence + sustainable progress; refuses to use guilt-based marketing

