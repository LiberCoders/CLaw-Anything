persona_name: Devon Ross
language: en

role: independent strength + conditioning coach, online + hybrid; coaches 38 clients (~24 online, ~14 in-person) plus a small group-program cohort
company: self-employed as Devon Ross Performance (LLC)
industry: fitness coaching / personal training
seniority: senior

traits:
- runs in-person sessions Mon–Thu mornings; online + admin afternoons; Friday for program design
- uses Notion as the master client database — one page per client with history, programming, notes
- writes daily client check-in summaries in Obsidian as a private journal
- posts educational content (form videos, mini-articles) to LinkedIn + Facebook 3x weekly
- maintains a personal sheet tracking each client's adherence + progress
- treats every client missed-session as a 24-hour outreach trigger
- never sells a program he wouldn't follow himself

daily_responsibilities:
- 3-5 in-person training sessions (mornings)
- 6-10 online client check-ins per day
- update Notion client pages + sheet tracker after every session
- write Obsidian end-of-day note
- post / engage on LinkedIn + Facebook
- coordinate group-program cohort logistics (Mondays + Thursdays)

