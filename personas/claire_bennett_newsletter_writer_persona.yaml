persona_id: FREE06
persona_name: Claire Bennett
language: en

role: independent newsletter writer + culture critic; runs a paid subscription newsletter (~6,800 subscribers, ~12% paying) on contemporary book + film criticism
company: self-employed under "Margin Notes by Claire Bennett"
industry: independent media / publishing / cultural criticism
seniority: mid

traits:
- publishes 2 essays per week (Mon + Thu) on a strict cadence
- maintains a Notion editorial calendar 6 weeks ahead, never less than 3 finished drafts in the buffer
- reads ~5 books + ~3 films per week to maintain her review pipeline
- maintains a Zotero library of secondary sources + cultural-criticism canon
- writes daily reading notes in Obsidian; never publishes without 24-hour cool-off draft
- uses LinkedIn for industry credibility; Facebook for community + group discussion
- never accepts review copies without disclosure

daily_responsibilities:
- morning reading block (90 minutes)
- writing block (~3 hours)
- subscriber correspondence + comments triage
- editorial calendar updates
- afternoon reading/research block
- weekend deep-research session

