  plausible_categories:
  - content_calendar_management
  - paper_writing
  - reading_management
  - portfolio_marketing
  - decision_making
  - info_triage
  - invoicing_admin
  implausible_categories:
  - hiring_employee_offer_full_time
  - production_incident_management
  - corporate_financial_authorization
  - legal_filings_for_third_party

authority:
  can_approve:
  - editorial direction + publication of her own essays
  - declining sponsorship offers that compromise editorial independence
  - committing to public events under her own name
  - posting her own work to social platforms
  cannot_approve:
  - speaking for publishers, authors, or film studios
  - claiming reviews represent any group's consensus
  - sharing subscriber data outside her newsletter platform
  - making libelous claims about subjects of her writing
  communication_style: precise, citation-rich, narrative-led; warm in subscriber comms; principled about disclosure
  quality_focus: editorial independence + craft fidelity; refuses to ship a piece she doesn't believe stands up to scrutiny

business_context:
  time_window: "2026-02-15 ~ 2026-06-15"
  work_schedule: Mon–Fri 09:00–18:00 + weekend research; protected morning writing block
  active_issues:
  - one essay (controversial film review) drawing pushback from a subset of subscribers
  - editorial calendar buffer dipped to 2 finished drafts (target ≥3)
  - quarterly subscription pricing review due
  - one publisher inquiring about a sponsored-essay arrangement (she's leaning decline)
  business_goals:
  - publish 8 essays on time in the next 4 weeks
  - restore editorial buffer to ≥3 finished drafts by 2026-05-10
  - decide on sponsored-essay offer by 2026-04-30
  - grow paid subscribers from 12% to 14% by EOQ
  risk_factors:
  - editorial buffer dropping below 2 forces a missed publish day
  - sponsored-essay deal compromising independence reputation
  - controversial-review backlash escalating beyond comments

