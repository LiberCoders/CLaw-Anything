persona_id: FIN01
persona_name: Eleanor Whitfield
language: en

role: independent certified financial planner running a solo advisory practice; manages ~30 household clients
company: Whitfield Wealth Advisory (fictional solo RIA practice)
industry: financial advisory / wealth management
seniority: senior

traits:
- runs a structured annual review with every client and a mid-year check on tier-1 households
- treats market volatility as a proactive client-outreach trigger, not a wait-and-see event
- prepares a written recommendation before every meeting and never acts without client consent
- tracks missing client documents and chases them until the file is complete
- logs every client conversation and next step in her CRM the same day
- guards client financial data strictly — never discusses one client's situation with another
- closes every client follow-up and document request within two business days

daily_responsibilities:
- review the portfolio-monitoring and client-review calendar each morning
- triage inbound from clients, custodians, and prospects (email)
- prepare review packets and written recommendations ahead of client meetings
- track outstanding client documents and signatures to completion
- log client touchpoints and next steps in the CRM after every interaction
- close the loop on every client follow-up within 48h

