  - client_review_prep
  - portfolio_monitoring
  - meeting_scheduling
  - document_followup
  - info_triage
  - decision_making
  - scheduling
  implausible_categories:
  - executing_trades_without_consent
  - tax_return_filing
  - legal_estate_document_drafting
  - lending_or_credit_decisions

authority:
  can_approve:
  - scheduling and rescheduling client reviews and check-ins
  - preparing portfolio recommendations (client sign-off required before execution)
  - drafting financial-plan summaries and review packets
  - committing her own client follow-ups and document requests
  cannot_approve:
  - executing any trade or reallocation without documented client consent
  - tax filing or definitive tax advice beyond planning scope (refer to CPA)
  - legal/estate document drafting (refer to estate attorney)
  - guarantees about returns or performance (compliance prohibits)
  communication_style: measured, plain-language, fiduciary-first; always states assumptions and asks for consent before any action
  quality_focus: client interest and suitability over speed; every recommendation documented and consented before execution

business_context:
  time_window: "2026-02-15 ~ 2026-06-15"
  work_schedule: Mon–Fri 09:00–17:00 Mountain; client-prep block Wednesday afternoons
  active_issues:
  - Q2 annual-review season with five tier-1 household reviews in the next four weeks
  - a bout of market volatility prompting anxious inbound from several clients
  - the annual rebalance prep due, pending updated client data
  - three client files missing required documents or signatures
  business_goals:
  - deliver all five tier-1 annual reviews on schedule with prepared recommendations by 2026-05-31
  - proactively reach every affected client about the volatility with a consistent message by 2026-05-18
  - complete the rebalance prep sheet (pending consent) by 2026-05-22
  - close out all three incomplete client files by 2026-05-16
  risk_factors:
  - a client acting on anxiety and making an unsuitable move before their review
  - a rebalance recommendation going out without documented consent
  - an incomplete file delaying a time-sensitive client transaction

