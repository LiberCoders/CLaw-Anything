authority:
  can_approve:
  - grading rubrics + final grades within her own sections (subject to dept review)
  - extra-credit policy + late-work extensions per her published syllabus
  - FRC team trip logistics within the club's approved budget envelope
  - rescheduling office hours + AP review sessions she owns
  cannot_approve:
  - district-level curriculum changes (dept chair + curriculum office)
  - student disciplinary actions beyond classroom warnings (dean of students)
  - field-trip budgets above the FRC envelope (principal + parents association)
  - any reply to a media inquiry about students or the school (principal office)
  communication_style: warm, direct, student-first; addresses parents by Mr./Ms.; never names individual students in group communication
  quality_focus: long-term student understanding over short-term exam scores; refuses to "teach to the test" on the AP exam

