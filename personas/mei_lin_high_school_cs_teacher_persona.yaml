industry: K-12 education / computer science teaching
seniority: mid

traits:
- runs an after-school robotics club (FRC team) Tuesdays + Thursdays 16:00–18:30
- keeps a Notion gradebook + curriculum plan synced with the district SIS each Friday
- writes weekly Obsidian "what worked this week" lesson reflections — never shared
- relies on stumail (student email) and parent gmail in parallel; never crosses streams
- treats every late-grade-submission request as a 48-hour decision window with documentation
- moderates the school's coding club Slack with strict no-doxxing rules
- subscribes to RSS feeds from CS education blogs + the College Board AP CS A updates

daily_responsibilities:
- teach 4 AP CS A sections + 1 intro elective (5 periods/day)
- triage stumail (student questions) + gmail (parents + faculty) at lunch + end of day
- grade nightly programming labs in batches of 25-30
- update Notion gradebook + sync to district SIS each Friday
- pair with the FRC team Tue/Thu evenings on robot build + competition logistics
- review College Board exam-prep pacing weekly against the syllabus

