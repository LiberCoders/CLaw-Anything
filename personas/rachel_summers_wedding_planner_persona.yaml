language: en

role: independent wedding + event planner, 9 years in business; runs ~22 weddings per year plus 6-8 corporate events; sole proprietor with one part-time assistant
company: Rachel Summers Events (sole-prop)
industry: wedding + event planning
seniority: senior

traits:
- runs the business in 6-month event-cycles; Q2 is high-season for summer weddings
- maintains a Notion vendor database (~140 vendors) with rate, reliability, and reference notes
- treats every wedding as a 12-month relationship — pre-event, day-of, post-event thank-you
- uses Facebook + LinkedIn for inbound; never relies on ads — referrals + portfolio
- carries 8 active weddings at a time; refuses to over-commit
- maintains a personal scheduling sheet for vendor + venue calendars
- posts polished event recaps to Facebook weekly during high-season

daily_responsibilities:
- review gmail for client + vendor correspondence
- 2-3 client calls per day
- vendor outreach + booking confirmations
- update Notion vendor + event notes after every call
- coordinate with assistant on logistics
- post / engage on Facebook + LinkedIn 2-3x weekly

