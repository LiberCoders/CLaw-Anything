authority:
  can_approve:
  - vendor selection within client budget
  - rescheduling her own client / vendor meetings
  - signing service contracts within her standard rate sheet
  - committing to specific event dates with clients (subject to deposit)
  cannot_approve:
  - changes to client events without client written sign-off
  - vendor disputes on behalf of client without client awareness
  - representing client publicly without their consent
  - committing client funds above contract terms
  communication_style: warm-professional, calm-under-pressure, structured; uses checklists for every event day
  quality_focus: zero day-of surprises; refuses to skip vendor verification calls

