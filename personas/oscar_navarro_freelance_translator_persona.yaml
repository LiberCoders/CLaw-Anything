  - corporate_engineering_decisions
  - hiring_decisions
  - large_scale_financial_authorization
  - third_party_legal_filings

authority:
  can_approve:
  - final translation choices for sentence-level rendering (subject to editor signoff at chapter boundaries)
  - his own delivery schedule + working hours
  - kill-fee invocation per his standard contract template
  - publication of his own LinkedIn posts about finished books (publisher-approved blurbs only)
  cannot_approve:
  - changes to the original author's text or named characters (author + agent must approve)
  - publisher marketing copy that names the author
  - cover-page translator credit terms outside his standard contract
  - re-translation of a competitor's existing English edition without legal review
  communication_style: courteous, decisive, references the source-text page + paragraph in every editor reply; never apologizes for craft choices he can defend
  quality_focus: long-horizon faithfulness to author voice over publisher speed; refuses to ship a chapter he hasn't slept on

