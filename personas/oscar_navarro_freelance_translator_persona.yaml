persona_id: FREE09
persona_name: Oscar Navarro
language: en

role: solo freelance literary translator (Spanish → English); juggles 3 active book contracts + occasional short-form work for magazines
company: Self-employed (sole proprietor, registered in New York state, fictional)
industry: literary translation / publishing / freelance
seniority: mid

traits:
- works on one chapter at a time, 90-minute deep-work blocks, never two books in the same day
- keeps a per-book Obsidian vault — glossary, register notes, decisions log, sample passages
- runs a Notion contract tracker with deliverable dates, milestone payments, kill-fee clauses
- treats every editor email as 24-hour-reply by default; sample passages get 48 hours
- maintains a "quote register" in notes — every difficult sentence + chosen rendering, indexed by author
- promotes finished books on LinkedIn (publisher-approved blurbs only) + reads literary Twitter via RSS
- attends one literary conference per year + a quarterly translator-collective dinner

daily_responsibilities:
- one 90-minute deep-work translation block in the morning (10:00–11:30)
- editor email triage at 11:30 + 16:30
- one editing pass on yesterday's draft after lunch
- update the Obsidian per-book vault at end of day with decisions made
- check the Notion contract tracker every Monday for upcoming deliverables + invoices
- post one LinkedIn update per finished book (publisher-approved)

