persona_id: ENG02
persona_name: Priya Natarajan
language: en

role: engineering manager owning a 9-person backend platform team at a public mid-cap fintech
seniority: senior
company: Northgate Pay (fictional, ~3,800 employees, publicly traded)
industry: fintech / payments

traits:
- runs weekly team standup Mondays 10:00 ET and a bi-weekly tech-review Thursdays
- holds 9 rolling 1:1s, never letting any direct report's slip past 2 weeks
- delegates IC code work entirely; reviews architecture decisions, not diffs
- protects her team's roadmap from ad-hoc exec asks — funnels everything through her director
- writes calibration notes year-round, not just at perf-review season
- maintains a private "team-health journal" in Notes, updated weekly
- never replies to non-urgent Slack after 18:00 local; expects the same from her team but doesn't enforce it

daily_responsibilities:
- review overnight #payments-platform Slack channel and on-call handoff notes first thing
- run or attend 2–4 1:1s per day on a rolling cadence
- approve / push back on cross-team dependency requests in Notion
- review architecture decision records (ADRs) drafted by tech leads
- block 30 minutes daily for the team-health journal and calibration notes
- prepare or follow up on weekly status report for her director

primary_services:
- gmail
- calendar
- claw_slack
- claw_notion
- todo
- meeting
secondary_services:
- contacts
- notes
- helpdesk
- crm
- claw_linkedin

fixture_scale: standard

task_constraints:
  plausible_categories:
  - scheduling
  - cross_team_coordination
  - performance_review_admin
  - hiring_pipeline_coordination
  - decision_making
  - info_triage
  - incident_followup
  implausible_categories:
  - production_code_change_approval
  - customer_pricing_negotiation
  - legal_filings
  - financial_authorization_above_25k

authority:
  can_approve:
  - team headcount allocation across her 9 reports
  - architecture trade-offs within her platform vertical
  - calibration ratings for her direct reports (subject to director sign-off)
  - rescheduling her own meetings and 1:1s
  - low-risk vendor purchases up to $5,000
  cannot_approve:
  - hiring offers above the band rubric (escalate to director + HR)
  - cross-vertical dependency commitments (escalate to director)
  - production hotfix deploys outside on-call protocol
  - public-facing communications (escalate to PR)
  communication_style: warm-but-direct, structured, tags owners explicitly, gives feedback with concrete examples
  quality_focus: psychological safety + clear ownership; never lets ambiguity linger across a 1:1 cycle

business_context:
  time_window: "2026-02-15 ~ 2026-06-15"
  work_schedule: Mon–Fri 09:00–18:00 Eastern; family pickup block 16:30–17:30 daily
  active_issues:
  - mid-year calibration cycle (2026-05-04 ~ 2026-05-22)
  - open backend-engineer requisition (level L5) on the team for 6 weeks
  - cross-team tension with the risk-engineering org over service ownership
  - one direct report (junior engineer) flagged for performance plan consideration
  business_goals:
  - close the L5 requisition by 2026-06-01
  - complete all 9 calibration write-ups by 2026-05-22
  - reach a written ownership agreement with risk-eng by 2026-05-15
  - retain 100% of high-performers through Q2
  risk_factors:
  - L5 requisition slipping further drags on team load and burnout risk
  - PIP escalation getting mishandled triggers attrition risk in adjacent reports
  - calibration cycle and risk-eng negotiation colliding in the same week

