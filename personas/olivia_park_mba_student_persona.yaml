  - representing the business school in any public capacity without dean-of-students sign-off
  - signing letters of intent for venture investments (she has no such authority)
  - changes to coursework deadlines (defer to professor)
  communication_style: friendly-formal, structured, concrete in follow-ups; never bcc's mass templates
  quality_focus: relationship durability + reciprocity; refuses to use generic templates that signal low effort

