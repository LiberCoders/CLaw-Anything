authority:
  can_approve:
  - submission of his own application materials
  - rescheduling his own meetings + advisor calls
  - committing to specific universities' visit weekends
  - declining unsolicited recruiter outreach unrelated to PhD search
  cannot_approve:
  - making commitments to a program before admit + funding letter in hand
  - signing letters of recommendation request without recommender consent
  - sharing employer's data outside the company
  - committing to TA / RA positions before formal offer
  communication_style: formal-warm, structured, defers heavily to potential advisors; never assumes familiarity
  quality_focus: precision in writing + honesty about background; refuses to overstate research experience

business_context:
  time_window: "2026-02-15 ~ 2026-06-15"
  work_schedule: full-time Sun–Thu day job (local timezone); application work evenings + weekends
  active_issues:
  - admission decisions arriving on rolling basis through 2026-05-31
  - 2 visit weekends overlap by date (have to choose)
  - 3 recommendation letters need 2 reminder nudges each before final deadlines
  - visa / financial-aid forms required for any school he commits to
  business_goals:
  - decide on PhD destination by 2026-06-15
  - close out all 8 applications (accept / decline) by 2026-06-20
  - submit complete visa application within 14 days of program acceptance
  - notify current employer cleanly once committed
  risk_factors:
  - poorly handled visit-weekend conflict damages a high-priority advisor relationship
  - recommendation reminders sent too aggressively annoys recommenders
  - committing to a program before vetting funding details

