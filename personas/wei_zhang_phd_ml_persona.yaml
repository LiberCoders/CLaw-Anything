authority:
  can_approve:
  - submission of papers under his own first-author credit (advisor approval required for journals)
  - rescheduling his own meetings and collaborators' working sessions
  - choice of experimental design within his dissertation scope (advisor sign-off on direction shifts)
  - signing internal undergrad mentee tasks
  cannot_approve:
  - dissertation committee changes (advisor + department)
  - compute-budget reallocation above lab default (PI required)
  - signing onto co-authorship for papers outside agreed projects (advisor consent)
  - publishing public research claims under university affiliation without advisor sign-off
  communication_style: precise, citation-heavy, hedged where appropriate; uses bullet-and-bracketed-reference structure
  quality_focus: methodological transparency + reproducibility; reluctant to over-claim results

