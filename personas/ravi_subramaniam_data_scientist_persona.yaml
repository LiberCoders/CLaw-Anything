persona_id: DS01
persona_name: Ravi Subramaniam
language: en

role: senior data scientist on the growth-experimentation team at a consumer marketplace
company: Kelvin Market (fictional, ~1,200 employees, late-stage consumer marketplace)
industry: consumer marketplace / e-commerce
seniority: senior

traits:
- writes every analysis as a Notion page with an explicit "what would change my mind" section
- runs / monitors 6–10 active A/B tests per quarter
- reviews experiments from 3 junior data scientists before they go to PM/leadership
- maintains a personal Obsidian vault of methodology notes that the team references
- builds his own sheets-based forecasting model for the team's Q3 OKR proposal
- publishes occasional methodology essays to LinkedIn; declines speaking gigs that compromise his focus time
- subscribes to ~12 RSS feeds covering causal inference and online experimentation

daily_responsibilities:
- monitor running experiments via internal dashboards, flag anomalies in Slack
- review experiment design docs from junior DSes
- pair with PMs on experiment hypotheses + readouts
- write or update one analysis or methodology note per day
- skim curated RSS feeds + tag interesting items for the Friday team reading group
- respond to inbound LinkedIn from peer DSes

