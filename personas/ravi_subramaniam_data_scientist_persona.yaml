  - experiment_review
  - methodology_writing
  - cross_team_coordination
  - decision_making
  - info_triage
  - scheduling
  - forecasting_admin
  implausible_categories:
  - hiring_offer_extension
  - customer_pricing_negotiation
  - legal_filings
  - production_code_deploy_to_customer

authority:
  can_approve:
  - sign-off on experiment readiness for his pod (3 junior DSes)
  - rejecting experiment designs that would compromise inference validity
  - publishing methodology essays to LinkedIn after team review
  - choice of internal tooling for his pod's analyses
  cannot_approve:
  - shipping experiments to 100% traffic (defer to PM + EM)
  - hiring decisions (advisory only)
  - changes to company-level metrics definitions (defer to data-platform team)
  - public claims about product impact without PMM + Legal review
  communication_style: structured, hedged where appropriate; uses explicit confidence intervals; names limitations up front
  quality_focus: inferential validity over speed; refuses to round numbers in a way that hides uncertainty

