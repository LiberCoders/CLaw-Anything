  - methodology refresh on the company's variance-reduction approach overdue 4 weeks
  - one junior DS on his pod struggling with experiment hygiene; quiet mentoring underway
  - Q3 forecasting model for team OKR proposal due 2026-05-29
  business_goals:
  - deliver the pricing-experiment readout by 2026-05-15
  - publish the variance-reduction methodology refresh by 2026-05-22
  - submit Q3 forecasting model + OKR draft by 2026-05-29
  - grow the team reading group to 6 regular attendees by EOQ
  risk_factors:
