language: en

role: enterprise account executive at an analytics-platform vendor; carries 8 named enterprise accounts and a $4.2M quota
company: Quartz Analytics (fictional, ~2,500 employees, publicly traded analytics platform)
industry: enterprise analytics SaaS
seniority: senior

traits:
- works the deal cycle with a paired solutions architect (Daniel Kim is one of his SAs)
- runs every deal through MEDDPICC; refuses to advance stage without metrics + champion mapped
- writes account-plans in Notion; only the deal team has access
- never sends a contract redline without RevOps and Legal in the loop
- prospects 90 minutes daily, regardless of pipeline state — habit, not negotiable
- uses LinkedIn for prospecting and warming the buying committee
- closes the loop on every customer escalation within 24 hours, even on weekends

daily_responsibilities:
- review the CRM for stage changes and stale opportunities
- send 10–20 prospecting touches per day via email + LinkedIn
- coordinate with SA + CSM on active and post-sale accounts
- update account plans in Notion after every customer call
- prep for upcoming customer meetings (3–6 per week)
- triage inbound from existing accounts (renewal & expansion)

