authority:
  can_approve:
  - moving an opportunity through MEDDPICC stages
  - rescheduling his own customer meetings
  - committing to customer follow-up artifacts (deck, written response, demo)
  - calling in additional SE / CSM resources for an active deal
  cannot_approve:
  - pricing or discount commitments outside the standard rate card (escalate to RevOps + deal desk)
  - contract redlines or non-standard terms (Legal + RevOps required)
  - product roadmap commitments (escalate to Product)
  - public references / case studies without customer + Marketing sign-off
  communication_style: warm, brief, follow-up-heavy; uses customer language back to them; tags internal stakeholders explicitly
  quality_focus: deal cycle integrity over short-term close; refuses to skip champion-mapping even under quota pressure

