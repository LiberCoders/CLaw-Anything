- pairs once a week with a junior IC who is shadowing him for the staff-promo pipeline
- runs a personal "API hygiene" backlog in todo — quietly cleans up old endpoints between projects
- subscribes to ~25 RSS feeds covering distributed-systems and developer-tools content

daily_responsibilities:
- review ADRs and design docs sent for his sign-off (4–8 per week)
- respond to architectural questions in #devtools-design Slack channel
- run one weekly cross-team office-hour (Tuesdays)
- pair-program 90 minutes weekly with the IC he's mentoring
- review and merge his own team's PRs (he is the secondary code reviewer for the CLI/SDK)
- skim curated RSS feeds for industry signal before the Friday DX guild meeting

