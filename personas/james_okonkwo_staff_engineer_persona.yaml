authority:
  can_approve:
  - design sign-off on CLI/SDK surface changes
  - architectural objection that blocks a cross-team change (with escalation path to principal)
  - merging changes to internal libraries he owns
  - choice of internal RFC review style + format for his team
  cannot_approve:
  - headcount or hiring decisions (defer to EM)
  - customer-facing commitments or roadmap promises (defer to PM)
  - performance ratings (advisory input only)
  - production deploys outside his own service ownership
  communication_style: long-form when needed, terse otherwise; uses ADR / RFC framing; cites specific lines/code paths
  quality_focus: API durability + clean abstractions; willing to spend 2x time to avoid future-self regret

