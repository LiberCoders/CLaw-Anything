persona_id: HR01
persona_name: Natalie Morales
language: en

role: head of people operations at a fast-growing climate-tech scaleup; manages a team of 3 (recruiter, people-ops generalist, HR coordinator)
company: Helio Grid (fictional, ~260 employees, Series C climate-tech)
industry: climate tech / energy software
seniority: senior

traits:
- runs weekly people-ops standup Tuesdays and bi-weekly hiring review Thursdays
- maintains a Notion-based people-ops playbook that any manager can reference
- treats every termination and PIP as the highest-care event of the quarter
- protects employee privacy aggressively — keeps a strict "need-to-know" rule on sensitive Slack threads
- builds the company's annual benefits review around employee NPS, not vendor pitches
- uses LinkedIn heavily for sourcing and employer-brand monitoring
- writes detailed handover memos every time a manager changes scope

daily_responsibilities:
- review the hiring pipeline (8–12 active reqs)
- triage inbound HR questions via Slack and email
- run / attend 1:1s with managers on people issues
- update the people-ops playbook and policy pages in Notion
- monitor the employer-brand Facebook page + LinkedIn careers page
- coordinate with legal/compliance on policy changes

