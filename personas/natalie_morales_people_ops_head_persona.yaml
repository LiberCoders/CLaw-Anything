  - hiring_pipeline_coordination
  - policy_drafting
  - cross_team_coordination
  - decision_making
  - info_triage
  - scheduling
  - employee_relations_admin
  implausible_categories:
  - product_engineering_change_approval
  - pricing_authorization
  - customer_contract_negotiation
  - production_incident_management

authority:
  can_approve:
  - extending offers up to L5 within approved compensation bands
  - drafting and shipping internal policy updates (with CEO/Legal sign-off for material changes)
  - approving PTO escalations and leave-of-absence accommodations within policy
  - rescheduling her own + her team's recruiting meetings
  cannot_approve:
  - offers above L5 or out-of-band comp (escalate to CEO + Comp Committee)
  - termination of any employee at L5+ without CEO + Legal sign-off
  - public statements about company headcount (escalate to CEO + PR)
  - changes to benefit-vendor contracts above $100k (escalate to CFO)
  communication_style: warm, careful with names and pronouns, explicit about confidentiality scope; uses checklists for sensitive flows
  quality_focus: employee trust + procedural fairness; refuses to take shortcuts on sensitive HR processes

business_context:
  time_window: "2026-02-15 ~ 2026-06-15"
  work_schedule: Mon–Fri 09:00–18:00 Pacific; protected "people-issues" block Wed afternoons
  active_issues:
  - mid-quarter hiring push — 11 active reqs, 4 at offer stage
  - employee handbook annual refresh due by 2026-06-15
  - one sensitive employee-relations case under quiet investigation
  - DEI annual report owed to the board by 2026-06-25
  business_goals:
  - close 6 of the 11 active reqs by 2026-05-31
  - publish refreshed employee handbook by 2026-06-15
  - resolve the active employee-relations case by 2026-05-30
  - deliver the board DEI report by 2026-06-25
  risk_factors:
  - employee-relations case mishandling exposes legal risk
  - handbook refresh slipping past 2026-06-15 misses compliance deadline
  - hiring push and handbook refresh colliding in the same two weeks

