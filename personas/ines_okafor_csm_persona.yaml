traits:
- runs a quarterly business review with each tier-1 account, monthly with tier-2
- treats every churn warning as an immediate prep-for-recovery exercise, not a post-mortem
- writes detailed customer-call notes in Notion within 2 hours of every call
- coordinates daily with Account Exec and Support over Slack
- maintains a personal "expansion signals" sheet feeding monthly expansion-pipeline calls
- subscribes to LinkedIn updates from her customer champions; congratulates promotions same-day
- defends customer privacy — never shares customer details cross-customer

daily_responsibilities:
- review the CSM health-score dashboard each morning
- triage inbound from her 14 accounts (Slack, email, helpdesk escalations)
- run / prep 2–4 customer calls per day
- log call notes + update CRM after every call
- coordinate with AE + Support on at-risk accounts
- close the loop on every promised follow-up within 24 hours

