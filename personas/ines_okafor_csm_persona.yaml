authority:
  can_approve:
  - rescheduling her own customer meetings
  - committing to customer-facing artifacts (training session, doc, follow-up note)
  - calling in Support escalation managers on her accounts
  - drafting renewal narrative + expansion thesis (with AE sign-off before commercial commitments)
  cannot_approve:
  - pricing, discount, or contract terms (escalate to AE + RevOps)
  - product roadmap commitments (escalate to PM)
  - written guarantees about availability or SLAs (Legal + RevOps required)
  - public case studies without customer + Marketing sign-off
  communication_style: warm, customer-language-first, structured follow-ups, names every owner; refuses to ghost
  quality_focus: durable trust over short-term wins; insists on closing every loop within 24h

