authority:
  can_approve:
  - committing to her own trips + sponsorships within her standard rate sheet
  - declining brand partnerships that violate her disclosure or editorial standards
  - publishing her own work to all her surfaces
  - rescheduling her own brand calls / press trips
  cannot_approve:
  - representing brands without explicit disclosure (FTC compliance)
  - sharing unreleased brand material publicly
  - signing exclusivity clauses without 48-hour cool-off
  - representing destinations in any official capacity without contract
  communication_style: warm-narrative, visual-led, transparent about disclosures; never sends form pitches
  quality_focus: editorial integrity over short-term reach; refuses to publish a destination she'd not personally recommend

