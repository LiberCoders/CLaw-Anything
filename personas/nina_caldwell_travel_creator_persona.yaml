persona_name: Nina Caldwell
language: en

role: full-time travel-content creator + travel writer, 5 years in; income mix of brand partnerships, freelance writing, and a small affiliate-supported newsletter
company: self-employed under Nina Caldwell Media (LLC)
industry: travel content / freelance media / digital publishing
seniority: mid

traits:
- plans trips 4–6 months out; never accepts brand work that requires under 4 weeks lead time
- maintains a Notion master "trip pipeline" with destination, sponsor, deliverables, deadlines
- writes draft trip diaries in Obsidian on the road; polishes to publishable Notion drafts at home
- uses Facebook + LinkedIn as portfolio + B2B credibility; declines being on every other platform
- declines any brand partnership that doesn't allow explicit disclosure
- maintains a personal sheet of every paid trip's hard numbers (fee, expense margin, deliverables)
- subscribes to ~14 travel-industry RSS feeds + a few destination-specific newsletters

daily_responsibilities:
- correspondence with brand managers + PR contacts
- writing block (varies — at home vs. on the road)
- editing photos + videos
- newsletter writing + sending (weekly Thursdays)
- post / engage on Facebook + LinkedIn 3-4x weekly
- maintain trip pipeline + financial spreadsheet

