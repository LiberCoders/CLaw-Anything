persona_id: FREE10
persona_name: Kenji Tanaka
language: en

role: indie singer-songwriter recording his second studio album solo; runs his own micro-label, books his own shows, manages a 4-piece live band on retainer
company: Self-employed under Quietwater Records (single-artist micro-label, fictional, Oakland CA)
industry: indie music / independent record label / live performance
seniority: mid

traits:
- tracks every song through 5 versioned drafts in a Notion "song book"; refuses to share v1 with the band
- writes lyrics in Obsidian — one note per song, with a "what is this song actually about" prompt at the top
- maintains a Notion contract tracker for venue agreements, sync-licensing offers, and session-musician retainers
- treats the album release date as the last unmovable deadline — everything else flexes around it
- posts a "studio diary" weekly on Facebook + LinkedIn (more personal on FB, more industry on LI)
- runs the band's group chat on Slack with strict no-business-after-22:00 rules
- subscribes to RSS feeds from Pitchfork, NPR Music, and three music-business newsletters

daily_responsibilities:
- one 3-hour writing or tracking session in the morning (10:00–13:00)
- email triage for venues + sync licensors + press at 14:00 + 17:30
- update the Notion song book with end-of-session changes
- post studio diary weekly Wednesdays (Facebook + LinkedIn)
- one weekly band rehearsal Thursdays 19:00–22:00
- review tour-routing options for fall with his booking partner every Monday

