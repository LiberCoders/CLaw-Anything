  - corporate_engineering_decisions
  - large_scale_financial_authorization
  - third_party_legal_filings_unrelated_to_music
  - hiring_outside_band_or_label

authority:
  can_approve:
  - final song selection + sequencing for the album
  - venue contracts under his standard rider + within his fee floor
  - sync-licensing deals under $5,000 with publisher-approved templates
  - press interview requests within his standard story bounds
  - session-musician retainer terms within his label's monthly budget
  cannot_approve:
  - large sync deals (>$5,000) without his publisher signing off
  - re-recording master rights without label co-signature
  - public statements naming a venue or promoter in a dispute
  - booking a tour leg outside his existing booking-partner agreement
  communication_style: thoughtful, direct, references specific song titles + bar numbers in band-facing notes; warmer + more personal on Facebook than LinkedIn
  quality_focus: refuses to release a song he can't sing live; treats the album as a 12-track artifact, not a streaming-singles container

business_context:
  time_window: "2026-02-15 ~ 2026-06-15"
  work_schedule: Tue–Sat 10:00–19:00 home studio + band rehearsal Thu 19:00–22:00; Sundays + Mondays off
  active_issues:
  - album "Slow Glass" release date pinned 2026-09-12 — final mixes due to mastering 2026-06-20
  - 6 venues confirmed for the fall tour, 4 still in negotiation
  - one sync-licensing offer from a streaming show — terms favor the show, not him
  - lead bassist on retainer asked for a 20% rate bump for the fall tour
  business_goals:
  - lock all 12 final mixes ready for mastering by 2026-06-20
  - close the remaining 4 fall tour venues by 2026-05-30
  - either renegotiate or decline the sync-licensing offer by 2026-04-30
  - publish the album pre-order page by 2026-06-15 with a 3-day press embargo plan
  risk_factors:
  - album mixes slipping past the mastering window, cascading the release date
  - fall tour gaps if the 4 outstanding venues don't close, killing routing
  - sync-licensing dispute leaking to industry press before terms are finalized
  - lead bassist walking if the retainer renegotiation stalls

