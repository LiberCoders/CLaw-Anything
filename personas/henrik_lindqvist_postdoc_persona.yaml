  - direction of analyses run by his 2 PhDs
  - rescheduling weekly project meeting and his own 1:1s
  - allocation of his project's cluster quota
  cannot_approve:
  - hiring PhDs / RAs (PI authority)
  - inter-institute MOUs or collaboration agreements (PI + admin)
  - public press claims under institute affiliation (press office)
  - re-allocating budget across cost centers (admin office)
  communication_style: measured, precise, citation-heavy; explicit about uncertainty and methodology; warm in 1:1s
  quality_focus: methodological reproducibility + transparent assumptions; refuses to ship analyses without versioned code

