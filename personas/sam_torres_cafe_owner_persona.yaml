  - representing the business in legal disputes without counsel
  - selling personal information about customers (privacy)
  - rate-card discounts contradicting his own promotional calendar
  communication_style: warm, direct, neighborhood-grounded; uses customer names; never apologizes generically
  quality_focus: every cup + plate must clear his personal bar; refuses to ship subpar product to save margin

