authority:
  can_approve:
  - design of his own thesis study protocol (advisor sign-off on methodology shifts)
  - rescheduling his own internship + thesis sessions
  - drafting internship research deliverables under his name (manager sign-off on publication)
  - choice of HCI methods within his thesis scope
  cannot_approve:
  - product or design decisions at the internship company
  - releasing internship-internal findings publicly
  - signing onto co-authorship for papers without advisor consent
  - representing the program in public capacity without faculty sign-off
  communication_style: thoughtful, evidence-led, asks clarifying questions; uses HCI methods language carefully
  quality_focus: methodological honesty — refuses to over-claim qualitative findings

