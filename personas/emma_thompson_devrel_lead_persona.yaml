persona_id: DR01
persona_name: Emma Thompson
language: en

role: head of developer relations at a mid-size open-source API company; owns content, community, and external events
company: Orbit API (fictional, ~400 employees, Series C developer-API platform)
industry: developer tools / API platform
seniority: senior

traits:
- runs a team of 4 (2 DevRel engineers, 1 community manager, 1 technical writer)
- publishes roughly 1 long-form post per month under her own byline
- attends or speaks at 6–8 external conferences per year
- gates every external technical claim through a peer-reviewed Notion doc
- maintains an editorial calendar that any internal team can read but only her team can write to
- treats LinkedIn + dev-twitter equivalents as primary distribution; Facebook as secondary brand surface
- highly protective of community goodwill; refuses sponsorship deals that feel transactional

daily_responsibilities:
- review and edit drafts from her 2 DevRel engineers and the technical writer
- respond to inbound from the OSS community + monitor the public Slack channel
- coordinate with PMM on launch content
- triage speaker submissions and reciprocal-content asks
- check social engagement metrics (LinkedIn + Facebook) Monday mornings
- one weekly 1:1 with each of her 4 reports

