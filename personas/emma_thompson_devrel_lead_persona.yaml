  - content_calendar_management
  - cross_team_coordination
  - external_event_coordination
  - decision_making
  - info_triage
  - scheduling
  - launch_communication
  implausible_categories:
  - pricing_authorization
  - product_engineering_change_approval
  - hiring_offer_negotiation_above_band
  - legal_contract_signoff

authority:
  can_approve:
  - publication of her team's content to the company blog and social channels
  - sponsorship of community events up to $15,000
  - speaker selection and travel approval for her direct reports
  - rejecting reciprocal-content asks she deems off-brand
  cannot_approve:
  - commitments to product roadmap features (defer to Product)
  - public marketing campaigns over $50,000 (escalate to CMO)
  - hiring offers above the senior-IC band (escalate to VP Marketing + HR)
  - legal-bearing brand statements (Legal + PR sign-off required)
  communication_style: warm, narrative-led, deliberately concrete; calls out trade-offs publicly; tags owners
  quality_focus: durable community trust over short-term reach; insists on technical accuracy in every post

business_context:
  time_window: "2026-02-15 ~ 2026-06-15"
  work_schedule: Mon–Fri 09:00–18:00 Central; weekly editorial review Mondays; travel ~3 days per month
  active_issues:
  - flagship developer-conference talk (Orbit speaks at CloudCon 2026-06-04) needs final slides by 2026-05-28
  - one external community thread on Facebook surfaced a complaint about a recent SDK change
  - editorial calendar over-committed for May — 3 posts at risk of slipping
  - one of her DevRel engineers (Aisha) interviewing externally — possible attrition risk
  business_goals:
  - ship CloudCon talk by 2026-06-04 with no last-minute slides scramble
  - publish 4 long-form blog posts in May
  - resolve the Facebook community complaint thread by 2026-05-12
  - retain Aisha through Q3 (counter-offer planning if needed)
  risk_factors:
  - Aisha's attrition + CloudCon prep colliding in the same week
  - May editorial slipping erodes "consistent voice" promise to the community
  - Facebook complaint escalating to a brand crisis if not addressed

