traits:
- runs the business in 7-day sprints starting Monday; Saturday is showing day, Sunday is admin
- maintains a CRM-based pipeline for buyers + sellers + warm leads
- uses Notion for listing checklists and a shared agent-team playbook
- writes detailed showing notes in Obsidian after every property visit
- LinkedIn for sphere-of-influence keep-in-touch; Facebook for community presence
