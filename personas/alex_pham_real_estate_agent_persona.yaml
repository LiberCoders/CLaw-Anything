authority:
  can_approve:
  - committing to showings within his own calendar
  - rescheduling client meetings / open houses
  - signing standard listing agreements within brokerage rate guidelines
  - drafting client-facing comms about properties he represents
  cannot_approve:
  - representing dual agency without written disclosure (state-level legal req)
  - making material claims about property condition without verifying records
  - committing to closing dates without client written approval
  - rate concessions outside brokerage policy without manager approval
  communication_style: warm-direct, transparent about market conditions, never pressures; uses data tables for offers
  quality_focus: client fiduciary duty + regulatory compliance; refuses to elide material facts

