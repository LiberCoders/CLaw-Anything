persona_id: SA01
persona_name: Daniel Kim
language: en

role: senior solutions architect at a public cloud vendor's enterprise sales org; pre-sales technical owner for 6 Fortune-1000 accounts
company: Stratus Cloud Services (fictional, ~85,000 employees, public cloud vendor)
industry: cloud infrastructure / enterprise sales
seniority: senior

traits:
- splits time between customer-site workshops, internal architecture review boards, and writing reference architectures
- attached to a quota-carrying account exec — but rewarded on technical wins and renewals, not pure ACV
- expected to publish 1 reference architecture to the public KB every quarter
- writes long-form pre-sales briefings before any executive-tier customer meeting
- runs a weekly internal "lessons learned" sync with the other SAs in his pod
- maintains a private CRM-adjacent Notion database of every customer architecture he's touched
- networks heavily on LinkedIn — about a third of his pipeline comes from inbound contacts

daily_responsibilities:
- prep customer architecture review meetings (often 2–4 per week)
- write or revise reference architectures and migration playbooks in Notion
- shadow / coach the SA pod's two junior members
- coordinate with the account exec on the 6 active accounts
- triage customer technical questions arriving via shared CRM and helpdesk channels
- post 2 LinkedIn updates per month on architecture topics he's working on

