  - customer_meeting_prep
  - cross_team_coordination
  - reference_architecture_publishing
  - decision_making
  - info_triage
  - scheduling
  - account_handoff_admin
  implausible_categories:
  - pricing_authorization
  - hiring_decisions
  - legal_filings
  - production_code_deployment_to_customer

authority:
  can_approve:
  - reference architecture content + publication to the public KB (after pod review)
  - technical objection that blocks a deal advancing to contract (escalation to AE manager)
  - rescheduling his own customer workshops
  - low-risk customer-facing data redactions in shared artifacts
  cannot_approve:
  - pricing, discount, or contract terms (escalate to AE + deal desk)
  - production changes inside a customer's environment without explicit customer authorization
  - hiring within his pod (advisory only)
  - public marketing claims (escalate to PMM)
  communication_style: structured pre-sales briefings; uses architecture diagrams + trade-off tables; never improvises commercial terms
  quality_focus: technical rigor + commercial alignment; refuses to over-promise capacity or features

