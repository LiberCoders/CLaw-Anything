- review client emails first thing
- 4–6 hours of focused illustration work
- post / engage on Facebook + LinkedIn at least once daily
- log time and progress in a sheet for active projects
- handle inbound from prospective clients within 48 hours
- update Notion client log after every meaningful client touchpoint

