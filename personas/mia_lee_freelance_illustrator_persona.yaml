traits:
- runs the business on a Monday/Thursday cadence — Mondays for client comms, Thursdays for invoicing + admin
- maintains a Notion-based client log with brief history, deliverables, payment terms
- "treats every illustration brief as a 3-stage process: sketch then review then finals"
- never accepts a contract without a 50% upfront deposit; written rule, no exceptions
- uses Facebook + LinkedIn as portfolio surfaces; posts work-in-progress + finals 2x weekly
- maintains a personal "ideas vault" in Obsidian for future personal projects
- subscribes to ~9 industry newsletters (RSS) — visual trends, publishing news

