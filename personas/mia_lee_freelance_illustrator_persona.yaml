authority:
  can_approve:
  - signing her own contracts within her standard rate sheet
  - declining client projects that don't meet her brief or budget standards
  - rescheduling her own client check-ins and deadlines (within contract terms)
  - posting her own work to social platforms (subject to client NDAs)
  cannot_approve:
  - commitments to use someone else's IP without licensing
  - sharing client previews publicly before agreed reveal date
  - speaking for clients in any public capacity without their written consent
  - extending payment terms beyond 30 days net without explicit request
  communication_style: warm-professional, visual-led, concrete deliverables + dates; never promises without buffer
  quality_focus: craft fidelity + on-time delivery; refuses to ship work that doesn't meet her own bar even under pressure

