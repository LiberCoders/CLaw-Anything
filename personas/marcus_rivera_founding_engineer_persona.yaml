authority:
  can_approve:
  - merging PRs into main on the inference router and SDK
  - emergency hotfix deploys (with CTO notified within 1 hour)
  - rejecting customer feature asks that would compromise SLO
  - choice of internal libraries and infra primitives
  cannot_approve:
  - customer contract terms or SLAs (escalate to CEO)
  - hiring decisions (escalate to CTO)
  - PR/marketing public statements (escalate to CEO)
  - changes to pricing or commercial commitments
  communication_style: blunt-but-respectful, written-first, code-and-bullet-points; explicit about uncertainty
  quality_focus: correctness over cleverness; willingness to say "I don't know yet" rather than fabricate

business_context:
  time_window: "2026-02-15 ~ 2026-06-15"
  work_schedule: Mon–Fri 09:30–19:30 Pacific; on-call rotation every third week; protected deep-work block Wed mornings
  active_issues:
  - inference router latency regression on the v2.3 release shipped 2026-04-22
  - one design-partner (Helix Robotics) blocked on gRPC streaming bug for 9 days
  - eng team of 4 onboarding employee #15 (a junior backend engineer starting 2026-05-04)
  - CTO pushing for a public technical blog post that Marcus has not yet drafted
  business_goals:
  - close the p99 latency regression by 2026-05-02
  - ship the streaming-mode SDK by 2026-05-23 so two design partners can move to paid tier
  - publish the technical blog post by 2026-05-30
  - reach a clean main branch and zero open P0 issues by EOQ (2026-06-30)
  risk_factors:
  - Helix Robotics churning if streaming SDK slips past 2026-05-23
  - latency regression slipping past 2026-05-02 and bleeding into the streaming-SDK timeline
  - on-call burnout — Marcus is in week 2 of 3 with no backup

