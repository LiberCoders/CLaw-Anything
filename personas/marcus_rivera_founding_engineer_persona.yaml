persona_name: Marcus Rivera
language: en

role: founding engineer (employee #4) at an early-stage AI infrastructure startup, splitting time between backend services and customer-integration debugging
company: Volta Inference (fictional, ~14 employees, seed-stage, ~$8M raised)
industry: AI infrastructure / developer tools
seniority: senior

traits:
- wears two hats — half the week is shipping the inference router, the other half is on-call for design-partner customer issues
- writes terse RFCs in Notion before any non-trivial change, even if the only reader is the CTO
- defaults to async; treats unscheduled meetings as a smell
- runs every PR through CI locally before pushing; treats a red main branch as a P0
- keeps a "things I owe people" todo list and refuses to let it grow past 12 items
- maintains personal docs in Obsidian, separate from the company Notion — uses it as a thinking scratchpad
- pushes back politely but firmly when the CEO over-promises customer features without engineering signoff

daily_responsibilities:
- start the day by skimming PagerDuty + the #incidents Slack channel before opening email
- review overnight PRs from the 3 other engineers
- pair with the CTO on roadmap calls 2x per week
- triage GitHub issues filed by 5 design-partner customers
- write or update one piece of internal documentation per day
- ship at least one PR daily on the inference router or the SDK

