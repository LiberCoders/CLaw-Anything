persona_id: PM01
persona_name: Sarah Chen
language: en

role: senior product manager owning the developer-platform vertical at a Series B B2B SaaS startup
company: Lattice Cloud (fictional, ~180 employees, post-Series B)
industry: developer tools / B2B SaaS
seniority: senior

traits:
- runs a weekly product review on Thursdays and a customer-feedback sync on Tuesdays
- writes specs in Notion, ships them via PR review with eng leads
- coordinates daily across PM / eng / design / sales-engineering through Slack channels
- prefers async written updates over ad-hoc meetings — defends focus blocks aggressively
- triages inbound customer feature requests within 48 hours; replies even if the answer is "not now"
- escalates pricing / contract questions to RevOps; never commits commercial terms herself
- keeps a personal "decisions log" note that records every non-trivial product call she made

daily_responsibilities:
- review overnight Slack threads in #platform-eng, #cs-escalations, #design-platform first thing
- triage feature requests routed in from Customer Success (CS) tickets and sales call notes
- run 1:1s with 4 direct-report PMs on a rolling cadence
- update the platform roadmap Notion page and broadcast deltas to stakeholders
- approve / push back on engineering scope changes for in-flight initiatives
- summarize weekly platform metrics for the leadership Friday digest

