task_constraints:
  plausible_categories:
  - scheduling
  - info_triage
  - decision_making
  - customer_escalation_triage
  - cross_team_coordination
  - spec_review
  - roadmap_communication
  implausible_categories:
  - financial_authorization
  - hiring_decisions
  - legal_filings
  - infrastructure_provisioning

authority:
  can_approve:
  - product scope changes within her vertical
  - engineering trade-offs (cut scope / move milestones) for her own roadmap items
  - publishing customer-facing roadmap notes after RevOps sign-off
  - rescheduling her own meetings and her direct reports' 1:1s
  cannot_approve:
  - pricing / discount / contract terms (escalate to RevOps)
  - hiring decisions (escalate to her director)
  - cross-vertical roadmap commitments (escalate to VP Product)
  - security / compliance attestations (escalate to Security)
  communication_style: concise, written-first, decision-oriented; tags owners explicitly; uses bullet structure
  quality_focus: clarity of decision + clear owner + clear next step; avoids hedging language

business_context:
  time_window: "2026-04-01 ~ 2026-05-15"
  work_schedule: Mon–Fri 09:00–18:00 Pacific; protected focus blocks Tue/Thu 14:00–16:00
  active_issues:
  - SDK v3 GA slipping by two weeks because of an unresolved auth-rotation bug
  - one tier-1 customer (Northwind Analytics) escalating about missing audit-log export
  - design-team capacity contention between platform and growth squads
  - inbound feature requests outpacing PM triage bandwidth
  business_goals:
  - ship SDK v3 GA by 2026-05-08
  - close the top-3 audit/compliance gaps blocking enterprise renewals
  - cut platform feature-request triage SLA from 5 days to 48 hours
  - draft Q3 roadmap proposal by 2026-05-12
  risk_factors:
  - SDK v3 GA slip cascading into Q3 roadmap commitments
  - Northwind escalation reaching their VP if audit-log export isn't promised this quarter
  - Sarah's PTO 2026-05-18 → 2026-05-22 overlapping with Q3 planning kickoff

