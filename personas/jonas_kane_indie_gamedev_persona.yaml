  - sharing publisher's confidential terms outside himself
  - speaking for any partner in public capacity
  - permanent commitments above 6 months without legal review
  communication_style: thoughtful, direct, narrative-led, transparent about uncertainty; community-first tone
  quality_focus: long-term reputation + technical quality over short-term hype; refuses to over-promise dates

