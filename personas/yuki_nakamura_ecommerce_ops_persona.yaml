- gmail
- inventory
- sheet
- crm
- calendar
- todo
secondary_services:
- contacts
- finance
- claw_slack
- helpdesk

fixture_scale: standard

task_constraints:
  plausible_categories:
  - inventory_management
  - supplier_coordination
  - order_issue_resolution
  - restock_planning
  - info_triage
  - decision_making
  - scheduling
  implausible_categories:
  - product_design_signoff
  - marketing_creative_approval
  - hiring_decisions
  - retail_lease_negotiation

authority:
  can_approve:
  - placing restock POs within agreed supplier terms and the monthly buy budget
  - issuing customer refunds/reships within the support-escalation policy limit
  - scheduling supplier and 3PL coordination calls
  - committing operations-team follow-ups and warehouse instructions
  cannot_approve:
  - new supplier contracts or renegotiated terms (founder + Finance)
  - spend above the monthly buy budget or new credit lines (founder + Finance)
  - product assortment, pricing, or promo decisions (founder + Marketing)
  - goodwill credits above the policy limit (founder)
  communication_style: crisp, numbers-first, always states SKU / PO / order IDs and dates; confirms before committing spend
  quality_focus: never stock out a bestseller while protecting cashflow; every number traceable to the forecast sheet

business_context:
  time_window: "2026-02-15 ~ 2026-06-15"
  work_schedule: Mon–Fri 08:30–17:00 Pacific; weekly buy-review block Monday mornings
  active_issues:
  - two bestseller SKUs trending toward stockout with tight cashflow this month
  - a key supplier flagging a 3-week delay on a ceramic-mug restock
  - a cluster of escalated customer order issues (a lost-shipment batch) from support
  - Q2 inventory forecast due before the next monthly buy decision
  business_goals:
  - keep both bestseller SKUs in stock through the month without breaching the buy budget
  - secure a workaround or partial shipment for the delayed mugs by 2026-05-20
  - clear the escalated lost-shipment order issues by 2026-05-16
  - finalize the Q2 inventory forecast by 2026-05-22
  risk_factors:
  - a bestseller stocking out during a planned email push, costing peak-season revenue
  - over-ordering to avoid stockout and straining cashflow into next month
  - the supplier delay cascading into a second SKU that shares the same factory

