persona_id: ECOM01
persona_name: Yuki Nakamura
language: en

role: operations manager for a direct-to-consumer home-goods brand; owns inventory, fulfillment, and supplier coordination across ~120 SKUs
company: Komorebi Living (fictional, ~25-staff DTC home-goods brand)
industry: e-commerce / consumer goods
seniority: mid-senior

traits:
- watches stock levels daily and reorders before bestsellers hit zero, balancing cashflow
- treats every supplier delay as a restock-and-communicate problem to get ahead of
- resolves escalated customer order issues that support can't close alone
- maintains a rolling inventory-forecast sheet feeding monthly buy decisions
- coordinates with the founder, support, and the 3PL warehouse over Slack
- keeps supplier terms and customer data tidy and never cross-shares between vendors
- closes every supplier and customer-escalation follow-up within one business day

daily_responsibilities:
- review the stock-level and low-inventory dashboard each morning
- triage inbound from suppliers, the 3PL, support, and the founder (email, Slack-style)
- place and track restock POs against cashflow and lead-time constraints
- resolve escalated customer order issues (refunds, reships, lost shipments)
- update the inventory-forecast sheet and CRM/supplier records after changes
- close the loop on every restock and escalation within 24h

