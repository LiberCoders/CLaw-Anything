[project]
name = "claw-anything"
version = "1.0.0"
description = "Agent evaluation framework for benchmarking AI agents in real-world personal assistant scenarios"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "httpx>=0.27",
    "uvicorn>=0.42.0",
    "fastapi>=0.135.2",
    "pypdf>=6.9.2",
]

[project.optional-dependencies]
mock = ["fastapi>=0.115", "uvicorn>=0.30", "pypdf", "trafilatura>=1.8", "requests>=2.28"]
web = ["trafilatura>=1.8", "requests>=2.28"]
sandbox = ["docker>=7.0"]
openharness = ["openharness-ai>=0.1.7"]
dev = ["pytest>=8.0"]

[project.scripts]
claw-anything = "claw_anything.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
