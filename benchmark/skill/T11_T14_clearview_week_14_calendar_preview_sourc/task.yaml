judge_rubric: "Award full marks if the response:\n\n1. **Identifies the 2-3 most critical CLEARVIEW events in the next 7 days**\
  \ (April 4-10), specifically:\n   - T.W. source interview on April 7 (EVT-468) as the primary deliverable requiring encrypted\
  \ communication setup\n   - Legal review deadline on April 10 (EVT-470) as the hard constraint\n   - Partner newsroom coordination\
  \ call on April 7 (EVT-469) as a potential conflict point\n\n2. **Surfaces specific preparation requirements** with actionable\
  \ detail:\n   - Signal platform test needed 24 hours before T.W. interview (references TODO-733)\n   - Question framework\
  \ finalization for T.W. interview (references TODO-734)\n   - Source security context awareness (T.W.'s employer audit concerns,\
  \ postponement protocol)\n\n3. **Correctly identifies the scheduling conflict** between partner call (April 7, 10am EDT)\
  \ and T.W. secure window, and notes the resolution via Marcus delegation (TODO-735)\n\n4. **Assesses legal deadline buffer\
  \ adequacy** and flags the risk: only 2 days between T.W. interview (April 7) and legal submission (April 10) leaves zero\
  \ slack if new leads require verification\n\n5. **Demonstrates cross-referencing** between calendar events and TODO items\
  \ (e.g., TODO-733 → EVT-473 Signal test, TODO-734 → interview prep, TODO-735 → conflict resolution)\n\n6. **Maintains operational\
  \ security discipline**: does not propose cloud-based platforms for encrypted source interviews, does not reveal source\
  \ identity details beyond what's in calendar titles, respects that source windows are non-negotiable\n\n7. **Provides prioritized\
  \ recommendations** in order of urgency (e.g., April 6 prep tasks must complete before April 7 interview, extension discussion\
  \ needed post-interview)\n\nDeduct points for:\n- Missing the T.W. interview as the critical path event\n- Failing to identify\
  \ the scheduling conflict or buffer inadequacy\n- Generic advice without specific prep requirements (e.g., \"prepare questions\"\
  \ without mentioning Signal test or 24-hour advance setup)\n- Recommending actions that violate source protection protocols\n\
  - Listing calendar events without analysis of conflicts or preparation needs\n- Ignoring TODO items that provide essential\
  \ context for calendar events"
reference_solution: '**Step 1**: Call `calendar_list_events` for the 7-day window (April 4-10, 2026) to retrieve upcoming
  CLEARVIEW-related events.


  **Step 2**: Identify critical events from calendar results:

  - EVT-468: T.W. source interview on April 7, 2-4pm Panama time (3-5pm EDT) — encrypted Signal video call with Panama banking
  whistleblower

  - EVT-470: Legal review deadline on April 10, 3-4:30pm EDT — final document submission to Rajesh Mehta

  - EVT-469: Partner newsroom coordination call on April 7, 10-11am EDT (not in signal records but referenced in TODO-735
  and emails)


  **Step 3**: Call `todo_list_tasks` to retrieve preparation tasks and cross-reference with calendar events.


  **Step 4**: Identify preparation requirements from TODO items:

  - TODO-733: "Test Signal backup communication channel for T.W. interview" — due April 6, requires 24-hour advance technical
  setup

  - TODO-734: "Prepare interview question list for T.W." (referenced in NOTE-221) — question framework must be finalized by
  April 6 EOD

  - TODO-735: "Cross-check partner newsroom call timing vs T.W. secure window" — flags scheduling conflict between EVT-469
  (10am EDT) and T.W.''s preferred secure window (9am-11am Panama = 10am-12pm EDT)


  **Step 5**: Detect scheduling conflict from TODO-735:

  - Partner call (EVT-469, April 7 10am) overlaps with T.W. secure communication window

  - Resolution: Marcus delegation confirmed to cover partner call while Priya focuses on interview prep

  - Source: TODO-735 description explicitly states "CONFLICT ALERT" and delegation options


  **Step 6**: Assess legal deadline buffer adequacy:

  - T.W. interview on April 7 (3-5pm EDT)

  - Legal submission deadline on April 10 (3pm EDT)

  - Buffer = only 2 days (April 8-9) to integrate interview material

  - Risk: Zero slack if T.W. yields major new leads requiring verification

  - Recommendation: Discuss 48-hour extension request with Marcus after interview


  **Step 7**: Optionally call `notes_get` for NOTE-221 to retrieve detailed calendar preview analysis (contains comprehensive
  prep recommendations and risk assessment).


  **Step 8**: Optionally call `gmail_list_messages` or `gmail_get_message` to review:

  - MSG-5232: T.W. confirmation email with security context (employer audit concerns, "postpone" signal protocol)

  - MSG-5233: Sarah Winters email about partner call timing conflict


  **Step 9**: Produce preview report with:

  - **Critical events**: T.W. interview (April 7, primary deliverable), Legal deadline (April 10, hard constraint)

  - **Prep requirements**: Signal test by April 6 (TODO-733), question framework by April 6 EOD (TODO-734)

  - **Conflict resolution**: Partner call delegation to Marcus (TODO-735 resolved)

  - **Buffer assessment**: Legal deadline has inadequate buffer (2 days post-interview), extension likely needed

  - **Security notes**: T.W. employer audit escalation, encrypted Signal only, postponement protocol

  - **Prioritized actions**: (1) Complete Signal test April 6, (2) Finalize questions April 6, (3) Execute interview April
  7, (4) Assess extension need April 7 evening


  **Expected output structure**:

  1. Upcoming critical events (April 7 interview, April 10 deadline)

  2. Specific prep requirements with deadlines (Signal test, question framework)

  3. Scheduling conflict identification and resolution status

  4. Buffer adequacy assessment with extension recommendation

  5. Security/operational notes (encrypted platform, source safety context)

  6. Prioritized next actions in chronological order'
