execution_date: '2026-04-02'
prompt:
  text: I just got my April exam proctoring assignment for April 15th. Can you help me figure out if I have any conflicts
    and whether I need to do anything about it? I have a feeling something might have changed but I'm not sure.
  language: en
scoring_components:
- name: Detected hidden schedule change from informal channel
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - exam moved
      - schedule compressed
      - April 14
      - moved up one day
      - date changed
    - - Chen Jing
      - department head
