judge_rubric: '# Evaluation Rubric for April Exam Week Proctoring Duty Conflict Detection


  ## Excellent (9-10)

  - **Proactive discovery**: Agent independently retrieved the unread urgent email (MSG-5140) from Chen Jing announcing the
  hidden schedule compression, without being explicitly told to check for informal notifications

  - **Hidden conflict recognition**: Correctly identified that the exam was moved from April 15 to April 14, creating a direct
  time overlap with the daughters'' Spring Reading Festival parent volunteer event (8:30-11:30 AM)

  - **Credibility assessment**: Explicitly evaluated the reliability of the informal notification by noting Chen Jing''s authority
  as department head, the timestamp (late evening March 31), and corroboration from Zhou Ming''s response

  - **Surface vs. true status distinction**: Clearly articulated that the official email shows "no conflict" on April 15,
  but the hidden information reveals a critical conflict on April 14

  - **Actionable recommendation**: Recommended accepting Zhou Ming''s duty swap offer before the April 5 deadline, with clear
  rationale that waiting for official confirmation risks missing the swap window

  - **Decision documentation**: Explained that the decision is based on credible hidden information that contradicts the official
  status, justifying proactive action

  - **Urgency awareness**: Noted the tight decision window (April 5 deadline for both duty swap and daughters'' school RSVP)


  ## Good (7-8)

  - Found the hidden schedule change email and identified the April 14 conflict

  - Recognized the credibility of Chen Jing''s notification

  - Recommended duty swap action

  - Minor gaps: May not have fully articulated the surface-vs-true-status distinction, or may have been less explicit about
  the urgency of acting before official confirmation


  ## Adequate (5-6)

  - Identified the schedule conflict with daughters'' event

  - Found either the official email or the hidden notification, but may not have fully integrated both sources

  - Recommended some form of action (duty swap or escalation)

  - Significant gaps: May have missed the credibility assessment, or may have suggested waiting for official confirmation
  without recognizing the deadline risk


  ## Poor (3-4)

  - Found some relevant information but failed to identify the true conflict

  - May have relied solely on the official email showing April 15 with "no conflicts"

  - Did not discover or did not trust the hidden schedule change notification

  - Weak or no actionable recommendation


  ## Failing (0-2)

  - Did not identify any schedule conflict

  - Did not retrieve the critical hidden information from the coordination group

  - Accepted the surface status from the official email without proactive investigation

  - No meaningful analysis or recommendation


  ## Key Evaluation Principles

  1. **Proactive information retrieval**: The core challenge is discovering hidden information in informal channels (unread
  urgent email) that contradicts official status. Agents that only check the official assignment email will miss the conflict.

  2. **Credibility assessment**: Strong responses evaluate the reliability of informal notifications by checking sender authority,
  timestamp, and peer corroboration before acting.

  3. **Hidden vs. surface conflict**: The task tests whether the agent can recognize that official systems lag behind informal
  coordination channels, and that "no conflict" status can be incorrect when hidden information exists.

  4. **Decision urgency**: The agent must recognize that waiting for official confirmation risks missing the duty swap deadline,
  requiring proactive action based on credible hidden information.

  5. **Family commitment priority**: The daughters'' school event is non-negotiable (already confirmed RSVP), so the agent
  must prioritize finding a duty swap rather than suggesting cancellation of family commitment.'
reference_solution: "# Reference Solution: April Exam Week Proctoring Duty Conflict - Hidden Schedule Change Detection\n\n\
  ## Step 1: Retrieve official proctoring assignment\n- **Action**: `gmail_get_message(message_id=\"MSG-5138\")`\n- **Finding**:\
  \ Official email from Academic Affairs (March 31, 2:30 PM) assigns Lin Jia Hui to proctor Mathematics on **April 15, 2026,\
  \ 9:00-11:00 AM**\n- **Surface status**: Email states \"no conflicts with your existing commitments\"\n- **Key detail**:\
  \ Roster finalization deadline is April 7; duty swap requests must be submitted by April 5\n\n## Step 2: Check calendar\
  \ for existing commitments\n- **Action**: `calendar_list_events()` or `calendar_get_user_events()`\n- **Finding 1**: Event\
  \ EVT-457 shows the official proctoring assignment on April 15, 9:00-11:00 AM (matches email)\n- **Finding 2**: Event EVT-458\
  \ shows **Daughters' Spring Reading Festival - Parent Volunteer (CONFIRMED RSVP)** on **April 14, 8:30-11:30 AM** at Luohu\
  \ District Primary School\n- **Initial assessment**: Based on official email alone, April 15 assignment appears to have\
  \ no conflict with April 14 family event\n\n## Step 3: Proactively retrieve informal coordination channel messages\n- **Action**:\
  \ `gmail_list_messages()` to check for recent urgent communications, then `gmail_get_message(message_id=\"MSG-5140\")`\n\
  - **Critical discovery**: Unread urgent email from Chen Jing (Grade 10 Department Head) sent March 31, 9:45 PM to grade10.teachers@szexperimental.edu.cn\n\
  - **Hidden information**: ALL April 15 exams moved to **April 14** due to Provincial Education Inspection visit scheduled\
  \ for April 15\n- **Specific impact**: \"Teacher Lin Jia Hui: Mathematics proctoring now April 14, 9:00 AM (was April 15)\"\
  \n- **Explanation**: Decision made in emergency administrative meeting that evening; official calendar/email updates coming\
  \ April 1 (next day)\n- **Timing note**: Sent at 9:45 PM explains why official system (email from 2:30 PM same day) not\
  \ yet updated\n\n## Step 4: Assess credibility of hidden information\n- **Sender authority**: Chen Jing is Grade 10 Department\
  \ Head (authoritative source for grade-level scheduling)\n- **Message timestamp**: March 31, 9:45 PM (recent, explains lag\
  \ in official system)\n- **Corroboration**: Check if other teachers acknowledged the change in thread\n- **Reason provided**:\
  \ Provincial Education Inspection visit (high-priority external event that would force schedule changes)\n- **Promise of\
  \ official update**: Chen Jing states official calendar/email updates coming April 1\n- **Credibility conclusion**: Highly\
  \ credible - authoritative sender, clear reason, promise of official confirmation, sent to entire teaching team\n\n## Step\
  \ 5: Identify true schedule conflict\n- **Surface status** (based on official email MSG-5138): April 15 assignment = NO\
  \ CONFLICT with April 14 family event\n- **True status** (based on hidden information MSG-5140): April 14 assignment = **CRITICAL\
  \ CONFLICT**\n- **Conflict details**:\n  - Exam proctoring (moved to April 14): 9:00-11:00 AM\n  - Daughters' school parent\
  \ volunteer event: 8:30-11:30 AM\n  - Direct time overlap: Cannot attend both commitments\n  - Family event status: Already\
  \ confirmed RSVP (March 28), mandatory parent participation\n\n## Step 6: Check todo tasks for additional context\n- **Action**:\
  \ `todo_list_tasks()`\n- **Finding**: Tasks TODO-655, TODO-656, TODO-657 show Lin Jia Hui has already begun analyzing this\
  \ conflict\n- **Key insight from TODO-657**: Zhou Ming offered a duty swap - take Lin's April 14 morning slot in exchange\
  \ for April 17 afternoon\n- **Deadline urgency**: Both duty swap deadline and daughters' school RSVP deadline are April\
  \ 5 (3 days away from execution date April 2)\n\n## Step 7: Consult notes for detailed analysis\n- **Action**: `notes_get(note_id=\"\
  NOTE-167\")`\n- **Finding**: Lin Jia Hui has documented comprehensive analysis of the hidden schedule conflict\n- **Key\
  \ points**:\n  - Credibility assessment confirms Chen Jing's message is trustworthy\n  - Zhou Ming's 10:10 PM reply acknowledges\
  \ the change and offers duty swap\n  - Decision rationale: Cannot rely solely on official email; must act on credible hidden\
  \ information\n  - Risk analysis: Waiting for official confirmation may cause missing the April 5 swap deadline\n\n## Step\
  \ 8: Formulate recommendation\n- **Primary recommendation**: Accept Zhou Ming's duty swap offer immediately\n  - Lin takes\
  \ Zhou Ming's April 17 afternoon slot\n  - Zhou Ming takes Lin's April 14 morning slot\n  - This resolves the conflict with\
  \ daughters' school event\n- **Action timeline**:\n  1. Contact Zhou Ming today (April 2) to confirm swap agreement\n  2.\
  \ Submit formal duty swap request to Academic Affairs before April 5 deadline\n  3. Monitor for official schedule update\
  \ on April 1-2 (as Chen Jing promised)\n- **Justification**: \n  - Hidden information from credible source (Chen Jing) reveals\
  \ true schedule is April 14, not April 15\n  - Daughters' school event is non-negotiable family commitment (already confirmed)\n\
  \  - Waiting for official confirmation risks missing swap deadline\n  - Zhou Ming's offer provides clean resolution\n- **Documentation**:\
  \ Note that decision is based on hidden information that contradicted official status, demonstrating proactive multi-channel\
  \ monitoring\n\n## Key Success Factors\n1. **Proactive retrieval**: Did not rely solely on official email; independently\
  \ checked for informal notifications\n2. **Credibility assessment**: Evaluated sender authority, timing, and corroboration\
  \ before trusting hidden information\n3. **Surface vs. true status**: Recognized that official system lag can create false\
  \ \"no conflict\" status\n4. **Urgency awareness**: Understood that acting on credible hidden information before official\
  \ confirmation is necessary to meet deadlines\n5. **Family priority**: Treated daughters' school commitment as non-negotiable,\
  \ requiring duty swap rather than cancellation"
