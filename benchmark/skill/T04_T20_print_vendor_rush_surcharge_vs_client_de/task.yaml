execution_date: '2026-04-05'
prompt:
  text: I need to decide on the print vendor option for the GreenFutures pitch deck by March 25. Should I pay the rush surcharge
    or go with standard delivery? Help me figure out what makes the most financial and practical sense.
  language: en
scoring_components:
- name: Rush delivery recommendation with financial justification
  weight: 0.4
  check:
    type: keywords_present
    keywords:
    - - rush
      - rush delivery
      - rush option
      - rush surcharge
