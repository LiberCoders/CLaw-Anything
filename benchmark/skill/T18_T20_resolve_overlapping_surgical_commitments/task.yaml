execution_date: '2026-04-02'
prompt:
  text: The trauma case this morning ran way over and now I've got three things colliding this afternoon. I need to figure
    out the least damaging way to handle this and get the right people notified ASAP.
  language: en
scoring_components:
- name: Identified all three overlapping commitments with timing constraints
  weight: 0.15
  check:
    type: keywords_present
    keywords:
    - - Wellington
      - private practice
      - Wellington Hospital
    - - David Chen
      - ARCP
      - competency sign-off
      - training assessment
    - - Clinical Governance
      - CT angiography
      - protocol presentation
      - governance committee
- name: Calculated financial exposure from Wellington breach
  weight: 0.2
  check:
    type: keywords_present
    keywords:
    - - £5,000
      - '5000'
      - contract penalty
      - contract minimum breach
    - - £4,200
      - '4200'
      - patient deposits
      - deposit refunds
    - - £12,000
      - '12000'
      - total financial
      - combined financial cost
- name: Recognized irreversible training deadline consequences for Chen
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - ARCP panel
      - 10th April
      - April 10
      - panel deadline
    - - cannot progress
      - ST7 to ST8
      - repeat ST7
      - training delay
      - 12 months
      - 12-month
    - - removed from rota
