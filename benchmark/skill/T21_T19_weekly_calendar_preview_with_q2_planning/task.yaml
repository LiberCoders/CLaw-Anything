execution_date: '2026-04-07'
prompt:
  text: I need a preview of my calendar for the week of April 7-11. I've got some Q2 planning meetings coming up and want
    to make sure I'm not walking into anything unprepared. Flag any scheduling issues you spot.
  language: en
scoring_components:
- name: Identified deep-work block violation on Tuesday
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - Tuesday
      - April 8
      - 4/8
      - Tue
    - - '10:30'
      - 10:30 AM
      - '1030'
    - - deep-work
      - deep work
      - blocked time
      - protected block
      - 09:00-12:00
      - 9:00-12:00
      - morning block
    - - OKR
      - Data Team Alignment
      - Q2 OKR Finalization
- name: Identified prep requirements for three high-priority meetings
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - Q2 OKR
      - Data Team Alignment
      - Tuesday
      - April 8
    - - Customer Success Review
      - Churn
      - Wednesday
      - April 9
    - - Executive Steering
      - Roadmap
      - Friday
      - April 11
    - - prep
      - preparation
      - pre-work
      - TODO-608
      - TODO-609
      - TODO-611
- name: Cross-referenced Notion pages for meeting context
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - NPAG-64
      - capacity conflict
      - 20 nodes
      - 14 nodes
      - compute quota
    - - NPAG-65
      - churn risk
      - TechFlow
      - Apex Manufacturing
      - DataSync
    - - constraint model
      - compromise
      - mitigation
- name: Retrieved calendar events for upcoming week
  weight: 0.15
  check:
    type: tool_called
