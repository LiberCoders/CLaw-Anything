    type: object
    properties:
      workbook_id:
        type: string
      sheet:
        type: string
      start_cell:
        type: string
      values:
        type: array
        items:
          type: array
    required:
    - workbook_id
    - sheet
    - start_cell
    - values
- name: sheet_insert_row
  description: Insert a new row after the given row index, with optional cell values.
