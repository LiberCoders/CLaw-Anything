      old_name:
        type: string
      new_name:
        type: string
    required:
    - workbook_id
    - old_name
    - new_name
- name: sheet_compute
  description: 'Run an aggregate over a range. op: SUM | AVG | COUNT | MAX | MIN.'
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      sheet:
        type: string
      range:
        type: string
      op:
        type: string
        description: SUM | AVG | COUNT | MAX | MIN
    required:
    - workbook_id
    - sheet
    - range
    - op
- name: sheet_delete_workbook
  description: Permanently delete a workbook by workbook_id. Irreversible.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
    required:
    - workbook_id
- name: sheet_delete_sheet
  description: Delete a single sheet from a workbook (the workbook itself is preserved).
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      sheet:
        type: string
    required:
    - workbook_id
    - sheet
