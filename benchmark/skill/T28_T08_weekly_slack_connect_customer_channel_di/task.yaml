judge_rubric: '# LLM Judge Rubric: Weekly Slack Connect Customer Channel Digest


  ## Evaluation Perspective

  You are evaluating from the perspective of a **principal solutions architect** who needs to maintain pipeline momentum across
  multiple EMEA FinServ POCs. The agent''s output should enable rapid prioritization of response actions and prevent critical
  POC issues from being missed in high-volume customer communication.


  ## Scoring Dimensions (each 0-10)


  ### 1. Signal vs. Noise Filtering (Weight: 30%)

  **10 points:** Clearly distinguished POC-blocking issues from routine status updates. Filtered out automated notifications
  and low-priority messages. Identified the Barclays data masking compliance blocker as critical (April 8th board review deadline,
  CDO involvement). Recognized HSBC GPU allocation as early warning signal vs. immediate blocker.


  **5-7 points:** Captured most critical signals but included some routine updates or missed urgency indicators. May have
  under-prioritized the Barclays situation or over-prioritized non-blocking issues.


  **0-4 points:** Failed to distinguish urgent from routine. Missed the Barclays POC blocker entirely or treated all messages
  with equal priority. Included substantial noise (automated notifications, routine confirmations).


  ### 2. Executive Stakeholder Identification (Weight: 20%)

  **10 points:** Correctly identified executive-level communications requiring priority response: HSBC CTO Sarah Chen engagement
  request (data governance briefing), Allianz CDO Dr. Schneider board presentation request, Barclays CTO joining war room.
  Cross-referenced against contact database or inferred from titles/context. Flagged these as high-priority engagement opportunities.


  **5-7 points:** Identified some executive communications but missed context or priority level. May have treated executive
  requests as routine technical questions.


  **0-4 points:** Failed to distinguish executive stakeholders from individual contributors. Missed the significance of C-level
  involvement in POC discussions.


  ### 3. Competitive Intelligence Extraction (Weight: 15%)

  **10 points:** Extracted both competitive mentions (Databricks at Barclays, Dremio at HSBC) with critical context. Recognized
  the Databricks mention is particularly dangerous given it came immediately after the data masking POC blocker. Noted specific
  positioning (Databricks: "simpler dynamic masking", Dremio: "cost-effective alternative").


  **5-7 points:** Identified competitive mentions but missed context or urgency. May have listed competitors without connecting
  to deal risk.


  **0-4 points:** Missed competitive intelligence mentions entirely or failed to flag them as requiring response.


  ### 4. Categorization & Prioritization (Weight: 20%)

  **10 points:** Categorized issues by urgency (critical/high/medium) and deal stage (POC/evaluation/negotiation). Applied
  appropriate priority levels: Barclays masking = P0/critical (board deadline + competitive threat), HSBC CTO briefing = P1/high
  (executive engagement), GPU allocation = medium (early warning). Provided clear response timeline recommendations.


  **5-7 points:** Attempted categorization but priority levels don''t match actual urgency or deal risk. May have used inconsistent
  taxonomy.


  **0-4 points:** No clear prioritization framework. Presented findings as flat list without urgency indicators.


  ### 5. Cross-Account Theme Identification (Weight: 10%)

  **10 points:** Identified recurring technical themes across multiple accounts: data governance/compliance (Barclays PII
  masking, Allianz compliance docs, HSBC data residency), multi-region architecture (HSBC APAC, implied at others), ML/Snowpark
  patterns (Allianz fraud detection, HSBC GPU allocation). Recognized these as portfolio-level insights requiring systematic
  response.


  **5-7 points:** Noted some patterns but missed cross-account connections or strategic implications.


  **0-4 points:** Treated each account in isolation. No pattern recognition across customer base.


  ### 6. Actionability & Response Planning (Weight: 15%)

  **10 points:** Generated clear action items with appropriate routing (TODO list for POC blockers, executive briefing prep).
  Specified response timelines aligned with customer deadlines (Barclays April 8th board review, HSBC CTO briefing "next week").
  Provided enough context for each action that follow-up can happen without re-reading all Slack messages.


  **5-7 points:** Created action items but missing key context, deadlines, or routing. May have been too vague for effective
  follow-up.


  **0-4 points:** No clear action plan or next steps. Output requires significant additional work to be actionable.


  ### 7. Completeness & Coverage (Weight: 10%)

  **10 points:** Covered all three active customer channels mentioned in the task (Barclays, Allianz, HSBC). Scanned the specified
  time window (week of March 26-31). Noted low/no activity channels if applicable. Provided message volume context (e.g.,
  "filtered 21 actionable from 85 total").


  **5-7 points:** Covered most channels but may have missed one or had incomplete time window coverage.


  **0-4 points:** Only examined one channel or significantly incomplete coverage.


  ## Overall Quality Assessment

  Combine dimension scores using weights above. An excellent response (9-10 overall) would enable Arjun to immediately understand
  POC risks, prioritize executive responses, and address competitive threats without re-reading 85+ Slack messages. A poor
  response (0-4) would miss critical signals or bury them in noise, creating deal risk.'
reference_solution: '# Reference Solution: Weekly Slack Connect Digest - POC Signal Extraction


  ## Step 1: Identify Active Slack Connect Customer Channels

  **Action:** Call `claw_slack_list_channels` to get all available Slack Connect channels

  **Expected Result:** Should find channels including:

  - SLKC-41 (barclays-data-platform-poc)

  - SLKC-42 (allianz-poc-2026q1)

  - SLKC-43 (hsbc-analytics-hub)

  - Plus Standard Chartered and BNP Paribas channels (mentioned in task but not in fixtures - agent should note if absent)


  ## Step 2: Retrieve Messages from Target Time Window

  **Action:** For each active customer channel, call `claw_slack_list_messages` with date filter for March 26-31, 2026

  **Target Channels:**

  - SLKC-41 (Barclays): Messages 1-5

  - SLKC-42 (Allianz): Messages 6-10

  - SLKC-43 (HSBC): Messages 11-15


  ## Step 3: Filter for POC-Blocking Signals

  **Critical Finding - Barclays (SLKC-41, Message 2):**

  - Sender: james.cooper@barclays.com

  - Timestamp: 2026-03-27T14:30:00+00:00

  - Content: "URGENT: Our CDO just flagged that the data masking implementation is blocking our compliance sign-off. We have
  a board review on April 8th and need this resolved ASAP."

  - **Classification:** CRITICAL POC blocker

  - **Urgency Indicators:** "URGENT" keyword, CDO escalation, board review deadline (April 8th = 6 days from execution date)

  - **Follow-up (Message 4):** CTO Sarah Mitchell joining war room session


  **Medium Priority - HSBC (SLKC-43, Message 14):**

  - Sender: simon.clarke@hsbc.com

  - Timestamp: 2026-03-28T14:20:00+00:00

  - Content: "Quick update - we''re hitting some GPU allocation limits on the ML workloads. Not blocking yet but want to flag
  early."

  - **Classification:** HIGH priority (early warning, not yet blocking)


  ## Step 4: Extract Executive Stakeholder Communications

  **HSBC CTO Engagement (SLKC-43, Message 12):**

  - Stakeholder: Sarah Chen (CTO) - should cross-reference with contacts_get or contacts_search

  - Contact record: CON-260 confirms title "Chief Technology Officer"

  - Requested by: david.wong@hsbc.com

  - Topic: Data governance framework, cross-region data residency for APAC

  - **Classification:** P1 executive engagement opportunity


  **Allianz CDO Board Presentation (SLKC-42, Message 9):**

  - Stakeholder: Dr. Schneider (CDO)

  - Requested by: klaus.weber@allianz.de

  - Topic: Executive summary of POC progress for quarterly board presentation

  - **Classification:** P1 executive visibility opportunity


  ## Step 5: Extract Competitive Intelligence

  **Databricks Mention - Barclays (SLKC-41, Message 5):**

  - Sender: james.cooper@barclays.com

  - Timestamp: 2026-03-31T11:20:00+00:00

  - Content: "Quick heads up - we''re also evaluating Databricks for a similar use case. Their team mentioned they have built-in
  dynamic masking that might be simpler to implement."

  - **Context:** Comes 4 days AFTER the critical data masking POC blocker

  - **Risk Level:** HIGH - competitive threat during technical crisis

  - **Positioning:** Databricks claiming "simpler" implementation for exact pain point


  **Dremio Mention - HSBC (SLKC-43, Message 15):**

  - Sender: rachel.tan@hsbc.com

  - Timestamp: 2026-03-31T13:45:00+00:00

  - Content: "Heads up - Dremio reached out to us this week about their data lakehouse offering. They''re positioning it as
  a more cost-effective alternative for our use case."

  - **Risk Level:** MEDIUM - price-based positioning, no specific technical hook


  ## Step 6: Identify Cross-Account Technical Themes

  **Data Governance & Compliance (3 accounts):**

  - Barclays: PII masking requirements (Message 2)

  - Allianz: Compliance documentation for revised architecture (Message 7)

  - HSBC: Cross-region data residency controls (Message 12)


  **Multi-Region Architecture (2 accounts):**

  - HSBC: APAC operations data residency (Message 12)

  - (Pattern suggests other accounts may have similar requirements)


  **ML/Snowpark Dependencies (2 accounts):**

  - Allianz: Multi-stage pipeline dependency management (Message 10)

  - HSBC: GPU allocation for ML workloads (Message 14)


  ## Step 7: Route Actionable Items to TODO

  **Action:** Create or verify TODO tasks for critical items

  **Expected TODO items (from fixtures):**

  - TODO-597: Barclays data masking blocker (CRITICAL, due 2026-03-28)

  - TODO-598: HSBC CTO briefing prep (HIGH, due 2026-04-01)

  - TODO-601: Barclays Databricks competitive response (HIGH, due 2026-04-02)


  **Additional TODO items agent should consider creating:**

  - Allianz CDO executive summary (P1)

  - HSBC Dremio competitive response (P2)

  - HSBC GPU quota assessment (P2)


  ## Step 8: Generate Consolidated Summary Note

  **Action:** Create structured summary note covering:

  1. **Critical POC-blocking issues** (Barclays masking = P0)

  2. **Executive stakeholder communications** (HSBC CTO, Allianz CDO)

  3. **Competitive intelligence** (Databricks at Barclays, Dremio at HSBC)

  4. **Recurring technical themes** (governance, multi-region, ML)

  5. **Response priorities** with timelines (P0: immediate, P1: this week, P2: next week)

  6. **Deal stage summary** (at-risk: Barclays; healthy: Allianz, HSBC)

  7. **Filtering context** (e.g., "21 actionable messages from 85 total")


  **Reference:** Note NOTE-140 shows expected output structure and level of detail


  ## Key Success Criteria

  - Correctly identified Barclays as CRITICAL (POC blocker + competitive threat + executive visibility + board deadline)

  - Distinguished executive communications (CTO/CDO level) from routine technical updates

  - Connected competitive mentions to deal context (Databricks threat higher because of existing POC blocker)

  - Categorized by urgency AND deal stage

  - Provided clear response timeline aligned with customer deadlines (April 8th board review)

  - Filtered noise (routine status updates, automated notifications)

  - Identified cross-account patterns requiring portfolio-level response'
