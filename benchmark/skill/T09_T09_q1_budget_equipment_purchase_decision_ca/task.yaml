execution_date: '2026-04-04'
prompt:
  text: I need to decide on the calculator purchase for the competition team before the Q1 budget closes on April 4. Help
    me figure out the best option given the timing constraints and budget situation.
  language: en
scoring_components:
- name: Identifies hard budget constraint and three decision paths
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - ¥6,000
      - 6000 yuan
      - six thousand yuan
    - - standard delivery
      - 5-day delivery
      - slower option
      - ¥5,472
