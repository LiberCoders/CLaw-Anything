execution_date: '2026-04-04'
prompt:
  text: I've got a pile of unread newsletters from the past week that I need to triage for the CLEARVIEW investigation. Help
    me sort through them and pull out anything that matters for vendor decisions or security alerts.
  language: en
scoring_components:
- name: Critical vendor intelligence extracted
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - ECI
      - European Corporate Intelligence
      - registry vendor
    - - GRD
      - Global Registry Database
    - - pricing change
      - price increase
      - cost update
      - fee adjustment
    - - fraud alert
