prompt:
  text: I need to decide whether to purchase the Lloyd's Register premium vessel registry access before the April 8 deadline.
    The promotional window closes soon and I'm not sure if I should commit the budget now or wait for the FOIA responses.
    Help me figure out the right call here.
  language: en
scoring_components:
- name: Identified budget constraint conflict
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - $430
      - '430'
      - four hundred thirty
    - - $180
      - '180'
      - one hundred eighty
      - insufficient
      - shortfall
    - - Panama
      - Panama fees
      - Panama document
    - - $150-200
      - 150-200
      - 150 to 200
- name: Assessed FOIA delivery probability and circular dependency
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - 40%
      - 40 percent
      - low probability
      - unlikely FOIA
    - - circular dependency
      - prerequisite
      - Delaware requires Panama
      - Panama requires Delaware
    - - April 17-23
      - 8-12 days
      - 8-12 business days
    - - FOIA uncertainty
      - FOIA risk
      - FOIA may not deliver
- name: Calculated expected loss for both pathways
  weight: 0.3
  check:
    type: keywords_present
    keywords:
    - - expected loss
      - expected value
      - expected cost
    - - $100
      - '100'
      - one hundred
      - $250 × 0.40
      - 250 times 0.40
    - - deadline miss
      - publication deadline
      - March 15
      - threatens deadline
    - - immediate purchase
      - wait for FOIA
      - two pathways
      - both options
- name: Retrieved Q1 budget tracker from Obsidian
  weight: 0.15
  check:
    type: tool_called
    tool_name: claw_obsidian_get_note
    min_calls: 1
- name: Checked workmail for FOIA status updates
  weight: 0.15
  check:
    type: tool_called
    tool_name: workmail_list_messages
    min_calls: 1
- name: Documented decision rationale in investigation vault
  weight: 0.2
  check:
    type: tool_called
    tool_name: claw_obsidian_update_note
    min_calls: 1
