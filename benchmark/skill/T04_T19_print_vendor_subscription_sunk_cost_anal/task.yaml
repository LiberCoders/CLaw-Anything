prompt:
  text: I've been paying $89/month for ColorWave's Premium print subscription since last September, but my print volume has
    dropped way off and I'm wondering if I should downgrade to their Basic tier or just keep what I have. Can you help me
    figure out if continuing Premium actually makes sense, or if I'm just throwing money away because I've already invested
    so much?
  language: en
