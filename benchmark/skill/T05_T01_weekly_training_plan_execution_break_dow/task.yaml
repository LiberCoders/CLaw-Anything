execution_date: '2026-04-07'
prompt:
  text: I need to break down my Olympic qualification goals into specific tasks for this week (April 7-13). I just finished
    the assessment camp and want to make sure I'm hitting all my technical priorities while managing recovery properly.
  language: en
scoring_components:
- name: Retrieved Olympic qualification goals from notes
  weight: 0.15
  check:
    type: tool_called
    tool_name: notes_get
    min_calls: 1
- name: Reviewed existing to-do tasks
  weight: 0.15
  check:
