judge_rubric: '# LLM Judge Rubric for Weekly Training Plan Execution


  ## Evaluation Dimensions


  ### 1. Workflow Completeness (35 points)

  - **Full cross-service integration (25-35)**: Agent retrieved Olympic goals from notes (NOTE-168, NOTE-169), reviewed existing
  to-do tasks (TODO-501, TODO-502), checked calendar events (EVT-453, EVT-454), and created comprehensive weekly task breakdown
  that connects all data sources

  - **Partial workflow execution (15-24)**: Agent accessed 2-3 services but missed key connections (e.g., didn''t link calendar
  gaps to task scheduling, or didn''t reference specific goal milestones from notes)

  - **Incomplete workflow (5-14)**: Agent accessed only 1-2 services or produced generic tasks without grounding in actual
  goals/calendar/existing tasks

  - **No workflow execution (0-4)**: Agent failed to retrieve relevant data or produce actionable task breakdown


  ### 2. Goal-to-Task Translation Accuracy (25 points)

  - **Precise translation (20-25)**: Tasks directly map to Q1 technical goals from NOTE-168 (biomechanics drills for 8-12%
  energy waste reduction, equipment testing 3x/week, recovery protocol maintenance) and reflect post-camp context from NOTE-169
  (moderate fatigue, shoulder tightness, active recovery focus)

  - **Adequate translation (12-19)**: Tasks relate to general training themes but lack specific connection to documented milestones
  or miss critical post-camp adjustments

  - **Weak translation (5-11)**: Tasks are generic training activities not grounded in actual goal documentation

  - **No translation (0-4)**: Output does not reflect documented goals


  ### 3. Calendar and Constraint Awareness (20 points)

  - **Full constraint compliance (16-20)**: Tasks scheduled around mandatory events (physiotherapy April 9 2-3pm, coach meeting
  April 10 9-10:30am), utilized identified calendar gaps (Tuesday afternoon, Thursday morning, Friday afternoon), respected
  recovery week constraints (no high-intensity work Mon-Wed per Coach Liu''s email)

  - **Partial awareness (10-15)**: Acknowledged some calendar constraints but missed key conflicts or didn''t optimize gap
  utilization

  - **Minimal awareness (4-9)**: Generic scheduling without reference to actual calendar or constraints

  - **No awareness (0-3)**: Proposed tasks that directly conflict with mandatory events


  ### 4. Prioritization and Sequencing Logic (15 points)

  - **Strategic prioritization (12-15)**: Tasks ordered by urgency (equipment appointment before Friday training resumption,
  physiotherapy before high-intensity work, coach meeting prep before Thursday 9am), balanced recovery needs with technical
  maintenance, addressed Olympic selection timeline (April 20 announcement)

  - **Reasonable prioritization (7-11)**: Logical task ordering but missed some urgency factors or recovery balance

  - **Weak prioritization (3-6)**: Tasks listed without clear priority logic

  - **No prioritization (0-2)**: Random task ordering


  ### 5. Actionability and Specificity (5 points)

  - **Highly actionable (4-5)**: Tasks include specific details (appointment time slots from equipment email, drill types
  from goals, preparation items for coach meeting)

  - **Moderately actionable (2-3)**: Tasks are clear but lack some execution details

  - **Vague (0-1)**: Tasks too generic to execute


  ## Scoring Guidelines

  - **Excellent (85-100)**: Complete workflow execution, accurate goal translation, full constraint awareness, strategic prioritization

  - **Good (70-84)**: Solid workflow with minor gaps, good goal connection, mostly respects constraints

  - **Adequate (55-69)**: Partial workflow, general goal alignment, some constraint awareness

  - **Poor (0-54)**: Incomplete workflow, weak goal grounding, or constraint violations


  ## Critical Success Factors

  1. Agent must access notes to retrieve specific Q1 goals (biomechanics, equipment, recovery)

  2. Agent must check calendar to identify conflicts and gaps

  3. Agent must review existing to-do tasks to understand current priorities

  4. Output must produce specific weekly tasks that respect recovery constraints and mandatory appointments

  5. Tasks must connect back to documented Olympic qualification objectives'
reference_solution: "# Reference Solution: Weekly Training Plan Execution\n\n## Step 1: Retrieve Olympic Qualification Goals\n\
  **Action**: `notes_list` → `notes_get(note_id='NOTE-168')`\n- Extract Q1 2026 technical priorities:\n  - Biomechanics optimization:\
  \ 8-12% energy waste reduction, explosive power transfer drills, bi-weekly video analysis with Coach Liu\n  - Equipment\
  \ integration: 3 sessions/week testing, final lock-in by March 25 (already passed)\n  - Recovery protocol: weekly physiotherapy\
  \ (shoulder focus), 2x weekly massage, injury-free status\n  - Mental preparation: bi-weekly high-pressure drills, daily\
  \ 15-min visualization\n- Note critical success factor: Zero training interruptions due to injury\n\n## Step 2: Review Current\
  \ Week Context\n**Action**: `notes_get(note_id='NOTE-169')`\n- Assessment camp completed April 5-12 (just finished)\n- Current\
  \ status: moderate fatigue, shoulder slightly tight\n- This week priorities: active recovery focus, no high-intensity training\n\
  - Calendar gaps identified: Tuesday afternoon (April 8), Thursday morning (April 10), Friday afternoon (April 11)\n- Need\
  \ tasks for: biomechanics refinements, equipment testing, recovery sessions, coach meeting prep\n\n## Step 3: Check Existing\
  \ To-Do Tasks\n**Action**: `todo_list_tasks`\n- TODO-501: Break down biomechanics goals into weekly drills (due April 8,\
  \ high priority)\n  - Requires scheduling video analysis with Coach Liu (bi-weekly requirement)\n  - Focus on explosive\
  \ power transfer, transition phase energy waste\n  - Use Tuesday afternoon or Thursday morning gaps\n- TODO-502: Schedule\
  \ equipment specialist appointment (due April 9, high priority)\n  - Minor fit adjustment on left side, grip texture optimization\n\
  \  - Equipment budget: ~1,200 RMB remaining\n  - Coordinate with specialist availability\n\n## Step 4: Review Calendar for\
  \ Conflicts\n**Action**: `calendar_list_events` (April 7-13 range)\n- EVT-453: Coach Liu performance review meeting, April\
  \ 10, 9:00-10:30am\n  - Need to prepare: notes on performance, equipment feedback, next phase priorities\n- EVT-454: Physiotherapy\
  \ appointment (shoulder assessment), April 9, 2:00-3:00pm\n  - Critical for addressing shoulder tightness before resuming\
  \ technical drills\n\n## Step 5: Check Coach Email for Constraints\n**Action**: Review MSG-5117 from coach.liu@nationalteam.cn\n\
  - Mon-Wed: Light recovery training only, NO high-intensity work\n- Thursday 9am: Video review meeting (already in calendar\
  \ as EVT-453)\n- Friday: Resume technical drills at 70% intensity if recovered\n- Bring to meeting: performance notes, equipment\
  \ feedback, training priorities\n- Selection announcement: April 20 (10 days away)\n\n## Step 6: Check Equipment Specialist\
  \ Availability\n**Action**: Review MSG-5118 from equipment.sales@sportsgear.cn\n- Available slots:\n  - Tuesday April 8:\
  \ 2:00-5:00 PM\n  - Wednesday April 9: 10:00 AM-12:00 PM, 3:00-6:00 PM\n  - Friday April 11: 1:00-5:00 PM\n- Appointment\
  \ duration: 90 minutes\n- Cost: 350-450 RMB (within budget)\n- Backup equipment prep: 2-3 days, additional 800 RMB\n\n##\
  \ Step 7: Create Weekly Task Breakdown\n\n### Task 1: Schedule Equipment Adjustment Appointment\n**Action**: `todo_create_task`\n\
  - Title: \"Book equipment specialist appointment - competition gear adjustments\"\n- Description: \"Contact Zhang Qiang\
  \ at Sports Equipment Pro (+86 138-0012-3456) to confirm appointment for left-side fit adjustment and grip optimization.\
  \ Preferred slots: Tuesday April 8 at 2:00 PM or Friday April 11 at 1:00 PM (after technical drills resume). Budget: 350-450\
  \ RMB. Duration: 90 minutes.\"\n- Due date: April 8 (before Friday training resumption)\n- Priority: High\n- Tags: equipment,\
  \ olympic-prep, assessment-followup\n\n### Task 2: Prepare for Coach Liu Performance Review Meeting\n**Action**: `todo_create_task`\n\
  - Title: \"Prep materials for Coach Liu meeting (April 10, 9:00 AM)\"\n- Description: \"Compile for Thursday meeting: (1)\
  \ Notes on camp performance - what felt good vs needs refinement, (2) Equipment feedback from assessment camp (overall 8.5/10,\
  \ minor adjustments needed), (3) Next phase training priorities considering April 20 selection announcement. Review NOTE-169\
  \ observations before meeting.\"\n- Due date: April 9 (day before meeting)\n- Priority: High\n- Tags: coach-meeting, olympic-prep,\
  \ assessment-followup\n\n### Task 3: Biomechanics Drill Refinement - Explosive Power Transfer\n**Action**: `todo_update_task(task_id='TODO-501')`\n\
  - Update description: \"Based on Q1 goals (NOTE-168), schedule specific explosive power transfer drills for this week. Given\
  \ recovery constraints (light training Mon-Wed), plan 70% intensity session for Friday April 11 afternoon (calendar gap\
  \ available). Focus on transition phase energy waste reduction. Schedule next bi-weekly video analysis session with Coach\
  \ Liu for week of April 14-20 (discuss timing at Thursday meeting).\"\n- Keep due date: April 8\n- Keep priority: High\n\
  \n### Task 4: Active Recovery Sessions - Shoulder Focus\n**Action**: `todo_create_task`\n- Title: \"Schedule massage therapy\
  \ and active recovery sessions (2x this week)\"\n- Description: \"Per Q1 recovery protocol (NOTE-168), book 2 massage therapy\
  \ sessions this week. Coordinate with physiotherapy appointment April 9 at 2:00 PM (EVT-454) - discuss shoulder tightness\
  \ with Dr. Chen. Schedule sessions for Tuesday evening April 8 and Friday morning April 11 (before technical drills). Maintain\
  \ injury-free status priority.\"\n- Due date: April 8\n- Priority: Medium\n- Tags: recovery, physiotherapy, injury-prevention\n\
  \n### Task 5: Daily Visualization Practice\n**Action**: `todo_create_task`\n- Title: \"Daily mental preparation - 15-minute\
  \ visualization (April 7-13)\"\n- Description: \"Continue daily 15-minute visualization practice per Q1 mental preparation\
  \ protocol (NOTE-168). Focus on Olympic selection scenarios and technical execution refinements identified at assessment\
  \ camp. Maintain consistency through recovery week.\"\n- Due date: April 13\n- Priority: Medium\n- Tags: mental-preparation,\
  \ olympic-prep, daily-routine\n\n### Task 6: Equipment Budget and Backup Gear Decision\n**Action**: `todo_create_task`\n\
  - Title: \"Decide on backup equipment set preparation\"\n- Description: \"After primary gear adjustments completed, evaluate\
  \ whether to prepare backup equipment set (2-3 days prep time, 800 RMB). Current budget: ~1,200 RMB remaining. Consider\
  \ Olympic selection timeline (April 20) and equipment lock-in requirements. Discuss with Coach Liu at Thursday meeting if\
  \ needed.\"\n- Due date: April 11\n- Priority: Low\n- Tags: equipment, budget, olympic-prep\n\n## Summary of Weekly Task\
  \ Plan (April 7-13)\n\n**Monday-Wednesday (April 7-9)**: Recovery focus\n- Light training only (per Coach Liu constraints)\n\
  - Book equipment appointment for Tuesday 2pm or Friday 1pm\n- Prepare coach meeting materials by April 9\n- Attend physiotherapy\
  \ April 9 at 2pm (EVT-454)\n- Schedule massage therapy sessions\n- Continue daily visualization\n\n**Thursday (April 10)**:\
  \ Performance review\n- Coach Liu meeting 9:00-10:30am (EVT-453) with prep materials\n- Discuss next bi-weekly video analysis\
  \ timing\n- Light recovery training continues\n\n**Friday (April 11)**: Technical training resumption\n- Resume biomechanics\
  \ drills at 70% intensity (if recovered)\n- Equipment appointment (if scheduled for Friday slot)\n- Explosive power transfer\
  \ drill focus (calendar gap: afternoon)\n- Decide on backup equipment set\n\n**Constraint compliance**:\n- ✓ No high-intensity\
  \ work Mon-Wed (recovery protocol)\n- ✓ Tasks scheduled around mandatory events (physiotherapy, coach meeting)\n- ✓ Utilized\
  \ identified calendar gaps (Tuesday afternoon, Thursday morning, Friday afternoon)\n- ✓ Respected shoulder tightness concern\
  \ (physiotherapy priority)\n- ✓ Aligned with Olympic selection timeline (April 20)\n- ✓ No deletion of existing calendar\
  \ events or to-do tasks\n- ✓ Equipment testing maintained (3x/week target, adjusted for recovery week)\n- ✓ Recovery protocol\
  \ maintained (physiotherapy + massage therapy)"
