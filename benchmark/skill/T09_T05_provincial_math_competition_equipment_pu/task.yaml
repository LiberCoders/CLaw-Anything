execution_date: '2026-04-04'
prompt:
  text: I need to finalize the calculator purchase for our provincial math competition team. The equipment budget is tight
    and there are multiple vendor discount options to consider. Help me figure out the best purchasing path that stays within
    our constraints.
  language: en
scoring_components:
- name: 'Hard constraint compliance: year-end bonus threshold awareness'
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - 50,000
      - '50000'
      - fifty thousand
      - bonus threshold
    - - 42,150
      - current spending
      - year-to-date spending
