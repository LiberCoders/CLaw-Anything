judge_rubric: '# Evaluation Rubric for Q1 Conference Reconciliation & Q2 Planning


  ## Excellent (0.9-1.0)

  - Accurately calculates total Q1 conference spend (€2,295) across all three conferences

  - Correctly identifies multi-channel payment breakdown: €1,240 voucher (exhausted), €715 direct reimbursement (€485 approved,
  €230 pending), €340 cashback

