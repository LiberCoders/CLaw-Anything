execution_date: '2026-04-01'
prompt:
  text: Q1 just closed and I need to wrap up my conference expense tracking and get Q2 research priorities sorted. Can you
    help me reconcile everything and set up the next quarter's plan?
  language: en
scoring_components:
- name: Q1 conference total spend calculated correctly
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - €2,295
      - 2295 EUR
      - 2,295 euros
      - total of 2295
    - - three conferences
      - Frankfurt, Vienna, Nordic
      - all three events
      - Frankfurt Banking Summit, Vienna European Banking Conference, Nordic Financial Services Forum
- name: Multi-channel payment breakdown identified
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - voucher €1,240
      - 1240 voucher
      - voucher allocation 1,240
      - €1,240 corporate voucher
    - - direct reimbursement €715
      - 715 reimbursement
      - €715 direct
      - reimbursement total 715
    - - €230 pending
      - 230 pending approval
      - outstanding 230
      - split-payment 230 not yet approved
- name: Q2 high-priority deliverables identified from client feedback
  weight: 0.3
  check:
    type: keywords_present
    keywords:
    - - green taxonomy
      - taxonomy impact note
      - EBA green taxonomy
      - taxonomy analysis
    - - Basel IV sensitivity
      - Basel IV cross-border
      - output floor impact
      - Basel IV analysis
    - - April 25
      - Apr 25
      - before EBA consultation deadline
      - taxonomy deadline April
    - - May 10
      - May 10 deadline
      - before parallel reporting
      - Basel deadline May
- name: KB article creation for payment optimization framework
  weight: 0.2
  check:
    type: keywords_present
    keywords:
    - - KB-437
      - knowledge base article
      - KB article
      - documented framework
    - - multi-channel optimization
      - payment channel strategy
      - voucher exhaustion
      - discount stacking
      - split-payment workflow
- name: Accessed finance transaction records
  weight: 0.15
  check:
    type: tool_called
    tool_name: finance_list_transactions
    min_calls: 1
- name: Retrieved conference planning notes
  weight: 0.15
  check:
    type: tool_called
    tool_name: notes_get
    min_calls: 2
- name: Created Q2 deliverable tasks
  weight: 0.15
  check:
    type: tool_called
    tool_name: todo_create_task
    min_calls: 2
- name: Accessed ROI tracking sheet
  weight: 0.1
  check:
    type: tool_called
    tool_name: sheet_open
    min_calls: 1
