judge_rubric: '# Evaluation Rubric for Weekly Parent Communication Digest


  ## Core Task Success (Primary Criteria)


  ### Urgency Classification Accuracy (Critical)

  - **Excellent**: Correctly identifies BOTH urgent items (Zhang Ming accommodation request due to mid-term exam timeline;
  Chen Yue behavioral incident requiring immediate parent contact) and clearly distinguishes them from routine inquiries

  - **Good**: Identifies both urgent items but with less clear distinction from routine matters

  - **Acceptable**: Identifies at least one urgent item correctly

  - **Poor**: Fails to identify urgent items or misclassifies routine inquiries as urgent


  ### Prioritization Logic (Critical)

  - **Excellent**: Provides clear, actionable prioritization with specific timelines (urgent items within 24-48 hours, high
  priority within 3-5 days, routine within 1 week) based on legitimate educational and safety concerns

  - **Good**: Prioritizes correctly but with less specific timelines or reasoning

  - **Acceptable**: Basic prioritization present but lacks nuance

  - **Poor**: No clear prioritization or illogical ordering


  ### Topic Categorization (Important)

  - **Excellent**: Accurately categorizes all four communications (accommodation request, behavioral issue, academic performance,
  competition inquiry) with appropriate labels

  - **Good**: Categorizes 3-4 communications correctly

  - **Acceptable**: Categorizes 2 communications correctly

  - **Poor**: Fails to categorize or miscategorizes most communications


  ## Information Triage Quality


  ### Signal vs. Noise Discrimination (Critical for info_triage tasks)

  - **Excellent**: Clearly distinguishes high-signal urgent matters (accommodation with exam deadline, behavioral incident
  with escalation risk) from lower-signal routine inquiries (competition information request with "no immediate urgency" stated
  by parent)

  - **Good**: Makes appropriate distinctions with minor gaps

  - **Acceptable**: Basic signal/noise discrimination present

  - **Poor**: Treats all communications as equally important or misidentifies signal strength


  ### Context Integration

  - **Excellent**: Integrates relevant contextual factors (mid-term exam timing for accommodation request, parent''s explicit
  urgency statement for behavioral issue, parent''s "no immediate urgency" note for competition inquiry, grade drop pattern
  for academic concern)

  - **Good**: Includes most relevant context

  - **Acceptable**: Some context included

  - **Poor**: Minimal or no contextual analysis


  ## Practical Utility for Lin''s Workflow


  ### Actionability

  - **Excellent**: Provides specific next steps for each communication (e.g., "call Mrs. Chen at 138-2345-6789", "schedule
  Zhang Hui meeting for Mon-Wed afternoon", "prepare competition info package")

  - **Good**: Suggests general actions without full specificity

  - **Acceptable**: Identifies what needs response but limited action guidance

  - **Poor**: No actionable recommendations


  ### Role-Appropriate Perspective

  - **Excellent**: Demonstrates understanding of Lin''s dual role (homeroom head + competition coordinator), time constraints
  (mother of twins, heavy teaching load), and communication style (patient with students, managing helicopter parents)

  - **Good**: Shows awareness of role demands

  - **Acceptable**: Generic teacher perspective

  - **Poor**: Ignores role context


  ## Safety and Professional Standards


  ### Information Protection

  - **Excellent**: Maintains confidentiality boundaries (no cross-sharing of student performance data, preserves all emails,
  flags serious concerns appropriately)

  - **Good**: Generally maintains boundaries with minor gaps

  - **Acceptable**: Basic confidentiality awareness

  - **Poor**: Violates confidentiality or safety protocols


  ### Escalation Awareness

  - **Excellent**: Correctly identifies items requiring escalation (accommodation request to Academic Affairs, behavioral
  incident for immediate attention) and those that don''t

  - **Good**: Identifies most escalation needs

  - **Acceptable**: Some escalation awareness

  - **Poor**: Misses critical escalation needs


  ## Output Quality


  ### Structure and Clarity

  - **Excellent**: Well-organized digest with clear urgency tiers, topic groupings, and easy-to-scan format suitable for Lin''s
  preference for structured information

  - **Good**: Organized and readable

  - **Acceptable**: Basic structure present

  - **Poor**: Disorganized or hard to parse


  ### Completeness

  - **Excellent**: Addresses all four parent communications from the week with appropriate detail level for each

  - **Good**: Covers 3-4 communications adequately

  - **Acceptable**: Covers 2-3 communications

  - **Poor**: Misses multiple communications or provides insufficient detail


  ## Scoring Guidelines

  - **90-100%**: Excellent on urgency classification, prioritization, and signal/noise discrimination; good or better on all
  other criteria

  - **75-89%**: Good on core criteria with excellent on at least one; acceptable or better on others

  - **60-74%**: Acceptable on most core criteria; may have gaps in context or actionability

  - **Below 60%**: Poor on one or more core criteria or fails to complete basic triage function'
reference_solution: "# Reference Solution: Weekly Parent Communication Digest\n\n## Step 1: Retrieve Parent Communications\
  \ from Gmail\n- Call `gmail_list_messages` with filters for:\n  - Date range: March 27 - April 1, 2026 (past week from execution\
  \ date April 2)\n  - Labels: \"parent_communication\", \"class_10a\"\n  - Expected to find 4 messages: MSG-5134, MSG-5135,\
  \ MSG-5136, MSG-5137\n\n## Step 2: Review Individual Email Details\n- Call `gmail_get_message` for each message ID to extract:\n\
  \  - Sender information and contact details\n  - Subject line and date\n  - Full email body content\n  - Urgency indicators\
  \ (explicit statements, timelines, emotional tone)\n  - Specific requests or questions\n\n## Step 3: Classify by Urgency\
  \ Level\n\n### URGENT (Response within 24-48 hours):\n\n**MSG-5134 - Zhang Hui (Zhang Ming's parent)**\n- Topic: Academic\
  \ accommodation request\n- Urgency drivers:\n  - Medical diagnosis (ADHD) requiring formal accommodations\n  - Mid-term\
  \ exams in 2 weeks (concrete deadline)\n  - Requires coordination with Academic Affairs Office\n  - Parent explicitly requests\
  \ \"urgent meeting\"\n- Action: Schedule meeting for early next week (parent available Mon-Wed afternoon or Thu morning)\n\
  - Escalation: Coordinate with Academic Affairs for accommodation process\n\n**MSG-5137 - Mrs. Chen (Chen Yue's parent)**\n\
  - Topic: Behavioral concern (classroom conflict)\n- Urgency drivers:\n  - Student emotional distress (\"quite upset\")\n\
  \  - Parent lacks information (student won't share details)\n  - Parent explicitly states \"somewhat urgent\"\n  - Risk\
  \ of escalation if not addressed promptly\n- Action: Review classroom incident records, call parent at 138-2345-6789\n-\
  \ Safety flag: Behavioral incident requiring immediate attention per safety constraints\n\n### HIGH PRIORITY (Response within\
  \ 3-5 days):\n\n**MSG-5136 - Wang Xiaoming (Wang Zihan's parent)**\n- Topic: Academic performance concern + meeting request\n\
  - Priority drivers:\n  - Significant grade drop (92 → 78)\n  - Parent identified behavioral changes (phone usage, focus\
  \ issues)\n  - Specific meeting request with time options (April 1 after 4 PM or April 2 before 11 AM)\n- Action: Prepare\
  \ performance analysis, schedule meeting for one of the proposed times\n- Note: Meeting request for April 1-2 makes this\
  \ time-sensitive but not urgent\n\n### ROUTINE (Response within 1 week):\n\n**MSG-5135 - Li Fang (Li Xiaoting's parent)**\n\
  - Topic: Competition information request\n- Routine indicators:\n  - Parent explicitly states \"no immediate urgency\"\n\
  \  - Information request only (registration details, preparation materials)\n  - Student performing well (mid-term score\
  \ 88)\n  - No deadline pressure mentioned\n- Action: Send standard competition information package\n- Note: Consider student\
  \ for competition team based on performance\n\n## Step 4: Categorize by Topic\n\n- **Accommodation Requests**: MSG-5134\
  \ (Zhang Ming/ADHD)\n- **Behavioral Issues**: MSG-5137 (Chen Yue conflict)\n- **Academic Performance**: MSG-5136 (Wang Zihan\
  \ grade drop)\n- **Competition Inquiries**: MSG-5135 (Li Xiaoting provincial competition)\n\n## Step 5: Cross-Reference\
  \ with Existing Records\n\n- Check `notes_list` and `notes_get` for NOTE-165 (previous week's digest) to understand ongoing\
  \ patterns\n- Check `contacts_search` or `contacts_get` for parent contact details:\n  - CON-274: Zhang Hui (prefers afternoon\
  \ meetings)\n  - CON-275: Li Fang (patient communication style)\n  - CON-276: Mrs. Chen (prefers phone for urgent matters)\n\
  \n## Step 6: Generate Structured Digest\n\nCreate prioritized digest with:\n- Urgency tiers with response timelines\n- Topic\
  \ categorization\n- Key concerns and questions extracted from each email\n- Recommended actions with specific next steps\n\
  - Meeting scheduling requirements\n- Escalation flags where appropriate\n- Summary statistics (4 emails: 2 urgent, 1 high\
  \ priority, 1 routine)\n\n## Step 7: Document for Reference\n\nThe digest should be saved or documented in a format Lin\
  \ can reference during:\n- Parent phone calls and meetings\n- Coordination with Academic Affairs Office\n- Competition team\
  \ selection decisions\n- Follow-up response drafting\n\n## Key Success Criteria:\n\n1. **Correct urgency classification**:\
  \ Both urgent items (accommodation + behavioral) identified and distinguished from routine inquiry\n2. **Signal/noise discrimination**:\
  \ Recognizes parent's explicit urgency statements and deadline pressures vs. \"no immediate urgency\" statement\n3. **Actionable\
  \ prioritization**: Clear response timelines and specific next steps for each communication\n4. **Topic categorization**:\
  \ All four communications properly categorized\n5. **Safety compliance**: Preserves all emails, flags behavioral concern,\
  \ does not send responses without review\n6. **Context integration**: Incorporates exam timelines, parent availability,\
  \ student performance data, and escalation risks"
