judge_rubric: 'Award full marks if the response: (1) correctly identifies all five hard calendar conflicts (April 8-9 training
  camp, April 11 PM physiotherapy, April 14 PM team drills, April 15 AM video analysis, April 16 qualification meet), (2)
  accurately calculates remaining quota as 11.5 hours from the 20-hour allocation minus 8.5 hours consumed, (3) determines
  that only Slots A, D, F, and G are feasible (eliminating B due to same-day rule, C due to training camp, E due to physiotherapy
  overlap, H due to competition conflict and minimum duration), (4) recommends booking all four feasible slots (A+D+F+G totaling
  11 hours) as the optimal combination that maximizes training value while staying within quota limits and respecting all
  buffer time requirements, and (5) acknowledges the April 4th response deadline. Award partial credit for: identifying most
  conflicts but missing 1-2 (60-80%), correct quota calculation but suboptimal slot selection (50-70%), or identifying feasible
  slots but failing to optimize the combination (40-60%). Award minimal credit (20-40%) if the response shows constraint awareness
  but makes critical errors in conflict detection or quota calculation. Award near-zero if the response recommends slots that
  violate hard constraints (mandatory team sessions, quota limits, or safety buffer rules).'
reference_solution: 'Step 1: Retrieve facility booking email (MSG-5047) to get all eight proposed time slots (A through H)
  with durations and facility rules (2.5h minimum session, 2h buffer between bookings, no same-day back-to-back). Step 2:
  Check calendar events to identify hard conflicts: EVT-354 (April 8-9 altitude training camp blocks Slot C), EVT-355 (April
  11 14:00-15:30 physiotherapy overlaps Slot E), EVT-356 (April 14 13:00-18:00 team drills blocks afternoon but Slot F ends
  11:30 so feasible), EVT-357 (April 15 08:00-12:00 video analysis blocks morning but Slot G is afternoon so feasible), EVT-358
  (April 16 qualification meet blocks Slot H). Step 3: Retrieve coach email (MSG-5048) confirming priority blocks align with
  calendar conflicts. Step 4: Query finance records to calculate quota: TXN-6024 shows 20-hour allocation purchased, TXN-6027
  shows 3 hours consumed in March; cross-reference NOTE-129 which documents total 8.5 hours consumed (Feb 8: 3h, Feb 22: 2.5h,
  Mar 12: 3h), leaving 11.5 hours remaining. Step 5: Apply constraint satisfaction logic: Slot A (3h, April 7 AM) - feasible;
  Slot B (2.5h, April 7 PM) - violates same-day rule with A; Slot C (3h, April 9) - conflicts with training camp; Slot D (2.5h,
  April 11 AM) - feasible, ends 10:30 before 14:00 physiotherapy; Slot E (3h, April 11 PM) - overlaps physiotherapy; Slot
  F (2.5h, April 14 AM) - feasible, ends 11:30 before 13:00 team drills; Slot G (3h, April 15 PM) - feasible, starts 14:00
  after 12:00 video analysis; Slot H (2h, April 16) - conflicts with competition AND below 2.5h minimum. Step 6: Evaluate
  combinations of feasible slots A, D, F, G: all four slots total 11 hours (3+2.5+2.5+3), which is within 11.5-hour quota
  and maximizes training value. All slots are on different days so buffer rules satisfied. Step 7: Compose booking confirmation
  selecting Slots A, D, F, and G, noting this uses 11 of 11.5 available hours and meets the April 4th deadline.'
primary_dimensions:
- completion
- robustness
