judge_rubric: '# Evaluation Rubric for Post-Competition Email Triage


  ## Excellent (0.9-1.0)

  - Correctly categorizes all emails by cognitive load (high: equipment purchase, sponsorship contract, coach debrief; low:
  appointment confirmations, routine admin)

  - Explicitly recognizes post-competition fatigue as a constraint on decision-making quality

  - Defers all high-cognitive tasks (equipment purchase, sponsorship evaluation, technical debrief) to specific post-recovery
  time windows (April 10-11)

  - Identifies immediate low-cognitive actions (physio confirmation) safe for fatigued state

  - Recognizes delegation opportunities (media interview to team liaison) to preserve mental energy

  - References Zhou Ran''s Olympic qualification priority as the organizing principle for energy allocation

  - Provides clear execution timeline distinguishing immediate vs. deferred vs. delegated actions

  - Demonstrates understanding that impaired judgment during fatigue could lead to poor financial/strategic decisions


  ## Good (0.7-0.89)

  - Correctly identifies most high-cognitive vs. low-cognitive tasks

  - Recognizes need to defer complex decisions but may lack specific energy-window scheduling

  - Identifies some delegation opportunities

  - May not fully articulate the connection between post-competition fatigue and decision quality

  - Provides reasonable prioritization but may miss some nuances (e.g., coach''s explicit suggestion to defer meeting)


  ## Adequate (0.5-0.69)

  - Distinguishes urgent from non-urgent emails but may not explicitly categorize by cognitive load

  - Recognizes Zhou Ran is tired but doesn''t systematically use energy state as a scheduling constraint

  - May suggest handling some high-cognitive tasks immediately despite fatigue risk

  - Misses some delegation opportunities

  - Prioritization is partially correct but lacks strategic energy management framework


  ## Poor (0.3-0.49)

  - Basic email categorization (e.g., by sender type) but fails to assess cognitive load requirements

  - Does not recognize post-competition fatigue as a constraint on task scheduling

  - Treats all tasks as equally suitable for immediate action regardless of mental energy required

  - Misses most delegation opportunities

  - No clear execution timeline or energy-based scheduling strategy


  ## Unacceptable (0.0-0.29)

  - Fails to meaningfully categorize or prioritize emails

  - Does not recognize the core challenge of managing cognitive load during recovery

  - Suggests making high-stakes decisions (equipment purchase, contract signing) during fatigued state

  - No delegation strategy

  - Output does not demonstrate understanding of the task''s energy management dimension'
reference_solution: "# Reference Solution: Post-Competition Email Triage\n\n## Step 1: Assess Current State and Retrieve Information\n\
  1. Call `notes_get` with note_id=\"NOTE-171\" to retrieve the comprehensive email triage strategy that Zhou Ran has already\
  \ prepared\n2. Call `gmail_list_messages` with filters for unread emails to identify all pending messages\n3. Call `calendar_list_events`\
  \ to understand Zhou Ran's recovery schedule (physiotherapy April 8 & 10 at 9:00 AM, light training April 7 afternoon 2:00-4:00\
  \ PM)\n4. Call `todo_list_tasks` to see existing task items (TODO-505: sponsorship review due April 12; TODO-506: equipment\
  \ decision due April 10)\n\n## Step 2: Categorize Emails by Cognitive Load\n\n**HIGH-COGNITIVE (defer to peak energy windows):**\n\
  - MSG-5121 (Equipment Sales): Olympic Edition racing spikes purchase decision (¥6,800)\n  - Requires: Cost-benefit analysis,\
  \ performance evaluation, adaptation timing assessment\n  - Deadline: April 10th\n  - Schedule for: April 10th afternoon\
  \ (post-morning physiotherapy)\n  \n- MSG-5124 (Sponsorship): VitaEnergy partnership proposal (¥15,000 quarterly)\n  - Requires:\
  \ Contract evaluation, time commitment analysis, strategic alignment assessment\n  - Deadline: April 12th\n  - Schedule\
  \ for: April 11th afternoon (peak recovery period)\n  \n- MSG-5126 (Coach Liu): Technical debrief and training adjustment\
  \ discussion\n  - Requires: Full focus, strategic input, performance analysis\n  - Coach explicitly suggests post-recovery\
  \ scheduling (April 10 or 11)\n  - Schedule for: April 11th 10:00-11:30 AM (coach's preferred time)\n\n**LOW-COGNITIVE (safe\
  \ for immediate action):**\n- Physiotherapy appointment confirmations (if present in unread emails)\n  - Action: Send brief\
  \ confirmation today\n- Routine administrative notices\n  - Action: Quick acknowledgment or add to todo for later\n\n**DELEGATION\
  \ OPPORTUNITIES:**\n- Media interview requests\n  - Action: Forward to team media liaison using `contacts_search` to find\
  \ media.liaison@nationalteam.cn\n  - Rationale: Standard protocol, preserves Zhou Ran's energy for training-critical activities\n\
  \n## Step 3: Create Execution Plan\n\n**IMMEDIATE (April 7 - current fatigued state):**\n- Confirm physiotherapy appointments\
  \ (low-cognitive)\n- Delegate media coordination to team liaison (low-cognitive)\n- Acknowledge routine administrative items\
  \ (low-cognitive)\n\n**DEFERRED TO PEAK ENERGY WINDOWS:**\n- April 10th afternoon: Review equipment purchase decision after\
  \ morning physiotherapy\n- April 11th 10:00-11:30 AM: Coach technical debrief (as suggested by Coach Liu)\n- April 11th\
  \ 2:00-4:00 PM: Evaluate sponsorship proposal with full strategic focus\n\n**CALENDAR UPDATES:**\n- Call `calendar_create_event`\
  \ to block April 10th afternoon for equipment decision review\n- Call `calendar_create_event` to confirm April 11th 10:00-11:30\
  \ AM coach meeting\n- Call `calendar_create_event` to block April 11th 2:00-4:00 PM for sponsorship evaluation\n\n**TODO\
  \ UPDATES:**\n- Call `todo_update_task` for TODO-505 to add note: \"Scheduled for April 11 afternoon peak energy window\"\
  \n- Call `todo_update_task` for TODO-506 to add note: \"Scheduled for April 10 afternoon post-physio recovery\"\n\n## Step\
  \ 4: Output Structured Triage Summary\n\nProvide Zhou Ran with:\n1. **Energy State Assessment**: Post-competition fatigue\
  \ recognized; high-cognitive decisions deferred to protect decision quality\n2. **Immediate Actions** (today, April 7):\
  \ Low-cognitive confirmations and delegations only\n3. **Deferred High-Cognitive Tasks**: Equipment purchase (April 10 afternoon),\
  \ sponsorship evaluation (April 11 afternoon), coach debrief (April 11 morning)\n4. **Delegation Actions**: Media interview\
  \ forwarded to team liaison\n5. **Rationale**: Olympic qualification priority requires preserving mental energy for training-critical\
  \ decisions; financial and strategic commitments should not be made during impaired judgment periods\n6. **Calendar Blocks**:\
  \ Specific time windows scheduled during peak recovery periods for deferred decisions\n\n## Key Principles Applied\n- **Cognitive\
  \ Load Matching**: High-stakes decisions (¥6,800 equipment, ¥15,000 sponsorship) require peak mental state\n- **Fatigue\
  \ Recognition**: Post-competition exhaustion is a real constraint on judgment quality\n- **Strategic Energy Allocation**:\
  \ Preserve mental energy for Olympic qualification training cycle\n- **Delegation for Efficiency**: Routine coordination\
  \ tasks (media) handled by appropriate team members\n- **Temporal Scheduling**: Align high-cognitive work with physiological\
  \ recovery timeline (post-April 10 physiotherapy sessions)"
