execution_date: '2026-04-02'
prompt:
  text: The blast chiller just died and I need to decide between repair and rental options before the spring menu preview
    on April 23rd. Help me figure out which option makes the most sense given the testing timeline and what's at stake with
    this event.
  language: en
scoring_components:
- name: Identifies rental as optimal decision
  weight: 0.4
  check:
    type: keywords_present
    keywords:
    - - rental
      - rent
      - renting the unit
    - - recommend rental
      - go with rental
      - rental option
      - choose rental
