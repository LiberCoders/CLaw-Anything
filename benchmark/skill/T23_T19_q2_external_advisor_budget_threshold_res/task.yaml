judge_rubric: '# Evaluation Rubric


  ## Constraint Satisfaction (Primary Criterion)

  The agent must demonstrate hard-constraint compliance before soft optimization:


  **Hard Constraints (must ALL be satisfied):**

  1. **Threshold restoration**: Proposed substitute services must bring Q2 external advisor spend to ≥ SEK 800k (starting
  from SEK 675k after Virtanen reallocation)

  2. **Vendor compliance**: All substitute services must be from Q2 pre-qualified vendor list per KB-419 (CIP AB, Nordic Synergy
  Analytics, Bergman & Partners, Nordic Strategy Advisors, EcoCompliance Nordic)

  3. **Budget code eligibility**: Substitute services must be chargeable to `external_advisor` budget code (strategic advisory,
  competitive intelligence, M&A diligence, integration planning, organizational consulting — NOT legal compliance, audit,
  or IT)

  4. **Timeline preservation**: Solution must NOT trigger the 4-week Finance reprocessing delay that would miss April 10 Finnish
  Competition Authority filing deadline

  5. **Authority boundaries**: Solution must stay within Sven''s approval authority (individual engagements < SEK 200k) OR
  explicitly request CFO approval for overages

  6. **Hard cap compliance**: Total Q2 external advisor spend after substitution must NOT exceed SEK 1.25M hard cap


  **Soft Optimization Criteria (evaluate only after hard constraints satisfied):**

  1. **Strategic alignment**: Do substitute services align with active strategic priorities (Aurora, Portfolio Review, TransLog,
  Org Restructuring)?

  2. **Financial efficiency**: What is the net incremental cost after accounting for discount savings (SEK 96k)?

  3. **Timeline risk**: Do substitute services introduce delivery delays that could impact board materials deadlines (e.g.,
  May 7)?

  4. **Stakeholder value**: Do services address documented friction points (e.g., Henrik Andersson''s org restructuring concerns)?

  5. **CFO approval likelihood**: Given Anna Karlsson''s explicit mandate for Q2 budget discipline, how likely is approval?


  ## Decision Documentation Quality

  Per Sven''s quality focus, every recommendation must include:

  1. **One-page rationale**: Clear explanation of why the chosen option satisfies constraints and optimizes strategic value

  2. **"What would change my mind" section**: Explicit criteria that would trigger a decision reversal (e.g., board deprioritizes
  TransLog, Henrik''s concerns resolved via alternative means)

  3. **Financial impact summary**: Substitute cost, discount savings preserved, net incremental cost

  4. **Risk assessment**: Timeline risks, compliance risks, stakeholder risks


  ## Scoring Tiers

  - **Excellent (0.9-1.0)**: Correctly identifies Option C (split engagement: TransLog SEK 75k + Org Restructuring SEK 55k)
  as optimal solution. Demonstrates all hard constraints satisfied, calculates net financial impact (SEK 34k incremental cost
  vs. SEK 96k discount preserved), explains strategic rationale (portfolio diversification, no timeline risk, addresses Henrik''s
  concerns), and documents "what would change my mind" criteria. Verifies vendor compliance with KB-419.

  - **Good (0.7-0.89)**: Identifies a valid substitute solution that satisfies all hard constraints (threshold, vendor list,
  budget code, timeline, authority, hard cap) and calculates financial impact correctly, but may choose Option A or B instead
  of optimal Option C, or lacks complete "what would change my mind" documentation.

  - **Adequate (0.5-0.69)**: Identifies the threshold problem and proposes substitute services, but makes minor errors in
  financial calculation (e.g., forgets to account for discount savings) or vendor compliance verification. Hard constraints
  still satisfied.

  - **Poor (0.3-0.49)**: Proposes a solution that violates one hard constraint (e.g., chooses non-pre-qualified vendor, exceeds
  Sven''s approval authority without requesting CFO approval, or miscalculates threshold gap).

  - **Failing (0.0-0.29)**: Proposes a solution that violates multiple hard constraints, recommends reversing the Virtanen
  invoice (triggering filing deadline miss), or fails to recognize the threshold problem entirely.


  ## Red Flags (automatic score reduction)

  - Recommends reversing TXN-6056 (Virtanen invoice) despite April 10 filing deadline risk: -0.3

  - Proposes services from non-pre-qualified vendors without CFO waiver: -0.2

  - Exceeds SEK 1.25M Q2 hard cap: -0.4 (critical compliance violation)

  - Fails to request CFO approval for individual engagements > SEK 200k (exceeds Sven''s authority): -0.2

  - Proposes services ineligible for `external_advisor` budget code (e.g., legal compliance, audit): -0.3'
reference_solution: "# Reference Solution\n\n## Step 1: Verify Q2 External Advisor Budget Status\n**Action**: Call `finance_list_transactions`\
  \ with category filter `external_advisor` and date range Q2 2026 (April 1 - June 30)\n\n**Key findings**:\n- TXN-6056: Lakitoimisto\
  \ Virtanen Oy, SEK 125,000, dated 2026-03-18, description indicates MISALLOCATED (should be `legal_compliance` budget code)\n\
  - TXN-6057: Q2 External Advisor Budget Reserve, SEK 675,000, dated 2026-04-01, represents current allocation after Aurora\
  \ synergy analysis, portfolio benchmarking Phase 1, and TransLog preliminary diligence\n\n**Calculation**: Current Q2 external\
  \ advisor spend = SEK 675,000 (after removing misallocated Virtanen invoice). This is SEK 125,000 below the SEK 800,000\
  \ threshold required for 12% volume discount.\n\n## Step 2: Retrieve Volume Discount Policy\n**Action**: Call `kb_get_article`\
  \ with article_id \"KB-419\" (Q2 External Advisor Volume Discount Threshold Policy)\n\n**Key findings**:\n- Minimum spend\
  \ threshold: SEK 800,000 total across all Q2 external advisor engagements\n- Discount rate: 12% applied retroactively to\
  \ ALL Q2 advisory services once threshold is met\n- Eligible categories: strategic advisory, competitive intelligence, M&A\
  \ diligence, integration planning, organizational consulting\n- Excluded categories: legal compliance, audit services, IT\
  \ consulting\n- Approved vendors (Q2 2026): CIP AB, Nordic Synergy Analytics AB, Bergman & Partners, Nordic Strategy Advisors\
  \ AB, EcoCompliance Nordic AB\n\n**Implication**: Need to add SEK 125,000-150,000 in substitute advisory services from approved\
  \ vendors to re-trigger threshold and preserve ~SEK 96,000 discount savings (12% of SEK 800k).\n\n## Step 3: Review Active\
  \ Strategic Priorities in Notion\n**Action**: Call `claw_notion_get_page` with page_id \"NPAG-68\" (Q2 External Advisor\
  \ Budget Triage workspace)\n\n**Expected context**: Active strategic priorities include Project Aurora (M&A integration),\
  \ Portfolio Review (BU competitive positioning), TransLog (M&A pipeline diligence), and Org Restructuring (cross-BU alignment).\
  \ Henrik Andersson (BU 4 GM) has raised concerns about org restructuring proposal in recent steering committee minutes.\n\
  \n## Step 4: Evaluate Substitute Options\n**Three candidate options**:\n\n### Option A: CIP AB Portfolio Benchmarking Phase\
  \ 2 Scope Expansion (+SEK 135k)\n- **Strategic value**: HIGH (board explicitly requested deeper competitive intelligence)\n\
  - **Timeline risk**: 10-day delivery delay may push insights past board materials deadline (May 7)\n- **Vendor compliance**:\
  \ CIP AB is Q2 pre-qualified per KB-419 ✓\n- **Budget code**: Strategic advisory, eligible for `external_advisor` ✓\n- **Financial\
  \ impact**: SEK 135k substitute cost, SEK 96k discount preserved, SEK 39k net incremental cost\n- **Threshold satisfaction**:\
  \ SEK 675k + SEK 135k = SEK 810k ≥ SEK 800k ✓\n\n### Option B: Nordic Synergy Analytics Aurora Integration Roadmap (+SEK\
  \ 140k)\n- **Strategic value**: MEDIUM (board-requested but non-critical-path, can defer to Q3)\n- **Timeline risk**: None\
  \ (not time-sensitive)\n- **Vendor compliance**: Nordic Synergy Analytics is Q2 pre-qualified per KB-419 ✓\n- **Budget code**:\
  \ Integration planning, eligible for `external_advisor` ✓\n- **Financial impact**: SEK 140k substitute cost, SEK 96k discount\
  \ preserved, SEK 44k net incremental cost\n- **Threshold satisfaction**: SEK 675k + SEK 140k = SEK 815k ≥ SEK 800k ✓\n\n\
  ### Option C: Split Engagement (TransLog + Org Restructuring)\n- **Component 1**: TransLog preliminary market assessment\
  \ (+SEK 75k, Bergman & Partners)\n  - Supports potential Q3 diligence acceleration\n  - Vendor compliance: Bergman & Partners\
  \ is Q2 pre-qualified per KB-419 ✓\n  - Budget code: M&A diligence, eligible for `external_advisor` ✓\n- **Component 2**:\
  \ Org Restructuring stakeholder workshop facilitation (+SEK 55k, Nordic Strategy Advisors)\n  - Addresses Henrik Andersson's\
  \ concerns documented in steering committee minutes\n  - Vendor compliance: Nordic Strategy Advisors is Q2 pre-qualified\
  \ per KB-419 ✓\n  - Budget code: Organizational consulting, eligible for `external_advisor` ✓\n- **Strategic value**: HIGH\
  \ (portfolio diversification, proactive stakeholder management)\n- **Timeline risk**: None (no critical-path deliverables\
  \ affected)\n- **Financial impact**: SEK 130k substitute cost, SEK 96k discount preserved, SEK 34k net incremental cost\n\
  - **Threshold satisfaction**: SEK 675k + SEK 130k = SEK 805k ≥ SEK 800k ✓\n\n## Step 5: Recommendation and Decision Documentation\n\
  **Recommended option**: Option C (Split Engagement)\n\n**Rationale**:\n1. **Portfolio diversification**: Addresses two active\
  \ strategic priorities (TransLog M&A pipeline, Org Restructuring stakeholder alignment) vs. single-focus Options A/B\n2.\
  \ **No timeline risk**: Unlike Option A Phase 2 scope expansion (10-day delay risk to board materials), Option C has no\
  \ critical-path deliverables\n3. **Proactive stakeholder management**: Directly addresses Henrik Andersson's org restructuring\
  \ concerns flagged in steering committee minutes\n4. **Lowest net incremental cost**: SEK 34k vs. SEK 39k (Option A) or\
  \ SEK 44k (Option B)\n5. **Vendor compliance**: Both Bergman & Partners and Nordic Strategy Advisors are Q2 pre-qualified\
  \ per KB-419\n6. **Authority boundaries**: Both engagements (SEK 75k, SEK 55k) are below Sven's SEK 200k approval threshold;\
  \ combined SEK 130k requires CFO approval as budget reallocation\n\n**\"What Would Change My Mind\" Criteria**:\n- If board\
  \ explicitly deprioritizes TransLog pipeline development → revert to Option B (Aurora integration roadmap)\n- If Henrik's\
  \ org restructuring concerns are resolved via alternative means (e.g., direct CEO intervention) → revert to Option B\n-\
  \ If either vendor cannot deliver fixed-price quotes with no scope creep risk → escalate to CFO for Option A/B fallback\
  \ approval\n\n## Step 6: Document Decision in Notion\n**Action**: Call `claw_notion_create_page` or `claw_notion_append_blocks`\
  \ to create decision log entry under NPAG-68 (Q2 External Advisor Budget Triage workspace)\n\n**Content structure** (as\
  \ shown in signal record NPAG-70):\n- Problem Statement: Virtanen invoice misallocation, threshold drop from SEK 800k to\
  \ SEK 675k, SEK 96k discount at risk\n- Constraint: 4-week Finance reprocessing delay would miss April 10 filing deadline\n\
  - Options Evaluated: A, B, C with strategic value, timeline risk, vendor compliance, financial impact\n- Decision Rationale:\
  \ Portfolio diversification, no timeline risk, addresses Henrik's concerns, lowest net cost\n- Financial Impact: SEK 130k\
  \ substitute cost, SEK 96k discount preserved, SEK 34k net incremental cost\n- \"What Would Change My Mind\": Board deprioritizes\
  \ TransLog OR Henrik concerns resolved via alternative means\n- Next Actions: Obtain fixed-price quotes from Bergman & Partners\
  \ (SEK 75k) and Nordic Strategy Advisors (SEK 55k) by April 7; coordinate Henrik availability with Eva Lindholm; copy CFO\
  \ on final vendor agreements\n\n## Step 7: Draft CFO Approval Request\n**Action**: Call `workmail_send_message` to anna.karlsson@vasaholm.se\n\
  \n**Subject**: URGENT: Q2 External Advisor Budget Threshold Rescue - CFO Approval Request\n\n**Body structure** (as shown\
  \ in signal record WMSG-5136):\n- Problem: Virtanen invoice misallocation, threshold drop, discount at risk\n- Financial\
  \ Impact: SEK 96k discount savings vs. SEK 34k net incremental cost\n- Proposed Solution: Option C (TransLog SEK 75k + Org\
  \ Restructuring SEK 55k)\n- Recommendation Rationale: Portfolio diversification, no timeline risk, addresses Henrik's concerns,\
  \ vendor compliance\n- Decision Criteria: \"What would change my mind\" section\n- Request: CFO approval to proceed with\
  \ Option C by EOD Friday April 4 for vendor contracting next week\n\n## Step 8: Create Follow-Up Tasks\n**Action**: Call\
  \ `todo_create_task` for each next action:\n- TODO-643: Obtain fixed-price quote from Bergman & Partners for TransLog market\
  \ assessment (SEK 75k) by April 7\n- TODO-644: Coordinate Henrik Andersson availability for org restructuring workshop (week\
  \ of April 14) with Eva Lindholm by April 7\n- TODO-645: Obtain fixed-price quote from Nordic Strategy Advisors for workshop\
  \ facilitation (SEK 55k) by April 7\n\n## Expected Outcome\nCFO Anna Karlsson approves Option C (as shown in signal record\
  \ WMSG-5137), with conditions:\n1. Document decision in Notion decision log with explicit \"what would change my mind\"\
  \ criteria\n2. Ensure both vendors provide fixed-price quotes with no scope creep risk\n3. Copy CFO on final vendor agreements\
  \ for audit trail\n\nFinance will leave TXN-6056 as-is (no reprocessing) and add manual journal entry reclassifying to `legal_compliance`\
  \ for Q2 reporting, preserving April 10 filing timeline."
