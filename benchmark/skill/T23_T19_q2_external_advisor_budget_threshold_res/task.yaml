    should be legal compliance, not external advisor. If we move it, we'll drop below the SEK 800k threshold for our Q2 volume
    discount (which saves us about SEK 96k). But reversing the invoice would delay our Finnish Competition Authority filing
    past the April 10 deadline. Can you figure out how to keep the discount without creating a compliance or timeline mess?
  language: en
