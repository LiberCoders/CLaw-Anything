execution_date: '2026-04-02'
prompt:
  text: I've got a major trauma activation at Royal London at 12:45 today (April 2nd) and my Wellington private session this
    afternoon. Help me figure out what to do.
  language: en
scoring_components:
- name: Identified locum availability as substitution mechanism
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - Richard Blackwell
      - Blackwell
      - locum consultant
    - - 45 min
      - 45-minute
      - 45min
      - fast response
    - - £600
      - 600 GBP
      - locum cost
- name: Analyzed Wellington contract force majeure vs penalty structure
  weight: 0.3
  check:
    type: keywords_present
    keywords:
    - - force majeure
      - Section 6.3
      - medical emergency exemption
    - - £15,000
      - '15000'
      - contract penalty
      - Q1 breach
    - - 11 sessions
      - 12 minimum
      - session 11
      - critical for compliance
- name: Assessed consequence irreversibility and substitutability tradeoff
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - substitutable
      - substitutability
      - locum can cover
      - backup available
    - - irreversible
      - cannot be replaced
      - no coverage
      - contractual obligation
    - - Priority 1
      - vascular injury
      - trauma patient
      - clinical urgency
- name: Executed decision with compensation plan
  weight: 0.4
  check:
    type: keywords_present
    keywords:
    - - authorize locum
      - contact Blackwell
      - emergency locum activation
      - locum request
    - - brief Dr. Patel
      - handover
      - registrar stabilize
      - initial resus
    - - Wellington session
      - honor commitment
      - maintain contract
      - attend private practice
- name: Queried calendar for recent NHS vs Wellington session distribution
  weight: 0.15
  check:
    type: tool_called
    tool_name: calendar_list_events
    min_calls: 1
- name: Retrieved Wellington contract terms from notes or workmail
  weight: 0.15
  check:
    type: tool_called
    tool_name: notes_get
    min_calls: 1
- name: Accessed locum consultant contact information
  weight: 0.1
  check:
    type: tool_called
    tool_name: contacts_search
