execution_date: '2026-04-08'
prompt:
  text: I've been paying for ColorWave Premium for a few months now, and I'm wondering if I should downgrade to their Basic
    tier. Can you help me figure out what makes sense going forward?
  language: en
scoring_components:
- name: Identified sunk cost fallacy and forward-looking framing
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - sunk cost
      - already spent
      - unrecoverable
      - past payments
    - - forward-looking
      - going forward
      - April onward
      - future costs
