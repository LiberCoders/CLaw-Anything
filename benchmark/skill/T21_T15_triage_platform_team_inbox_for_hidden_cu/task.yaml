execution_date: '2026-04-05'
prompt:
  text: I need to catch up on the platform-team inbox from the past two days. Can you help me triage what needs attention
    and route anything urgent?
  language: en
scoring_components:
- name: Identified DataSync Solutions escalation as critical priority
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - DataSync Solutions
      - DataSync
      - CUS-105
      - CUS-111
    - - escalation
      - urgent
      - critical
      - churn risk
      - churn threat
    - - production-blocking
      - production blocking
      - ETL pipeline
      - API rate limit
      - rate limit errors
- name: Detected contradiction between dashboard status and email signals
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - contradiction
      - contradicts
      - mismatch
      - discrepancy
      - doesn't reflect reality
    - - stable
      - dashboard shows stable
      - CRM status
      - health dashboard
    - - hidden
      - buried
      - missed signal
      - not reflected
- name: Escalated to appropriate leadership (VP Customer Success and Engineering)
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - David Torres
      - VP Customer Success
      - customer success leadership
    - - Priya Sharma
      - VP Engineering
      - engineering leadership
    - - escalate
      - escalation
      - immediate escalation
      - urgent escalation
- name: Updated Notion churn-risk tracking with audit trail
  weight: 0.2
  check:
    type: keywords_present
    keywords:
    - - Notion
      - NPAG-8
      - churn risk tracking
      - churn-risk tracking
      - Customer Escalations
    - - update
      - updated
      - document
      - documented
      - audit trail
- name: Retrieved platform-team Workmail messages
  weight: 0.15
  check:
    type: tool_called
    tool_name: workmail_list_messages
    min_calls: 1
- name: Cross-referenced CRM customer record
  weight: 0.15
  check:
    type: tool_called
    tool_name: crm_get_customer
    min_calls: 1
- name: Verified CSM identity via contacts
  weight: 0.1
  check:
    type: tool_called
    tool_name: contacts_search
    min_calls: 1
- name: Retrieved customer interview notes for corroboration
  weight: 0.1
  check:
    type: tool_called
    tool_name: notes_get
    min_calls: 1
safety_checks: []
expected_actions:
- service: workmail
  action_key: list_messages_platform_team_inbox
  required: true
- service: workmail
  action_key: get_escalation_messages
  required: true
- service: contacts
  action_key: verify_csm_identity
  required: true
- service: crm
  action_key: get_datasync_customer_record
  required: true
- service: notes
  action_key: retrieve_q1_interview_notes
  required: true
- service: claw_notion
  action_key: update_churn_risk_tracking_page
  required: true
- service: workmail
  action_key: send_escalation_acknowledgment
  required: true
judge_rubric: 'Award full marks if the agent: (1) correctly identifies the DataSync Solutions escalation emails (WMSG-5045,
  WMSG-5046) as the highest priority signal requiring immediate action, not routine triage; (2) explicitly recognizes the
  contradiction between the CRM ''stable'' status and the urgent churn-risk reality conveyed in Elena Martinez''s emails;
  (3) assesses credibility by verifying Elena''s CSM role via contacts and cross-referencing customer tier/history in CRM;
