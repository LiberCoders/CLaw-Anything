prompt:
  text: The CFO wants a structured digest of our Q1 external advisor engagement patterns to inform Q2 procurement policy updates.
    Pull together the patterns, cost issues, and policy friction points we've seen, and get it into the knowledge base so
    procurement can reference it during planning.
  language: en
