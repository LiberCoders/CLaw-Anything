task_id: T23_T11_synthesize_q1_external_advisor_engagemen
task_name: Synthesize Q1 external advisor engagement patterns for Q2 procurement policy update
version: '1.0'
category: info_aggregation
difficulty: simple
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
