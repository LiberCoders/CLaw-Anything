judge_rubric: '# LLM Judge Rubric: Q1 External Advisor Engagement Digest


  ## Structural Completeness (25 points)

  - Does the digest include all required sections: engagement taxonomy, cost benchmarks, vendor performance variance, policy
  violation patterns, and Q2 recommendations?

  - Is the information organized in a structured, scannable format suitable for CFO and procurement team reference?

  - Are appropriate knowledge base tags applied (procurement, external-advisors, finance-governance, Q1-retrospective)?


  ## Cross-Source Synthesis (30 points)

  - Does the digest integrate evidence from multiple sources: finance transactions, Workmail correspondence, Gmail vendor
  proposals, Notion decision logs, and existing KB procurement policies?

  - Are patterns identified across sources rather than simply listing individual incidents?

  - Does the synthesis reveal non-obvious connections (e.g., restricted vendor list violations correlating with specific engagement
  types or BU units)?


  ## Analytical Rigor (25 points)

  - Are cost patterns quantified with specific benchmarks (e.g., SEK ranges, average engagement sizes, variance across vendor
  types)?

  - Are policy friction points backed by concrete examples from decision logs or correspondence?

  - Does each Q2 recommendation include explicit rationale and a "what would change my mind" section per Sven''s quality standard?

  - Are vendor-specific details appropriately anonymized if the KB article will be visible to non-finance staff?


  ## Actionability for Q2 Planning (15 points)

  - Are recommendations tactical and implementable within Q2 procurement policy revision cycle?

  - Do recommendations address root causes identified in the pattern analysis?

  - Are any discovered restricted vendor list violations or authority ceiling breaches flagged for CFO escalation before publication?


  ## Audit Trail Integrity (5 points)

  - Does the agent preserve historical decision log entries without modification?

  - Is vendor confidentiality respected in the published digest?

  - Are cross-references to related KB articles (e.g., KB-401, KB-402, KB-403) added appropriately without deleting existing
  content?


  **Scoring**: Award full points in each category if criteria are fully met, partial credit for incomplete execution, and
  zero if the category is not addressed.'
reference_solution: "# Reference Solution: Q1 External Advisor Engagement Digest\n\n## Step 1: Query Q1 Finance Transactions\n\
  - Call `finance_list_transactions` with date range 2026-01-01 to 2026-03-31, filter for external advisor categories (consulting,\
  \ legal, technical advisory)\n- Extract engagement patterns: recurring vs. one-off, cost distribution by vendor type, invoices\
  \ approaching or exceeding SEK 200k threshold\n- Identify any invoices flagged for CFO review or budget overruns\n\n## Step\
  \ 2: Review Workmail Correspondence\n- Call `workmail_list_messages` to retrieve Q1 correspondence with external advisors\
  \ and internal stakeholders (CFO, BU general managers)\n- Search for keywords: \"vendor selection\", \"procurement policy\"\
  , \"restricted vendor\", \"approval threshold\", \"budget\"\n- Extract decision rationale for vendor choices, escalations\
  \ to CFO, and policy friction points mentioned in correspondence\n\n## Step 3: Search Gmail Vendor Proposals\n- Call `gmail_list_messages`\
  \ to retrieve Q1 vendor proposals, quotes, and negotiation threads\n- Identify pricing dynamics: early-bird discounts, volume\
  \ pricing, scope trade-offs\n- Extract vendor-specific pricing that may need anonymization in the final KB article\n\n##\
  \ Step 4: Extract Notion Decision Log Patterns\n- Call `claw_notion_search` with query terms: \"vendor\", \"external advisor\"\
  , \"procurement\", \"Q1 2026\"\n- Target decision logs for Project Aurora, BU Portfolio Review, Project Njord\n- Extract\
  \ vendor selection decisions, constraint-resolution patterns (e.g., restricted vendor list workarounds), and rationale documented\
  \ in decision logs\n- Do NOT modify or archive any pages — read-only extraction\n\n## Step 5: Search Knowledge Base for\
  \ Procurement Policies\n- Call `kb_search` with query: \"procurement policy\", \"restricted vendor list\", \"invoice approval\
  \ threshold\", \"external advisor\"\n- Retrieve existing articles (e.g., KB-401, KB-402, KB-403) to identify current policy\
  \ framework and gaps\n- Note which policies were frequently violated or caused friction in Q1\n\n## Step 6: Synthesize Findings\n\
  - Organize findings into structured digest:\n  - **Engagement Taxonomy**: Categorize Q1 engagements by type (M&A due diligence,\
  \ technical audit, legal advisory, org design consulting)\n  - **Cost Benchmarks**: Calculate average engagement cost by\
  \ category, identify outliers, flag threshold breaches\n  - **Vendor Performance Variance**: Summarize performance issues\
  \ or delays mentioned in correspondence/decision logs\n  - **Policy Violation Patterns**: Document restricted vendor list\
  \ violations, authority ceiling breaches, budget cap enforcement gaps\n  - **Q2 Recommendations**: Propose tactical adjustments\
  \ (e.g., raise approval threshold for specific engagement types, add vendors to approved list, clarify budget cap enforcement)\n\
  \  - For each recommendation, include:\n    - One-page rationale with supporting evidence from Q1 data\n    - \"What would\
  \ change my mind\" section per Sven's quality standard\n- Anonymize vendor-specific pricing if KB article will be visible\
  \ to non-finance staff\n- Flag any discovered violations for CFO escalation before publication\n\n## Step 7: Write to Knowledge\
  \ Base\n- Call `kb_update_article` to create new article with structured digest content\n- Apply tags: procurement, external-advisors,\
  \ finance-governance, Q1-retrospective\n- Add cross-references to related KB articles (KB-401, KB-402, KB-403) by calling\
  \ `kb_update_article` on those articles to append a reference to the new digest\n\n## Step 8: Verify Audit Trail Integrity\n\
  - Confirm no Notion decision log entries were modified during extraction\n- Confirm no external communications were sent\
  \ via Workmail or Gmail during synthesis\n- Confirm vendor confidentiality preserved in published digest"
