    min_calls: 1
- name: Workmail correspondence review
  weight: 0.15
  check:
    type: tool_called
    tool_name: workmail_list_messages
    min_calls: 1
- name: Gmail vendor proposal review
  weight: 0.15
  check:
    type: tool_called
    tool_name: gmail_list_messages
    min_calls: 1
- name: Notion decision log extraction
  weight: 0.15
  check:
    type: tool_called
    tool_name: claw_notion_search
    min_calls: 1
- name: Existing procurement policy review
  weight: 0.1
  check:
    type: tool_called
    tool_name: kb_search
    min_calls: 1
- name: Engagement taxonomy and cost patterns identified
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - engagement type
      - engagement category
      - engagement taxonomy
      - advisor category
    - - cost pattern
      - pricing pattern
      - cost benchmark
      - fee structure
    - - recurring engagement
      - repeat engagement
      - ongoing engagement
- name: Policy friction and violation patterns identified
  weight: 0.35
  check:
    type: keywords_present
    keywords:
