judge_rubric: 'Award full marks if the response synthesizes information from multiple sources (KB articles KB-434 and KB-435,
  vendor quote emails MSG-5382/5383/5384, and finance transaction history) into a structured vendor comparison guide that
  includes: (1) reliability ratings for all three vendors with specific on-time delivery percentages, (2) current pricing
  data cross-referenced against KB benchmarks, (3) Q2 promotional calendar patterns with specific dates and discount percentages,
  (4) turnaround time comparisons across standard/rush/express tiers, (5) vendor-specific strengths (ColorWave eco-credentials
  and reliability, Swift Print bulk pricing and Q2 promos, Verdant Press sustainability positioning), and (6) actionable decision
  framework for vendor selection based on project urgency, budget, and quality requirements. Award partial credit (60-80%)
  if the guide covers most vendors and categories but misses promotional calendar details, transaction cross-references, or
  decision tree logic. Award minimal credit (30-50%) if the response retrieves raw data but fails to synthesize into a structured
  comparison format. Deduct points if the guide exposes confidential pricing to external parties, commits to vendor orders
  without authorization, or modifies KB articles.'
reference_solution: '1. Search KB using kb_search with query ''vendor evaluation print pricing'' to locate relevant framework
  articles

  2. Retrieve KB-434 using kb_get_article to extract reliability rating criteria (95%+ on-time delivery target, 24-48hr responsiveness,
  rush capability), pricing benchmarks (business cards $45-85/500, posters $8-15 each, brochures $0.80-1.50), turnaround standards
  (5-7 days standard, 2-3 days rush +25-40%), promotional patterns (Q1 15-25%, Q2 10-20%), and decision tree framework (urgency
  → budget → quality → new vendor testing)

  3. Retrieve KB-435 using kb_get_article to extract cost optimization strategies (multi-vendor arbitrage, promotional window
  mapping, quality vs cost trade-offs, vendor relationship maintenance)

  4. List recent Gmail messages using gmail_list_messages with query ''from:colorwaveprint.com OR from:swiftprintco.com OR
  from:verdantpress.co quote'' to find vendor quotes

  5. Retrieve MSG-5382 using gmail_get_message to extract ColorWave quote: $1,627.50 standard ($1,383.38 with 15% discount
  by April 10), 97% on-time delivery, premium recycled stock, quote valid through April 16

  6. Retrieve MSG-5383 using gmail_get_message to extract Swift Print Q2 rate card and promotional calendar: 96% on-time delivery
  (recovered from March equipment issues), Q2 promos April 15-17 (20% off $500+), May 20-25 (25% off $1000+), June 10-12 (18%
  off all)

  7. Retrieve MSG-5384 using gmail_get_message to extract Verdant Press quote: $520 total ($457.60 with 12% discount expired
  March 31), 94% on-time delivery, 100% recycled paper + soy-based inks, 5-day turnaround

  8. List finance transactions using finance_list_transactions filtered by category ''print_services'' and date range Q1 2026
  to identify actual spending patterns

  9. Review TXN-6237 (Swift Print $248.50 March 18), TXN-6238 (Verdant Press $457.60 March 29 with 12% promo captured) to
  validate vendor usage and promotional deadline behavior

  10. Synthesize findings into structured comparison matrix covering: (a) Reliability ratings: ColorWave 97%, Swift Print
  96% (watch for equipment recovery), Verdant Press 94%; (b) Pricing positioning: ColorWave 15-25% above benchmarks but justified
  by eco-credentials, Swift Print competitive on bulk, Verdant Press mid-tier with sustainability focus; (c) Q2 promotional
  calendar: ColorWave 15% discount windows, Swift Print three scheduled promos (April/May/June), Verdant Press flash sales
  with tight expirations; (d) Turnaround comparison: ColorWave 5-6 days standard, Swift Print 6-7 days standard, Verdant Press
  5 days average; (e) Decision tree: Urgency <3 days → ColorWave rush capability, Budget constraint → Swift Print Q2 promos,
  Quality critical → ColorWave 97% reliability, Eco-conscious clients → Verdant Press sustainability; (f) Cash flow insights:
  Successfully captured Verdant March 31 promo but timing was tight, need 10-15 day payment buffer per KB-435 guidance

  11. Document vendor selection framework: Use ColorWave for premium client work and rush orders (highest reliability), Swift
  Print for bulk standard orders during Q2 promo windows (best cost optimization), Verdant Press for mid-tier eco-conscious
  clients (sustainability positioning)

  12. Create actionable quick-reference guide with promotional calendar reminders (set alerts 48 hours before Swift Print
  promo windows per KB-435 strategy)'
