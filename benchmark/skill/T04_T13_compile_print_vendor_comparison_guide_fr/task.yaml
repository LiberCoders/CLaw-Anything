execution_date: '2026-04-08'
prompt:
  text: I need to put together a print vendor comparison guide for Q2 budget planning. I've got some KB articles on vendor
    evaluation and recent quotes from ColorWave, Swift Print, and Verdant Press floating around in my emails. Can you help
    me compile everything into a structured reference doc that'll help me pick vendors faster when I'm juggling multiple projects?
  language: en
scoring_components:
- name: KB framework extraction
  weight: 0.2
  check:
    type: tool_called
    tool_name: kb_search
    min_calls: 1
- name: KB article retrieval
  weight: 0.2
