execution_date: '2026-04-07'
prompt:
  text: I need to finalize the Q2 infrastructure allocation for our 18 mid-market and enterprise customers across the three
    pools by end of week. Help me figure out the optimal distribution that maximizes our discount utilization while staying
    within capacity and SLA constraints.
  language: en
scoring_components:
- name: Hard constraint compliance verification
  weight: 0.4
  check:
    type: keywords_present
    keywords:
    - - 85% utilization
      - 85 percent utilization
      - utilization threshold
      - utilization ceiling
    - - capacity cap
      - capacity limit
      - pool capacity
      - hard capacity constraint
    - - SLA
      - latency requirement
      - contractual requirement
      - geographic constraint
- name: Volume discount optimization
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - volume discount
      - discount tier
      - discount threshold
      - pricing tier
    - - US-West
      - US-East
      - EU-Central
    - - total cost
      - infrastructure cost
      - minimize cost
      - cost optimization
- name: Allocation decision documented with rationale
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - allocation
      - assignment
      - distribution
      - customer-to-pool
    - - constraint
      - satisfies
      - meets requirement
      - compliance
    - - rationale
      - justification
      - decision basis
      - proof
- name: Retrieved customer resource requirements from CRM
  weight: 0.15
  check:
    type: tool_called
    tool_name: crm_list_customers
    min_calls: 1
- name: Retrieved infrastructure capacity data from Notion
  weight: 0.15
  check:
    type: tool_called
    tool_name: claw_notion_get_page
    min_calls: 2
- name: Documented allocation decision in Notion
  weight: 0.2
  check:
    type: tool_called
    tool_name: claw_notion_create_page
