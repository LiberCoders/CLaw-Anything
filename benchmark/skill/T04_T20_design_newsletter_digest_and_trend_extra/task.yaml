execution_date: '2026-04-08'
prompt:
  text: I'm drowning in design newsletters and vendor emails again. Can you pull together a weekly digest from the past week?
    I need the actual industry insights separated from the sales pitches, organized so I can actually use it.
  language: en
scoring_components:
- name: Identified legitimate design publications vs vendor promotions
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - Designer's News
      - Designers News
      - design publication
    - - Creative Fuel
      - industry newsletter
    - - vendor promotion
      - promotional email
      - sales email
      - marketing email
