execution_date: '2026-04-01'
prompt:
  text: Bosphorus Marine's 15% early booking discount for the Zone 4C Q2 marine equipment expires in 5 days. I've already
    put a lot of work into this, but the foundation design isn't approved yet. Help me figure out whether to lock in the discount
    or wait.
  language: en
scoring_components:
- name: Identified sunk cost fallacy risk
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - sunk cost
      - sunk coordination
      - unrecoverable
      - already invested
