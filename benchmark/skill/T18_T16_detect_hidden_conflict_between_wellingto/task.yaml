judge_rubric: 'Award full marks if the agent: (1) correctly identifies the hidden conflict between the April 3rd Wellington
  booking (09:00) and the completion of the 24-hour on-call shift on April 2nd (08:00), recognizing this violates the 24-hour
  post-call elective surgery restriction; (2) explains the safety rationale clearly, referencing the post-call fatigue protocol
  that prohibits elective surgery within 24 hours of on-call completion; (3) recommends declining the April 3rd slot despite
  the financial attractiveness (£8,500 fee, Q2 contract credit); (4) provides specific alternative dates that satisfy both
  the safety buffer and Wellington contract requirements (e.g., April 4th, 10th, or 17th); (5) demonstrates understanding
  that patient safety must override financial considerations. Award partial credit if the agent identifies the timing issue
  but fails to articulate the safety protocol violation clearly, or if it suggests proceeding with the April 3rd booking with
  caveats rather than firmly declining. Deduct points if the agent: misses the conflict entirely and recommends accepting
  the booking; fails to cross-reference the on-call schedule against the proposed surgery time; does not consult the documented
  safety protocols; or prioritizes financial/contractual considerations over clinical governance standards. The response should
  reflect Benjamin''s characteristic direct communication style and uncompromising stance on safety protocols, while maintaining
  professionalism in addressing the Wellington coordinator.'
reference_solution: '1. Retrieve the Wellington booking request email (WMSG-5155) from Elizabeth Thornbury dated March 31st,
  noting the proposed procedure details: April 3rd, 09:00-13:00, complex ventral hernia repair, £8,500 fee.


  2. Query calendar for recent on-call shifts using calendar_list_events or calendar_get_user_events, identifying EVT-454:
  24-hour trauma on-call shift from April 1st 08:00 to April 2nd 08:00.


  3. Calculate the temporal gap: on-call completion at April 2nd 08:00, proposed surgery at April 3rd 09:00 = 25-hour gap.


  4. Search KB for post-call fatigue protocols using kb_search with terms like ''post-call'', ''fatigue'', ''elective surgery'',
  retrieving KB-418 which specifies 24-hour minimum buffer for elective procedures.


  5. Review personal implementation notes (NOTE-191) confirming Benjamin''s documented 24-hour elective surgery prohibition
  and Wellington contract implications.


  6. Identify the hidden conflict: while the 25-hour gap technically meets the minimum 24-hour buffer, the procedure is complex
  (4-hour duration, high-risk category), and Benjamin''s protocol emphasizes conservative safety margins. The financial attractiveness
  (£8,500, Q2 contract credit) creates pressure to accept, but safety protocol is non-negotiable.


  7. Reference NOTE-192 which documents Benjamin''s analysis of this exact conflict and his decision to decline the April
  3rd slot.


  8. Formulate recommendation: decline April 3rd booking citing post-call safety protocol, provide alternative dates (Friday
  April 4th with 48-hour buffer, Thursday April 10th regular slot, Thursday April 17th backup), explain that Wellington contract
  accepts safety-based rescheduling without penalty.


  9. Draft communication to Elizabeth Thornbury explaining the clinical governance rationale and offering the three alternative
  slots, maintaining Benjamin''s direct communication style while preserving professional relationship.


  10. Document the safety-driven decision for audit trail and annual governance review.'
