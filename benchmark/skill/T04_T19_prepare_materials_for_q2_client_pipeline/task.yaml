judge_rubric: 'Award full marks if the response: (1) Confirms the meeting details (date, time, location, attendee) for the
  April 9 meeting with Sofia Park; (2) Summarizes the Q2 pipeline development framework including target prospect count, sector
  focus, and key action phases (research, case study, referral network, outreach); (3) Reports progress on completed tasks
  (prospect research of 5 brands, Marcus Kim meeting, case study in progress) and pending items (case study due April 10);
  (4) Identifies scheduled discovery calls with specific details (Harvest & Hearth on April 11 at 2:00 PM with Jessica Lin);
  (5) Evaluates sustainable scheduling progress by contrasting what''s working (deep work blocks, morning meeting slots) with
  what needs adjustment (overlapping deadlines, need for 48-hour buffers, declining rush requests); (6) Synthesizes findings
  into a coherent meeting preparation summary rather than dumping raw data. Deduct points for: missing key pipeline metrics
  or discovery call details; failing to distinguish completed vs. in-progress tasks; omitting the scheduling goals evaluation;
  presenting disorganized information without synthesis; including irrelevant client project details that don''t relate to
  pipeline development or scheduling goals.'
reference_solution: 'Step 1: Search calendar for the meeting with Sofia Park using calendar_list_events or calendar_get_user_events
  to find EVT-635 (Q2 Client Pipeline Review on April 9, 2026, 10:00-11:30 AM at Blue Bottle Coffee, Hayes Valley).


  Step 2: Retrieve pipeline planning notes using notes_list and notes_get to access NOTE-334 (Q2 Pipeline Planning — Goal-to-Action
  Task Mapping) which contains the Q2 framework: target of 3-5 qualified prospects in sustainable food + eco-wellness sectors,
  action plan breakdown (prospect research, case study development, referral network activation, outreach campaign), and success
  metrics.


  Step 3: Retrieve the meeting preparation summary using notes_get to access NOTE-335 (Q2 Pipeline Review Prep — Meeting Materials
  Summary) which synthesizes completed work (prospect research of 5 brands completed April 5 via TODO-962, Marcus Kim meeting
  completed, GreenRoot case study in progress with April 10 due date via TODO-964), scheduled discovery calls (Harvest & Hearth
  April 11 at 2:00 PM, Rooted Plate Co. April 15 tentative), and sustainable scheduling evaluation (what''s working: deep
  work blocks, morning slots; what needs adjustment: 48-hour buffer implementation, declining <5 day turnaround projects,
  communicating revised lead times).


  Step 4: Check gmail using gmail_list_messages and gmail_get_message to retrieve MSG-5410 (discovery call confirmation from
  Jessica Lin at Harvest & Hearth for April 11 at 2:00 PM) and MSG-5412 (meeting confirmation from Sofia Park for April 9
  at 10:00 AM).


  Step 5: Check contacts using contacts_search or contacts_get to find CON-401 (Jessica Lin from Harvest & Hearth, referral
  from Marcus Kim, discovery call scheduled April 11).


  Step 6: Check todo list using todo_list_tasks to verify TODO-963 (Prepare materials for Q2 pipeline review meeting) status
  and confirm completion.


  Step 7: Synthesize findings into a meeting preparation summary that includes: (a) Meeting logistics (April 9, 10:00 AM,
  Blue Bottle Hayes Valley with Sofia Park); (b) Q2 pipeline framework and targets (3-5 prospects, sustainable food + eco-wellness
  focus); (c) Completed tasks (5 prospect research profiles, Marcus Kim referral meeting, case study in progress); (d) Discovery
  calls scheduled (Harvest & Hearth April 11 confirmed, Rooted Plate Co. April 15 tentative); (e) Scheduling progress evaluation
  (deep work blocks and morning slots working well, but need to implement 48-hour delivery buffers and decline rush requests);
  (f) Discussion topics for Sofia (referrals, case study feedback, communicating revised lead times, accountability structure,
  conversion strategies).'
