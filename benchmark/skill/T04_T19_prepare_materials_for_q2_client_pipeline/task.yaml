execution_date: '2026-04-08'
prompt:
  text: I have my quarterly pipeline review meeting with Sofia on April 9 and I want to show up prepared with actual data
    instead of just winging it. Can you help me pull together the materials I need?
  language: en
scoring_components:
- name: Located scheduled meeting details
  weight: 0.15
  check:
    type: keywords_present
    keywords:
    - - April 9
      - April 9th
      - '2026-04-09'
    - - Sofia Park
      - Sofia
    - - 10:00 AM
      - '10:00'
