execution_date: '2026-04-02'
prompt:
  text: I just got an NHS trauma activation for tomorrow afternoon (April 3rd) but I already have a Wellington session booked.
    Help me figure out what to do.
  language: en
scoring_components:
- name: Identified the core tradeoff dimensions
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - financial loss
      - revenue loss
      - £4,800
      - lost income
    - - contract compliance
      - contract breach
      - Q1 minimum
      - contractual obligation
      - 11 sessions
    - - patient safety
      - clinical priority
      - Priority 1
      - P1 trauma
      - life-threatening
    - - locum
      - emergency cover
      - Dr. Okonkwo
      - backup consultant
- name: Reached the correct decision (cancel Wellington, cover NHS personally)
  weight: 0.4
  check:
    type: keywords_present
    keywords:
    - - cancel Wellington
      - cancel private practice
      - cancel the Wellington session
    - - cover NHS
      - attend trauma
      - primary consultant for NHS
      - personally handle trauma
    - - clinical need
      - patient safety priority
      - emergency takes precedence
      - NHS obligation
- name: Documented key risks and mitigation strategies
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - medical emergency exemption
      - emergency clause
      - contract clause 7.3
    - - contact patients
      - reschedule
      - apologize to patients
      - Mr. Thompson
      - Mrs. Knowles
