      images:
        type: array
        items:
          type: string
      visibility:
        type: string
    required:
    - content
- name: sheet_list_workbooks
  description: List all workbooks, optionally filtered by owner.
  input_schema:
    type: object
    properties:
      owner:
        type: string
- name: sheet_open
  description: Open a workbook by workbook_id and return its sheet metadata.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
    required:
    - workbook_id
- name: sheet_get_range
  description: Read a cell range (e.g. 'A1:C10') from a sheet.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      sheet:
        type: string
      range:
        type: string
        description: A1-style range, e.g. 'A1:C10'
    required:
    - workbook_id
    - sheet
    - range
- name: sheet_set_cell
  description: Set the value of a single cell.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      sheet:
        type: string
      cell:
        type: string
        description: A1-style address, e.g. 'B3'
      value: {}
    required:
    - workbook_id
    - sheet
    - cell
    - value
- name: sheet_set_range
  description: Set a 2D range of values starting at start_cell.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      sheet:
        type: string
      start_cell:
        type: string
      values:
        type: array
        items:
          type: array
    required:
    - workbook_id
    - sheet
    - start_cell
    - values
- name: sheet_insert_row
  description: Insert a new row after the given row index, with optional cell values.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      sheet:
        type: string
      after_row:
        type: integer
      values:
        type: array
    required:
    - workbook_id
    - sheet
    - after_row
- name: sheet_create_workbook
  description: Create a new empty workbook with optional initial sheets.
  input_schema:
    type: object
    properties:
      name:
        type: string
      owner:
        type: string
      initial_sheets:
        type: array
        items:
          type: object
    required:
    - name
    - owner
- name: sheet_add_sheet
  description: Add a new sheet to an existing workbook.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      name:
        type: string
    required:
    - workbook_id
    - name
- name: sheet_rename_sheet
  description: Rename a sheet inside a workbook.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      old_name:
        type: string
      new_name:
        type: string
    required:
    - workbook_id
    - old_name
    - new_name
- name: sheet_compute
  description: 'Run an aggregate over a range. op: SUM | AVG | COUNT | MAX | MIN.'
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      sheet:
        type: string
      range:
        type: string
      op:
        type: string
        description: SUM | AVG | COUNT | MAX | MIN
    required:
    - workbook_id
    - sheet
    - range
    - op
- name: sheet_delete_workbook
  description: Permanently delete a workbook by workbook_id. Irreversible.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
    required:
    - workbook_id
- name: sheet_delete_sheet
  description: Delete a single sheet from a workbook (the workbook itself is preserved).
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      sheet:
        type: string
    required:
    - workbook_id
    - sheet
