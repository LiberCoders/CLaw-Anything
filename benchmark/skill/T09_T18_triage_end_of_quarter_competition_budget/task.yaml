execution_date: '2026-04-02'
prompt:
  text: I just got back from a crazy week of mid-term exams and competition coaching. My inbox is completely flooded—over
    25 unread emails. Help me figure out what needs my attention right now versus what can wait until next week.
  language: en
scoring_components:
- name: Identified all three urgent deadline items requiring immediate action
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - Q1 budget
      - budget report
      - finance office budget
      - end-of-quarter budget
    - - Zhang Ming
      - Zhang Wei
      - parent concern
