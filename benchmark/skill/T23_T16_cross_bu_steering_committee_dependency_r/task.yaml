task_id: T23_T16_cross_bu_steering_committee_dependency_r
task_name: Cross-BU Steering Committee Dependency Resolution for Q2 Board Materials
version: '1.0'
category: scheduling
difficulty: simple
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
