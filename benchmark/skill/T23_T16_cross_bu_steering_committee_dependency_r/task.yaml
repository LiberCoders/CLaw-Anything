prompt:
  text: I need to prepare Q2 board materials covering Aurora integration, portfolio optimization, and org restructuring for
    the May 14 board meeting. Per sent me the request on April 1 — can you figure out the steering committee dependencies
    and build me a scheduling plan that gets everything done in time?
  language: en
