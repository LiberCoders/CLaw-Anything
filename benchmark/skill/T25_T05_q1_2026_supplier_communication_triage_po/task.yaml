prompt:
  text: I just got back from CNY break and my inbox is flooded with supplier messages from the Yiwu factories. Help me figure
    out which deposit deadlines are actually urgent versus just standard follow-ups, and draft replies for anything that could
    cost me Q2 production slots if I don't respond fast.
  language: en
