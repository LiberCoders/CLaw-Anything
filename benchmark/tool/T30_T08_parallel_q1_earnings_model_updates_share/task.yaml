- name: sheet_list_workbooks
  description: List all workbooks, optionally filtered by owner.
  input_schema:
    type: object
    properties:
      owner:
        type: string
- name: sheet_open
  description: Open a workbook by workbook_id and return its sheet metadata.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
    required:
    - workbook_id
- name: sheet_get_range
  description: Read a cell range (e.g. 'A1:C10') from a sheet.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      sheet:
        type: string
      range:
        type: string
        description: A1-style range, e.g. 'A1:C10'
    required:
    - workbook_id
    - sheet
    - range
- name: sheet_set_cell
  description: Set the value of a single cell.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      sheet:
        type: string
      cell:
        type: string
        description: A1-style address, e.g. 'B3'
      value: {}
    required:
    - workbook_id
    - sheet
    - cell
    - value
- name: sheet_set_range
  description: Set a 2D range of values starting at start_cell.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      sheet:
        type: string
      start_cell:
        type: string
      values:
        type: array
        items:
          type: array
    required:
    - workbook_id
    - sheet
    - start_cell
    - values
