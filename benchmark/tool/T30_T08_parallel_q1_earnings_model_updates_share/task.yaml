    - from_index
    - to_index
- name: slide_create_deck
  description: Create a new empty deck with optional initial slides.
  input_schema:
    type: object
    properties:
      name:
        type: string
      owner:
        type: string
      initial_slides:
        type: array
        items:
          type: object
    required:
    - name
    - owner
- name: slide_delete_deck
  description: Permanently delete a deck by deck_id. Irreversible.
  input_schema:
    type: object
    properties:
      deck_id:
        type: string
    required:
    - deck_id
- name: slide_delete_slide
  description: Delete a single slide from a deck (the deck itself is preserved).
  input_schema:
    type: object
    properties:
      deck_id:
        type: string
      slide_index:
        type: integer
    required:
    - deck_id
    - slide_index
