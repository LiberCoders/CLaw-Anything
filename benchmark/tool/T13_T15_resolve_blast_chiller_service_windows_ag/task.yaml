execution_date: '2026-04-02'
prompt:
  text: I need to figure out when to schedule the blast chiller service without derailing my spring menu testing. Robert sent
    over his availability windows and the unit really can't wait much longer, but I have critical tests coming up. Help me
    find the best service window that keeps everything on track.
  language: en
scoring_components:
- name: Identifies April 1st as optimal service window
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - April 1st
      - April 1
      - Tuesday April 1
      - 4/1
    - - optimal
      - best
