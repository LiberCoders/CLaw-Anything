task_id: T18_T03_upcoming_theatre_and_clinical_commitment
task_name: Upcoming theatre and clinical commitments preview with preparation requirements
version: '1.0'
category: scheduling
difficulty: simple
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
