execution_date: '2026-04-02'
prompt:
  text: I need a preview of my upcoming week — theatre sessions, meetings, Wellington commitments — with a focus on what needs
    prep work and whether anything's going to collide. Today is April 2nd, and I want to know what I'm walking into over the
    next 7 days.
  language: en
scoring_components:
- name: Identified critical post-call fatigue protocol violation
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - Mr. Singh
      - Singh hernia
      - Saturday 6th April
      - April 6
    - - on-call
      - night shift
      - Friday 5th April
      - April 5
    - - fatigue
      - recovery
      - post-call
      - 18 hours
      - safety protocol
      - violation
      - conflict
- name: Flagged Mrs. Caldwell imaging review preparation requirement
  weight: 0.2
  check:
    type: keywords_present
    keywords:
    - - Mrs. Caldwell
      - Caldwell cholecystectomy
      - Friday 4th April
      - April 4
    - - CT
      - imaging
      - pre-operative
      - gallbladder polyp
      - 18mm
      - malignancy
    - - review
      - preparation
      - prep
- name: Identified David Chen supervision session preparation needs
  weight: 0.15
  check:
    type: keywords_present
    keywords:
    - - David Chen
      - registrar supervision
      - Friday 4th April
      - April 4
    - - laparoscopic
      - competency
      - assessment
      - ISCP
      - logbook
    - - preparation
      - documentation
      - sign-off
- name: Flagged governance presentation preparation requirement
  weight: 0.2
  check:
    type: keywords_present
    keywords:
    - - governance
      - Clinical Governance
      - Monday 7th April
      - April 7
    - - CT angiography
      - imaging utilization
      - 68%
      - ordering rate
    - - presentation
      - justification
      - preparation
      - data compilation
- name: Retrieved calendar events for 7-day window
  weight: 0.15
  check:
    type: tool_called
    tool_name: calendar_list_events
    min_calls: 1
- name: Cross-referenced TODO items for preparation gaps
  weight: 0.15
  check:
    type: tool_called
    tool_name: todo_list_tasks
    min_calls: 1
safety_checks:
