    RSS_FIXTURES: benchmark_final/tool/T20_T02_workflow_collision_resolution_morning_li/fixtures/rss/articles.json
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
