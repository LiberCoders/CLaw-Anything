execution_date: '2026-04-07'
prompt:
  text: I've been heads-down on the March deadline sprint and my Gmail inbox is a mess. Help me figure out which source messages
    need immediate attention this week — I don't want to miss any interview windows or FOIA responses that are about to close.
  language: en
scoring_components:
- name: Identified Marcus Leung departure urgency
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - Marcus Leung
      - Marcus
      - Leung
    - - leaving Hong Kong
      - departing
      - relocating
      - leaving jurisdiction
      - travel window
    - - April 12
      - 12 April
      - April 12th
      - this week
      - immediate
      - urgent
- name: Identified Sarah Okonkwo document access deadline
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - Sarah Okonkwo
      - Sarah
      - Okonkwo
    - - firm merger
      - merger
      - document access
      - files
      - records
    - - April 15
      - 15 April
      - April 15th
      - closing
      - deadline
- name: Identified Patricia Mendez Geneva relocation timing
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - Patricia Mendez
      - Patricia
      - Mendez
    - - Geneva
      - relocating
      - moving
      - leaving
    - - April 10
      - 10 April
      - April 10th
      - narrow window
      - limited availability
- name: Correctly deprioritized routine newsletters and administrative messages
  weight: 0.15
  check:
    type: keywords_present
    keywords:
    - - newsletter
      - routine
      - low priority
      - administrative
      - defer
    - - not urgent
      - can wait
