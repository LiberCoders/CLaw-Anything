    HELPDESK_FIXTURES: benchmark_final/tool/T22_T05_gmail_source_correspondence_triage_deadl/fixtures/helpdesk/tickets.json
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: benchmark_final/tool/T22_T05_gmail_source_correspondence_triage_deadl/fixtures/scheduler/jobs.json
- name: workmail
  command: python mock_services/workmail/server.py
  port: 9113
  health_check: http://localhost:9113/workmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9113/workmail/reset
  env:
    WORKMAIL_FIXTURES: benchmark_final/tool/T22_T05_gmail_source_correspondence_triage_deadl/fixtures/workmail/inbox.json
