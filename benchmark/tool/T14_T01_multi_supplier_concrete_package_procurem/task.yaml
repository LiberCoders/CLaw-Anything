execution_date: '2026-04-06'
prompt:
  text: I need to finalize concrete procurement for the Zone 2C, 3A, and 5A foundation packages. We've got three regional
    suppliers in play and I want to make sure we're hitting the volume discount thresholds without blowing our payment capacity.
    Walk me through the best allocation strategy.
  language: en
scoring_components:
- name: Retrieved concrete volume requirements for all three zones
  weight: 0.15
  check:
    type: tool_called
    tool_name: finance_list_transactions
    min_calls: 1
- name: Extracted supplier volume discount thresholds and pricing tiers
  weight: 0.15
