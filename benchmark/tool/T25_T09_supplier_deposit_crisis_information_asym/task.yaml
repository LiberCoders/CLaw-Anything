task_id: T25_T09_supplier_deposit_crisis_information_asym
task_name: 'Supplier deposit crisis: information asymmetry analysis between email assurances and WeChat urgency signals'
version: '1.0'
category: decision_making
difficulty: simple
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
