prompt:
  text: I need help sorting out the Q2 supplier deposit situation. All three suppliers sent me reassuring emails about flexible
    payment terms, but the WeChat messages are telling a completely different story. I need to figure out which urgency signals
    are real versus which ones are just pressure tactics, and decide who actually gets paid by when. Can you help me analyze
    this and give me a clear action plan?
  language: en
