- name: slide_delete_deck
  description: Permanently delete a deck by deck_id. Irreversible.
  input_schema:
    type: object
    properties:
      deck_id:
        type: string
    required:
    - deck_id
- name: slide_delete_slide
  description: Delete a single slide from a deck (the deck itself is preserved).
  input_schema:
    type: object
    properties:
      deck_id:
        type: string
      slide_index:
        type: integer
    required:
    - deck_id
    - slide_index
