execution_date: '2026-04-02'
prompt:
  text: I need help sorting out my schedule for exam week April 8-10. I've got my teaching duties, homeroom responsibilities,
    and my daughters have some mandatory school events. Can you consolidate everything and flag where I have conflicts that
    need resolving?
  language: en
scoring_components:
- name: Identified all three critical time conflicts
  weight: 0.4
  check:
    type: keywords_present
    keywords:
    - - April 8
      - April 8th
      - 8th
      - Tuesday April 8
    - - grading session
      - grading coordination
