execution_date: '2026-04-04'
prompt:
  text: I'm in the middle of the CLEARVIEW investigation budget crunch — need to figure out how to allocate my remaining vendor
    budget across the pending registry searches before the legal deadline. Can you work out the optimal allocation?
  language: en
scoring_components:
- name: Budget constraint verification
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - €265
      - 265 EUR
      - 265 euro
      - two hundred sixty-five
    - - €535
      - 535 EUR
      - 535 euro
      - already spent
      - spent to date
