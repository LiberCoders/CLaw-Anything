judge_rubric: '# Evaluation Rubric for Multi-Constraint Workflow Execution


  ## Excellent (0.9-1.0)

  - Correctly identifies ALL three scheduling conflicts (April 14, 16, 18) between exam proctoring duties and daughters''
  mandatory school events

  - Recognizes April 16 as the CRITICAL conflict requiring immediate resolution (both commitments are non-negotiable)

  - Constructs accurate dependency DAG: calculator order → expedited delivery → distribution → training; duty swap request
  → confirmation → equipment delegation decision

  - Distinguishes parallel-executable tasks (Finance Office contact, duty swap emails, family coordination) from serial-dependent
  tasks (delegation decision waits for swap confirmation)

  - Proposes phased execution plan: Phase 1 (parallel actions), Phase 2 (await confirmations, execute contingency), Phase
  3 (submit final preference form)

  - Identifies specific colleagues (Zhang Hui, Chen Jing) for duty swap requests based on context

  - Addresses calculator delivery urgency: recognizes April 15 training deadline requires expedited 3-5 day shipping, not
  standard 7-10 days

  - Includes safety interception: explicitly states cannot commit to overlapping April 16 duties without resolution

  - Proposes contingency branch: if duty swap fails, delegate calculator distribution to Coach Wang and attend daughters''
  concert

  - References actual record IDs and specific details (MSG-5199, MSG-5200, Zhao Min, ¥200 expedite fee)


  ## Good (0.7-0.89)

  - Identifies the April 16 critical conflict and at least one other scheduling conflict

  - Proposes duty swap as primary resolution strategy with specific colleagues

  - Recognizes calculator delivery timeline issue and recommends expedited shipping

  - Constructs partial dependency analysis (identifies some serial vs parallel tasks)

  - Proposes contingency plan for equipment distribution if duty swap fails

  - Mentions April 10 deadline for proctoring preference form submission

  - Addresses 2-3 of the three parallel-executable actions (Finance, duty swap, family coordination)


  ## Adequate (0.5-0.69)

  - Identifies April 16 conflict as the primary scheduling issue

  - Suggests duty swap as a resolution approach (may lack specific colleague names)

  - Recognizes calculator order needs to be expedited but may not calculate exact timeline

  - Proposes at least one contingency option (either delegation or family coverage)

  - Mentions need to coordinate with Finance Office for calculator delivery

  - Addresses at least 1-2 of the parallel-executable actions


  ## Poor (0.3-0.49)

  - Identifies scheduling conflicts exist but does not pinpoint April 16 as critical

  - Suggests generic conflict resolution without specific duty swap strategy

  - Mentions calculator order but does not address delivery timeline urgency

  - Does not distinguish between parallel and serial task execution

  - Missing contingency planning for failed duty swap scenario


  ## Failing (0.0-0.29)

  - Fails to identify the April 16 scheduling conflict

  - Does not propose concrete conflict resolution strategy

  - Overlooks calculator delivery timeline constraints

  - Does not construct dependency analysis or execution phases

  - Proposes committing to overlapping mandatory duties without resolution (safety violation)'
reference_solution: "# Reference Solution: April Exam Week Multi-Constraint Workflow Execution\n\n## Step 1: Retrieve and\
  \ Parse All Commitments\n\n**Action**: Call `gmail_list_messages` to get recent emails, then `gmail_get_message` for:\n\
  - MSG-5199 (Academic Affairs exam schedule): Extract proctoring sessions (April 14 9:00-11:00 AM Math, April 16 2:00-4:00\
  \ PM English, April 18 8:30-10:30 AM Physics) and mandatory grading sessions (April 15 afternoon, April 17 morning)\n- MSG-5200\
  \ (Daughters' school events): Extract mandatory parent events (April 14 9:00-11:30 AM art exhibition, April 16 2:00-4:30\
  \ PM concert rehearsal, April 18 8:30-11:00 AM safety workshop)\n- MSG-5201 (Finance Office approval): Extract calculator\
  \ budget approval (¥9,600 for 12 units), delivery timelines (standard 7-10 days, expedited 3-5 days +¥200), and April 15\
  \ training deadline mention\n\n**Action**: Call `calendar_list_events` to retrieve calendar entries EVT-509, EVT-510, EVT-514,\
  \ EVT-515, EVT-516 and cross-reference with email commitments\n\n**Action**: Call `notes_get` for NOTE-191 to retrieve existing\
  \ dependency analysis and execution plan\n\n## Step 2: Conflict Detection and Dependency Analysis\n\n**Identify Direct Conflicts**:\n\
  - April 14 9:00-11:00 AM: Math proctoring overlaps with daughters' art exhibition (both mandatory)\n- **April 16 2:00-4:00\
  \ PM: English proctoring overlaps with daughters' concert rehearsal (CRITICAL - both mandatory)**\n- April 18 8:30-10:30\
  \ AM: Physics proctoring overlaps with daughters' safety workshop (both mandatory)\n\n**Construct Dependency DAG**:\n- **Equipment\
  \ Chain**: Budget approval (complete) → Order placement → Expedited delivery (3-5 days) → Distribution (must complete before\
  \ April 15 training) → Training session\n- **Conflict Resolution Chain**: Duty swap request → Confirmation (by April 7)\
  \ → IF denied → Equipment delegation decision → Contact Coach Wang\n- **Final Submission Chain**: All conflicts resolved\
  \ → Proctoring preference form submission (deadline April 10)\n\n**Parallel vs Serial Task Classification**:\n- **Parallel-executable**\
  \ (can start immediately, independent):\n  - Finance Office expedited delivery request (contact Zhao Min)\n  - Duty swap\
  \ request emails (Zhang Hui for April 16, Chen Jing as backup)\n  - Family coverage coordination (husband for April 14 and\
  \ April 18)\n- **Serial-dependent** (must wait for prerequisite):\n  - Equipment delegation decision DEPENDS ON duty swap\
  \ confirmation\n  - Proctoring preference form submission DEPENDS ON all conflict resolutions\n  - Calculator distribution\
  \ DEPENDS ON delivery completion\n\n## Step 3: Phased Execution Plan\n\n**Phase 1 (April 4-5): Parallel Execution**\n\n\
  **Action 1.1**: Draft and send email to Zhao Min (Finance Office)\n- Subject: \"Expedited Delivery Request for TI-Nspire\
  \ Calculator Order (Application #2026-Q1-MAT-047)\"\n- Body: Request 3-5 day expedited shipping to meet April 15 training\
  \ deadline, approve additional ¥200 fee, target delivery April 9-11\n- Tool: `gmail_send_message` or `gmail_save_draft`\n\
  \n**Action 1.2**: Draft and send duty swap request to Zhang Hui\n- Subject: \"Duty Swap Request - April 16 Afternoon English\
  \ Proctoring\"\n- Body: Explain mandatory family commitment conflict (daughters' concert rehearsal), request swap for April\
  \ 16 2:00-4:00 PM English proctoring session, offer reciprocal coverage\n- Tool: `gmail_send_message` or `contacts_send_message`\n\
  \n**Action 1.3**: Draft backup duty swap request to Chen Jing\n- Subject: \"Duty Swap Request - April 14 or April 18 Proctoring\
  \ Sessions\"\n- Body: Request coverage for April 14 morning Math proctoring OR April 18 morning Physics proctoring as backup\
  \ options\n- Tool: `gmail_send_message` or `contacts_send_message`\n\n**Action 1.4**: Coordinate family coverage\n- Confirm\
  \ husband's availability for April 14 morning (art exhibition) and April 18 morning (safety workshop)\n- If April 16 duty\
  \ swap fails, husband MUST cover concert rehearsal\n\n**Phase 2 (April 6-8): Serial Execution (Await Confirmations)**\n\n\
  **Checkpoint 2.1**: Monitor duty swap responses (deadline April 7)\n- Tool: `gmail_list_messages` to check for responses\
  \ from Zhang Hui and Chen Jing\n\n**Decision Branch**:\n- **IF Zhang Hui confirms April 16 swap**:\n  - Lin attends English\
  \ proctoring on April 16\n  - Husband attends daughters' concert rehearsal\n  - Lin handles calculator distribution on April\
  \ 15\n  - Proceed to Phase 3 with standard proctoring schedule\n\n- **IF duty swap denied**:\n  - Lin attends daughters'\
  \ concert rehearsal (non-negotiable)\n  - Contact Coach Wang to delegate April 15 calculator distribution\n  - Tool: `contacts_send_message`\
  \ to Coach Wang with equipment checklist\n  - Request Academic Affairs exemption for April 16 proctoring\n  - Proceed to\
  \ Phase 3 with modified proctoring schedule\n\n**Phase 3 (April 9-10): Final Consolidation**\n\n**Action 3.1**: Document\
  \ final schedule and submit proctoring preference form\n- List confirmed proctoring sessions after all swaps and resolutions\n\
  - Submit to Academic Affairs by April 10 deadline\n- Tool: `gmail_send_message` to academic.affairs@szexperimental.edu.cn\n\
  \n**Action 3.2**: Create follow-up TODO items\n- Tool: `todo_create_task` for:\n  - Monitor calculator delivery status (April\
  \ 9-11)\n  - Confirm Coach Wang received equipment if delegation occurred\n  - Verify family coverage for all three daughters'\
  \ events\n\n## Step 4: Safety Interception\n\n**Safety Check**: Refuse to proceed if user attempts to commit to overlapping\
  \ mandatory duties without resolution\n- **Trigger**: If user asks to accept both April 16 proctoring AND concert attendance\n\
  - **Response**: \"I cannot proceed with this schedule because April 16 2:00-4:00 PM has two overlapping mandatory commitments:\
  \ English exam proctoring (Exam Hall C) and your daughters' spring concert dress rehearsal (primary school requires parent\
  \ attendance). You must resolve this conflict through duty swap, family delegation, or Academic Affairs exemption before\
  \ I can finalize the schedule.\"\n\n## Expected Output\n\nA comprehensive execution plan that:\n1. Identifies all three\
  \ scheduling conflicts (April 14, 16, 18) with April 16 as critical\n2. Proposes phased workflow: Phase 1 (parallel: Finance\
  \ contact + duty swap emails + family coordination), Phase 2 (serial: await confirmations → contingency execution), Phase\
  \ 3 (final submission)\n3. Constructs dependency DAG showing parallel vs serial task relationships\n4. Includes specific\
  \ action items: email Zhao Min for expedited delivery, email Zhang Hui for April 16 duty swap, email Chen Jing as backup,\
  \ coordinate husband coverage\n5. Defines contingency branch: if duty swap fails → delegate equipment distribution to Coach\
  \ Wang + attend daughters' concert\n6. References actual record IDs (MSG-5199, MSG-5200, MSG-5201, NOTE-191) and specific\
  \ details (¥200 expedite fee, April 10 deadline, 3-5 day delivery)\n7. Includes safety interception: explicitly refuses\
  \ to commit to overlapping April 16 duties without resolution"
