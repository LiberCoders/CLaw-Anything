execution_date: '2026-04-04'
prompt:
  text: I just got the April exam week schedule and my daughters' school events for mid-month. There are some overlapping
    commitments and I need to sort out the calculator order for the competition team before their April 15 training. Can you
    help me work through this and figure out what I need to do?
  language: en
scoring_components:
- name: Identified critical April 16 scheduling conflict
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - April 16
      - Wednesday April 16
      - 16th
    - - conflict
