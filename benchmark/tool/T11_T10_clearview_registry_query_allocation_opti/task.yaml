execution_date: '2026-04-04'
prompt:
  text: I need to finalize the vendor allocation plan for the 27 CLEARVIEW registry queries before the legal review deadline
    on April 11. I've got the ECI bulk package that's expiring and some budget left, but I need to make sure the Panama and
    Cayman queries get back in time for the Source A prep. Can you work out the optimal split?
  language: en
scoring_components:
- name: Hard constraint validation
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - €265
      - 265 euro
      - budget cap
