      - Liu Wei
    - - April 7
      - Apr 7
      - 4/7
      - '2026-04-07'
    - - Yongxin
      - Chen Xiaoming
    - - April 8
      - Apr 8
      - 4/8
      - '2026-04-08'
    - - Jinlong
      - Wang Jianhua
    - - April 9
      - Apr 9
      - 4/9
      - '2026-04-09'
- name: Cross-referenced preparation requirements with TODO items
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - TODO-791
      - pricing verification
      - WB-32 pricing analysis
    - - TODO-792
      - MOQ negotiation
      - Yongxin talking points
      - 3500 units
    - - TODO-793
      - quality scorecard
      - Jinlong quality
      - trial order assessment
- name: Flagged timezone conflicts and overnight call risks
  weight: 0.3
  check:
    type: keywords_present
    keywords:
    - - 9pm EST
      - Sunday night
      - evening EST
      - night call
    - - back-to-back
      - compressed
      - 24 hour
      - sequential
    - - 1am EST
      - overnight
      - middle of night
      - Wednesday 1am
    - - Beijing time
      - timezone
      - time zone
      - EST
- name: Linked related workbooks and notes to each call
  weight: 0.2
  check:
    type: keywords_present
    keywords:
    - - WB-32
      - WB-66
      - pricing verification workbook
      - supplier pricing
    - - NOTE-210
      - NOTE-211
      - weekly calendar preview
      - quality assessment
    - - preparation dashboard
      - call schedule
      - cross-reference
- name: Retrieved calendar events for the upcoming week
  weight: 0.15
  check:
    type: tool_called
    tool_name: calendar_list_events
    min_calls: 1
- name: Retrieved TODO items related to call preparation
  weight: 0.15
  check:
    type: tool_called
