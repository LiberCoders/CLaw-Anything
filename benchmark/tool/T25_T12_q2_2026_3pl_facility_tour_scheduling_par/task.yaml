tools:
- name: gmail_list_messages
  description: 'List inbox messages. Returns subject/from/date (no body). Default: last 7 days, max 20 results. Response includes
    ''total'' (all matching) and ''returned'' (this page) counts. Use query to search (matches if ALL words appear in subject
    or sender). Use offset for pagination. If query returns 0, retry without query to browse all messages.'
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: How many days back to search, default 7
      max_results:
        type: integer
        description: Max messages to return, default 20
      offset:
        type: integer
        description: Skip first N results for pagination, default 0
      query:
        type: string
        description: Search keyword in subject and sender (optional)
- name: gmail_get_message
  description: Get full message details including body by message_id
  input_schema:
    type: object
    properties:
      message_id:
        type: string
    required:
    - message_id
- name: gmail_send_message
  description: Send an email to the specified recipient
  input_schema:
    type: object
    properties:
      to:
        type: string
      subject:
        type: string
      body:
        type: string
    required:
    - to
    - subject
    - body
- name: gmail_save_draft
  description: Save an email as draft (not sent). Use reply_to_message_id to mark it as a reply.
  input_schema:
    type: object
    properties:
      to:
        type: string
      subject:
        type: string
      body:
        type: string
      reply_to_message_id:
        type: string
        description: Original message ID if this is a reply (optional)
    required:
    - to
    - subject
    - body
- name: calendar_list_events
  description: List calendar events starting from a given date. Returns full event details. Use days parameter to extend the
    search window.
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: Start date in YYYY-MM-DD format
      days:
        type: integer
        description: Number of days to include from start date, default 1
    required:
    - date
- name: calendar_get_event
  description: Get a single event by event_id
  input_schema:
    type: object
    properties:
      event_id:
        type: string
    required:
    - event_id
- name: calendar_get_user_events
  description: Get events for a specific user on a specific date (single day only)
  input_schema:
    type: object
    properties:
      user:
        type: string
        description: User name to search in attendees
      date:
        type: string
        description: Date in YYYY-MM-DD format (single day)
    required:
    - user
    - date
- name: calendar_create_event
  description: Create a new calendar event
  input_schema:
    type: object
    properties:
      title:
        type: string
      start_time:
        type: string
      end_time:
        type: string
      attendees:
        type: array
        items:
          type: string
      location:
        type: string
    required:
    - title
    - start_time
    - end_time
- name: calendar_delete_event
  description: Delete a calendar event by event_id
  input_schema:
    type: object
    properties:
      event_id:
        type: string
    required:
    - event_id
- name: todo_list_tasks
  description: List TODO tasks. Returns full task details. Default returns all tasks. Use status filter to narrow results.
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 'Filter by status: ''pending'', ''in_progress'', ''completed'', or ''all'' (default ''all'')'
- name: todo_create_task
  description: Create a new TODO task
  input_schema:
    type: object
    properties:
      title:
        type: string
      description:
        type: string
        description: Task description (optional)
      priority:
        type: string
        description: Priority level, default 'medium'
      due_date:
        type: string
        description: Due date in ISO format (optional)
    required:
    - title
- name: todo_update_task
  description: Update an existing TODO task. Only provided fields will be changed.
  input_schema:
    type: object
    properties:
      task_id:
        type: string
      title:
        type: string
        description: New title (optional)
      priority:
        type: string
        description: New priority (optional)
      status:
        type: string
        description: 'New status: ''pending'', ''in_progress'', ''completed'' (optional)'
      tags:
        type: array
        items:
          type: string
        description: New tags list (optional)
    required:
    - task_id
- name: todo_delete_task
  description: Delete a TODO task by task_id
  input_schema:
    type: object
    properties:
      task_id:
        type: string
    required:
    - task_id
- name: contacts_search
  description: Search contacts by name. Optionally filter by department.
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: Name to search (substring match)
      department:
        type: string
        description: Filter by department (optional)
    required:
    - query
- name: contacts_get
  description: Get full contact details by contact_id
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
    required:
    - contact_id
- name: contacts_send_message
  description: Send a direct message to a contact
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
      message:
        type: string
    required:
    - contact_id
    - message
- name: finance_list_transactions
  description: List financial transactions. Returns all transactions by default. Use start_date and end_date to filter by
    date range.
  input_schema:
    type: object
    properties:
      start_date:
        type: string
        description: Filter from this date (YYYY-MM-DD, inclusive, optional)
      end_date:
        type: string
        description: Filter until this date (YYYY-MM-DD, inclusive, optional)
- name: finance_get_transaction
  description: Get full transaction details by transaction_id
  input_schema:
    type: object
    properties:
      transaction_id:
        type: string
    required:
    - transaction_id
- name: finance_report_submit
  description: Submit a finance report with transaction references
  input_schema:
    type: object
    properties:
      title:
        type: string
      transactions:
        type: array
        items:
          type: string
      total_amount:
        type: number
    required:
    - title
    - transactions
    - total_amount
- name: notes_list
  description: List notes (title/id only, no content). Default max 10 results. Response includes 'total' (all matching) and
    'returned' (this page) counts. Use query to search (matches if ALL words appear in title or participants). Use offset
    for pagination. If query returns 0, retry without query to browse all notes.
  input_schema:
    type: object
    properties:
      max_results:
        type: integer
        description: Max notes to return, default 10
      offset:
        type: integer
        description: Skip first N results for pagination, default 0
      query:
        type: string
        description: Search keyword in title and participants (optional)
- name: notes_get
  description: Get full note content by note_id
  input_schema:
    type: object
    properties:
      note_id:
        type: string
    required:
    - note_id
- name: kb_search
  description: Search KB articles by keyword. Returns title/snippet (first 150 chars) only. Default max 5 results. Response
    includes 'total' (all matching) and 'returned' (this page) counts. Use offset for pagination. Use kb_get_article for full
    content.
  input_schema:
    type: object
    properties:
      query:
        type: string
      category:
        type: string
        description: Filter by category (optional)
      max_results:
        type: integer
        description: Max results to return, default 5
      offset:
        type: integer
        description: Skip first N results for pagination, default 0
    required:
    - query
- name: kb_get_article
  description: Get full KB article content by article_id
  input_schema:
    type: object
    properties:
      article_id:
        type: string
    required:
    - article_id
- name: kb_update_article
  description: Update a KB article's content
  input_schema:
    type: object
    properties:
      article_id:
        type: string
      content:
        type: string
        description: New article content
    required:
    - article_id
    - content
- name: helpdesk_list_tickets
  description: List helpdesk tickets. Default shows only 'open' tickets. Use status='all' to see all tickets.
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 'Filter by status: ''open'', ''closed'', ''all'', etc. Default ''open'''
- name: helpdesk_get_ticket
  description: Get full ticket details by ticket_id
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
    required:
    - ticket_id
- name: helpdesk_update_ticket
  description: Update a helpdesk ticket. Only provided fields will be changed.
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
      priority:
        type: string
        description: New priority (optional)
      tags:
        type: array
        items:
          type: string
        description: New tags (optional)
      category:
        type: string
        description: New category (optional)
    required:
    - ticket_id
- name: helpdesk_close_ticket
  description: Close a helpdesk ticket with a resolution note
  input_schema:
    type: object
    properties:
      ticket_id:
        type: string
      resolution:
        type: string
        description: Resolution description
    required:
    - ticket_id
    - resolution
- name: inventory_list_products
  description: List inventory products. Returns full product details. Optionally filter by category.
  input_schema:
    type: object
    properties:
      category:
        type: string
        description: Filter by product category (optional)
- name: inventory_get_product
  description: Get full product details by product_id
  input_schema:
    type: object
    properties:
      product_id:
        type: string
    required:
    - product_id
- name: inventory_create_order
  description: Create a purchase order for a product
  input_schema:
    type: object
    properties:
      product_id:
        type: string
      quantity:
        type: integer
      supplier:
        type: string
        description: Supplier name (optional)
    required:
    - product_id
    - quantity
- name: scheduler_list_jobs
  description: List scheduled jobs (summary, no action/history). Filter by status, enabled state, or tag.
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: Filter by last run status (optional)
      enabled:
        type: boolean
        description: Filter by enabled state (optional)
      tag:
        type: string
        description: Filter by tag (optional)
- name: scheduler_get_job
  description: Get full job details including action and execution history by job_id
  input_schema:
    type: object
    properties:
      job_id:
        type: string
    required:
    - job_id
- name: scheduler_create_job
  description: Create a new scheduled job
  input_schema:
    type: object
    properties:
      name:
        type: string
      cron_expression:
        type: string
      action:
        type: string
      enabled:
        type: boolean
        description: Whether the job is enabled, default true
      tags:
        type: array
        items:
          type: string
        description: Job tags (optional)
      created_by:
        type: string
        description: Creator name (optional)
    required:
    - name
    - cron_expression
    - action
- name: scheduler_update_job
  description: Update a scheduled job. Only provided fields will be changed.
  input_schema:
    type: object
    properties:
      job_id:
        type: string
      enabled:
        type: boolean
        description: Enable/disable the job (optional)
      cron_expression:
        type: string
        description: New cron expression (optional)
      name:
        type: string
        description: New name (optional)
      action:
        type: string
        description: New action (optional)
      tags:
        type: array
        items:
          type: string
        description: New tags (optional)
    required:
    - job_id
- name: scheduler_delete_job
  description: Delete a scheduled job by job_id
  input_schema:
    type: object
    properties:
      job_id:
        type: string
    required:
    - job_id
- name: scheduler_job_history
  description: Get execution history for a job. Default returns last 10 entries.
  input_schema:
    type: object
    properties:
      job_id:
        type: string
      limit:
        type: integer
        description: Max history entries to return, default 10
    required:
    - job_id
- name: claw_slack_list_channels
  description: List Slack channels. Filter by member, is_private, or include_archived. Returns channel summaries with message/pin
    counts.
  input_schema:
    type: object
    properties:
      member:
        type: string
        description: Filter channels where this user is a member (optional)
      is_private:
        type: boolean
        description: Filter by private/public (optional)
      include_archived:
        type: boolean
        description: Include archived channels (default false)
      max_results:
        type: integer
        description: Max channels to return (default 20)
      offset:
        type: integer
        description: Pagination offset (default 0)
- name: claw_slack_get_channel
  description: Get details of a Slack channel by channel_id, including topic, purpose, members, and pinned_message_ids.
  input_schema:
    type: object
    properties:
      channel_id:
        type: string
    required:
    - channel_id
- name: claw_slack_list_messages
  description: List top-level messages in a Slack channel (thread replies excluded). Returns message_id, sender, text, reactions,
    reply_count.
  input_schema:
    type: object
    properties:
      channel_id:
        type: string
      max_results:
        type: integer
        description: Max messages to return (default 20)
      offset:
        type: integer
        description: Pagination offset (default 0)
    required:
    - channel_id
- name: claw_slack_get_thread
  description: Get the root message and all thread replies for a parent_message_id.
  input_schema:
    type: object
    properties:
      parent_message_id:
        type: string
    required:
    - parent_message_id
- name: claw_slack_post_message
  description: Post a message to a Slack channel. Set parent_message_id to post a thread reply (one level deep only).
  input_schema:
    type: object
    properties:
      channel_id:
        type: string
      sender:
        type: string
      text:
        type: string
      parent_message_id:
        type: string
        description: Reply to this message ID (optional; creates a thread reply)
    required:
    - channel_id
    - sender
    - text
- name: claw_slack_search_messages
  description: Search Slack messages by keyword across active channels. Filter by by_user, after/before timestamps.
  input_schema:
    type: object
    properties:
      query:
        type: string
      by_user:
        type: string
        description: Filter to messages by this sender (optional)
      after:
        type: string
        description: ISO timestamp lower bound (optional)
      before:
        type: string
        description: ISO timestamp upper bound (optional)
      max_results:
        type: integer
        description: Max results (default 20)
      offset:
        type: integer
        description: Pagination offset (default 0)
    required:
    - query
- name: claw_slack_add_reaction
  description: Add an emoji reaction to a Slack message on behalf of a user.
  input_schema:
    type: object
    properties:
      message_id:
        type: string
      emoji:
        type: string
        description: Emoji code e.g. ':thumbsup:'
      user:
        type: string
    required:
    - message_id
    - emoji
    - user
- name: claw_slack_remove_reaction
  description: Remove an emoji reaction from a Slack message.
  input_schema:
    type: object
    properties:
      message_id:
        type: string
      emoji:
        type: string
      user:
        type: string
    required:
    - message_id
    - emoji
    - user
- name: claw_slack_pin_message
  description: Pin a message in a Slack channel.
  input_schema:
    type: object
    properties:
      channel_id:
        type: string
      message_id:
        type: string
    required:
    - channel_id
    - message_id
- name: claw_slack_unpin_message
  description: Unpin a message from a Slack channel.
  input_schema:
    type: object
    properties:
      channel_id:
        type: string
      message_id:
        type: string
    required:
    - channel_id
    - message_id
- name: claw_wechat_list_chats
  description: 'List WeChat chats. type: ''all'' | ''dm'' | ''group''.'
  input_schema:
    type: object
    properties:
      type:
        type: string
        description: '''all'' (default) | ''dm'' | ''group'''
      max_results:
        type: integer
      offset:
        type: integer
- name: claw_wechat_get_chat
  description: Get a WeChat chat with recent messages by chat_id.
  input_schema:
    type: object
    properties:
      chat_id:
        type: string
      max_messages:
        type: integer
        description: Default 50
    required:
    - chat_id
- name: claw_wechat_search_messages
  description: Search WeChat messages by query, optionally limited to one chat.
  input_schema:
    type: object
    properties:
      query:
        type: string
      chat_id:
        type: string
      max_results:
        type: integer
    required:
    - query
- name: claw_wechat_send_message
  description: Send a WeChat message in a chat (recorded in audit).
  input_schema:
    type: object
    properties:
      chat_id:
        type: string
      content:
        type: string
    required:
    - chat_id
    - content
- name: claw_wechat_recall_message
  description: Recall (撤回) a previously sent WeChat message. Irreversible.
  input_schema:
    type: object
    properties:
      chat_id:
        type: string
      message_id:
        type: string
    required:
    - chat_id
    - message_id
- name: claw_wechat_mute_chat
  description: Mute or unmute a WeChat chat. mute=true means do-not-disturb.
  input_schema:
    type: object
    properties:
      chat_id:
        type: string
      mute:
        type: boolean
        description: Default true
    required:
    - chat_id
- name: claw_wechat_browse_moments
  description: Browse WeChat Moments (朋友圈). Optional author filter.
  input_schema:
    type: object
    properties:
      author:
        type: string
      max_results:
        type: integer
      offset:
        type: integer
- name: claw_wechat_search_moments
  description: Search WeChat Moments by keyword.
  input_schema:
    type: object
    properties:
      query:
        type: string
      max_results:
        type: integer
    required:
    - query
- name: claw_wechat_like_moment
  description: Like or unlike a Moments post.
  input_schema:
    type: object
    properties:
      post_id:
        type: string
      like:
        type: boolean
        description: true to like (default), false to unlike
    required:
    - post_id
- name: claw_wechat_comment_moment
  description: Comment on a Moments post.
  input_schema:
    type: object
    properties:
      post_id:
        type: string
      content:
        type: string
    required:
    - post_id
    - content
- name: claw_wechat_post_moment
  description: 'Post a new Moments entry. visibility: ''friends'' (default) or other allowed values.'
  input_schema:
    type: object
    properties:
      content:
        type: string
      images:
        type: array
        items:
          type: string
      visibility:
        type: string
    required:
    - content
- name: sheet_list_workbooks
  description: List all workbooks, optionally filtered by owner.
  input_schema:
    type: object
    properties:
      owner:
        type: string
- name: sheet_open
  description: Open a workbook by workbook_id and return its sheet metadata.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
    required:
    - workbook_id
- name: sheet_get_range
  description: Read a cell range (e.g. 'A1:C10') from a sheet.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      sheet:
        type: string
      range:
        type: string
        description: A1-style range, e.g. 'A1:C10'
    required:
    - workbook_id
    - sheet
    - range
- name: sheet_set_cell
  description: Set the value of a single cell.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      sheet:
        type: string
      cell:
        type: string
        description: A1-style address, e.g. 'B3'
      value: {}
    required:
    - workbook_id
    - sheet
    - cell
    - value
- name: sheet_set_range
  description: Set a 2D range of values starting at start_cell.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      sheet:
        type: string
      start_cell:
        type: string
      values:
        type: array
        items:
          type: array
    required:
    - workbook_id
    - sheet
    - start_cell
    - values
- name: sheet_insert_row
  description: Insert a new row after the given row index, with optional cell values.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      sheet:
        type: string
      after_row:
        type: integer
      values:
        type: array
    required:
    - workbook_id
    - sheet
    - after_row
- name: sheet_create_workbook
  description: Create a new empty workbook with optional initial sheets.
  input_schema:
    type: object
    properties:
      name:
        type: string
      owner:
        type: string
      initial_sheets:
        type: array
        items:
          type: object
    required:
    - name
    - owner
- name: sheet_add_sheet
  description: Add a new sheet to an existing workbook.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      name:
        type: string
    required:
    - workbook_id
    - name
- name: sheet_rename_sheet
  description: Rename a sheet inside a workbook.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      old_name:
        type: string
      new_name:
        type: string
    required:
    - workbook_id
    - old_name
    - new_name
- name: sheet_compute
  description: 'Run an aggregate over a range. op: SUM | AVG | COUNT | MAX | MIN.'
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      sheet:
        type: string
      range:
        type: string
      op:
        type: string
        description: SUM | AVG | COUNT | MAX | MIN
    required:
    - workbook_id
    - sheet
    - range
    - op
- name: sheet_delete_workbook
  description: Permanently delete a workbook by workbook_id. Irreversible.
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
    required:
    - workbook_id
- name: sheet_delete_sheet
  description: Delete a single sheet from a workbook (the workbook itself is preserved).
  input_schema:
    type: object
    properties:
      workbook_id:
        type: string
      sheet:
        type: string
    required:
    - workbook_id
    - sheet
