execution_date: '2026-04-05'
prompt:
  text: I need to wrap up the Q1 customer interview cycle and get the insights deck finalized. Can you pull together all the
    feedback themes from the 40 interviews, cross-reference against our roadmap, and synthesize everything into a comprehensive
    Notion page?
  language: en
scoring_components:
- name: Retrieved Q1 customer interview data from Notion
  weight: 0.2
  check:
    type: tool_called
    tool_name: claw_notion_get_page
    min_calls: 3
- name: Identified top pain points with frequency analysis
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - API rate limits
      - rate limit
      - 429 errors
      - request limits
    - - '28'
      - 22 mentions
      - most frequent
      - highest frequency
    - - webhook reliability
      - webhook delivery
      - delivery failure
    - - SSO integration
      - SAML
      - authentication complexity
- name: Identified feature requests with frequency counts
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - increased rate limits
      - rate limit increase
      - higher rate limits
    - - 22 mentions
      - 22/40
      - 22 interviews
    - - batch API
      - bulk operations
      - batch endpoints
    - - 18 mentions
      - 18/40
      - 18 interviews
    - - GraphQL
      - GraphQL API
    - - advanced RBAC
      - role-based access
      - department-level permissions
- name: Flagged churn risk accounts with supporting evidence
  weight: 0.4
  check:
    type: keywords_present
    keywords:
    - - TechFlow
      - CUS-101
    - - GlobalRetail
      - CUS-103
    - - Apex
      - CUS-107
    - - churn risk
      - high risk
      - evaluating alternatives
      - evaluating competitors
    - - June 2026
      - contract renewal
      - August 2026
- name: Identified conflict between customer requests and Q2 OKR proposals
  weight: 0.4
  check:
    type: keywords_present
    keywords:
    - - data team
      - real-time analytics
      - analytics dashboard
    - - infrastructure capacity
      - database pool
      - connection pool
      - resource conflict
    - - rate limit increase
      - API rate limits
    - - cannot do both
      - conflict
      - competing for
      - overlapping requirements
    - - Q2 OKR
      - Q2 proposal
- name: Cross-referenced against platform roadmap
  weight: 0.2
  check:
    type: tool_called
    tool_name: claw_notion_get_page
    min_calls: 1
- name: Tagged customer feedback by tier using CRM data
  weight: 0.15
  check:
    type: keywords_present
    keywords:
    - - mid-market
      - enterprise
      - professional tier
      - starter tier
    - - customer tier
      - by tier
      - tier breakdown
- name: Created synthesized Notion page with structured findings
  weight: 0.25
  check:
    type: tool_called
    tool_name: claw_notion_create_page
    min_calls: 1
- name: Included verbatim quotes in synthesis
