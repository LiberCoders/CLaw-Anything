execution_date: '2026-04-02'
prompt:
  text: I need help figuring out what to do about my spring ingredient order with Artisan European after rejecting that rancid
    hazelnut paste. The order dropped below the volume discount threshold and I'm trying to balance the cost savings against
    cash flow with my loan payment coming up mid-April. What's the best move here?
  language: en
scoring_components:
- name: Identified all three strategic options
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - accept discount loss
      - proceed with reduced order
      - pay full price on current order
    - - pad order
      - add ingredients to reach threshold
      - add lower-priority items
