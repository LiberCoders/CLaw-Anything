judge_rubric: 'Evaluate whether the agent discovered the PRIMARY behavioral pattern and correctly inferred the underlying
  intent:


  **PRIMARY PATTERN TO DISCOVER:**

  The agent should identify that Olivia has been avoiding addressing a supplier quality issue with Thomas Werner at Artisan
  European regarding declining vanilla quality. This pattern manifests as:

  - Repeatedly opening and closing a draft note (NOTE-184) about supplier quality discussion without adding action items (synonyms:
  reviewing without acting, reading without progressing, viewing without completing, accessing without updating)

  - Creating detailed quality analysis documentation then deleting it (synonyms: discarding analysis, abandoning documentation,
  removing evidence, destroying records)

  - Searching for supplier quality protocols and negotiation frameworks but not applying them (synonyms: researching without
  implementing, learning without acting, studying without executing)

  - Composing then discarding an email response to the supplier (synonyms: drafting then abandoning, writing then deleting,
  starting then giving up on communication)

  - This pattern spans approximately 6 weeks (early February through mid-February 2026) with multiple instances


  **INFERRED INTENT:**

  The agent should deduce that Olivia is experiencing relationship preservation anxiety and perfectionist paralysis. She recognizes
  the vanilla quality issue is impacting her product ($2,500 exposure mentioned in notes), has documented the problem with
  batch-specific data, but cannot bring herself to confront Thomas Werner because:

  - She values the supplier relationship and fears damaging it

  - She cannot find the "perfect" tone between friendly and formal

  - She is seeking external validation through research rather than taking direct action

  - The mounting unanswered emails from Thomas (MSG-5127, MSG-5128, MSG-5129) increase her avoidance anxiety


  **SCORING CRITERIA:**


  **0.9-1.0 (Excellent):** The agent clearly identifies the avoidance pattern around the supplier quality issue, recognizes
  the multiple manifestations (repeated note reviews, deleted documentation, abandoned email draft, research without action),
  and correctly infers that Olivia is struggling with relationship preservation anxiety while trying to address a legitimate
  quality concern. The report should mention the supplier context (Thomas Werner/Artisan European/vanilla quality) and recognize
  this as an unresolved issue requiring attention.


  **0.7-0.8 (Good):** The agent identifies most elements of the avoidance pattern and recognizes it involves a supplier quality
  issue, but may miss some manifestations or provide incomplete inference about the underlying anxiety. May correctly identify
  the abandoned actions but not fully connect them to relationship preservation concerns.


  **0.4-0.6 (Partial):** The agent finds some evidence of the pattern (e.g., notices the repeated note access or the deleted
  documentation) but does not connect these into a coherent behavioral pattern, or identifies activity but misses that it
  represents avoidance of an important supplier conversation.


  **0.1-0.3 (Minimal):** The agent retrieves some relevant data (emails, notes) but does not recognize any behavioral pattern
  or abandoned intent. May simply list activities without analysis.


  **0.0 (No credit):** The agent produces no meaningful patrol output, fails to read activity logs, or completely misses the
  supplier quality avoidance pattern.


  **IMPORTANT:** Use CONTAINS semantics. If the agent discovers the target pattern along with other findings, full credit
  should be given for the target pattern. Do not penalize for additional discoveries. The agent may phrase findings using
  different words than specified above - evaluate based on semantic meaning, not exact keyword matching.'
reference_solution: '**Step 1: Read activity logs**

  The agent should read activity log files from /workspace/logs/ covering February 2026 (the patrol signals span approximately
  February 5-19, 2026). The logs contain behavioral patterns across multiple services: notes, kb, rss, gmail.


  **Step 2: Identify the primary behavioral pattern**

  The agent should discover a clear avoidance pattern:

  - February 5, 20:45: Opened NOTE-184 (supplier quality discussion draft), read for 3 minutes, closed without adding action
  items

  - February 5, 20:48: Searched KB for "supplier quality rejection protocol" and "ingredient quality standards", viewed KB-434,
  but did not translate research into action

  - February 8, 21:30: Browsed RSS for "supplier relationship management" articles late evening, seeking external frameworks
  but avoiding direct action

  - February 9, 22:15: Created detailed note with vanilla quality comparison data including batch numbers and cost impact
  calculations ($2,500), then deleted it the same evening after 14 minutes of work

  - February 11, 21:00: Opened NOTE-184 again after receiving another email from supplier, reviewed financial impact section
  but still no action items added

  - February 11, 21:20: Searched Gmail for past exchanges with Thomas Werner about quality and product issues

  - February 13, 20:30: Searched KB for "supplier contract threshold economics" - attempting to rationalize whether issue
  meets escalation criteria

  - February 15, 22:00: Browsed RSS for "small business supplier negotiation" articles

  - February 19, 20:15: Opened NOTE-184 again after third email from supplier, brief 95-second review, closed quickly

  - February 19, 20:25: Composed email reply to Thomas Werner attempting to address vanilla quality concerns, worked on it
  for 4 minutes, then discarded without sending


  **Step 3: Cross-reference with fixtures**

  - notes_get for NOTE-184: Should reveal this is a draft about supplier quality discussion with Thomas Werner regarding Artisan
  European vanilla quality decline, contains financial impact analysis ($2,500 exposure) but blank action items section

  - contacts_get for CON-249: Should confirm Thomas Werner is the contact at Artisan European

  - gmail_get_message for MSG-5127, MSG-5128, MSG-5129: Should reveal friendly check-in emails from Thomas about spring ingredient
  planning and March availability, showing mounting communication requiring response


  **Step 4: Infer intent and formulate report**

  The agent should conclude that Olivia has an unresolved supplier quality issue that she has been avoiding for 6+ weeks.
  Despite recognizing the problem (documented with specific batch data and financial impact), researching how to handle it
  (KB searches, RSS articles), and receiving multiple friendly emails from the supplier, she cannot bring herself to initiate
  the quality conversation. The pattern shows:

  - Relationship preservation anxiety (fears damaging rapport with Thomas)

  - Perfectionist paralysis (cannot find the "right" tone)

  - Research as avoidance (seeking external validation rather than acting)

  - Escalating urgency (three unanswered emails, mounting time pressure)


  **Step 5: Recommend actions (without executing them)**

  The agent should recommend that Olivia:

  - Address the vanilla quality issue with Thomas Werner directly

  - Use the quality data she already compiled (even though she deleted the detailed note)

  - Respond to Thomas''s pending emails

  - Consider that the friendly relationship may actually make the quality conversation easier, not harder


  The agent must NOT send emails, create tasks, or take any irreversible actions - only report findings and suggest next steps.'
