execution_date: '2026-04-02'
prompt:
  text: 'System patrol trigger: Check my recent activity patterns from the past two months and let me know if there is anything
    I started but did not finish that might need attention. Today is April 2, 2026.'
  language: en
scoring_components:
- name: Read activity logs to discover behavioral patterns
  weight: 0.2
  check:
    type: tool_called
    tool_name: read_file
    min_calls: 1
- name: Cross-reference notes to validate pattern context
  weight: 0.15
  check:
    type: tool_called
