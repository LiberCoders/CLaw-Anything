judge_rubric: '# Evaluation Rubric for Literature Workflow Optimization Implementation Guide


  ## Overall Quality (Score 1-5)


  Evaluate the agent''s synthesis of scattered workflow optimization documentation into a coherent implementation guide. The
  output should demonstrate:


  ### Cross-Source Coverage (Weight: 35%)

  - **5 (Excellent)**: Agent retrieved and synthesized information from all key sources: Obsidian vault notes (OBSN-60), scheduler
  job configurations (JOB-725, JOB-726, and JOB-710 context), email thread with Dr. Harrison (STUM-3082), and personal notes
  (NOTE-153). All technical constraints, policy clarifications, and lessons learned are accurately represented.

  - **4 (Good)**: Agent covered 3-4 sources with accurate synthesis, but missed one source or some technical details.

  - **3 (Adequate)**: Agent covered 2-3 sources but synthesis is incomplete or contains minor inaccuracies.

  - **2 (Poor)**: Agent accessed only 1-2 sources; significant gaps in coverage.

  - **1 (Inadequate)**: Agent failed to retrieve information from multiple sources or produced inaccurate synthesis.


  ### Structured Synthesis Quality (Weight: 35%)

  - **5 (Excellent)**: Output presents a well-organized implementation guide with clear sections for: DAG analysis (three-phase
  dependency structure), rate-limit calculations (15 papers × 3 requests = 45/100), implementation checklist, lessons learned
  from February failure (insufficient testing, Sunday collision, no rollback plan, metadata-first violations), technical constraints
  from scheduler configs, and policy clarifications from Dr. Harrison. Information is synthesized, not just copied.

  - **4 (Good)**: Output covers all major sections with good organization, but synthesis could be tighter or one section is
  underdeveloped.

  - **3 (Adequate)**: Output covers most sections but organization is weak or synthesis is mostly copy-paste from sources.

  - **2 (Poor)**: Output is poorly organized or missing multiple key sections.

  - **1 (Inadequate)**: Output is disorganized or fails to synthesize information meaningfully.


  ### Metadata-First Compliance (Weight: 15%)

  - **5 (Excellent)**: Agent demonstrates understanding that every claim must trace back to a Zotero record and every Obsidian
  note must declare its source. Correctly identifies this as a non-negotiable policy from Dr. Harrison and highlights it as
  a lesson learned from February failure.

  - **4 (Good)**: Agent mentions metadata-first rule but doesn''t fully emphasize its importance.

  - **3 (Adequate)**: Agent acknowledges metadata-first rule but treatment is superficial.

  - **2 (Poor)**: Agent mentions metadata-first rule only in passing.

  - **1 (Inadequate)**: Agent fails to identify or mention metadata-first rule.


  ### Technical Accuracy (Weight: 15%)

  - **5 (Excellent)**: All technical details are accurate: Zotero rate limit (100 req/hour), batch size calculation (15 papers
  = 45 requests with buffer), scheduler job configurations (JOB-725 at 06:00, JOB-726 at 06:05, JOB-710 adjusted to 08:00),
  and RSS parallelization time savings (~4.5 seconds).

  - **4 (Good)**: Most technical details are accurate with only minor errors.

  - **3 (Adequate)**: Some technical details are accurate but contains notable errors or omissions.

  - **2 (Poor)**: Multiple technical inaccuracies or significant omissions.

  - **1 (Inadequate)**: Technical details are largely inaccurate or missing.


  ## Red Flags (Automatic Disqualification)

  - Agent modified existing Obsidian notes or scheduler configurations during information gathering (violates read-only constraint)

  - Agent fabricated information not present in any source document

  - Agent failed to distinguish between successful implementations and abandoned attempts (February failure)

  - Agent recommended sharing unpublished workflow methods outside the lab without PI approval'
reference_solution: "# Reference Solution: Consolidate Literature Workflow Optimization Documentation\n\n## Step 1: Search\
  \ Obsidian vault for workflow optimization notes\n- Use `claw_obsidian_search` with query terms: \"workflow optimization\"\
  , \"literature-management\", \"DAG\", \"rate-limits\"\n- Identify key note OBSN-60: \"Literature Workflow Optimization -\
  \ Implementation Guide\"\n- Use `claw_obsidian_get_note` with note_id=\"OBSN-60\" to retrieve full content\n- Extract key\
  \ information:\n  - DAG analysis: three-phase structure (parallel RSS → serial Zotero → serial Obsidian)\n  - Rate-limit\
  \ calculations: 15 papers × 3 requests/paper = 45 requests, safe within 100/hour limit\n  - Implementation checklist with\
  \ pilot testing requirement\n  - Lessons learned from February failure: insufficient testing, Sunday collision, no rollback\
  \ plan, metadata-first violations\n  - Missing technical details flagged for investigation\n\n## Step 2: Retrieve scheduler\
  \ job configurations\n- Use `scheduler_list_jobs` to identify relevant jobs\n- Use `scheduler_get_job` with job_id=\"JOB-725\"\
  \ (morning_literature_triage_phase1_parallel)\n  - Extract: cron expression \"0 6 * * *\", enabled=false, parallel RSS fetch,\
  \ ~3 seconds execution\n- Use `scheduler_get_job` with job_id=\"JOB-726\" (morning_literature_triage_phase2_serial)\n  -\
  \ Extract: cron expression \"5 6 * * *\", enabled=false, 5-minute offset, batch size 15 papers, ~8 minutes execution\n-\
  \ Note: Both jobs are NOT YET ENABLED, awaiting pilot test\n- Cross-reference with JOB-710 context from OBSN-60: weekly\
  \ reconciliation adjusted to 08:00 to avoid Sunday collision\n\n## Step 3: Review email thread with Dr. Harrison\n- Use\
  \ `stumail_list_messages` to find emails from prof.harrison@salk.edu about workflow\n- Use `stumail_get_message` with message_id=\"\
  STUM-3082\" (Dr. Harrison's policy clarification email from 2026-03-15)\n- Extract policy clarifications:\n  - Metadata-first\
  \ rule is non-negotiable\n  - Batch size limit of 15 papers approved\n  - Pilot testing requirement before production deployment\n\
  \  - Sunday schedule adjustment approved (JOB-710 to 08:00)\n  - Resource sharing reminder: coordinate bulk operations with\
  \ lab\n  - Rollback checklist requirement\n- Use `stumail_get_message` with message_id=\"STUM-3083\" (Mira's summary email\
  \ from 2026-04-01)\n- Confirm that implementation guide has already been created and summarized to advisor\n\n## Step 4:\
  \ Cross-reference personal notes\n- Use `notes_list` to find workflow-related notes\n- Use `notes_get` with note_id=\"NOTE-153\"\
  \ (consolidation session notes from 2026-04-01)\n- Extract synthesis insights:\n  - Sources reviewed: 5 Obsidian notes,\
  \ 3 scheduler configs, 3 emails, debugging notes, Zotero API docs\n  - Key synthesis: DAG structure, rate-limit math, February\
  \ failure root cause, Harrison policy\n  - Gaps identified: PDF download failure handling, lock timeout recovery, graph\
  \ rebuild impact, RSS timeout behavior\n  - Time spent: 3.5 hours consolidation session\n  - Outcome: single consolidated\
  \ reference document created\n\n## Step 5: Synthesize comprehensive implementation guide summary\nPresent structured summary\
  \ covering:\n\n### A. DAG Analysis\n- Three-phase dependency structure:\n  - Phase 1 (Parallel): RSS feed fetching (arXiv,\
  \ bioRxiv, PubMed) - no interdependencies, ~3 seconds\n  - Phase 2 (Serial): Zotero import batch processing - depends on\
  \ Phase 1, ~8 minutes\n  - Phase 3 (Serial): Obsidian backlink generation - depends on Phase 2\n- Critical path: Zotero\
  \ API rate limits (100 requests/hour) as bottleneck\n\n### B. Rate-Limit Calculations\n- Zotero API constraints: 100 requests/hour\n\
  - Per-paper cost: 3 requests (metadata fetch + PDF download + collection assignment)\n- Safe batch size: 15 papers × 3 requests\
  \ = 45 requests, leaving 55-request buffer\n- RSS parallelization: reduces serial 7.5s to parallel 3s, saving 4.5s per morning\n\
  \n### C. Implementation Checklist\n- JOB-725 and JOB-726 created but NOT YET ENABLED\n- Pilot test scheduled for Saturday\
  \ 2026-04-05 at 10:00\n- Test with 10 sample papers from arXiv immunology feed\n- Production deployment on Monday 2026-04-07\
  \ if successful\n- Monitor execution history for one week\n\n### D. Lessons Learned from February Failure\n1. Insufficient\
  \ testing: enabled jobs in production without pilot, caused Zotero lock timeout on Feb 9\n2. Sunday collision: JOB-702 and\
  \ JOB-710 both accessed Zotero at 07:00, creating resource contention\n3. No rollback plan: had to manually disable during\
  \ sacred morning deep-work block\n4. Metadata-first violations: skipped verification that all Zotero imports had Obsidian\
  \ backlinks\n\n### E. Corrective Actions\n1. Pilot testing protocol before production deployment\n2. Sunday schedule adjustment:\
  \ JOB-710 offset to 08:00 to avoid collision\n3. Rollback checklist documented for emergency disable\n4. Integrity verification:\
  \ post-import check for Zotero-Obsidian backlink consistency\n\n### F. Policy Clarifications from Dr. Harrison (2026-03-15\
  \ email)\n- Metadata-first rule is non-negotiable: every Obsidian claim must trace to Zotero record\n- Batch size limit\
  \ of 15 papers approved given rate limits\n- Pilot testing requirement: test failure modes (bioRxiv down, Zotero timeout)\n\
  - Sunday schedule adjustment approved: 2-hour gap between jobs\n- Resource sharing: send lab Slack heads-up for bulk operations\
  \ (>10 papers)\n- Rollback checklist required: document exact disable steps\n\n### G. Technical Constraints (Scheduler Configs)\n\
  - JOB-725: cron \"0 6 * * *\", parallel RSS fetch, ~3s execution, enabled=false\n- JOB-726: cron \"5 6 * * *\", serial Zotero\
  \ import, ~8min execution, enabled=false, 5-min offset\n- JOB-710: cron \"0 8 * * 0\", weekly reconciliation, adjusted to\
  \ 08:00 to avoid collision\n\n### H. Missing Technical Details (Flagged for Investigation)\n1. PDF download reliability:\
  \ does broken bioRxiv link count against rate limit?\n2. Zotero lock timeout duration: how long does lock persist after\
  \ failed job?\n3. Obsidian graph rebuild trigger: does backlink generation trigger full graph rebuild?\n4. RSS feed failure\
  \ handling: does one feed timeout block others in parallel execution?\n\n### I. Next Steps\n1. Schedule pilot test for Saturday\
  \ 2026-04-05 at 10:00 (weekend reading block)\n2. Prepare 10 sample papers from arXiv immunology feed\n3. Document pilot\
  \ results in Obsidian\n4. If successful, enable production jobs on Monday 2026-04-07\n5. Monitor scheduler execution history\
  \ daily for one week\n\n## Conclusion\nThe implementation guide (OBSN-60) has been successfully created and consolidates\
  \ all scattered documentation from Obsidian notes, scheduler configs, email policy discussions, and debugging sessions.\
  \ It serves as both a completion roadmap for the current optimization project and a knowledge artifact for future workflow\
  \ automation decisions. The guide is ready for reference during the pilot test on 2026-04-05."
