task_id: T23_T10_weekly_strategic_project_task_planning_f
task_name: Weekly strategic project task planning from Q1 board preparation backlog
version: '1.0'
category: personal_productivity
difficulty: simple
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
