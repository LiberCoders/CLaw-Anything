judge_rubric: '# Evaluation Rubric


  ## Excellent (0.9–1.0)

  - Systematically searched knowledge base for trauma imaging protocols and CT angiography guidelines

  - Retrieved and synthesized clinical governance meeting notes to identify recent discussions on imaging utilization and
  missed diagnoses

  - Produced a well-structured guidance document with clear clinical decision points organized by trauma scenario (blunt vs
  penetrating, anatomical region, mechanism of injury)

  - Included specific CT angiography indications with clinical thresholds that registrars can apply during trauma activations

  - Explicitly addressed information governance by ensuring all case references are anonymized and no identifiable patient
  information is included

  - Integrated lessons from recent cases without breaching confidentiality

  - Structured content for rapid reference during high-pressure trauma calls (e.g., bullet points, decision trees, clear headings)

  - Acknowledged need for Medical Director review before external publication


  ## Good (0.7–0.89)

  - Searched knowledge base and accessed clinical governance notes

  - Synthesized key CT angiography protocols and decision frameworks

  - Created structured guidance with most major clinical scenarios covered

  - Addressed anonymization requirements, though may lack explicit information governance language

  - Content is registrar-focused but may be slightly verbose or less optimized for rapid reference

  - Minor gaps in cross-referencing protocols with governance discussions


  ## Adequate (0.5–0.69)

  - Retrieved some protocols from knowledge base or notes but coverage is incomplete

  - Provided basic CT angiography guidance but lacks depth in clinical decision points

  - Structure is present but not optimally organized for trauma activation scenarios

  - Mentions anonymization but does not thoroughly address information governance requirements

  - May miss integration of recent clinical governance lessons

  - Content may be too general or not sufficiently tailored to registrar needs


  ## Poor (below 0.5)

  - Failed to systematically search knowledge base or clinical governance notes

  - Produced generic imaging guidance not specific to trauma CT angiography protocols

  - Lacks clear structure or clinical decision frameworks

  - Does not address information governance or anonymization requirements

  - Content is not practical for registrar reference during trauma calls

  - May include inappropriate patient-identifiable information or recommend protocol modifications without governance approval'
reference_solution: '# Reference Solution


  ## Step 1: Search knowledge base for trauma imaging protocols

  - Use `kb_search` with queries like "trauma imaging protocol", "CT angiography", "vascular injury imaging", "trauma CT guidelines"

  - Use `kb_get_article` to retrieve full content of relevant protocol articles

  - Extract existing departmental standards for CT angiography indications in trauma


  ## Step 2: Review clinical governance meeting notes

  - Use `notes_list` to identify recent clinical governance meeting notes

  - Use `notes_get` to retrieve notes containing discussions on imaging utilization, missed diagnoses, or protocol reviews

  - Look for case discussions involving vascular injuries, aortic dissections, or imaging decision-making

  - Extract lessons learned and areas where registrars need additional guidance


  ## Step 3: Synthesize content into structured guidance

  - Organize by clinical scenario: blunt trauma, penetrating trauma, specific anatomical regions

  - Create clear decision points: mechanism of injury, physical examination findings, hemodynamic status

  - List specific CT angiography indications with clinical thresholds

  - Include common pitfalls and high-risk scenarios (e.g., deceleration injuries, thoracic trauma)

  - Reference departmental protocols while incorporating governance insights


  ## Step 4: Ensure information governance compliance

  - Review all case references to ensure complete anonymization

  - Remove any patient identifiers, dates, or details that could identify individuals

  - Add explicit statement about information governance compliance

  - Note that document is for internal registrar reference and requires Medical Director review before external distribution


  ## Step 5: Structure for practical use

  - Format with clear headings, bullet points, and decision trees

  - Optimize for rapid reference during trauma activations

  - Include summary table or algorithm at the beginning

  - Provide context on when to escalate imaging decisions to consultant


  ## Step 6: Present compiled guidance

  - Save as draft or present content to Benjamin for review

  - Do NOT send via email or publish without approval

  - Do NOT modify existing KB protocol articles'
