task_id: T22_T15_sunk_cost_decision_transcriptpro_service
task_name: 'Sunk Cost Decision: TranscriptPro Service Cancellation vs. Retention'
version: '1.0'
category: conflict_detection
difficulty: hard
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
