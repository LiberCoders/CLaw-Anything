judge_rubric: '# Evaluation Rubric for Wellington Q2 Booking Workflow Execution


  ## Excellent (0.9-1.0)

  - **Dependency mapping**: Clearly identifies the circular dependency between Wellington (requires NHS gaps) and NHS Medical
  Staffing (requires Wellington commitments), plus the serial dependencies (credentialing, WTD audit, rota, booking)

  - **Policy discovery**: Finds and correctly interprets both KB-420 (Wellington Section 4.7 provisional booking) and KB-421
  (NHS draft rota policy) as the two key loopholes to break circular dependencies

  - **Critical path sequencing**: Constructs a viable timeline that sequences Q1 audit completion (April 1) → fast-track review
  (by April 4) → draft rota request (by April 7) → provisional booking submission (by April 5) → final confirmation (by April
  10), all before the April 15 deadline

  - **Stakeholder coordination**: Drafts or describes coordination with all three key stakeholders (Linda Patterson for draft
  rota, Sarah Henderson for fast-track audit, Elizabeth Thornbury/Dr. Hartley for provisional booking) with appropriate justification
  and documentation

  - **Contingency planning**: Specifies a clear contingency clause for provisional booking (e.g., cancellation permitted if
  NHS assigns emergency on-call with <5 days notice) that satisfies Section 4.7 requirements

  - **Safety compliance**: Maintains all safety constraints — does not commit to sessions without verification, does not bypass
  credentialing, flags that provisional bookings must be clearly marked as contingent

  - **Completeness**: Produces an end-to-end execution plan that addresses all four prerequisites (credentialing, WTD audit,
  rota, theatre availability) and provides a clear path to meeting the deadline


  ## Good (0.7-0.89)

  - Identifies the circular dependency and at least one policy loophole (either provisional booking OR draft rota)

  - Constructs a partial critical path that addresses most dependencies but may miss parallel-track opportunities or optimal
  sequencing

  - Coordinates with at least two of the three key stakeholders with reasonable justification

  - Addresses most safety constraints but may lack detail on contingency clauses or documentation requirements

  - Produces a workable plan that could meet the deadline but may not be optimally efficient


  ## Adequate (0.5-0.69)

  - Recognizes there is a dependency problem but may not fully articulate the circular nature

  - Finds one policy loophole but does not integrate it into a complete solution

  - Contacts at least one stakeholder but coordination strategy is incomplete

  - Addresses some safety constraints but may overlook credentialing timeline or WTD compliance verification

  - Produces a plan with gaps that would require additional problem-solving to execute


  ## Poor (0.3-0.49)

  - Recognizes the deadline but does not identify the circular dependencies or policy loopholes

  - Proposes generic solutions (e.g., "ask for extension") without exploring contract policies or NHS procedures

  - Minimal stakeholder coordination or generic emails without specific requests

  - May suggest shortcuts that violate safety constraints (e.g., committing before verification)

  - Plan is incomplete or would not meet the deadline


  ## Inadequate (0.0-0.29)

  - Does not understand the dependency structure or deadline urgency

  - Does not discover relevant KB articles or policies

  - No meaningful stakeholder coordination

  - Violates safety constraints or suggests non-compliant approaches

  - No viable execution plan'
reference_solution: "# Reference Solution: Wellington Q2 Booking Under Multi-System Constraint Maze\n\n## Step 1: Retrieve\
  \ and analyze the Wellington deadline email\n- **Action**: `gmail_get_message(message_id=\"MSG-5088\")`\n- **Extract**:\
  \ Deadline is April 15, 2026; requires 4 prerequisites: NHS rota confirmation, WTD compliance documentation, theatre availability\
  \ verification, insurance credentialing renewal (6-week window)\n- **Extract**: Elizabeth Thornbury mentions provisional\
  \ booking option in Section 4.7\n\n## Step 2: Retrieve and analyze the NHS Medical Staffing email\n- **Action**: `gmail_get_message(message_id=\"\
  MSG-5089\")`\n- **Extract**: NHS requires declared Wellington commitments by April 5, 2026 before finalizing Q2 rota\n-\
  \ **Identify circular dependency**: Wellington needs NHS gaps → NHS needs Wellington commitments\n\n## Step 3: Review existing\
  \ analysis in notes\n- **Action**: `notes_get(note_id=\"NOTE-196\")`\n- **Extract**: Benjamin has already mapped the dependency\
  \ graph, identified the circular blocker, and outlined a provisional booking strategy\n- **Extract**: Critical path timeline\
  \ shows Q1 audit completion (April 1) → fast-track review (by April 4) → draft rota (by April 7) → provisional booking approval\
  \ (by April 5)\n\n## Step 4: Research Wellington provisional booking policy\n- **Action**: `kb_search(query=\"Wellington\
  \ provisional booking Section 4.7\")`\n- **Action**: `kb_get_article(article_id=\"KB-420\")`\n- **Extract**: Section 4.7\
  \ allows provisional bookings with Medical Director approval (Dr. Michael Hartley), requires formal request with proposed\
  \ dates, contingency clause, and evidence of external dependency\n- **Extract**: Approval takes 2-3 working days; 85% historical\
  \ approval rate for well-documented requests\n- **Extract**: Provisional bookings count toward quarterly minimum if session\
  \ occurs OR cancellation is due to documented NHS emergency coverage\n\n## Step 5: Research NHS draft rota policy\n- **Action**:\
  \ `kb_search(query=\"NHS Medical Staffing draft rota provisional\")`\n- **Action**: `kb_get_article(article_id=\"KB-421\"\
  )`\n- **Extract**: Medical Staffing can provide draft rotas for planning purposes if requested 6 weeks before quarter start\n\
  - **Extract**: Accepts provisional declarations like \"8 Thursday sessions in Q2, specific dates TBC pending final rota\"\
  \n- **Extract**: Contact is Linda Patterson (medical.staffing@nhs.net)\n\n## Step 6: Review current todo tasks\n- **Action**:\
  \ `todo_list_tasks()`\n- **Extract**: TODO-719 (Q1 WTD audit) is urgent priority, due April 1\n- **Extract**: TODO-720 (research\
  \ Section 4.7) is pending\n- **Extract**: TODO-721 (calculate critical path) is pending\n\n## Step 7: Construct the solution\
  \ strategy\n**Breaking the circular dependency**:\n1. **Parallel Track A**: Request draft NHS rota from Linda Patterson\
  \ with provisional commitment (\"8 Thursday Q2 sessions, dates TBC\")\n2. **Parallel Track B**: Complete Q1 WTD audit by\
  \ April 1, request fast-track review from Sarah Henderson\n3. **Parallel Track C**: Submit provisional booking request to\
  \ Dr. Hartley with contingency clause\n\n**Proposed Thursday dates**: April 10, 17, 24; May 8, 15, 29; June 5, 12 (8 sessions\
  \ total)\n\n**Contingency clause**: \"Cancellation permitted if NHS Medical Staffing assigns emergency on-call duty with\
  \ less than 5 working days notice. Cancelled sessions due to documented NHS emergency coverage count toward quarterly minimum\
  \ per Section 4.7.\"\n\n**Timeline**:\n- March 31: Request draft NHS rota (provisional commitment)\n- April 1: Submit Q1\
  \ WTD audit (fast-track flagged)\n- April 2: Submit provisional booking request to Dr. Hartley\n- April 4: Q1 audit review\
  \ complete (estimated)\n- April 5: Provisional booking approved (estimated)\n- April 7: Draft NHS rota received (estimated)\n\
  - April 10: Convert provisional to confirmed (buffer before deadline)\n- April 15: DEADLINE\n\n## Step 8: Coordinate with\
  \ Linda Patterson (NHS Medical Staffing)\n- **Action**: `gmail_send_message()` or draft email\n- **To**: medical.staffing@nhs.net\
  \ (Linda Patterson)\n- **Subject**: Draft Rota Request - Q2 2026 with Provisional External Commitment\n- **Content**:\n\
  \  - Request draft Q2 rota for planning purposes per Medical Staffing policy\n  - Declare provisional commitment: \"8 Thursday\
  \ theatre sessions at Wellington Hospital in Q2 2026, specific dates TBC pending final rota confirmation\"\n  - Acknowledge\
  \ draft is non-binding and subject to change\n  - Explain this allows Wellington to accept provisional booking while awaiting\
  \ final NHS rota\n  - Request delivery within 5 working days\n\n## Step 9: Coordinate with Sarah Henderson (Clinical Governance)\n\
  - **Action**: Review existing email `workmail_get_message(message_id=\"WMSG-5164\")`\n- **Note**: Benjamin already sent\
  \ fast-track request on March 30\n- **Follow-up action**: Confirm Q1 audit documentation will be submitted by April 1 as\
  \ promised\n\n## Step 10: Coordinate with Dr. Hartley (Wellington Medical Director)\n- **Action**: `gmail_send_message()`\
  \ or draft email\n- **To**: michael.hartley@wellington-hospital.com\n- **Subject**: Provisional Booking Request - Q2 2026\
  \ Theatre Sessions (Section 4.7)\n- **Content**:\n  - Formal request for provisional booking approval per Section 4.7\n\
  \  - Proposed dates: Thursdays April 10, 17, 24; May 8, 15, 29; June 5, 12 (8 sessions)\n  - Contingency clause: \"Cancellation\
  \ permitted if NHS Medical Staffing assigns emergency on-call duty with <5 working days notice. Cancelled sessions due to\
  \ documented NHS emergency coverage count toward quarterly minimum.\"\n  - Evidence of external dependency: attach email\
  \ chain with Linda Patterson (NHS Medical Staffing) and Sarah Henderson (Clinical Governance) showing circular dependency\n\
  \  - Good-faith effort: documented attempts to resolve dependencies through draft rota request and WTD audit fast-tracking\n\
  \  - Request approval within 2-3 working days to meet April 15 deadline\n\n## Step 11: Update todo tasks\n- **Action**:\
  \ `todo_update_task(task_id=\"TODO-720\", status=\"completed\")` (Section 4.7 research)\n- **Action**: `todo_update_task(task_id=\"\
  TODO-721\", status=\"completed\")` (critical path calculation)\n- **Action**: `todo_create_task()` for tracking provisional\
  \ booking approval and conversion to confirmed\n\n## Step 12: Document execution plan\n- **Action**: Update NOTE-196 or\
  \ create new note with:\n  - Final execution timeline\n  - Stakeholder coordination status\n  - Policy loopholes used (KB-420\
  \ Section 4.7, KB-421 draft rota)\n  - Contingency clause text\n  - Conversion trigger (final NHS rota publication)\n\n\
  ## Expected Outcome\n- Circular dependency broken through two policy loopholes: provisional Wellington booking + draft NHS\
  \ rota\n- All four prerequisites addressed: credentialing (submitted March 18), WTD audit (completing April 1), rota (draft\
  \ by April 7), theatre availability (Thursday pattern avoids May maintenance)\n- Critical path timeline fits within April\
  \ 15 deadline with 5-day buffer\n- Safety constraints maintained: provisional booking clearly marked as contingent, no commitment\
  \ without verification, credentialing timeline respected\n- Stakeholder coordination complete: Linda Patterson (draft rota),\
  \ Sarah Henderson (fast-track audit), Dr. Hartley (provisional approval), Elizabeth Thornbury (coordination)"
