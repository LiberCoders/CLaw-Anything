execution_date: '2026-04-02'
prompt:
  text: I need to get my Wellington Q2 theatre sessions booked before the April 15th deadline, but I'm stuck in a circular
    dependency mess between their system and NHS Medical Staffing. Can you figure out a way through this and get everything
    sorted?
  language: en
scoring_components:
- name: Identified circular dependency structure
  weight: 0.2
  check:
    type: keywords_present
    keywords:
    - - circular dependency
      - circular blocker
      - catch-22
      - mutual dependency
    - - Wellington requires NHS
      - Wellington needs rota
      - Wellington needs confirmed gaps
    - - NHS requires Wellington
      - Medical Staffing requires declared
      - NHS needs commitments
- name: Identified provisional booking policy solution
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - Section 4.7
      - provisional booking
      - contingent booking
      - provisional session
    - - Medical Director approval
      - Dr. Hartley
      - Dr. Michael Hartley
    - - contingency clause
      - contingent on
      - subject to final confirmation
      - cancellation conditions
- name: Identified draft rota policy workaround
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - draft rota
      - provisional rota
      - indicative rota
      - draft NHS rota
    - - Linda Patterson
      - Medical Staffing Coordinator
    - - provisional commitment
      - provisional declaration
      - TBC pending final
- name: Prioritized Q1 WTD audit completion
  weight: 0.2
  check:
    type: keywords_present
    keywords:
    - - Q1 audit
      - Q1 WTD
      - Working Time Directive audit
      - WTD compliance
    - - fast-track
      - expedited review
      - prioritize
      - urgent processing
    - - Sarah Henderson
      - Clinical Governance
    - - April 1
      - 1st April
      - 1 April
      - Tuesday
- name: Consulted Wellington contract KB article
  weight: 0.15
  check:
    type: tool_called
    tool_name: kb_search
    min_calls: 1
- name: Retrieved critical emails from stakeholders
  weight: 0.15
  check:
    type: tool_called
    tool_name: gmail_get_message
    min_calls: 2
- name: Coordinated with multiple stakeholders
  weight: 0.2
  check:
    type: keywords_present
    keywords:
    - - email to Linda
