task_id: T23_T09_project_njord_phase_2_vendor_continuatio
task_name: Project Njord Phase 2 vendor continuation decision under sunk cost pressure
version: '1.0'
category: conflict_detection
difficulty: simple
services:
- name: gmail
  command: python mock_services/gmail/server.py
  port: 9100
  health_check: http://localhost:9100/gmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9100/gmail/reset
