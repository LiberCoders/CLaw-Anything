task_id: TGUI14_calendar_payment_sms_obsidian
task_name: Calendar reminder triggers client payment follow-up, check Obsidian contract then send SMS
version: '1.0'
category: workflow_execution
difficulty: simple
task_env:
- mobile_gui
- cli
apps:
- name: Fossify Calendar
  package: org.fossify.calendar
  role: View and create calendar events via Fossify Calendar
- name: Contacts
  package: com.google.android.contacts
  role: Look up contact information via Android Contacts
- name: Fossify Messages
  package: org.fossify.messages
  role: Read and send SMS messages via Fossify Messages
inject:
- type: calendar
  fixture: fixtures/gui/fossify_calendar_gui/events.json
  description: Fossify Calendar fixture data for task TGUI14
- type: contacts
  fixture: fixtures/gui/contacts_gui/contacts.json
  description: Contacts fixture data for task TGUI14
- type: fossify_messages
  fixture: fixtures/gui/fossify_messages_gui/threads.json
  description: Fossify Messages fixture data for task TGUI14
services:
- name: config
  command: python mock_services/config/server.py
  port: 9111
  health_check: http://localhost:9111/config/integrations
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9111/config/reset
  env:
    CONFIG_FIXTURES: gen_tasks_GUI/CLI_GUI_Tasks/complex_tasks/TGUI14_calendar_payment_sms_obsidian/fixtures/config/integrations.json
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: gen_tasks_GUI/CLI_GUI_Tasks/complex_tasks/TGUI14_calendar_payment_sms_obsidian/fixtures/scheduler/jobs.json
- name: claw_obsidian
  command: python mock_services/claw_obsidian/server.py
  port: 9115
  health_check: http://localhost:9115/claw_obsidian/notes
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9115/claw_obsidian/reset
  env:
    CLAW_OBSIDIAN_FIXTURES: gen_tasks_GUI/CLI_GUI_Tasks/complex_tasks/TGUI14_calendar_payment_sms_obsidian/fixtures/claw_obsidian/vault.json
tools:
- name: fossify_calendar_list_events
  description: 列出日历事件，支持日期范围过滤
  input_schema:
    type: object
    properties:
      start_date:
        type: string
      end_date:
        type: string
      query:
        type: string
      max_results:
        type: integer
- name: fossify_calendar_get_event
  description: 获取单个日历事件的完整详情
  input_schema:
    type: object
    properties:
      event_id:
        type: string
    required:
    - event_id
- name: fossify_calendar_create_event
  description: 在日历中新建事件
  input_schema:
    type: object
    properties:
      title:
        type: string
      start_time:
        type: string
      end_time:
        type: string
      description:
        type: string
      location:
        type: string
    required:
    - title
    - start_time
    - end_time
- name: contacts_list
  description: 搜索手机通讯录联系人
  input_schema:
    type: object
    properties:
      query:
        type: string
      group:
        type: string
      max_results:
        type: integer
- name: contacts_get
  description: 获取单个联系人的完整信息
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
    required:
    - contact_id
- name: contacts_create
  description: 在通讯录中新增联系人
  input_schema:
    type: object
    properties:
      name:
        type: string
      phone:
        type: string
      email:
        type: string
      company:
        type: string
      title:
        type: string
      note:
        type: string
    required:
    - name
- name: contacts_update
  description: 更新通讯录中已有联系人的信息
  input_schema:
    type: object
    properties:
      contact_id:
        type: string
      name:
        type: string
      phone:
        type: string
      email:
        type: string
      company:
        type: string
      title:
        type: string
      note:
        type: string
    required:
    - contact_id
- name: fossify_messages_list_threads
  description: 列出短信会话列表，支持关键词和未读过滤
  input_schema:
    type: object
    properties:
      query:
        type: string
      unread_only:
        type: boolean
      max_results:
        type: integer
- name: fossify_messages_get_thread
  description: 获取某个会话的完整消息记录
  input_schema:
    type: object
    properties:
      thread_id:
        type: string
    required:
