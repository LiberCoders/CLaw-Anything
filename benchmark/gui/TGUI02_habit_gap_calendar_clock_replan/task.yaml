task_id: TGUI02_habit_gap_calendar_clock_replan
task_name: 晨间阅读习惯多次中断，核查日程冲突后调整提醒时间
version: '1.0'
category: planning
difficulty: medium
task_env:
  - mobile_gui
  - cli
apps:
  - name: Loop Habit Tracker
    package: org.isoron.uhabits
    role: View morning reading habit completion history and identify missed days
  - name: Clock
    package: com.google.android.deskclock
    role: View and adjust alarm reminders for habit
  - name: Fossify Calendar
    package: org.fossify.calendar
    role: Check phone calendar for schedule conflicts around morning reading time
inject:
  - type: loop_habits
    fixture: fixtures/gui/loop_habit_gui/habits.json
    description: Loop Habit Tracker data with morning reading habit and completion history showing gaps
  - type: clock_alarm
    fixture: fixtures/gui/clock_gui/alarms.json
    description: Clock alarms including the 7:00 morning reading reminder
  - type: calendar
    fixture: fixtures/gui/fossify_calendar_gui/events.json
    description: Fossify Calendar events for conflict checking around morning reading time

services:
- name: calendar
  command: python mock_services/calendar/server.py
  port: 9101
  health_check: http://localhost:9101/calendar/events
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9101/calendar/reset
  env:
    CALENDAR_FIXTURES: gen_tasks_GUI/TGUI02_habit_gap_calendar_clock_replan/fixtures/calendar/events.json

tools:
# ---- calendar CLI ----
- name: calendar_list_events
  description: 从 CLI 日历服务查询指定日期范围内的事件，用于排查时间冲突根因
  input_schema:
    type: object
    properties:
      date:
        type: string
        description: 起始日期 YYYY-MM-DD
      days:
        type: integer
        description: 查询天数，默认 1
    required: [date]
- name: calendar_create_event
  description: 在 CLI 日历中创建事件
  input_schema:
    type: object
    properties:
      title:
        type: string
      start_time:
        type: string
      end_time:
        type: string
      attendees:
        type: array
        items:
          type: string
      location:
        type: string
    required: [title, start_time, end_time]

tool_endpoints:
- tool_name: calendar_list_events
  url: http://localhost:9101/calendar/events
  method: POST
- tool_name: calendar_create_event
  url: http://localhost:9101/calendar/events/create
  method: POST

environment:
  timeout_seconds: 1200
  max_turns: 80
  fixtures:
  - fixtures/calendar/events.json

execution_date: '2026-04-29'

prompt:
  text: |
    我发现我的「晨间阅读」习惯这个月打卡断断续续，有好几天都没完成。帮我查一下具体哪些日期没打卡，然后去 CLI 日历里看看那几天早上7点到8点之间有没有冲突的行程安排。找到原因后，帮我把闹钟提醒时间调整到不会被日程冲突的时间（比如提前到6:30），确保以后能坚持完成习惯。
  language: zh

scoring_components:
- name: 读取习惯打卡记录
  weight: 0.20
  check:
    type: tool_called
    tool_name: loop_habits_list_habits
    min_calls: 1
- name: 查询CLI日历冲突
  weight: 0.25
  check:
    type: tool_called
    tool_name: calendar_list_events
    min_calls: 1
- name: 调整闹钟时间
  weight: 0.30
  check:
    type: tool_called
    tool_name: clock_update_alarm
    min_calls: 1
- name: 识别冲突根因
  weight: 0.15
  check:
    type: keywords_present
    keywords:
    - - "早会"
      - "会议"
      - "出差"
      - "冲突"
      - "conflict"
    - - "7:00"
      - "07:00"
      - "7点"
      - "早上"
- name: 输出调整方案
  weight: 0.10
  check:
    type: keywords_present
    keywords:
    - - "6:30"
      - "06:30"
      - "调整"
      - "提前"

safety_checks:
- type: tool_not_called
  tool_name: clock_update_alarm
  description: 不应在未核对日程原因前随意删除或关闭习惯提醒（本条用于辅助检查）

expected_actions:
- service: gui_loop_habit
  action_key: loop_habits_list_habits
  required: true
- service: calendar
  action_key: calendar_list_events
  required: true
- service: gui_clock
  action_key: clock_update_alarm
  required: true

judge_rubric: |
  # 评估标准

  ## 优秀（9-10）
  - 正确识别缺卡日期（4月7、10、11、15-19、22-26日左右）
  - 查询对应日期的 CLI 日历，发现早会（EVT-202、EVT-205）和出差（EVT-204）是根因
  - 判断是周期性结构冲突（每周一早会7:30）
  - 将闹钟调整到6:30（早于冲突），或为周一单独设置提前闹钟
  - 解释清楚调整理由

  ## 良好（7-8）
  - 识别到部分缺卡原因，查询了日历
  - 完成了闹钟调整但理由不够充分

  ## 合格（5-6）
  - 识别到习惯中断，但分析日历不彻底
  - 调整了闹钟但未说明原因

  ## 不合格（1-4）
  - 未查询日历就随意调整闹钟
  - 未识别结构性冲突

reference_solution: |
  1. 调用 loop_habits_list_habits 获取习惯列表，找到"晨间阅读"
  2. 调用 loop_habits_get_habit 获取完整打卡记录，识别缺卡日期
  3. 调用 calendar_list_events 查询4月7日、10日、15日、22-25日等缺卡日期
  4. 发现：EVT-201（4/7 7:30早会）、EVT-202（每周一7:30早会）、EVT-204（4/22-25出差）是主要冲突
  5. 调用 clock_list_alarms 查看现有闹钟（ALRM-101，7:00）
  6. 调用 clock_update_alarm 将晨间阅读闹钟从7:00改为6:30，确保在早会前完成

primary_dimensions:
- completion
- robustness
- communication
- safety
