task_id: TGUI18_obsidian_finance_sms_scheduler_invoice
task_name: Cross-reference CLI deployment logs with client payment records to generate Q1 invoice reconciliation report
version: '1.0'
category: workflow_execution
difficulty: simple
task_env:
- mobile_gui
- cli
apps:
- name: Fossify Messages
  package: org.fossify.messages
  role: Read and send SMS messages via Fossify Messages
inject:
- type: fossify_messages
  fixture: fixtures/gui/fossify_messages_gui/threads.json
  description: Fossify Messages fixture data for task TGUI18
services:
- name: config
  command: python mock_services/config/server.py
  port: 9111
  health_check: http://localhost:9111/config/integrations
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9111/config/reset
  env:
    CONFIG_FIXTURES: fixtures/config/integrations.json
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: fixtures/scheduler/jobs.json
- name: claw_obsidian
  command: python mock_services/claw_obsidian/server.py
  port: 9115
  health_check: http://localhost:9115/claw_obsidian/notes
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9115/claw_obsidian/reset
  env:
    CLAW_OBSIDIAN_FIXTURES: fixtures/claw_obsidian/vault.json
tools:
- name: fossify_messages_list_threads
  description: 列出短信会话列表，支持关键词和未读过滤
  input_schema:
    type: object
    properties:
      query:
        type: string
      unread_only:
        type: boolean
      max_results:
        type: integer
- name: fossify_messages_get_thread
  description: 获取某个会话的完整消息记录
  input_schema:
    type: object
    properties:
      thread_id:
        type: string
    required:
    - thread_id
- name: fossify_messages_send_message
  description: 向指定号码或会话发送短信
  input_schema:
    type: object
    properties:
      phone_number:
        type: string
      thread_id:
        type: string
      text:
        type: string
    required:
    - text
- name: fossify_messages_mark_thread
  description: 更新会话状态（已读/未读、归档、置顶）
  input_schema:
    type: object
    properties:
      thread_id:
        type: string
      read:
        type: boolean
      archived:
        type: boolean
      pinned:
        type: boolean
    required:
    - thread_id
- name: config_list_integrations
  description: List integrations (summary only, no secrets/credentials). Optionally filter by status.
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: Filter by status, e.g. 'active', 'inactive' (optional)
- name: config_get_integration
  description: Get full integration details by integration_id
  input_schema:
    type: object
    properties:
      integration_id:
        type: string
    required:
    - integration_id
- name: scheduler_list_jobs
  description: List scheduled jobs (summary, no action/history). Filter by status, enabled state, or tag.
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: Filter by last run status (optional)
      enabled:
        type: boolean
        description: Filter by enabled state (optional)
      tag:
        type: string
        description: Filter by tag (optional)
- name: scheduler_get_job
  description: Get full job details including action and execution history by job_id
  input_schema:
    type: object
    properties:
      job_id:
        type: string
    required:
    - job_id
- name: scheduler_create_job
  description: Create a new scheduled job
  input_schema:
    type: object
    properties:
      name:
        type: string
      cron_expression:
        type: string
      action:
        type: string
      enabled:
        type: boolean
        description: Whether the job is enabled, default true
      tags:
        type: array
        items:
          type: string
        description: Job tags (optional)
      created_by:
        type: string
        description: Creator name (optional)
    required:
    - name
    - cron_expression
    - action
- name: scheduler_update_job
  description: Update a scheduled job. Only provided fields will be changed.
  input_schema:
    type: object
    properties:
      job_id:
        type: string
      enabled:
        type: boolean
        description: Enable/disable the job (optional)
      cron_expression:
        type: string
        description: New cron expression (optional)
      name:
        type: string
        description: New name (optional)
      action:
        type: string
        description: New action (optional)
      tags:
        type: array
        items:
          type: string
        description: New tags (optional)
    required:
    - job_id
- name: scheduler_delete_job
  description: Delete a scheduled job by job_id
  input_schema:
    type: object
    properties:
      job_id:
        type: string
    required:
    - job_id
- name: scheduler_job_history
  description: Get execution history for a job. Default returns last 10 entries.
  input_schema:
    type: object
    properties:
      job_id:
        type: string
      limit:
        type: integer
        description: Max history entries to return, default 10
    required:
    - job_id
- name: claw_obsidian_list_notes
  description: List claw_obsidian notes (summary only, no content). Optionally filter by folder or tag.
  input_schema:
    type: object
    properties:
      folder:
        type: string
        description: Filter by folder path (optional)
      tag:
        type: string
        description: Filter by a single tag (optional)
      max_results:
        type: integer
        description: Max notes to return, default 20
      offset:
        type: integer
        description: Skip first N results for pagination, default 0
- name: claw_obsidian_get_note
  description: Get full note (title + content + tags + outlinks + inlinks) by note_id
  input_schema:
    type: object
    properties:
      note_id:
        type: string
    required:
    - note_id
- name: claw_obsidian_create_note
  description: Create a new claw_obsidian markdown note.
  input_schema:
    type: object
    properties:
      title:
        type: string
      folder:
        type: string
        description: Folder path (optional)
      tags:
        type: array
        items:
          type: string
        description: Tag list (optional)
      content:
        type: string
        description: Initial markdown content (optional)
    required:
    - title
- name: claw_obsidian_update_note
  description: Replace a note's content wholesale.
  input_schema:
    type: object
    properties:
      note_id:
        type: string
      content:
        type: string
        description: New full markdown content
    required:
    - note_id
    - content
- name: claw_obsidian_append_to_note
  description: Append markdown text to the end of a note's content.
  input_schema:
    type: object
    properties:
      note_id:
        type: string
      text:
        type: string
        description: Markdown text to append
    required:
    - note_id
    - text
- name: claw_obsidian_delete_note
  description: Delete a note permanently.
  input_schema:
    type: object
    properties:
      note_id:
        type: string
    required:
    - note_id
- name: claw_obsidian_search
  description: Search notes by text query and/or by required tags.
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: Text query (optional; empty = no text filter)
      tags:
        type: array
        items:
          type: string
        description: Required tags (optional)
      max_results:
        type: integer
        description: Max notes to return, default 10
      offset:
        type: integer
        description: Skip first N results for pagination, default 0
- name: claw_obsidian_add_link
  description: Create a directed link from_note_id → to_note_id.
  input_schema:
    type: object
    properties:
      from_note_id:
        type: string
      to_note_id:
        type: string
    required:
    - from_note_id
    - to_note_id
- name: claw_obsidian_remove_link
  description: Remove a directed link from_note_id → to_note_id.
  input_schema:
    type: object
    properties:
      from_note_id:
        type: string
      to_note_id:
        type: string
    required:
    - from_note_id
    - to_note_id
- name: claw_obsidian_get_backlinks
  description: Get the list of note_ids that link TO this note.
  input_schema:
    type: object
    properties:
      note_id:
        type: string
    required:
    - note_id
tool_endpoints:
- tool_name: fossify_messages_list_threads
  url: http://localhost:9120/gui/fossify_messages/list_threads
