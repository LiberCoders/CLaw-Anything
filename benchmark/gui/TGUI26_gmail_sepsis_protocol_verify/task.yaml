task_id: TGUI26_gmail_sepsis_protocol_verify
task_name: Verify sepsis protocol adherence after night shift handoff alert before replying to attending
version: '1.0'
category: cross_device_decision
difficulty: simple
task_env:
- mobile_gui
- cli
