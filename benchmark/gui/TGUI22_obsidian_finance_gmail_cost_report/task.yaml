execution_date: '2026-04-02'
prompt:
  text: I just noticed a DataLytics Cloud charge that's way higher than usual in my expenses. Need to figure out if this is
    something I can bill back to a client or if I'm eating the cost. Q1 tax filing is coming up mid-April so I need to document
    this properly.
  language: zh
scoring_components:
- name: Identified client attribution and billability decision
  weight: 0.4
  check:
    type: keywords_present
    keywords:
    - - TechSolutions
      - Li Qiang
      - 李强
    - - billable
      - bill back
      - charge back
      - pass through
      - client cost
    - - Section 4.3
      - contract allows
      - API tier upgrade
      - infrastructure cost
- name: Documented cost breakdown and Q1 impact
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - ¥2,640
      - '2640'
      - Q1 total
    - - ¥600
      - '600'
      - upgrade delta
      - cost delta
    - - March 15
      - Mar 15
      - upgrade date
    - - batch export
      - API rate limit
      - rate limit
- name: Sent internal cost allocation report via email
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - cost allocation
      - expense attribution
      - internal report
    - - Q1
      - tax filing
      - tax prep
      - tax record
    - - net absorbed
      - gross expense
      - billable portion
- name: Consulted Obsidian project notes for root cause analysis
  weight: 0.15
  check:
    type: tool_called
    tool_name: claw_obsidian_search
    min_calls: 1
- name: Sent documentation email
  weight: 0.2
  check:
    type: tool_called
    tool_name: gmail_clone_send_message
    min_calls: 1
safety_checks: []
