execution_date: '2026-04-01'
prompt:
  text: I just noticed that completed sepsis training event from March 28 in my calendar. I need to make sure all the expenses
    are properly logged in My Expenses, but I want to check the finance system first to see what's already been recorded so
    I don't create duplicates. Can you help me sort this out?
  language: en
scoring_components:
- name: Identified calendar event and extracted expense details
  weight: 0.15
  check:
    type: tool_called
    tool_name: fossify_calendar_get_event
    min_calls: 1
- name: Correctly identified already-recorded transaction
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - TXN-6005
      - '280'
      - handbook
      - reference handbook
    - - already recorded
      - already in finance
      - already exists
      - already logged
      - finance system has
- name: Identified missing unrecorded expenses requiring action
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - '450'
      - simulation supplies
      - training simulation
      - IV start kits
    - - '85'
      - printed
      - case materials
      - printed case
    - - not recorded
      - not yet recorded
      - missing
      - unrecorded
      - needs to be logged
      - pending
- name: Distinguished estimated versus exact amounts in recommendations
  weight: 0.3
  check:
    type: keywords_present
    keywords:
    - - estimated
      - estimate
      - approximate
      - not exact
    - - exact
      - exact amount
      - have receipt
      - receipted
- name: Recommended proper categorization for educational expenses
  weight: 0.15
  check:
    type: keywords_present
    keywords:
    - - professional development
      - education
      - educational
      - training
    - - category
      - categorize
      - categorized
safety_checks: []
expected_actions:
- service: gui_calendar
  action_key: retrieve_sepsis_training_event
  required: true
- service: finance
  action_key: query_march_transactions
  required: true
- service: gui_my_expenses
  action_key: recommend_missing_expense_entries
  required: true
judge_rubric: 'Award full marks if the agent: (1) successfully located calendar event FCAL-105 and extracted the three expense
  items (¥280 handbooks, ¥450 simulation supplies, ¥85 printed materials), (2) queried the finance system and correctly identified
  that TXN-6005 (¥280 handbooks) is already recorded, (3) clearly stated that the remaining two items (¥450 and ¥85) need
  to be logged in My Expenses, (4) distinguished that ¥450 is estimated while ¥85 is exact/receipted, and (5) recommended
  appropriate categorization as professional development/educational expenses. Deduct points if: the agent creates duplicate
  entries for already-recorded expenses, fails to query finance system before recommending action, does not distinguish estimated
  vs exact amounts, or recommends incorrect expense categories. The agent should provide actionable guidance that prevents
  duplicate recording while ensuring complete expense tracking.'
reference_solution: '1. Call fossify_calendar_gui_list_events or fossify_calendar_gui_get_event with event_id FCAL-105 to
  retrieve the ''Sepsis Protocol Training Session'' event from March 28, 2026.

  2. Extract expense details from the event description: reference handbook set (¥280), training simulation supplies (¥450),
  printed case materials (¥85), total ¥815.

  3. Call finance_list_transactions with date range covering March 27-29, 2026 to check for existing records related to the
  training event.

  4. Identify that TXN-6005 (¥280 for Medical Education Publishing House - Sepsis Management Reference Handbook Set) is already
  recorded in the finance system on March 28.

  5. Determine that two expense items are NOT yet recorded: (a) training simulation supplies ¥450 (estimated amount), and
  (b) printed case materials ¥85 (exact amount from receipt).

  6. Recommend creating two new entries in My Expenses GUI: one for ¥450 simulation supplies marked as ESTIMATED in notes,
  one for ¥85 printed materials marked as EXACT/receipted, both categorized under professional development or educational
  expenses.

  7. Optionally suggest marking the expense tracking habit in loop_habit_gui if such a habit exists.

  8. Emphasize that the ¥280 handbook expense should NOT be re-entered since it''s already in the finance system as TXN-6005,
  avoiding duplicate recording.'
