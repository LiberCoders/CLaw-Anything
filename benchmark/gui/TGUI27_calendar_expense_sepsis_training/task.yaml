    properties:
      meeting_id:
        type: string
    required:
    - meeting_id
- name: meeting_add_participant
  description: Register a participant on a meeting.
  input_schema:
    type: object
    properties:
      meeting_id:
        type: string
      email:
        type: string
      role:
        type: string
        description: host | panelist | attendee (default attendee)
