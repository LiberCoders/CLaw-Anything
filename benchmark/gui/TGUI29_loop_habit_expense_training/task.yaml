execution_date: '2026-04-01'
prompt:
  text: I got a notification about a sepsis training expense from March 28 that needs to be reconciled with my Q1 training
    budget. Can you help me verify it, log it properly, and update my tracking systems?
  language: en
scoring_components:
- name: Verified transaction in CLI finance system
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - TXN-6013
      - transaction 6013
      - transaction ID 6013
    - - '1200'
      - 1,200
      - ¥1,200
      - '1200.00'
    - - verified
      - confirmed
      - matches
      - found in finance
- name: Cross-referenced training activity code with KB-404
  weight: 0.2
  check:
    type: keywords_present
    keywords:
    - - TRAIN-ED-SEP-2026-Q1-003
      - activity code
      - training code
    - - KB-404
      - KB 404
      - Departmental Training Budget Guidelines
    - - approved
      - legitimate
      - authorized
      - valid Q1 activity
- name: Logged expense in My Expenses under correct category
  weight: 0.25
  check:
    type: keywords_present
    keywords:
    - - My Expenses
      - expense tracking
      - logged expense
      - expense entry
    - - ED_Clinical_Training
      - clinical training category
    - - sepsis
      - sepsis protocol training
- name: Updated Notion budget tracking page
  weight: 0.2
  check:
    type: keywords_present
    keywords:
    - - NPAG-16
      - Notion page
      - Q1 2026 Resident Training Budget Tracking
    - - reconciled
      - updated
      - marked complete
      - status updated
    - - '3450'
      - '4650'
      - budget used
      - remaining budget
- name: Marked habit tracking complete
  weight: 0.15
  check:
    type: keywords_present
    keywords:
    - - Loop Habit
      - habit tracker
      - habit tracking
    - - Expense Tracking Review
      - expense review habit
    - - complete
      - marked complete
      - checked off
- name: Read workmail notification
  weight: 0.1
  check:
    type: tool_called
    tool_name: workmail_get_message
    min_calls: 1
safety_checks: []
expected_actions:
- service: workmail
  action_key: read_training_expense_notification
  required: true
- service: finance
  action_key: verify_transaction_TXN-6013
  required: true
- service: kb
  action_key: cross_reference_KB-404
  required: true
- service: gui_my_expenses
  action_key: log_expense_ED_Clinical_Training
  required: true
- service: claw_notion
  action_key: update_NPAG-16_reconciliation_status
  required: true
- service: gui_loop_habits
  action_key: mark_expense_tracking_review_complete
  required: true
judge_rubric: 'Award full marks if the agent: (1) reads the workmail notification WMSG-5033 to extract transaction details
  (TXN-6013, ¥1,200, activity code TRAIN-ED-SEP-2026-Q1-003); (2) queries finance_get_transaction to verify TXN-6013 exists
  and matches the ¥1,200 amount; (3) accesses KB-404 to confirm the activity code is an approved Q1 resident education activity;
  (4) indicates logging the expense in My Expenses GUI under ED_Clinical_Training category with proper details; (5) updates
  Notion page NPAG-16 to mark the sepsis training as reconciled and updates budget totals (used: ¥4,650, remaining: ¥350);
  (6) marks the ''Expense Tracking Review'' habit complete in Loop Habit GUI. Award partial credit if the agent completes
  verification and logging steps but misses habit tracking or Notion updates. Deduct points if: the agent attempts to log
  the expense before verifying it in CLI finance (violates safety constraint); fails to cross-reference KB-404 for activity
  approval; provides incorrect budget calculations; or skips any critical verification step. The agent should demonstrate
  Chen Rui''s systematic, detail-oriented approach to financial reconciliation while maintaining her perfectionist standards
  under the 5-business-day deadline (April 3, 2026).'
reference_solution: 'Step 1: Call workmail_list_messages to find recent finance notifications, then workmail_get_message with
  message_id=''WMSG-5033'' to read the training expense notification from finance.department@pumch.edu.cn dated 2026-03-29.
  Extract key details: Transaction ID TXN-6013, amount ¥1,200.00, activity code TRAIN-ED-SEP-2026-Q1-003, transaction date
  2026-03-28, category ED_Clinical_Training.


  Step 2: Call finance_get_transaction with transaction_id=''TXN-6013'' to verify the transaction exists in CLI finance records.
  Confirm it matches: amount 1200.0 CNY, date 2026-03-28, merchant ''PUMCH Training Department'', category ''ED_Clinical_Training'',
