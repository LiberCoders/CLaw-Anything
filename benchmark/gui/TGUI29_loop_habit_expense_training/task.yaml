task_id: TGUI30_loop_habit_expense_training
task_name: Reconcile training expense notification with department budget records and update tracking systems
version: '1.0'
category: finance
difficulty: simple
task_env:
- mobile_gui
- cli
apps:
- name: Loop Habit Tracker
  package: org.isoron.uhabits
  role: Track daily habits via Loop Habit Tracker
- name: My Expenses
  package: org.totschnig.myexpenses
  role: View and record expenses via My Expenses
inject:
- type: loop_habits
  fixture: fixtures/gui/loop_habit_gui/habits.json
  description: Loop Habit Tracker fixture data for task TGUI30
- type: my_expenses
  fixture: fixtures/gui/my_expenses_gui/data.json
  description: My Expenses fixture data for task TGUI30
services:
- name: todo
  command: python mock_services/todo/server.py
  port: 9102
  health_check: http://localhost:9102/todo/tasks
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9102/todo/reset
  env:
    TODO_FIXTURES: fixtures/todo/tasks.json
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: fixtures/scheduler/jobs.json
- name: workmail
  command: python mock_services/workmail/server.py
  port: 9113
  health_check: http://localhost:9113/workmail/messages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9113/workmail/reset
  env:
    WORKMAIL_FIXTURES: fixtures/workmail/inbox.json
- name: claw_notion
  command: python mock_services/claw_notion/server.py
  port: 9114
  health_check: http://localhost:9114/claw_notion/pages
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9114/claw_notion/reset
  env:
    CLAW_NOTION_FIXTURES: fixtures/claw_notion/pages.json
- name: meeting
  command: python mock_services/meeting/server.py
  port: 9116
  health_check: http://localhost:9116/meeting/list
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9116/meeting/reset
  env:
    MEETING_FIXTURES: fixtures/meeting/meetings.json
tools:
- name: loop_habits_list_habits
  description: 列出所有习惯打卡项目
  input_schema:
    type: object
    properties:
      query:
        type: string
- name: loop_habits_check_habit
  description: 完成某个习惯的今日打卡
  input_schema:
    type: object
    properties:
      habit_id:
        type: string
      date:
        type: string
        description: YYYY-MM-DD，默认今天
    required:
    - habit_id
- name: loop_habits_list_completions
  description: 查询习惯的历史打卡记录
  input_schema:
    type: object
    properties:
      habit_id:
        type: string
      start_date:
        type: string
      end_date:
        type: string
    required:
    - habit_id
- name: my_expenses_list_transactions
  description: 列出 My Expenses 中的交易记录，支持日期和分类过滤
  input_schema:
    type: object
    properties:
      start_date:
        type: string
      end_date:
        type: string
      category:
        type: string
      account_id:
        type: string
      max_results:
        type: integer
- name: my_expenses_create_transaction
  description: 在 My Expenses 中录入一笔新交易
  input_schema:
    type: object
    properties:
      amount:
        type: number
      account_id:
        type: string
      category_id:
        type: string
      date:
        type: string
      comment:
        type: string
      payee:
        type: string
    required:
    - amount
    - account_id
- name: my_expenses_get_transaction
  description: 获取单笔交易的完整详情
  input_schema:
    type: object
    properties:
      transaction_id:
        type: string
    required:
    - transaction_id
- name: todo_list_tasks
  description: List TODO tasks. Returns full task details. Default returns all tasks. Use status filter to narrow results.
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 'Filter by status: ''pending'', ''in_progress'', ''completed'', or ''all'' (default ''all'')'
- name: todo_create_task
  description: Create a new TODO task
  input_schema:
    type: object
    properties:
      title:
        type: string
      description:
        type: string
        description: Task description (optional)
      priority:
        type: string
        description: Priority level, default 'medium'
      due_date:
        type: string
        description: Due date in ISO format (optional)
    required:
    - title
- name: todo_update_task
  description: Update an existing TODO task. Only provided fields will be changed.
  input_schema:
    type: object
    properties:
      task_id:
        type: string
      title:
        type: string
        description: New title (optional)
      priority:
        type: string
        description: New priority (optional)
      status:
        type: string
        description: 'New status: ''pending'', ''in_progress'', ''completed'' (optional)'
      tags:
        type: array
        items:
          type: string
        description: New tags list (optional)
    required:
    - task_id
- name: todo_delete_task
  description: Delete a TODO task by task_id
  input_schema:
    type: object
    properties:
      task_id:
        type: string
    required:
    - task_id
- name: scheduler_list_jobs
  description: List scheduled jobs (summary, no action/history). Filter by status, enabled state, or tag.
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: Filter by last run status (optional)
      enabled:
        type: boolean
        description: Filter by enabled state (optional)
      tag:
        type: string
        description: Filter by tag (optional)
- name: scheduler_get_job
  description: Get full job details including action and execution history by job_id
  input_schema:
    type: object
    properties:
      job_id:
        type: string
    required:
    - job_id
- name: scheduler_create_job
  description: Create a new scheduled job
  input_schema:
    type: object
    properties:
      name:
        type: string
      cron_expression:
        type: string
      action:
        type: string
      enabled:
        type: boolean
        description: Whether the job is enabled, default true
      tags:
        type: array
        items:
          type: string
        description: Job tags (optional)
      created_by:
        type: string
        description: Creator name (optional)
    required:
    - name
    - cron_expression
    - action
- name: scheduler_update_job
  description: Update a scheduled job. Only provided fields will be changed.
  input_schema:
    type: object
    properties:
      job_id:
        type: string
      enabled:
        type: boolean
        description: Enable/disable the job (optional)
      cron_expression:
        type: string
        description: New cron expression (optional)
      name:
        type: string
        description: New name (optional)
      action:
        type: string
        description: New action (optional)
      tags:
        type: array
        items:
          type: string
        description: New tags (optional)
    required:
    - job_id
- name: scheduler_delete_job
  description: Delete a scheduled job by job_id
  input_schema:
    type: object
    properties:
      job_id:
        type: string
    required:
    - job_id
- name: scheduler_job_history
  description: Get execution history for a job. Default returns last 10 entries.
  input_schema:
    type: object
    properties:
      job_id:
        type: string
      limit:
        type: integer
        description: Max history entries to return, default 10
    required:
    - job_id
- name: workmail_list_messages
  description: 'List company-internal mail inbox. Returns subject/from/date (no body). Default: last 7 days, max 20 results.'
  input_schema:
    type: object
    properties:
      days_back:
        type: integer
        description: How many days back to search, default 7
      max_results:
        type: integer
        description: Max messages to return, default 20
      offset:
        type: integer
        description: Skip first N results for pagination, default 0
      query:
        type: string
        description: Search keyword in subject and sender (optional)
- name: workmail_get_message
  description: Get full company-internal message details including body by message_id
  input_schema:
    type: object
    properties:
      message_id:
        type: string
    required:
    - message_id
- name: workmail_send_message
  description: Send a company-internal email to the specified recipient
  input_schema:
    type: object
    properties:
      to:
        type: string
      subject:
        type: string
      body:
        type: string
    required:
    - to
    - subject
    - body
- name: workmail_save_draft
  description: Save a company-internal email as draft (not sent).
  input_schema:
    type: object
    properties:
      to:
        type: string
      subject:
        type: string
      body:
        type: string
      reply_to_message_id:
        type: string
        description: Original message ID if this is a reply (optional)
    required:
    - to
    - subject
    - body
- name: claw_notion_list_pages
  description: List claw_notion pages (summary only, no blocks). Optionally filter by parent_page_id or database_id. By default
    archived pages are excluded.
  input_schema:
    type: object
    properties:
      parent_page_id:
        type: string
        description: Filter by parent page id (optional)
      database_id:
        type: string
        description: Filter by database id (optional)
      include_archived:
        type: boolean
        description: Whether to include archived pages, default false
      max_results:
        type: integer
        description: Max pages to return, default 20
      offset:
        type: integer
        description: Skip first N results for pagination, default 0
- name: claw_notion_get_page
  description: Get full page details (title + properties + blocks) by page_id
  input_schema:
    type: object
    properties:
      page_id:
        type: string
    required:
    - page_id
- name: claw_notion_create_page
  description: Create a new claw_notion page.
  input_schema:
    type: object
    properties:
      title:
        type: string
      parent_page_id:
        type: string
        description: Parent page id (optional)
      database_id:
        type: string
        description: Database id if this page belongs to a database (optional)
      properties:
        type: object
        description: Structured key-value properties (optional)
      blocks:
        type: array
        items:
          type: object
        description: Initial blocks, each {type, text} (optional)
    required:
    - title
- name: claw_notion_update_page_properties
  description: Update a page's structured properties (merge into existing).
  input_schema:
    type: object
    properties:
      page_id:
        type: string
      properties:
        type: object
        description: Property keys to set/override
    required:
    - page_id
    - properties
- name: claw_notion_append_blocks
  description: Append blocks to the end of a page's block list.
  input_schema:
    type: object
    properties:
      page_id:
        type: string
      blocks:
        type: array
        items:
          type: object
        description: Blocks to append
    required:
    - page_id
    - blocks
- name: claw_notion_archive_page
  description: Archive a page (soft delete).
  input_schema:
    type: object
    properties:
      page_id:
        type: string
    required:
    - page_id
- name: claw_notion_search
  description: Full-text search pages by query.
  input_schema:
    type: object
    properties:
      query:
        type: string
      max_results:
        type: integer
        description: Max pages to return, default 10
      offset:
        type: integer
        description: Skip first N results for pagination, default 0
    required:
    - query
- name: claw_notion_query_database
  description: Query pages in a database by equality filter on properties.
  input_schema:
    type: object
    properties:
      database_id:
        type: string
      property_filter:
        type: object
        description: Key-value pairs; page matches if all pairs equal page.properties[key]
      max_results:
        type: integer
        description: Max pages to return, default 20
      offset:
        type: integer
        description: Skip first N results for pagination, default 0
    required:
    - database_id
- name: meeting_list
  description: List meetings. Filter by status, host, or date range.
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: scheduled | started | ended | cancelled | all (default all)
      host:
        type: string
        description: Filter by host email substring (optional)
      start_date:
        type: string
        description: YYYY-MM-DD inclusive (optional)
      end_date:
        type: string
        description: YYYY-MM-DD inclusive (optional)
- name: meeting_get
  description: Get full meeting details (participants + recordings) by meeting_id
  input_schema:
    type: object
    properties:
      meeting_id:
        type: string
    required:
    - meeting_id
- name: meeting_create
  description: Schedule a new meeting.
  input_schema:
    type: object
    properties:
      topic:
        type: string
      host:
        type: string
        description: Host email
      start_time:
        type: string
        description: ISO 8601
      duration_minutes:
        type: integer
        description: Default 60
      participants:
        type: array
        items:
          type: object
        description: Initial participant list (optional)
    required:
    - topic
    - host
    - start_time
- name: meeting_update
  description: Update topic/start_time/duration of a scheduled or started meeting.
  input_schema:
    type: object
    properties:
      meeting_id:
        type: string
      topic:
        type: string
      start_time:
        type: string
      duration_minutes:
        type: integer
    required:
    - meeting_id
- name: meeting_cancel
  description: Cancel a scheduled/started meeting.
  input_schema:
    type: object
    properties:
      meeting_id:
        type: string
    required:
    - meeting_id
- name: meeting_start
  description: Start a scheduled meeting.
  input_schema:
    type: object
    properties:
      meeting_id:
        type: string
    required:
    - meeting_id
- name: meeting_end
  description: End a meeting.
  input_schema:
    type: object
    properties:
      meeting_id:
        type: string
    required:
    - meeting_id
- name: meeting_add_participant
  description: Register a participant on a meeting.
  input_schema:
    type: object
    properties:
      meeting_id:
        type: string
      email:
        type: string
      role:
        type: string
        description: host | panelist | attendee (default attendee)
    required:
    - meeting_id
    - email
- name: meeting_remove_participant
  description: Remove a participant from a meeting by email.
  input_schema:
    type: object
    properties:
      meeting_id:
        type: string
      email:
        type: string
    required:
    - meeting_id
    - email
- name: meeting_list_recordings
  description: List recordings across meetings.
  input_schema:
    type: object
    properties:
      meeting_id:
        type: string
        description: Filter to one meeting (optional)
      host:
        type: string
        description: Filter by host email substring (optional)
      start_date:
        type: string
        description: YYYY-MM-DD inclusive on recording date (optional)
      end_date:
        type: string
        description: YYYY-MM-DD inclusive on recording date (optional)
