    type: keywords_present
    keywords:
    - - initiative
      - recommendation
      - action item
      - improvement
    - - priority
      - prioritized
      - HIGH
      - MEDIUM
    - - social sharing
      - gamification
      - friend-invite
    - - onboarding
      - registration
      - 56.8%
      - Day-1 drop
    - - target impact
      - expected lift
      - +3.5pp
      - +5pp
    - - Q1 OKR
      - growth KPI
      - OKR alignment
