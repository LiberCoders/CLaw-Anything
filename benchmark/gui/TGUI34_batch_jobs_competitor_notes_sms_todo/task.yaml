execution_date: '2026-04-02'
prompt:
  text: Hey, I ran the overnight retention analysis job and need to put together an
    action plan for improving our numbers. Can you pull everything together — the
    batch results, competitive research, and turn it into a structured retention improvement
    plan with follow-up tasks? I need to share it with the dev and design leads today.
  language: zh
scoring_components:
- name: Retrieved scheduler job output and extracted retention metrics
  weight: 0.2
  check:
    type: tool_called
    tool_name: scheduler_get_job
    min_calls: 1
- name: Accessed competitor research notes from Obsidian
  weight: 0.15
  check:
    type: tool_called
    tool_name: claw_obsidian_search
    min_calls: 1
- name: Created structured action plan document in Obsidian
  weight: 0.25
  check:
    type: tool_called
    tool_name: claw_obsidian_create_note
    min_calls: 1
- name: Action plan includes correct current retention metrics with data source citation
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - 43.2%
      - 43.2 percent
      - 'Day-1 retention: 43.2'
    - - 19.1%
      - 19.1 percent
      - 'Day-7 retention: 19.1'
    - - 8.4%
      - 8.4 percent
      - 'Day-30 retention: 8.4'
    - - JOB-715
      - job 715
      - scheduler job 715
      - /data/retention/2026-04-02
- name: Action plan incorporates competitive benchmarks and identifies gaps
  weight: 0.35
  check:
    type: keywords_present
    keywords:
    - - industry average
      - competitor benchmark
      - competitive context
      - top competitor
    - - 24.3%
