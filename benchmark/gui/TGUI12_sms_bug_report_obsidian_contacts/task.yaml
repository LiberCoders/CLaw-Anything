environment:
  timeout_seconds: 1200
  max_turns: 100
  fixtures:
  - fixtures/gui/fossify_messages_gui/threads.json
  - fixtures/gui/contacts_gui/contacts.json
  - fixtures/config/integrations.json
  - fixtures/scheduler/jobs.json
