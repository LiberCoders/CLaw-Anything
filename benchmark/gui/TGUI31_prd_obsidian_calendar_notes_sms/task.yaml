task_id: TGUI31_prd_obsidian_calendar_notes_sms
task_name: Review PRD draft in Obsidian, discover inconsistency with product strategy,
  verify against team OKR document and send clarification to design lead
version: '1.0'
category: workflow_execution
difficulty: simple
task_env:
- mobile_gui
- cli
apps:
- name: Fossify Calendar
  package: org.fossify.calendar
  role: View and create calendar events via Fossify Calendar
- name: Fossify Messages
  package: org.fossify.messages
  role: Read and send SMS messages via Fossify Messages
- name: Fossify Notes
  package: org.fossify.notes
  role: Read and write notes via Fossify Notes
inject:
- type: calendar
  fixture: fixtures/gui/fossify_calendar_gui/events.json
  description: Fossify Calendar fixture data for task TGUI31
- type: fossify_messages
  fixture: fixtures/gui/fossify_messages_gui/threads.json
  description: Fossify Messages fixture data for task TGUI31
- type: fossify_notes
  fixture: fixtures/gui/fossify_notes_gui/notes.json
  description: Fossify Notes fixture data for task TGUI31
services:
- name: todo
  command: python mock_services/todo/server.py
  port: 9102
  health_check: http://localhost:9102/todo/tasks
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9102/todo/reset
  env:
    TODO_FIXTURES: fixtures/todo/tasks.json
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: fixtures/scheduler/jobs.json
- name: claw_obsidian
  command: python mock_services/claw_obsidian/server.py
  port: 9115
  health_check: http://localhost:9115/claw_obsidian/notes
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9115/claw_obsidian/reset
  env:
    CLAW_OBSIDIAN_FIXTURES: fixtures/claw_obsidian/vault.json
tools:
- name: fossify_calendar_list_events
  description: 列出日历事件，支持日期范围过滤
  input_schema:
    type: object
    properties:
      start_date:
        type: string
      end_date:
        type: string
      query:
        type: string
      max_results:
        type: integer
- name: fossify_calendar_get_event
  description: 获取单个日历事件的完整详情
  input_schema:
    type: object
    properties:
      event_id:
        type: string
    required:
    - event_id
- name: fossify_calendar_create_event
  description: 在日历中新建事件
  input_schema:
    type: object
    properties:
      title:
        type: string
      start_time:
        type: string
      end_time:
        type: string
      location:
        type: string
      description:
        type: string
    required:
    - title
    - start_time
    - end_time
- name: fossify_messages_list_threads
  description: 列出短信会话列表，支持关键词和未读过滤
  input_schema:
    type: object
    properties:
      query:
        type: string
      unread_only:
        type: boolean
      max_results:
        type: integer
- name: fossify_messages_get_thread
  description: 获取某个会话的完整消息记录
  input_schema:
    type: object
    properties:
      thread_id:
        type: string
    required:
    - thread_id
- name: fossify_messages_send_message
  description: 向指定号码或会话发送短信
  input_schema:
    type: object
    properties:
      phone_number:
        type: string
      thread_id:
        type: string
      text:
        type: string
    required:
    - text
- name: fossify_messages_mark_thread
  description: 更新会话状态（已读/未读、归档、置顶）
  input_schema:
    type: object
    properties:
      thread_id:
        type: string
      read:
        type: boolean
      archived:
        type: boolean
      pinned:
        type: boolean
    required:
    - thread_id
- name: fossify_notes_list_notes
  description: 列出 Fossify Notes 中的笔记，支持关键词和标签过滤
  input_schema:
    type: object
    properties:
      query:
        type: string
      tag:
        type: string
      max_results:
        type: integer
- name: fossify_notes_get_note
  description: 获取单条笔记的完整内容和元数据
  input_schema:
    type: object
    properties:
      note_id:
        type: string
    required:
    - note_id
- name: fossify_notes_create_note
  description: 在 Fossify Notes 中新建一条笔记
  input_schema:
    type: object
    properties:
      title:
        type: string
      content:
        type: string
      color:
        type: string
      tags:
        type: array
        items:
          type: string
      checklist:
        type: boolean
    required:
    - title
    - content
- name: fossify_notes_update_note
  description: 更新 Fossify Notes 中已有笔记的内容或元数据
  input_schema:
    type: object
    properties:
      note_id:
        type: string
      title:
        type: string
      content:
        type: string
      color:
        type: string
      tags:
        type: array
        items:
          type: string
    required:
    - note_id
- name: todo_list_tasks
  description: List TODO tasks. Returns full task details. Default returns all tasks.
    Use status filter to narrow results.
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 'Filter by status: ''pending'', ''in_progress'', ''completed'',
          or ''all'' (default ''all'')'
- name: todo_create_task
  description: Create a new TODO task
  input_schema:
    type: object
    properties:
      title:
        type: string
      description:
        type: string
        description: Task description (optional)
      priority:
        type: string
        description: Priority level, default 'medium'
      due_date:
        type: string
        description: Due date in ISO format (optional)
    required:
    - title
- name: todo_update_task
  description: Update an existing TODO task. Only provided fields will be changed.
  input_schema:
    type: object
    properties:
      task_id:
        type: string
      title:
        type: string
        description: New title (optional)
      priority:
        type: string
        description: New priority (optional)
      status:
        type: string
        description: 'New status: ''pending'', ''in_progress'', ''completed'' (optional)'
      tags:
        type: array
        items:
          type: string
        description: New tags list (optional)
    required:
    - task_id
- name: todo_delete_task
  description: Delete a TODO task by task_id
  input_schema:
    type: object
    properties:
      task_id:
        type: string
    required:
    - task_id
- name: scheduler_list_jobs
  description: List scheduled jobs (summary, no action/history). Filter by status,
    enabled state, or tag.
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: Filter by last run status (optional)
      enabled:
        type: boolean
        description: Filter by enabled state (optional)
      tag:
        type: string
        description: Filter by tag (optional)
- name: scheduler_get_job
  description: Get full job details including action and execution history by job_id
  input_schema:
    type: object
    properties:
      job_id:
        type: string
    required:
    - job_id
- name: scheduler_create_job
  description: Create a new scheduled job
  input_schema:
    type: object
    properties:
      name:
        type: string
      cron_expression:
        type: string
      action:
        type: string
      enabled:
        type: boolean
        description: Whether the job is enabled, default true
      tags:
        type: array
        items:
          type: string
        description: Job tags (optional)
      created_by:
        type: string
        description: Creator name (optional)
    required:
    - name
    - cron_expression
    - action
- name: scheduler_update_job
  description: Update a scheduled job. Only provided fields will be changed.
  input_schema:
    type: object
    properties:
      job_id:
        type: string
      enabled:
        type: boolean
        description: Enable/disable the job (optional)
      cron_expression:
        type: string
        description: New cron expression (optional)
      name:
        type: string
        description: New name (optional)
      action:
        type: string
        description: New action (optional)
      tags:
        type: array
        items:
          type: string
        description: New tags (optional)
    required:
    - job_id
- name: scheduler_delete_job
  description: Delete a scheduled job by job_id
  input_schema:
    type: object
    properties:
      job_id:
        type: string
    required:
    - job_id
- name: scheduler_job_history
  description: Get execution history for a job. Default returns last 10 entries.
  input_schema:
    type: object
    properties:
      job_id:
        type: string
      limit:
        type: integer
        description: Max history entries to return, default 10
    required:
    - job_id
- name: claw_obsidian_list_notes
  description: List claw_obsidian notes (summary only, no content). Optionally filter
    by folder or tag.
  input_schema:
    type: object
    properties:
      folder:
        type: string
        description: Filter by folder path (optional)
      tag:
        type: string
        description: Filter by a single tag (optional)
      max_results:
        type: integer
        description: Max notes to return, default 20
      offset:
        type: integer
        description: Skip first N results for pagination, default 0
- name: claw_obsidian_get_note
  description: Get full note (title + content + tags + outlinks + inlinks) by note_id
  input_schema:
    type: object
    properties:
      note_id:
        type: string
    required:
    - note_id
- name: claw_obsidian_create_note
  description: Create a new claw_obsidian markdown note.
  input_schema:
    type: object
    properties:
      title:
        type: string
      folder:
        type: string
        description: Folder path (optional)
      tags:
        type: array
        items:
          type: string
        description: Tag list (optional)
      content:
        type: string
        description: Initial markdown content (optional)
    required:
    - title
- name: claw_obsidian_update_note
  description: Replace a note's content wholesale.
  input_schema:
    type: object
    properties:
      note_id:
        type: string
      content:
        type: string
        description: New full markdown content
    required:
    - note_id
    - content
- name: claw_obsidian_append_to_note
  description: Append markdown text to the end of a note's content.
  input_schema:
    type: object
    properties:
      note_id:
        type: string
      text:
        type: string
        description: Markdown text to append
    required:
    - note_id
    - text
- name: claw_obsidian_delete_note
  description: Delete a note permanently.
  input_schema:
    type: object
    properties:
      note_id:
        type: string
    required:
    - note_id
- name: claw_obsidian_search
  description: Search notes by text query and/or by required tags.
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: Text query (optional; empty = no text filter)
      tags:
        type: array
        items:
          type: string
        description: Required tags (optional)
      max_results:
        type: integer
        description: Max notes to return, default 10
      offset:
        type: integer
        description: Skip first N results for pagination, default 0
- name: claw_obsidian_add_link
  description: Create a directed link from_note_id → to_note_id.
  input_schema:
    type: object
    properties:
      from_note_id:
        type: string
      to_note_id:
        type: string
    required:
    - from_note_id
    - to_note_id
- name: claw_obsidian_remove_link
  description: Remove a directed link from_note_id → to_note_id.
  input_schema:
    type: object
    properties:
      from_note_id:
        type: string
      to_note_id:
        type: string
    required:
    - from_note_id
    - to_note_id
- name: claw_obsidian_get_backlinks
  description: Get the list of note_ids that link TO this note.
  input_schema:
    type: object
    properties:
      note_id:
        type: string
    required:
    - note_id
