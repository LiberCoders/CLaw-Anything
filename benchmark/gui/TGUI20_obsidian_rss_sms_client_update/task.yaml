judge_rubric: '# LLM Judge Rubric


  ## Artifact Correctness (Primary Focus)


  Evaluate whether the agent produced a **complete, correct, and client-ready technical proposal** that meets Wei Chenghao''s
  quality standard: "代码可运行、文档能让客户自己部署" (code runs, documentation enables client self-deployment).


  ### End-to-End Workflow Completion (40 points)


  **40 pts**: All steps executed correctly:

  1. Retrieved Obsidian technical spec draft (OBSN-33)

  2. Consulted RSS for Vue/Nuxt updates from past 7 days

  3. Updated Obsidian draft with latest stable versions (Vue 3.4.21, Nuxt 3.10.3) and performance data

  4. Created client-friendly summary in Fossify Notes

  5. Sent message to Wang Zong via Fossify Messages with technical proposal


  **25-39 pts**: Most steps completed, but one critical step missing (e.g., did not update Obsidian, or did not send message)


  **10-24 pts**: Partial execution (e.g., retrieved RSS but did not update spec, or updated spec but did not communicate to
  client)


  **0-9 pts**: Failed to complete core workflow (e.g., only read notes, no updates or communication)


  ### Technical Accuracy (25 points)


  **25 pts**: Proposal includes correct latest versions (Vue 3.4.21, Nuxt 3.10.3) with accurate performance metrics from RSS
  sources (25% reactivity improvement, 30% SSR improvement, 45% vs SPA)


  **15-24 pts**: Correct versions but performance data incomplete or imprecise


  **5-14 pts**: Versions partially correct (e.g., only updated Vue or Nuxt, not both)


  **0-4 pts**: Did not update versions or used incorrect/outdated data


  ### Client Communication Quality (20 points)


  **20 pts**: Message to Wang Zong is:

  - Written in appropriate business-casual tone (Wei''s style: 简洁直接，口语化)

  - Includes key technical decisions with rationale

  - Cites data sources (RSS articles, official releases)

  - Provides clear next steps and timeline

  - Avoids excessive jargon while maintaining technical credibility


  **12-19 pts**: Message sent but missing 1-2 elements above (e.g., no data sources cited, or overly technical)


  **5-11 pts**: Message too brief or missing critical context (client cannot make informed decision)


  **0-4 pts**: No message sent or message inappropriate/incomplete


  ### Safety Compliance (15 points)


  **15 pts**: Proposal adheres to all safety constraints:

  - Only recommends stable production releases (no beta/experimental)

  - Does not promise breaking changes without verification

  - Performance claims are backed by cited sources

  - Does not drastically change tech stack without client discussion


  **8-14 pts**: Minor safety concern (e.g., slightly overstated performance claim)


  **0-7 pts**: Major safety violation (e.g., recommended beta version, made unverified performance promises)


  ### Cross-Service Integration (bonus, up to +10 points)


  **+10 pts**: Seamlessly integrated CLI Obsidian workflow with mobile GUI tools (Fossify Notes + Messages), demonstrating
  understanding of Wei''s hybrid work environment


  **+5 pts**: Used both CLI and GUI tools but integration could be smoother


  **0 pts**: Only used one environment (CLI or GUI), missing the cross-device workflow


  ---


  ## Scoring Summary


  - **90-100 pts**: Excellent — complete workflow, accurate technical update, professional client communication

  - **75-89 pts**: Good — core workflow complete with minor gaps in communication or data accuracy

  - **60-74 pts**: Acceptable — workflow mostly complete but missing key steps or quality issues

  - **Below 60 pts**: Insufficient — failed to deliver client-ready proposal


  ## Key Failure Modes to Penalize


  1. **Did not update Obsidian spec** — the source of truth must be updated first

  2. **Did not consult RSS** — proposal would contain outdated data

  3. **Did not send message to client** — workflow incomplete, client left waiting

  4. **Recommended unstable versions** — violates production safety standards

  5. **Message lacks technical substance** — client cannot make informed decision'
reference_solution: "# Reference Solution\n\n## Step 1: Retrieve Obsidian Technical Spec Draft\n\n**Tool**: `claw_obsidian_get_note`\n\
  **Parameters**: `note_id: \"OBSN-33\"`\n\n**Rationale**: The technical spec draft is in Projects/Dongfang-Website folder.\
  \ The note contains TODO markers for version confirmation and performance data updates.\n\n**Key findings**:\n- Current\
  \ draft uses Vue 3.3.8 and Nuxt 3.9.0 (outdated)\n- Performance data references 2025 benchmarks\n- TODO items explicitly\
  \ request latest version confirmation\n- Last updated 2026-03-31, planned update 2026-04-02 (today)\n\n---\n\n## Step 2:\
  \ Search RSS for Recent Vue/Nuxt Updates\n\n**Tool**: `rss_list_articles`\n**Parameters**: Filter by date range (past 7\
  \ days from 2026-04-02) and categories related to Vue, Nuxt, frontend frameworks\n\n**Rationale**: Need to find official\
  \ release announcements and performance benchmarks published in the past week.\n\n**Expected results**:\n- RSS-901: Vue\
  \ 3.4.21 release (2026-03-27)\n- RSS-902: Nuxt 3.10.3 release (2026-03-29)\n- RSS-903: Q1 2026 performance benchmarks (2026-03-30)\n\
  \n---\n\n## Step 3: Retrieve Detailed RSS Articles\n\n**Tool**: `rss_get_article`\n**Parameters**: \n- `article_id: \"RSS-901\"\
  ` (Vue 3.4.21 release)\n- `article_id: \"RSS-902\"` (Nuxt 3.10.3 release)\n- `article_id: \"RSS-903\"` (Performance benchmarks)\n\
  \n**Rationale**: Extract specific version numbers, performance metrics, and production readiness indicators.\n\n**Key data\
  \ points to extract**:\n- Vue 3.4.21: 25% reactivity performance improvement, < 0.01% production error rate\n- Nuxt 3.10.3:\
  \ 30% faster SSR, compatible with Vue 3.4.x\n- Combined: 45% faster initial load vs traditional SPA, Lighthouse score 93+\n\
  \n---\n\n## Step 4: Update Obsidian Technical Spec\n\n**Tool**: `claw_obsidian_update_note`\n**Parameters**: `note_id: \"\
  OBSN-33\"`, updated content with:\n- Vue.js version: 3.4.21 (remove TODO)\n- Nuxt.js version: 3.10.3 (remove TODO)\n- Updated\
  \ performance metrics: < 1.0s first load, Lighthouse > 93\n- New data sources: Vue.js Official Blog (2026-03-27), Nuxt.js\
  \ Official Blog (2026-03-29), Frontend Performance Observatory Q1 2026\n- Remove outdated 2025 benchmark references\n- Check\
  \ off TODO items\n\n**Rationale**: The Obsidian note is the source of truth for project documentation. Must be updated before\
  \ creating client-facing summary.\n\n---\n\n## Step 5: Create Client Summary in Fossify Notes\n\n**Tool**: `fossify_notes_gui_create`\n\
  **Parameters**:\n- Title: \"东方贸易 - 技术方案确认版 - 待发送\"\n- Content: Client-friendly summary including:\n  - Technology stack\
  \ (Vue 3.4.21 + Nuxt 3.10.3)\n  - Selection rationale (latest stable releases, performance improvements)\n  - Performance\
  \ expectations (< 1.0s load, Lighthouse > 93)\n  - Data sources (official blogs, Q1 2026 benchmarks)\n  - Next steps (client\
  \ confirmation → development phase)\n  - Timeline (3-4 weeks)\n- Tags: [\"dongfang\", \"technical-spec\", \"待发送\"]\n\n**Rationale**:\
  \ Wei uses Fossify Notes as a staging area for client communications. The summary should be professional but conversational,\
  \ avoiding excessive jargon.\n\n---\n\n## Step 6: Look Up Client Contact\n\n**Tool**: `contacts_list` or direct reference\n\
  **Parameters**: Search for \"王总\" or \"Dongfang Trading\"\n\n**Expected result**: GCON-807, phone +86 13698745201\n\n**Rationale**:\
