  max_turns: 100
  fixtures:
  - fixtures/gui/gmail_clone_gui/messages.json
  - fixtures/gui/my_expenses_gui/data.json
  - fixtures/gui/loop_habit_gui/habits.json
  - fixtures/config/integrations.json
