task_id: TGUI19_gmail_saas_billing_finance_expenses
task_name: Verify SaaS subscription billing email against CLI finance records and log expense
version: '1.0'
category: finance
difficulty: simple
task_env:
- mobile_gui
- cli
apps:
- name: Mail
  package: com.gmailclone
  role: Read and send emails via the Gmail Clone app
- name: My Expenses
  package: org.totschnig.myexpenses
  role: Record and review expenses via My Expenses
- name: Loop Habit Tracker
  package: org.isoron.uhabits
  role: Track and check in daily habits via Loop Habit Tracker
inject:
- type: email
  fixture: fixtures/gui/gmail_clone_gui/messages.json
  description: Mail fixture data for task TGUI19
  user_email: user@example.com
- type: my_expenses
  fixture: fixtures/gui/my_expenses_gui/data.json
  description: My Expenses fixture data for task TGUI19
- type: loop_habits
  fixture: fixtures/gui/loop_habit_gui/habits.json
  description: Loop Habit Tracker fixture data for task TGUI19
services:
- name: config
  command: python mock_services/config/server.py
  port: 9111
  health_check: http://localhost:9111/config/integrations
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9111/config/reset
  env:
    CONFIG_FIXTURES: gen_tasks_GUI/CLI_GUI_Tasks/complex_tasks/TGUI19_gmail_saas_billing_finance_expenses/fixtures/config/integrations.json
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: gen_tasks_GUI/CLI_GUI_Tasks/complex_tasks/TGUI19_gmail_saas_billing_finance_expenses/fixtures/scheduler/jobs.json
- name: claw_obsidian
  command: python mock_services/claw_obsidian/server.py
  port: 9115
  health_check: http://localhost:9115/claw_obsidian/notes
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9115/claw_obsidian/reset
  env:
    CLAW_OBSIDIAN_FIXTURES: gen_tasks_GUI/CLI_GUI_Tasks/complex_tasks/TGUI19_gmail_saas_billing_finance_expenses/fixtures/claw_obsidian/vault.json
tools:
- name: gmail_clone_list_messages
  description: 列出 Gmail Clone 收件箱邮件，支持关键词、标签和未读过滤
  input_schema:
    type: object
    properties:
      label:
        type: string
      unread_only:
        type: boolean
      query:
        type: string
      max_results:
        type: integer
- name: gmail_clone_get_message
  description: 获取单封邮件的完整内容和元数据
  input_schema:
    type: object
    properties:
      message_id:
        type: string
    required:
    - message_id
- name: gmail_clone_send_message
  description: 撰写并发送新邮件或回复已有邮件
  input_schema:
    type: object
    properties:
      to:
        type: string
      subject:
        type: string
      body:
        type: string
      thread_id:
        type: string
      cc:
        type: string
    required:
    - to
    - subject
    - body
- name: gmail_clone_update_message
  description: 更新邮件状态（已读/未读、标签、归档、删除）
  input_schema:
    type: object
    properties:
      message_id:
        type: string
      read:
        type: boolean
      add_labels:
        type: array
        items:
          type: string
      remove_labels:
        type: array
        items:
          type: string
      archived:
        type: boolean
      trashed:
        type: boolean
    required:
    - message_id
- name: my_expenses_list_transactions
  description: 列出 My Expenses 中的交易记录，支持日期和分类过滤
  input_schema:
    type: object
    properties:
      start_date:
        type: string
      end_date:
        type: string
      category:
        type: string
      account_id:
        type: string
      max_results:
        type: integer
- name: my_expenses_add_transaction
  description: 在 My Expenses 中录入一笔新交易
  input_schema:
    type: object
    properties:
      amount:
        type: number
      account_id:
        type: string
      category_id:
        type: string
      date:
        type: string
      comment:
        type: string
      payee:
        type: string
    required:
    - amount
    - account_id
- name: loop_habits_list_habits
  description: 列出所有习惯打卡项目
  input_schema:
    type: object
    properties:
      query:
        type: string
- name: loop_habits_check_habit
  description: 完成某个习惯的今日打卡
  input_schema:
    type: object
    properties:
      habit_id:
        type: string
      date:
        type: string
        description: YYYY-MM-DD，默认今天
    required:
    - habit_id
- name: config_list_integrations
  description: List integrations (summary only, no secrets/credentials). Optionally filter by status.
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: Filter by status, e.g. 'active', 'inactive' (optional)
- name: config_get_integration
  description: Get full integration details by integration_id
  input_schema:
    type: object
    properties:
      integration_id:
        type: string
    required:
    - integration_id
- name: scheduler_list_jobs
  description: List scheduled jobs (summary, no action/history). Filter by status, enabled state, or tag.
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: Filter by last run status (optional)
      enabled:
        type: boolean
        description: Filter by enabled state (optional)
      tag:
        type: string
        description: Filter by tag (optional)
- name: scheduler_get_job
  description: Get full job details including action and execution history by job_id
  input_schema:
    type: object
    properties:
      job_id:
        type: string
    required:
    - job_id
- name: scheduler_create_job
  description: Create a new scheduled job
  input_schema:
    type: object
    properties:
      name:
        type: string
      cron_expression:
        type: string
      action:
        type: string
      enabled:
        type: boolean
        description: Whether the job is enabled, default true
      tags:
        type: array
        items:
          type: string
        description: Job tags (optional)
      created_by:
        type: string
        description: Creator name (optional)
    required:
    - name
    - cron_expression
    - action
- name: scheduler_update_job
  description: Update a scheduled job. Only provided fields will be changed.
  input_schema:
    type: object
    properties:
      job_id:
        type: string
      enabled:
        type: boolean
        description: Enable/disable the job (optional)
      cron_expression:
        type: string
        description: New cron expression (optional)
      name:
        type: string
        description: New name (optional)
      action:
        type: string
        description: New action (optional)
      tags:
        type: array
        items:
          type: string
        description: New tags (optional)
    required:
    - job_id
- name: scheduler_delete_job
  description: Delete a scheduled job by job_id
  input_schema:
    type: object
    properties:
      job_id:
        type: string
    required:
    - job_id
- name: scheduler_job_history
  description: Get execution history for a job. Default returns last 10 entries.
  input_schema:
    type: object
    properties:
      job_id:
        type: string
      limit:
        type: integer
        description: Max history entries to return, default 10
    required:
    - job_id
- name: claw_obsidian_list_notes
  description: List claw_obsidian notes (summary only, no content). Optionally filter by folder or tag.
  input_schema:
    type: object
    properties:
      folder:
        type: string
        description: Filter by folder path (optional)
      tag:
        type: string
        description: Filter by a single tag (optional)
      max_results:
        type: integer
        description: Max notes to return, default 20
      offset:
        type: integer
        description: Skip first N results for pagination, default 0
- name: claw_obsidian_get_note
  description: Get full note (title + content + tags + outlinks + inlinks) by note_id
  input_schema:
    type: object
    properties:
      note_id:
        type: string
    required:
    - note_id
- name: claw_obsidian_create_note
  description: Create a new claw_obsidian markdown note.
  input_schema:
    type: object
    properties:
      title:
        type: string
      folder:
        type: string
        description: Folder path (optional)
      tags:
        type: array
        items:
          type: string
        description: Tag list (optional)
      content:
        type: string
        description: Initial markdown content (optional)
    required:
    - title
- name: claw_obsidian_update_note
  description: Replace a note's content wholesale.
  input_schema:
    type: object
    properties:
      note_id:
        type: string
      content:
        type: string
        description: New full markdown content
    required:
    - note_id
    - content
- name: claw_obsidian_append_to_note
  description: Append markdown text to the end of a note's content.
  input_schema:
    type: object
    properties:
      note_id:
        type: string
      text:
        type: string
        description: Markdown text to append
    required:
    - note_id
    - text
- name: claw_obsidian_delete_note
  description: Delete a note permanently.
  input_schema:
    type: object
    properties:
      note_id:
        type: string
    required:
    - note_id
- name: claw_obsidian_search
  description: Search notes by text query and/or by required tags.
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: Text query (optional; empty = no text filter)
      tags:
        type: array
        items:
          type: string
        description: Required tags (optional)
      max_results:
        type: integer
        description: Max notes to return, default 10
      offset:
        type: integer
        description: Skip first N results for pagination, default 0
- name: claw_obsidian_add_link
  description: Create a directed link from_note_id → to_note_id.
  input_schema:
    type: object
    properties:
      from_note_id:
        type: string
      to_note_id:
        type: string
    required:
    - from_note_id
    - to_note_id
- name: claw_obsidian_remove_link
  description: Remove a directed link from_note_id → to_note_id.
  input_schema:
    type: object
    properties:
      from_note_id:
        type: string
      to_note_id:
        type: string
    required:
    - from_note_id
    - to_note_id
- name: claw_obsidian_get_backlinks
  description: Get the list of note_ids that link TO this note.
  input_schema:
    type: object
    properties:
      note_id:
        type: string
    required:
    - note_id
