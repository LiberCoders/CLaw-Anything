task_id: TGUI43_deployment_conflict_calendar_sms_crm_finance
task_name: Resolve production deployment window conflict between rate-limiting rollout
  and database maintenance
version: '1.0'
category: workflow_execution
difficulty: simple
task_env:
- mobile_gui
- cli
apps:
- name: Fossify Calendar
  package: org.fossify.calendar
  role: View and create calendar events via Fossify Calendar
- name: Fossify Messages
  package: org.fossify.messages
  role: Read and send SMS messages via Fossify Messages
inject:
- type: calendar
  fixture: fixtures/gui/fossify_calendar_gui/events.json
  description: Fossify Calendar fixture data for task TGUI43
- type: fossify_messages
  fixture: fixtures/gui/fossify_messages_gui/threads.json
  description: Fossify Messages fixture data for task TGUI43
services:
- name: claw_obsidian
  command: python mock_services/claw_obsidian/server.py
  port: 9115
  health_check: http://localhost:9115/claw_obsidian/notes
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9115/claw_obsidian/reset
  env:
    CLAW_OBSIDIAN_FIXTURES: fixtures/claw_obsidian/vault.json
- name: crm
  command: python mock_services/crm/server.py
  port: 9110
  health_check: http://localhost:9110/crm/customers
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9110/crm/reset
  env:
    CRM_FIXTURES: fixtures/crm/customers.json
- name: finance
  command: python mock_services/finance/server.py
  port: 9104
  health_check: http://localhost:9104/finance/transactions
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9104/finance/reset
  env:
    FINANCE_FIXTURES: fixtures/finance/transactions.json
- name: scheduler
  command: python mock_services/scheduler/server.py
  port: 9112
  health_check: http://localhost:9112/scheduler/jobs
  health_check_method: POST
  ready_timeout: 10
  reset_endpoint: http://localhost:9112/scheduler/reset
  env:
    SCHEDULER_FIXTURES: fixtures/scheduler/jobs.json
tools:
- name: fossify_calendar_list_events
  description: 列出日历事件，支持日期范围过滤
  input_schema:
    type: object
    properties:
      start_date:
        type: string
      end_date:
        type: string
      query:
        type: string
      max_results:
        type: integer
- name: fossify_calendar_get_event
  description: 获取单个日历事件的完整详情
  input_schema:
    type: object
    properties:
      event_id:
        type: string
    required:
    - event_id
- name: fossify_calendar_create_event
  description: 在日历中新建事件
  input_schema:
    type: object
    properties:
      title:
        type: string
      start_time:
        type: string
      end_time:
        type: string
      location:
        type: string
      description:
        type: string
    required:
    - title
    - start_time
    - end_time
- name: fossify_calendar_update_event
  description: 更新已有日历事件
  input_schema:
    type: object
    properties:
      event_id:
        type: string
      title:
        type: string
      start_time:
        type: string
      end_time:
        type: string
      location:
        type: string
      description:
        type: string
    required:
    - event_id
- name: fossify_messages_list_threads
  description: 列出短信会话列表，支持关键词和未读过滤
  input_schema:
    type: object
    properties:
      query:
        type: string
      unread_only:
        type: boolean
      max_results:
        type: integer
- name: fossify_messages_get_thread
  description: 获取某个会话的完整消息记录
  input_schema:
    type: object
    properties:
      thread_id:
        type: string
    required:
    - thread_id
- name: fossify_messages_send_message
  description: 向指定号码或会话发送短信
  input_schema:
    type: object
    properties:
      phone_number:
        type: string
      thread_id:
        type: string
      text:
        type: string
    required:
    - text
- name: fossify_messages_mark_thread
  description: 更新会话状态（已读/未读、归档、置顶）
  input_schema:
    type: object
    properties:
      thread_id:
        type: string
      read:
        type: boolean
      archived:
        type: boolean
      pinned:
        type: boolean
    required:
    - thread_id
- name: todo_list_tasks
  description: List TODO tasks. Returns full task details. Default returns all tasks.
    Use status filter to narrow results.
  input_schema:
    type: object
    properties:
      status:
        type: string
        description: 'Filter by status: ''pending'', ''in_progress'', ''completed'',
          or ''all'' (default ''all'')'
- name: todo_create_task
  description: Create a new TODO task
  input_schema:
    type: object
    properties:
      title:
        type: string
      description:
        type: string
        description: Task description (optional)
      priority:
        type: string
        description: Priority level, default 'medium'
      due_date:
        type: string
        description: Due date in ISO format (optional)
    required:
    - title
- name: todo_update_task
  description: Update an existing TODO task. Only provided fields will be changed.
  input_schema:
    type: object
    properties:
      task_id:
        type: string
      title:
        type: string
        description: New title (optional)
      priority:
        type: string
        description: New priority (optional)
      status:
        type: string
        description: 'New status: ''pending'', ''in_progress'', ''completed'' (optional)'
      tags:
        type: array
        items:
          type: string
        description: New tags list (optional)
    required:
    - task_id
- name: todo_delete_task
  description: Delete a TODO task by task_id
  input_schema:
    type: object
    properties:
      task_id:
        type: string
    required:
    - task_id
- name: finance_list_transactions
  description: List financial transactions. Returns all transactions by default. Use
