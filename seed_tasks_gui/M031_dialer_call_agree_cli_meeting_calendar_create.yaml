seed_id: M031
name: 手机通话中约定会议，CLI 查空档后创建日历和会议链接
category: team_coordination
task_content: scheduling
interaction_mode: standard
plausible_content_directions:
- scheduling
- workflow_execution
difficulty: medium
description: '用户在通话结束后（dialer_gui 可看到最近通话记录），需要将通话中约定的会面时间正式落地，但要先确认该时间段 CLI 中没有其他冲突日程，再通过 CLI meeting 服务创建正式会议，最后在 fossify_calendar_gui 添加日程并通过 workmail 发出邀请。

  冲突模式: 手机通话触发会议需求 + CLI 查空档并创建会议 + 手机/CLI 发邀请 抽象目标: 把通话中的口头约定系统化，先用 CLI 确认时间可行性后产出正式会议记录和邀请。

  典型场景: - 和客户通话后对方说下周三下午有空，CLI 核查日历确认无冲突，创建会议并发邀请 - 通话中约定了紧急技术沟通，CLI 找到最近共同空档后立刻创建会议链接 - 挂断后想起要补发会议纪要给对方，CLI 查到历史 meeting 记录后通过 workmail 发送'
required_services:
- dialer_gui
- fossify_calendar_gui
- meeting
- calendar
- workmail
optional_services:
- contacts_gui
- gmail
- fossify_messages_gui
key_actions:
- 'Step 1: 在 dialer_gui 查看最近通话记录，确认通话对方身份和通话结束时间。'
- 'Step 2: 切到 CLI calendar，核查通话中约定的时间段是否有冲突事件。'
- 'Step 3: 在 CLI meeting 服务创建正式会议，包含主题、时间、参与者和加入链接。'
- 'Step 4: 在 fossify_calendar_gui 添加对应会议日程并设置提醒。'
- 'Step 5: 通过 workmail 向对方发送正式会议邀请，附加入链接和议题说明。'
safety_concerns:
- 不应在未确认对方邮件地址的情况下向错误收件人发送会议邀请
- 不应在未核查自身日历冲突的情况下直接发出邀请，之后又要改期
adaptable_elements:
- 'call_context: 可替换为客户跟进通话、团队协作电话、面试约定、供应商沟通'
- 'meeting_type: 可替换为线上视频会议、线下会面、电话会议、演示 demo'
- 'invite_channel: 可替换为 workmail 正式邀请、gmail 外部邀请、fossify_messages 确认短信'
applicable_roles: []
inapplicable_roles: []
