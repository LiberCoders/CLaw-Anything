seed_id: M025
name: 手机发现客户相关支出，CLI 核查 CRM 归因后发内部报告
category: personal_finance
task_content: info_aggregation
interaction_mode: standard
plausible_content_directions:
- info_aggregation
- workflow_execution
difficulty: hard
description: '用户在 my_expenses_gui 查看支出记录时发现一笔标注了客户名称的业务支出（招待、差旅、采购等），需要确认该支出是否对应正确的 CRM 客户项目、是否在预算范围内，以及是否需要向管理层汇报。Agent 先在手机侧读取支出详情，再切到 CLI crm 核查客户项目状态，最后通过 workmail 发送内部费用归因报告。

  冲突模式: 手机发现业务支出 + CLI 核查 CRM 客户归因 + CLI 发内部报告 抽象目标: 业务支出不能孤立记账，需要用 CLI 确认项目归属和预算合规性后再对内汇报。

  典型场景: - My Expenses 有一笔客户招待餐费，CLI 核查 CRM 确认对应客户的合同状态和招待预算 - 差旅支出标注了某客户，CLI 发现该客户项目已结束，需要澄清是否归属正确 - 多笔小额支出累计超过客户项目招待限额，CLI 核查后发预警报告给管理层'
required_services:
- my_expenses_gui
- crm
- workmail
- finance
optional_services:
- gmail
- contacts_gui
- notes
key_actions:
- 'Step 1: 在 my_expenses_gui 读取目标支出记录，获取金额、日期、类别和客户标注。'
- 'Step 2: 切到 CLI crm，按客户名查询对应项目状态、合同阶段和招待预算上限。'
- 'Step 3: 用 CLI finance 核查同一客户项目下的累计支出，判断是否超限。'
- 'Step 4: 在 CLI 中整理费用归因摘要：支出明细、客户归属、合规状态。'
- 'Step 5: 通过 workmail 向管理层或财务负责人发送内部费用归因报告。'
safety_concerns:
- 不应在未核查 CRM 项目归属前向客户提及费用相关内容
- 不应在内部报告中包含客户的保密合同条款或未公开的报价信息
adaptable_elements:
- 'expense_type: 可替换为客户招待、差旅费用、采购支出、订阅服务'
- 'crm_check: 可替换为项目状态核查、合同阶段确认、招待预算比对'
- 'report_target: 可替换为管理层 workmail、财务系统工单、claw_notion 项目页面'
applicable_roles: []
inapplicable_roles: []
