seed_id: M020
name: 手机早晨闹钟触发，CLI 检查自动化任务和待办后确认当天安排
category: personal_productivity
task_content: scheduling
interaction_mode: standard
plausible_content_directions:
- scheduling
- workflow_execution
difficulty: hard
description: '用户设置了早晨工作日闹钟作为「开启工作流」的触发点，闹钟响后需要在手机侧确认今日日程，并在 CLI 中检查自动化任务执行状态、待办积压和紧急邮件，形成完整的当天任务视图；最终回到 fossify_calendar_gui 确认或调整日程，并通过 workmail 发送必要的早晨同步消息。

  冲突模式: 手机闹钟触发 + CLI 多源状态检查 + 手机确认当日安排并发通知 抽象目标: 把闹钟作为跨设备工作流的触发点，让 Agent 在手机和 CLI 之间完成系统性的晨间工作检查。

  典型场景: - 工作日早晨闹钟提醒，CLI 发现夜间定时任务失败，需要立刻处理后再确认日程 - 早晨起床后发现 todo 有昨晚新增的高优先级任务，CLI 核查后重排今日日历 - 闹钟提醒后发现 workmail 有早晨紧急消息，CLI 整合全局状态后决定是否调整会议'
required_services:
- clock_gui
- fossify_calendar_gui
- scheduler
- todo
- workmail
optional_services:
- gmail_clone_gui
- mattermost_gui
- loop_habit_gui
key_actions:
- 'Step 1: 在 clock_gui 确认今日为工作日且闹钟已响，读取今天的第一条日历事件。'
- 'Step 2: 切到 CLI scheduler，检查昨夜到今晨自动化任务的执行状态，识别失败项。'
- 'Step 3: 切到 CLI todo 和 workmail，查看高优先级待办和紧急消息。'
- 'Step 4: 整合所有状态，判断是否需要调整今日日历安排或提前处理某个紧急事项。'
- 'Step 5: 回到 fossify_calendar_gui 确认或更新当日安排，通过 workmail 发送早晨同步消息。'
safety_concerns:
- 不应在 CLI 发现自动化任务失败时忽略不处理就直接进入正常日程
- 不应因为晨间检查耗时过长而遗漏当天第一个会议或重要截止时间
adaptable_elements:
- 'trigger_alarm: 可替换为任意周期性工作闹钟，如午休结束提醒、下班前复盘提醒'
- 'cli_checks: 可按场景替换为 logs 运行状态、helpdesk 积压、config 异常告警'
- 'sync_channel: 可替换为 mattermost 频道同步、gmail 外部邮件、fossify_messages 群通知'
applicable_roles: []
inapplicable_roles: []
