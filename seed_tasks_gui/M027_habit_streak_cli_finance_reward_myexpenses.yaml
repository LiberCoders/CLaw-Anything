seed_id: M027
name: 手机习惯达到里程碑，CLI 核查奖励预算后在 My Expenses 记录奖励支出
category: personal_productivity
task_content: workflow_execution
interaction_mode: standard
plausible_content_directions:
- workflow_execution
- info_aggregation
difficulty: medium
description: '用户在 loop_habit_gui 发现某习惯达到了连续打卡里程碑（如连续 30 天），决定给自己设置的奖励是一笔消费，但需要先确认个人当月预算是否允许这笔奖励支出。Agent 需要先在手机侧确认里程碑达成，再切到 CLI finance 核查预算余量，最后在 my_expenses_gui 记录这笔有明确用途的奖励消费。

  冲突模式: 手机确认里程碑达成 + CLI 核查奖励预算 + 手机记录奖励支出 抽象目标: 把习惯激励机制和财务管理连通，让奖励消费有预算依据而非随意发生。

  典型场景: - 健身打卡连续 30 天，预设奖励是一双运动鞋，CLI 核查预算后决定是否立刻购买 - 阅读习惯完成季度目标，奖励预算不足时 CLI 建议延迟到下月 - 戒糖习惯坚持 2 周，奖励是一顿外出大餐，CLI 确认餐饮类预算尚余后去记账'
required_services:
- loop_habit_gui
- my_expenses_gui
- finance
optional_services:
- fossify_calendar_gui
- notes
- todo
key_actions:
- 'Step 1: 在 loop_habit_gui 确认目标习惯已达到里程碑，读取连续天数和完成率。'
- 'Step 2: 切到 CLI finance，查询当月该类别（如购物、餐饮）的预算余量。'
- 'Step 3: 根据预算余量决定：立即执行奖励、调整奖励规模或延迟到下月。'
- 'Step 4: 在 my_expenses_gui 记录奖励支出，备注「习惯里程碑奖励：XXX」。'
- 'Step 5: 如延迟奖励，在 fossify_calendar_gui 创建提醒事件，标注奖励计划。'
safety_concerns:
- 不应在预算严重透支时仍执行奖励消费并记入账本
- 不应把奖励记账条目混入日常刚需支出类别造成分析混乱
adaptable_elements:
- 'habit_milestone: 可替换为连续 7/14/30/100 天、完成率达标、累计次数目标'
- 'reward_type: 可替换为购物、餐饮、娱乐、旅行预订等消费类奖励'
- 'budget_threshold: 可替换为绝对余额判断或月度类别限额判断'
applicable_roles: []
inapplicable_roles: []
