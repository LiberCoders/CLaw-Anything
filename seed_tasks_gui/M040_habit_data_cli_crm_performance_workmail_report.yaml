seed_id: M040
name: 手机习惯数据反映工作状态，CLI 关联 CRM 业绩后发周报
category: personal_productivity
task_content: info_aggregation
interaction_mode: standard
plausible_content_directions:
- info_aggregation
- workflow_execution
difficulty: hard
description: '用户的 loop_habit_gui 追踪了一批与工作效率相关的习惯（如「完成当日销售跟进」「更新 CRM」「发送日报」），本周数据出炉后需要结合 CLI 中的 CRM 业绩数据形成完整的周报，而不是单独发习惯打卡率。Agent 需要先在手机侧读取习惯完成数据，再切到 CLI crm 和 finance 提取本周业绩指标，最后通过 workmail 发送整合了习惯执行率和业务结果的周报。

  冲突模式: 手机读取习惯数据 + CLI 关联业绩指标 + CLI 发整合周报 抽象目标: 把习惯追踪器的行为数据和 CLI 的业务结果关联，产出有实质内容的工作周报。

  典型场景: - 本周「日常客户跟进」习惯完成率 80%，CLI 查 CRM 本周跟进记录验证一致性，写入周报 - 「更新 CRM」习惯连续 3 天未打卡，CLI 发现对应天的 CRM 数据也缺失，在周报中注明 - 习惯完成率高但 CRM 商机转化低，CLI 分析后在周报中提出效率改进建议'
required_services:
- loop_habit_gui
- workmail
- crm
- finance
optional_services:
- claw_notion
- notes
- gmail
key_actions:
- 'Step 1: 在 loop_habit_gui 读取本周所有工作相关习惯的完成率和具体打卡记录。'
- 'Step 2: 切到 CLI crm，提取本周的客户跟进记录、商机状态变化和成交数据。'
- 'Step 3: 切到 CLI finance，获取本周的收入或订单金额等业绩指标。'
- 'Step 4: 关联习惯执行率与业务结果，识别强相关项和需要改进的执行缺口。'
- 'Step 5: 通过 workmail 向上级或团队发送整合周报，包含习惯数据、业绩指标和自我分析。'
safety_concerns:
- 不应在周报中暴露 CRM 中其他团队成员的客户数据或个人业绩
- 不应把习惯打卡率作为唯一业绩衡量标准而忽视 CLI 中的实际结果数据
adaptable_elements:
- 'habit_category: 可替换为销售跟进习惯、学习习惯、健康习惯、写作习惯'
- 'cli_metrics: 可替换为 CRM 跟进量、finance 收入、helpdesk 解决工单数'
- 'report_format: 可替换为 workmail 周报、claw_notion 个人复盘页、gmail 外发总结'
applicable_roles: []
inapplicable_roles: []
