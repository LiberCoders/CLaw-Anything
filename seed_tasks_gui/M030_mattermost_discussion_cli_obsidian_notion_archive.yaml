seed_id: M030
name: 手机 Mattermost 讨论产出结论，CLI 查背景后归档至 Notion
category: knowledge_management
task_content: info_aggregation
interaction_mode: standard
plausible_content_directions:
- info_aggregation
- workflow_execution
difficulty: hard
description: '用户在 mattermost_gui 的频道讨论中出现了重要决策或技术结论，这些内容需要被正式归档，但单独存为 Notion 页面前要先在 CLI 的 claw_obsidian 中找到相关背景笔记，确保归档内容包含完整上下文。Agent 需要先在手机侧提取讨论中的关键结论，再切到 CLI 补充背景，最后在 claw_notion 创建正式的决策归档页面。

  冲突模式: 手机提取讨论结论 + CLI 查历史背景 + CLI 创建正式归档 抽象目标: 不把 Mattermost 讨论截图当做正式记录，而是借助 CLI 补足上下文后产出有结构的决策档案。

  典型场景: - 频道讨论确定了技术方案选型，CLI 在 Obsidian 找到调研对比笔记后一并归档到 Notion - 产品讨论达成了优先级共识，CLI 找到旧版路线图后创建包含来龙去脉的决策页 - 应急处置讨论结束后需要归档处理过程，CLI 补充事件背景后形成完整事后回顾'
required_services:
- mattermost_gui
- claw_obsidian
- claw_notion
optional_services:
- notes
- meeting
- workmail
key_actions:
- 'Step 1: 在 mattermost_gui 读取目标讨论线程，提取关键结论、参与者和决策时间。'
- 'Step 2: 切到 CLI claw_obsidian，搜索与该议题相关的历史背景笔记和前置讨论。'
- 'Step 3: 整合 Mattermost 结论和 Obsidian 背景，形成完整的决策上下文。'
- 'Step 4: 在 claw_notion 创建决策归档页面，包含背景、讨论摘要、最终结论和参与者。'
- 'Step 5: 在 Mattermost 频道回复归档链接，通知参与者查阅正式记录。'
safety_concerns:
- 不应把频道中仍在讨论中的未定结论当做最终决策归档
- 不应在 Notion 公开页面中包含频道内讨论的个人敏感评论
adaptable_elements:
- 'discussion_type: 可替换为技术选型、产品优先级、应急处置、需求评审结论'
- 'background_source: 可替换为 claw_obsidian 调研笔记、meeting 历史纪要、notes 草稿'
- 'archive_format: 可替换为 Notion 决策页、claw_obsidian 结论笔记、workmail 正式通知'
applicable_roles: []
inapplicable_roles: []
