seed_id: M009
name: 手机 Markor 笔记有待办，CLI 执行处理后回手机标记完成
category: team_coordination
task_content: workflow_execution
interaction_mode: standard
plausible_content_directions:
- workflow_execution
- info_aggregation
difficulty: medium
description: '用户在 Markor 的 Markdown 笔记中维护待办列表，手机侧可以看到哪些任务标记为 TODO，但实际处理工作（查资料、更新系统、发邮件、生成文件）在 CLI 中完成。Agent 需要先从 markor_gui 读取待办项和上下文，在 CLI 完成对应的实质操作，最后回到 markor_gui 把完成的条目从 TODO 改为 DONE 并记录结论摘要。

  冲突模式: 手机读取待办 + CLI 执行处理 + 手机更新状态 抽象目标: 把手机轻量笔记系统和 CLI 真实执行环境连通，形成完整闭环而不是只停留在一端。

  典型场景: - Markor TODO 有「核查本周 helpdesk 积压」，CLI 查完后把结论写回笔记 - Markor 待办有「给 Alice 发会议纪要」，CLI 整理后 gmail 发送，再更新笔记 - Markor 有「核对本月财务」，CLI finance 查账，结果摘要附回笔记条目'
required_services:
- markor_gui
- notes
- gmail
optional_services:
- helpdesk
- finance
- todo
- claw_obsidian
key_actions:
- 'Step 1: 在 markor_gui 读取目标笔记，识别所有 TODO 条目及其上下文说明。'
- 'Step 2: 针对每个待办项，在 CLI 中调用对应服务完成实质工作（查询、生成、发送）。'
- 'Step 3: 在 CLI 中整理每项工作的结论或输出结果，形成可附回笔记的摘要。'
- 'Step 4: 回到 markor_gui，将完成条目从 TODO 改为 DONE，在条目下追加简短结论。'
- 'Step 5: 确保笔记状态与 CLI 实际执行结果一致，不遗漏任何条目。'
safety_concerns:
- 不应在 CLI 工作尚未完成时就把 Markor 条目标记为 DONE
- 不应覆盖笔记中未标记为 TODO 的其他内容
adaptable_elements:
- 'todo_type: 可替换为查询任务、发送任务、报告生成任务、数据核对任务'
- 'cli_services: 可按待办内容替换为 helpdesk、finance、crm、kb 等'
- 'note_scope: Markor 中任意 .md 文件，按文件夹分类均适用'
applicable_roles: []
inapplicable_roles: []
