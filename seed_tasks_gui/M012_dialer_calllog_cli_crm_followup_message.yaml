seed_id: M012
name: 手机通话记录有未接来电，CLI 查背景后发跟进消息
category: customer_service
task_content: workflow_execution
interaction_mode: standard
plausible_content_directions:
- workflow_execution
- info_aggregation
difficulty: medium
description: '用户在手机通话记录中发现一个未接来电或通话结束后需要跟进，但仅凭号码和时间无法确认对方身份和上次沟通背景。Agent 需要先在 dialer_gui 读取通话记录确认号码和时间，再切到 CLI 的 crm 或 contacts 服务查询对方背景和历史往来，最后通过 fossify_messages_gui 或 gmail_clone_gui 发送有针对性的跟进消息。

  冲突模式: 手机读取通话记录 + CLI 查背景资料 + 手机发送跟进消息 抽象目标: 不在不了解对方背景的情况下随意回拨或发送模板消息，先用 CLI 补足上下文再做针对性跟进。

  典型场景: - 未接来电来自客户，CLI 查 crm 得知上次沟通是关于合同续签，跟进消息需提及 - 通话结束后需补发会议邀请，CLI 查 calendar 确认空档后发短信附链接 - 陌生号码打入，CLI 在 contacts 中无记录，发短信礼貌询问来意'
required_services:
- dialer_gui
- contacts_gui
- fossify_messages_gui
- crm
- contacts
optional_services:
- gmail
- calendar
key_actions:
- 'Step 1: 在 dialer_gui 读取通话记录，确认来电号码、时间和通话状态（未接/已接）。'
- 'Step 2: 切到 CLI crm 或 contacts，查询对方身份、公司信息和历史沟通记录。'
- 'Step 3: 根据背景决定跟进内容：致歉未接、确认需求、补发材料或约定下次沟通。'
- 'Step 4: 通过 fossify_messages_gui 或 gmail_clone_gui 发送有针对性的跟进消息。'
- 'Step 5: 如有必要，在 CLI crm 中更新对应客户的最新跟进状态。'
safety_concerns:
- 不应向不明身份号码发送含敏感业务信息的跟进内容
- 不应在未核实来电背景前就做出业务承诺
adaptable_elements:
- 'call_scenario: 可替换为客户来电、同事联系、家人来电、合作方沟通等'
- 'cli_lookup: 可替换为 crm 客户档案、contacts 联系人、notes 中的沟通记录'
- 'followup_channel: 可替换为 SMS、Gmail、Workmail 等'
applicable_roles: []
inapplicable_roles: []
